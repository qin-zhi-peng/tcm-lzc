<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>中医专长 · 每日一练</title>
<style>
:root{
  --paper:#f7f3ea; --paper2:#fffdf7; --ink:#1f1c18; --ink2:#4a443b;
  --mute:#8a8175; --line:#e2dac9; --line2:#efe8da;
  --red:#a8321e; --red-soft:#fbeae6;
  --green:#2f7d4f; --green-soft:#e8f3ec;
  --amber:#b8873a; --amber-soft:#fbf2e2;
  --blue:#2b5b8c; --blue-soft:#e9f0f8;
  --r:14px; --shadow:0 1px 2px rgba(40,30,15,.05),0 6px 20px rgba(40,30,15,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.55;overscroll-behavior-y:none}
body{
  background-image:
    radial-gradient(circle at 12% 8%,rgba(184,135,58,.055),transparent 42%),
    radial-gradient(circle at 88% 92%,rgba(168,50,30,.045),transparent 45%);
  background-attachment:fixed;
}
.app{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.01em}
.serif{font-family:"Songti SC","STSong","SimSun",Georgia,serif}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:10px;padding:18px 2px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(to bottom,var(--paper) 72%,rgba(247,243,234,0))}
.top .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;
  color:var(--ink2);background:var(--paper2);box-shadow:var(--shadow);flex:0 0 auto}
.top .ttl{font-size:17px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .act{font-size:14px;color:var(--ink2);padding:6px 10px;border-radius:9px;background:var(--paper2);box-shadow:var(--shadow)}

/* ---------- 通用卡片 ---------- */
.card{background:var(--paper2);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--mute);font-size:13px}
.tiny{font-size:12px;color:var(--mute)}
.divider{height:1px;background:var(--line2);margin:12px 0}

/* ---------- 首页 ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:6px 2px 4px}
.seal{width:38px;height:38px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;
  font-family:"Songti SC",serif;font-size:19px;font-weight:600;letter-spacing:0;box-shadow:0 2px 8px rgba(168,50,30,.28)}
.brand .n1{font-size:18px;font-weight:700;line-height:1.2}
.brand .n2{font-size:11.5px;color:var(--mute);letter-spacing:.06em}

.hero{background:linear-gradient(150deg,#fffdf7 0%,#fdf6e8 100%);border:1px solid var(--line2);
  border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);margin:14px 0 12px;position:relative;overflow:hidden}
.hero::after{content:"醫";position:absolute;right:-14px;bottom:-34px;font-family:"Songti SC",serif;
  font-size:132px;color:rgba(168,50,30,.05);line-height:1;pointer-events:none}
.hero .k{font-size:12.5px;color:var(--mute);letter-spacing:.12em}
.hero .big{font-size:34px;font-weight:750;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big em{font-style:normal;font-size:16px;font-weight:500;color:var(--mute);margin-left:4px}
.hero .sub{font-size:13px;color:var(--ink2)}
.progress{height:8px;background:#ece4d4;border-radius:99px;overflow:hidden;margin-top:14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#c85a3c,var(--red));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--paper2);border-radius:12px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:11px;color:var(--mute);margin-top:2px}

.entries{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.entry{background:var(--paper2);border-radius:14px;padding:15px 14px;box-shadow:var(--shadow);text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.entry:active{transform:scale(.978)}
.entry .ico{font-size:20px;line-height:1}
.entry .t{font-size:15px;font-weight:650;display:block}
.entry .d{font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
.entry .grow{display:block;min-width:0}
.entry.primary{background:linear-gradient(145deg,#b03a22,#8e2a17);color:#fff}
.entry.primary .d{color:rgba(255,255,255,.72)}
.entry.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.entry.wide .grow{flex:1}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-title h3{font-size:15px}
.sec-title .more{font-size:12.5px;color:var(--mute)}

/* ---------- 科目条 ---------- */
.subj{padding:11px 0}
.subj .hd{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.subj .hd b{font-weight:600}
.bar{height:7px;background:#ece4d4;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar > i.ok{background:linear-gradient(90deg,#4e9a6c,var(--green))}
.bar > i.mid{background:linear-gradient(90deg,#d6a24c,var(--amber))}
.bar > i.bad{background:linear-gradient(90deg,#c4664c,var(--red))}

/* ---------- 答题 ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--amber-soft);color:#8a641f;font-weight:600}
.pill.gray{background:#efe8da;color:var(--mute)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.qidx{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

.groupbox{background:#f4eee0;border-left:3px solid var(--amber);border-radius:8px;padding:10px 12px;
  font-size:13.5px;color:var(--ink2);margin-bottom:12px;line-height:1.7;white-space:pre-wrap}

.qstem{font-size:17px;line-height:1.72;letter-spacing:.005em;margin:2px 0 16px;font-weight:500}
.qstem .num{color:var(--red);font-weight:700;margin-right:6px}

.opt{display:flex;gap:11px;align-items:flex-start;background:var(--paper2);border:1.5px solid var(--line2);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;transition:border-color .13s,background .13s,transform .1s;width:100%;text-align:left}
.opt:active{transform:scale(.99)}
.opt .k{width:24px;height:24px;border-radius:7px;background:#f1ebdc;color:var(--ink2);display:grid;place-items:center;
  font-size:13px;font-weight:700;flex:0 0 auto;margin-top:1px}
.opt .v{font-size:15.5px;line-height:1.6;flex:1}
.opt.sel{border-color:var(--red);background:#fff8f6}
.opt.sel .k{background:var(--red);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:#d99b8b;background:#fdf1ee}
.opt.wrong .k{background:#c4664c;color:#fff}
.opt.dim{opacity:.55}

.explain{background:#f6f2e7;border-radius:12px;padding:13px 14px;margin-top:12px;font-size:14px;line-height:1.75;
  color:var(--ink2);border-left:3px solid var(--green);animation:fadeUp .22s ease}
.explain .h{font-weight:700;font-size:12.5px;color:var(--green);letter-spacing:.06em;margin-bottom:6px}
.explain.wrongx{border-left-color:var(--red)}
.explain.wrongx .h{color:var(--red)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 底栏 ---------- */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,243,234,.94);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line2);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.footbar .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:1;height:46px;border-radius:12px;font-size:15.5px;font-weight:650;display:grid;place-items:center;
  background:#efe8da;color:var(--ink2);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 3px 12px rgba(168,50,30,.24)}
.btn.ghost{background:transparent;color:var(--mute);flex:0 0 auto;width:52px;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.small{height:38px;font-size:14px;flex:0 0 auto;padding:0 16px}

/* ---------- 答题卡 ---------- */
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sheet.p5{grid-template-columns:repeat(5,1fr)}
.sq{aspect-ratio:1;border-radius:9px;background:#efe8da;color:var(--ink2);display:grid;place-items:center;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.sq.done{background:#d9e5dc;color:#22603c}
.sq.mark::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:99px;background:var(--amber)}
.sq.cur{outline:2.5px solid var(--red);outline-offset:1px}
.sq.right{background:var(--green);color:#fff}
.sq.wrong{background:#c4664c;color:#fff}

/* ---------- 报告 ---------- */
.score-hero{text-align:center;padding:26px 16px 20px;border-radius:18px;background:var(--paper2);box-shadow:var(--shadow);margin-bottom:12px}
.score-hero.pass{background:linear-gradient(160deg,#f2fbf5,#e4f3ea);border:1px solid #cfe6d8}
.score-hero.fail{background:linear-gradient(160deg,#fdf5f2,#fbebe6);border:1px solid #f0d5cc}
.score-hero .lab{font-size:12.5px;color:var(--mute);letter-spacing:.14em}
.score-hero .num{font-size:58px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 0}
.score-hero .num small{font-size:20px;font-weight:600;color:var(--mute)}
.score-hero.pass .num{color:var(--green)}
.score-hero.fail .num{color:var(--red)}
.score-hero .verdict{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;padding:5px 16px;border-radius:99px}
.score-hero.pass .verdict{background:var(--green);color:#fff}
.score-hero.fail .verdict{background:var(--red);color:#fff}
.score-hero .note{font-size:12.5px;color:var(--mute);margin-top:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper2);border-radius:12px;padding:13px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--mute)}

.weaklist .w{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.weaklist .w:last-child{border-bottom:0}
.weaklist .w .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaklist .w .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute)}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(30,24,16,.42);z-index:60;display:grid;place-items:center;padding:24px;
  animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--paper2);border-radius:18px;padding:22px 20px 16px;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(30,20,10,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.dialog h4{font-size:17px;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--ink2);line-height:1.7;margin:0 0 16px}
.dialog .acts{display:flex;gap:9px}
.dialog .acts .btn{height:42px;font-size:14.5px}

/* ---------- 设置 ---------- */
.field{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line2)}
.field:last-child{border-bottom:0}
.field .lab{font-size:14.5px}
.field .lab small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.field input[type=date],.field input[type=number]{border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font-size:14px;background:var(--paper);color:var(--ink);width:auto;text-align:right;font-family:inherit}
.switch{width:48px;height:28px;border-radius:99px;background:#ded5c4;position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* ---------- 空态 ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--mute)}
.empty .ico{font-size:42px;opacity:.45;margin-bottom:12px}
.empty p{font-size:14px;margin:6px 0}

/* ---------- 表 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}

@media (max-width:360px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero .big{font-size:29px}
  .score-hero .num{font-size:48px}
}

</style>
</head>

<script id="qb-data">window.__QB__={"banks":[{"meta":{"bank_id":"jichu-fangji","title":"方剂学","paper":"jichu","subject":"方剂学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":80,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"JC-FJ-0001","type":"A1","group":null,"topic":"总论-君臣佐使","difficulty":1,"stem":"方剂中针对主病或主证起主要治疗作用的药物是","options":{"A":"君药","B":"臣药","C":"佐药","D":"使药","E":"引经药"},"answer":"A","explain":"君药针对主病或主证起主要治疗作用，是一方中不可缺少的核心。臣药协助君药或兼治兼证；佐药有佐助、佐制、反佐三义；使药引经或调和诸药，故 B、C、D、E 皆非。","tags":["经典"]},{"id":"JC-FJ-0002","type":"A1","group":null,"topic":"总论-八法","difficulty":1,"stem":"八法中，和法的含义是","options":{"A":"发汗解表","B":"涌吐痰涎宿食","C":"和解少阳、调和脏腑","D":"温里散寒","E":"消导化积"},"answer":"C","explain":"和法通过和解或调和作用，使半表半里之邪或脏腑表里阴阳失和之证得以解除，如小柴胡汤和解少阳、逍遥散调和肝脾。A 为汗法；B 为吐法；D 为温法；E 为消法。","tags":["经典"]},{"id":"JC-FJ-0003","type":"A1","group":null,"topic":"总论-剂型","difficulty":1,"stem":"关于汤剂的特点，正确的是","options":{"A":"吸收快，能迅速发挥药效","B":"便于携带与长期保存","C":"药效持久而缓慢","D":"不便于随证加减","E":"只适用于慢性病"},"answer":"A","explain":"汤剂吸收快、起效迅速，且能随证加减、灵活变通，最宜急症与病情变化者。其缺点为携带不便、不易保存、药效较丸散为短，故 B、C、D、E 均误。","tags":[]},{"id":"JC-FJ-0004","type":"A1","group":null,"topic":"总论-煎服法","difficulty":2,"stem":"解表剂煎煮时宜","options":{"A":"武火急煎，不宜久煎","B":"文火久煎以取其厚味","C":"先煎半小时再入余药","D":"久煎两小时以增药力","E":"与补益剂同法久煎"},"answer":"A","explain":"解表药多含挥发油，久煎易挥散而减效，故解表剂宜武火急煎、沸后不久即取。文火久煎适用于补益剂；先煎适用于矿物介壳类；E 与解表剂煎法正相反。","tags":["易错"]},{"id":"JC-FJ-0005","type":"A1","group":null,"topic":"泻下剂-大承气汤","difficulty":1,"stem":"大承气汤的功用是","options":{"A":"峻下热结","B":"轻下热结","C":"缓下热结","D":"润肠泄热","E":"攻逐水饮"},"answer":"A","explain":"大承气汤以大黄为君、芒硝为臣，配枳实、厚朴行气除满，硝黄枳朴同用，峻下热结，治痞满燥实俱备之阳明腑实证。小承气汤去芒硝故轻下；调胃承气汤去枳朴加甘草故缓下。","tags":["高频"]},{"id":"JC-FJ-0006","type":"A1","group":null,"topic":"泻下剂-麻子仁丸","difficulty":2,"stem":"麻子仁丸的功用是","options":{"A":"峻下热结","B":"润肠泄热、行气通便","C":"温肾益精、润肠通便","D":"攻逐水饮、消肿","E":"泻热逐瘀、散结消肿"},"answer":"B","explain":"麻子仁丸以麻子仁润肠为君，配杏仁、白芍、蜂蜜润燥，大黄、枳实、厚朴泄热通便，共奏润肠泄热、行气通便之功，治肠胃燥热之脾约便秘。C 为济川煎；D 为十枣汤；E 为大黄牡丹汤。","tags":[]},{"id":"JC-FJ-0007","type":"A1","group":null,"topic":"和解剂-小柴胡汤","difficulty":1,"stem":"小柴胡汤的君药是","options":{"A":"柴胡","B":"黄芩","C":"半夏","D":"人参","E":"甘草"},"answer":"A","explain":"柴胡苦平，疏解少阳半表之邪为君；黄芩清泄半里之热为臣，二药相合和解少阳。半夏、生姜和胃降逆止呕；人参、大枣、甘草益气扶正，防邪内传。","tags":["高频"]},{"id":"JC-FJ-0008","type":"A1","group":null,"topic":"和解剂-逍遥散","difficulty":2,"stem":"逍遥散的功用是","options":{"A":"疏肝解郁、养血健脾","B":"透邪解郁、疏肝理脾","C":"和解少阳、内泻热结","D":"平肝息风、清热活血","E":"清肝泻火、利湿止带"},"answer":"A","explain":"逍遥散疏肝解郁、养血健脾，治肝郁血虚脾弱之两胁作痛、神疲食少、月经不调。B 为四逆散；C 为大柴胡汤；D 为天麻钩藤饮；E 为龙胆泻肝汤，均各有专主。","tags":["高频"]},{"id":"JC-FJ-0009","type":"A1","group":null,"topic":"和解剂-半夏泻心汤","difficulty":3,"stem":"半夏泻心汤主治","options":{"A":"少阳证","B":"寒热错杂之痞证","C":"水热互结之结胸","D":"阳明腑实之痞满","E":"痰热内扰之失眠"},"answer":"B","explain":"半夏泻心汤以半夏为君，配干姜、黄芩、黄连辛开苦降、寒热平调，人参、大枣、甘草补虚和中，治寒热错杂、虚实夹杂之心下痞满、呕吐肠鸣下利。A 为小柴胡汤；C 为大陷胸汤；D 为大承气汤。","tags":["易错"]},{"id":"JC-FJ-0010","type":"A1","group":null,"topic":"清热剂-白虎汤","difficulty":1,"stem":"白虎汤的君药是","options":{"A":"石膏","B":"知母","C":"粳米","D":"甘草","E":"竹叶"},"answer":"A","explain":"石膏辛甘大寒，清阳明气分实热为君；知母苦寒质润，助石膏清热并滋阴润燥，为臣；粳米、甘草益胃护津，防大寒伤中。竹叶非本方之品。","tags":["高频"]},{"id":"JC-FJ-0011","type":"A1","group":null,"topic":"清热剂-龙胆泻肝汤","difficulty":2,"stem":"龙胆泻肝汤的功用是","options":{"A":"清泻肝胆实火、清利肝经湿热","B":"清胃凉血、解毒消肿","C":"清营解毒、透热养阴","D":"泻火解毒、凉血散瘀","E":"滋阴清热、凉血止血"},"answer":"A","explain":"龙胆泻肝汤以龙胆、黄芩、栀子清泻肝胆实火，泽泻、木通、车前子清利湿热，当归、生地养血滋阴，柴胡引药入肝，治肝胆实火上炎与湿热下注。B 为清胃散；C 为清营汤；D 为黄连解毒汤一类。","tags":[]},{"id":"JC-FJ-0012","type":"A1","group":null,"topic":"祛暑剂-香薷散","difficulty":2,"stem":"香薷散的功用是","options":{"A":"祛暑解表、化湿和中","B":"祛暑清热、益气生津","C":"清暑利湿、止渴除烦","D":"解表散寒、温肺化饮","E":"清热解暑、生津止渴"},"answer":"A","explain":"香薷散以香薷解表散寒、祛暑化湿为君，配厚朴、白扁豆行气和中，治夏月乘凉饮冷、外感于寒、内伤于湿之阴暑证。B 为清暑益气汤；C 为六一散一类；D 为小青龙汤。","tags":[]},{"id":"JC-FJ-0013","type":"A1","group":null,"topic":"补益剂-四君子汤","difficulty":1,"stem":"四君子汤的君药是","options":{"A":"人参","B":"白术","C":"茯苓","D":"甘草","E":"黄芪"},"answer":"A","explain":"人参大补元气、健脾养胃为君；白术健脾燥湿为臣；茯苓渗湿健脾为佐；炙甘草益气和中、调和诸药为使。黄芪不在方中，为补中益气汤之君药。","tags":["高频"]},{"id":"JC-FJ-0014","type":"A1","group":null,"topic":"补益剂-补中益气汤","difficulty":3,"stem":"补中益气汤中体现升举清阳的配伍是","options":{"A":"黄芪配升麻、柴胡","B":"当归配陈皮","C":"人参配白术","D":"甘草配当归","E":"白术配茯苓"},"answer":"A","explain":"黄芪补气升阳为君，升麻、柴胡少量升举下陷之清阳，共成升阳举陷之功，故治脱肛、子宫脱垂。人参、白术补气健脾；当归养血；陈皮理气，使补而不滞。","tags":["高频"]},{"id":"JC-FJ-0015","type":"A1","group":null,"topic":"补益剂-六味地黄丸","difficulty":1,"stem":"六味地黄丸的功用是","options":{"A":"滋补肝肾","B":"温补肾阳","C":"滋阴降火","D":"益气健脾","E":"养血调肝"},"answer":"A","explain":"六味地黄丸以熟地黄滋阴补肾填精为君，山茱萸、山药补肝脾，是为三补；泽泻、牡丹皮、茯苓泻其有余，是为三泻，共奏滋补肝肾之功。知柏地黄丸滋阴降火；肾气丸温补肾阳。","tags":["高频"]},{"id":"JC-FJ-0016","type":"A1","group":null,"topic":"补益剂-炙甘草汤","difficulty":2,"stem":"炙甘草汤的功用是","options":{"A":"益气滋阴、通阳复脉","B":"益气健脾、渗湿止泻","C":"滋阴降火、清心安神","D":"温阳利水、健脾消肿","E":"养血安神、清热除烦"},"answer":"A","explain":"炙甘草汤以炙甘草益气补中为君，配人参、大枣、地黄、阿胶、麦冬、麻仁滋阴养血，桂枝、生姜、清酒通阳复脉，治气阴两虚之脉结代、心动悸。B 为参苓白术散；D 为真武汤。","tags":["经典"]},{"id":"JC-FJ-0017","type":"A1","group":null,"topic":"固涩剂-牡蛎散","difficulty":2,"stem":"牡蛎散的功用是","options":{"A":"敛阴止汗、益气固表","B":"温补脾肾、涩肠止泻","C":"补肾涩精、固摄下元","D":"益气健脾、渗湿止泻","E":"滋阴清热、固表止汗"},"answer":"A","explain":"牡蛎散以煅牡蛎敛阴潜阳、固涩止汗为君，黄芪益气实卫固表，麻黄根专于止汗，小麦养心气退虚热，标本兼顾，治体虚自汗盗汗。B 为四神丸；C 为金锁固精丸。","tags":[]},{"id":"JC-FJ-0018","type":"A1","group":null,"topic":"固涩剂-四神丸","difficulty":2,"stem":"四神丸主治","options":{"A":"脾虚湿盛之泄泻","B":"脾肾阳虚之五更泄泻","C":"湿热下注之泄泻","D":"肝郁乘脾之腹痛泄泻","E":"寒湿困脾之泄泻"},"answer":"B","explain":"四神丸由肉豆蔻、补骨脂、五味子、吴茱萸组成，温补脾肾、涩肠止泻，治命门火衰、脾肾阳虚之五更泄泻、不思饮食、腹痛肢冷。A 为参苓白术散；C 为葛根芩连汤；D 为痛泻要方。","tags":["高频"]},{"id":"JC-FJ-0019","type":"A1","group":null,"topic":"安神剂-朱砂安神丸","difficulty":2,"stem":"朱砂安神丸的功用是","options":{"A":"镇心安神、清热养血","B":"养血安神、清热除烦","C":"滋阴清热、养血安神","D":"益气镇惊、安神定志","E":"交通心肾、安神益智"},"answer":"A","explain":"朱砂重镇安神、清心火为君，黄连清心泻火，生地黄、当归滋阴养血，甘草调和诸药，共奏镇心安神、清热养血之功，治心火亢盛、阴血不足之失眠惊悸。C 为天王补心丹。","tags":["鉴别"]},{"id":"JC-FJ-0020","type":"A1","group":null,"topic":"安神剂-天王补心丹","difficulty":2,"stem":"天王补心丹的功用是","options":{"A":"滋阴清热、养血安神","B":"镇心安神、清热养血","C":"益气镇惊、安神定志","D":"疏肝解郁、安神定志","E":"清热化痰、和胃安神"},"answer":"A","explain":"天王补心丹重用生地黄滋阴养血为君，配天冬、麦冬、玄参滋阴清热，当归、丹参补血养心，人参、茯苓益气宁心，治心肾阴亏、虚火内扰之虚烦不眠、心悸健忘。B 为朱砂安神丸。","tags":[]},{"id":"JC-FJ-0021","type":"A1","group":null,"topic":"理气剂-越鞠丸","difficulty":2,"stem":"越鞠丸主治","options":{"A":"气郁化火之胁痛","B":"气血痰火湿食六郁证","C":"痰气郁结之梅核气","D":"胸阳不振之胸痹","E":"肝气犯胃之呕吐"},"answer":"B","explain":"越鞠丸以香附治气郁为君，川芎治血郁，栀子治火郁，苍术治湿郁，神曲治食郁，痰郁随之而解，为通治六郁之代表方。C 为半夏厚朴汤；D 为瓜蒌薤白白酒汤一类。","tags":["高频"]},{"id":"JC-FJ-0022","type":"A1","group":null,"topic":"理气剂-半夏厚朴汤","difficulty":1,"stem":"半夏厚朴汤主治","options":{"A":"胸阳不振之胸痹","B":"痰气郁结之梅核气","C":"肝郁气滞之胁痛","D":"胃虚痰阻之噫气","E":"上盛下虚之喘咳"},"answer":"B","explain":"半夏厚朴汤以半夏化痰散结、降逆和胃为君，厚朴行气开郁，茯苓渗湿健脾，生姜和胃止呕，苏叶行气舒肝，共奏行气散结、降逆化痰之功，治咽中如有物阻之梅核气。D 为旋覆代赭汤；E 为苏子降气汤。","tags":["高频"]},{"id":"JC-FJ-0023","type":"A1","group":null,"topic":"理气剂-旋覆代赭汤","difficulty":2,"stem":"旋覆代赭汤的功用是","options":{"A":"降逆化痰、益气和胃","B":"行气散结、降逆化痰","C":"降气平喘、祛痰止咳","D":"温中祛寒、补气健脾","E":"和胃降逆、清热散结"},"answer":"A","explain":"旋覆代赭汤以旋覆花降气消痰、代赭石重镇降逆为君，半夏、生姜化痰降逆止呕，人参、大枣、甘草补益脾胃，治胃气虚弱、痰浊内阻之心下痞硬、噫气不除。B 为半夏厚朴汤。","tags":[]},{"id":"JC-FJ-0024","type":"A1","group":null,"topic":"理气剂-苏子降气汤","difficulty":3,"stem":"苏子降气汤主治","options":{"A":"风寒束表之喘咳","B":"上实下虚之喘咳","C":"痰热壅肺之喘咳","D":"肺肾阴虚之喘咳","E":"寒饮伏肺之喘咳"},"answer":"B","explain":"苏子降气汤以苏子降气平喘为君，半夏、厚朴、前胡降气祛痰，肉桂温补下元、纳气归肾，当归养血润燥，治痰涎壅盛于上、肾阳不足于下之上实下虚喘咳。E 为小青龙汤；C 为清气化痰丸。","tags":["鉴别"]},{"id":"JC-FJ-0025","type":"A1","group":null,"topic":"祛湿剂-五苓散","difficulty":2,"stem":"五苓散的功用是","options":{"A":"利水渗湿、温阳化气","B":"利水渗湿、清热养阴","C":"温阳利水、健脾消肿","D":"燥湿运脾、行气和胃","E":"清热利湿、退黄消肿"},"answer":"A","explain":"五苓散以泽泻利水渗湿为君，猪苓、茯苓淡渗，白术健脾燥湿，桂枝温阳化气兼解表，共奏利水渗湿、温阳化气之功，治膀胱气化不利之蓄水证。C 为真武汤；D 为平胃散；E 为茵陈蒿汤。","tags":["鉴别"]},{"id":"JC-FJ-0026","type":"A1","group":null,"topic":"祛湿剂-真武汤","difficulty":2,"stem":"真武汤的功用是","options":{"A":"温阳利水","B":"利水渗湿、温阳化气","C":"温中祛寒、补气健脾","D":"温经散寒、养血通脉","E":"峻下逐水、行气消肿"},"answer":"A","explain":"真武汤以附子温肾助阳为君，白术、茯苓健脾渗湿，生姜温散水气，白芍利小便兼缓急止痛，共奏温阳利水之功，治脾肾阳虚、水湿内停之水肿、小便不利。B 为五苓散；D 为当归四逆汤。","tags":[]},{"id":"JC-FJ-0027","type":"A1","group":null,"topic":"消食剂-保和丸","difficulty":1,"stem":"保和丸的君药是","options":{"A":"山楂","B":"神曲","C":"莱菔子","D":"半夏","E":"连翘"},"answer":"A","explain":"山楂酸甘微温，消一切饮食积滞，尤善消肉食油腻之积，为君；神曲化酒食陈腐之积，莱菔子下气消食除胀，共为臣；半夏、陈皮、茯苓、连翘为佐，连翘兼清食积所化之热。","tags":["高频"]},{"id":"JC-FJ-0028","type":"A1","group":null,"topic":"驱虫剂-乌梅丸","difficulty":1,"stem":"乌梅丸主治","options":{"A":"蛔厥证","B":"绦虫病","C":"蛲虫病","D":"湿热下注之带下","E":"脾虚虫积之疳积"},"answer":"A","explain":"乌梅丸以乌梅酸以安蛔为君，蜀椒、细辛辛以伏蛔，黄连、黄柏苦以下蛔，附子、干姜、桂枝温脏寒，人参、当归补气血，寒热并用、攻补兼施，治寒热错杂之蛔厥。B、C 非本方主治；E 为肥儿丸一类。","tags":[]},{"id":"JC-FJ-0029","type":"A1","group":null,"topic":"方剂鉴别-四君子汤与理中丸","difficulty":3,"stem":"四君子汤与理中丸均可治脾胃虚弱，二者的主要区别是","options":{"A":"四君子汤重在益气健脾，理中丸重在温中祛寒","B":"四君子汤重在温中，理中丸重在益气","C":"二方组成完全相同","D":"四君子汤能清热，理中丸能滋阴","E":"四君子汤治肾阳虚，理中丸治心阳虚"},"answer":"A","explain":"四君子汤以人参、白术、茯苓、甘草益气健脾，治脾胃气虚证；理中丸以干姜为君，配人参、白术、甘草温中祛寒、补气健脾，治中焦虚寒证。二方皆治脾胃，一偏补气、一偏温中。","tags":["鉴别","高频"]},{"id":"JC-FJ-0030","type":"A1","group":null,"topic":"方剂鉴别-六味地黄丸与肾气丸","difficulty":2,"stem":"六味地黄丸与肾气丸的组方关系，正确的是","options":{"A":"肾气丸为六味地黄丸加桂枝、附子","B":"肾气丸为六味地黄丸加肉桂、黄芪","C":"六味地黄丸治肾阳虚，肾气丸治肾阴虚","D":"二方组成相同而仅剂量不同","E":"六味地黄丸加知母、黄柏即为肾气丸"},"answer":"A","explain":"肾气丸为六味地黄丸加少量桂枝、附子，取少火生气之意，温补肾阳，治腰痛脚软、少腹拘急、小便不利或反多。加知母、黄柏者为知柏地黄丸，故 C、D、E 皆误，B 亦与组成不符。","tags":["鉴别","高频"]},{"id":"JC-FJ-0031","type":"A1","group":null,"topic":"方剂鉴别-白虎汤与竹叶石膏汤","difficulty":3,"stem":"白虎汤与竹叶石膏汤的鉴别，正确的是","options":{"A":"白虎汤清气分实热，竹叶石膏汤清热益气养阴","B":"二方均以石膏、知母为君","C":"白虎汤治虚热，竹叶石膏汤治实热","D":"二方药物组成完全相同","E":"竹叶石膏汤为白虎汤去甘草加人参"},"answer":"A","explain":"白虎汤以石膏、知母清气分实热，治壮热汗出、脉洪大；竹叶石膏汤由白虎汤去知母，加竹叶、麦冬、半夏、人参，清热兼益气养阴、和胃降逆，治热病后期余热未清气津两伤。B、C、D、E 均误。","tags":["鉴别"]},{"id":"JC-FJ-0032","type":"A1","group":null,"topic":"方剂鉴别-归脾汤与四物汤","difficulty":2,"stem":"归脾汤与四物汤均可治血虚，二者的主要区别是","options":{"A":"归脾汤益气补血、健脾养心，四物汤补血调血","B":"归脾汤养血调经，四物汤益气健脾","C":"二方均以熟地黄为君","D":"归脾汤治肝血虚，四物汤治心血虚","E":"二方组成完全相同"},"answer":"A","explain":"归脾汤以黄芪、人参、白术、甘草补脾益气，配当归、龙眼肉养血，茯神、远志、酸枣仁安神，治心脾两虚、气血不足；四物汤以熟地黄、当归、白芍、川芎补血调血，治营血虚滞。B、C、D、E 均误。","tags":["鉴别"]},{"id":"JC-FJ-0033","type":"A2","group":null,"topic":"解表剂-败毒散","difficulty":3,"stem":"患者，男，45 岁。恶寒发热，头项强痛，肢体酸痛，无汗，鼻塞声重，咳嗽有痰，胸膈痞满，舌淡苔白腻，脉浮而按之无力。宜首选","options":{"A":"麻黄汤","B":"桂枝汤","C":"败毒散","D":"银翘散","E":"小青龙汤"},"answer":"C","explain":"外感风寒湿邪兼气虚，脉浮而按之无力为辨证眼目，治当散寒祛湿、益气解表，方用败毒散，以羌活、独活、川芎、柴胡解表散邪，配人参益气鼓邪外出。A 纯用辛温发汗易伤正；B 治表虚有汗；D 治风热；E 治外寒内饮。","tags":["经典","鉴别"]},{"id":"JC-FJ-0034","type":"A2","group":null,"topic":"泻下剂-大承气汤","difficulty":2,"stem":"患者，男，38 岁。高热不退，腹满硬痛拒按，大便不通，烦躁谵语，舌苔焦黄起刺，脉沉实有力。宜首选","options":{"A":"大承气汤","B":"小承气汤","C":"调胃承气汤","D":"麻子仁丸","E":"大黄牡丹汤"},"answer":"A","explain":"痞满燥实俱备之阳明腑实证，当峻下热结，大承气汤硝黄枳朴同用最为对证。小承气汤去芒硝而轻下；调胃承气汤去枳朴加甘草而缓下；麻子仁丸润肠治脾约；大黄牡丹汤泻热逐瘀治肠痈。","tags":["高频"]},{"id":"JC-FJ-0035","type":"A2","group":null,"topic":"和解剂-小柴胡汤","difficulty":1,"stem":"患者，女，30 岁。寒热往来，胸胁苦满，默默不欲饮食，心烦喜呕，口苦咽干，目眩，脉弦。宜首选","options":{"A":"逍遥散","B":"小柴胡汤","C":"半夏泻心汤","D":"四逆散","E":"蒿芩清胆汤"},"answer":"B","explain":"寒热往来、胸胁苦满、默默不欲饮食、心烦喜呕为少阳四大症，治当和解少阳，小柴胡汤主之。逍遥散治肝郁血虚脾弱；半夏泻心汤治寒热错杂之痞；四逆散治阳郁厥逆；蒿芩清胆汤治少阳湿热痰浊。","tags":["高频"]},{"id":"JC-FJ-0036","type":"A2","group":null,"topic":"和解剂-逍遥散","difficulty":2,"stem":"患者，女，34 岁。两胁作痛，头痛目眩，神疲食少，月经不调，乳房胀痛，脉弦而虚。宜首选","options":{"A":"四逆散","B":"逍遥散","C":"小柴胡汤","D":"柴胡疏肝散","E":"归脾汤"},"answer":"B","explain":"肝郁血虚脾弱之胁痛、神疲食少、月经不调、脉弦而虚，治当疏肝解郁、养血健脾，逍遥散主之。四逆散偏疏肝理脾治阳郁厥逆；柴胡疏肝散行气止痛而无养血健脾之力；归脾汤益气补血健脾养心。","tags":["高频"]},{"id":"JC-FJ-0037","type":"A2","group":null,"topic":"清热剂-清营汤","difficulty":3,"stem":"患者，男，25 岁。身热夜甚，神烦少寐，时有谵语，口渴或不渴，斑疹隐隐，舌绛而干，脉细数。宜首选","options":{"A":"白虎汤","B":"清营汤","C":"黄连解毒汤","D":"青蒿鳖甲汤","E":"犀角地黄汤"},"answer":"B","explain":"身热夜甚、神烦少寐、时有谵语、舌绛而干为热入营分，治当清营解毒、透热养阴，方用清营汤。白虎汤清气分热；黄连解毒汤泻三焦火毒；青蒿鳖甲汤治热病后期阴伤邪伏；犀角地黄汤凉血散血，主血分证。","tags":["鉴别"]},{"id":"JC-FJ-0038","type":"A2","group":null,"topic":"清热剂-玉女煎","difficulty":3,"stem":"患者，女，42 岁。牙痛牵引头痛，牙齿松动，牙龈出血，烦热干渴，舌红苔黄而干，脉细数。宜首选","options":{"A":"清胃散","B":"玉女煎","C":"黄连解毒汤","D":"龙胆泻肝汤","E":"知柏地黄丸"},"answer":"B","explain":"牙痛兼齿松龈衄、烦热干渴、舌红苔黄而干，为胃热阴虚，治当清胃热、滋肾阴，玉女煎主之。清胃散清胃凉血，宜胃火牙痛而阴未伤者；黄连解毒汤泻三焦火毒；知柏地黄丸滋阴降火而清胃力弱。","tags":["鉴别"]},{"id":"JC-FJ-0039","type":"A2","group":null,"topic":"祛暑剂-清暑益气汤","difficulty":2,"stem":"患者，男，28 岁。夏日感暑，身热汗多，口渴心烦，体倦少气，精神不振，小便短赤，脉虚数。宜首选","options":{"A":"香薷散","B":"清暑益气汤","C":"白虎汤","D":"六一散","E":"藿香正气散"},"answer":"B","explain":"暑热伤气耗津，身热汗多、口渴心烦而体倦少气、脉虚数，治当清暑益气、养阴生津，方用清暑益气汤。香薷散治阴暑外寒内湿；白虎汤清气分实热而无益气生津之力；六一散清暑利湿；藿香正气散化湿解表。","tags":["鉴别"]},{"id":"JC-FJ-0040","type":"A2","group":null,"topic":"补益剂-归脾汤","difficulty":2,"stem":"患者，女，36 岁。心悸怔忡，健忘失眠，体倦食少，面色萎黄，月经量多色淡，舌淡苔薄白，脉细弱。宜首选","options":{"A":"四物汤","B":"归脾汤","C":"补中益气汤","D":"天王补心丹","E":"逍遥散"},"answer":"B","explain":"思虑过度、劳伤心脾，气血两虚而见心悸健忘、食少体倦、月经量多色淡，治当益气补血、健脾养心，归脾汤主之。四物汤无补气健脾之力；补中益气汤重在升阳举陷；天王补心丹偏滋阴清热；逍遥散偏疏肝。","tags":["高频"]},{"id":"JC-FJ-0041","type":"A2","group":null,"topic":"补益剂-肾气丸","difficulty":2,"stem":"患者，男，58 岁。腰痛脚软，下半身常有冷感，少腹拘急，小便不利，夜尿增多，舌淡胖，脉沉细。宜首选","options":{"A":"六味地黄丸","B":"肾气丸","C":"左归丸","D":"右归丸","E":"真武汤"},"answer":"B","explain":"肾阳不足、气化不行之腰痛脚软、少腹拘急、小便不利，治当补肾助阳、化气行水，肾气丸主之。六味地黄丸滋补肝肾；左归丸滋阴填精；右归丸纯补无泻而少利水之力；真武汤偏于温阳利水治水泛。","tags":["鉴别"]},{"id":"JC-FJ-0042","type":"A2","group":null,"topic":"固涩剂-金锁固精丸","difficulty":2,"stem":"患者，男，26 岁。遗精滑泄，腰酸耳鸣，神疲乏力，舌淡苔白，脉细弱。宜首选","options":{"A":"金锁固精丸","B":"桑螵蛸散","C":"四神丸","D":"牡蛎散","E":"六味地黄丸"},"answer":"A","explain":"肾虚不固之遗精滑泄，治当补肾涩精，金锁固精丸以沙苑子补肾固精，配芡实、莲子、莲须涩精，龙骨、牡蛎收敛固涩。桑螵蛸散调补心肾、涩精止遗，偏治尿频遗尿；四神丸涩肠止泻；牡蛎散止汗；六味地黄丸专补而少固涩。","tags":[]},{"id":"JC-FJ-0043","type":"A2","group":null,"topic":"理气剂-瓜蒌薤白白酒汤","difficulty":3,"stem":"患者，男，55 岁。胸痛胸闷，喘息咳唾，短气，舌苔白腻，脉沉弦。宜首选","options":{"A":"半夏厚朴汤","B":"瓜蒌薤白白酒汤","C":"血府逐瘀汤","D":"越鞠丸","E":"旋覆代赭汤"},"answer":"B","explain":"胸阳不振、痰浊痹阻之胸痹，治当通阳散结、行气祛痰，瓜蒌薤白白酒汤主之。半夏厚朴汤治梅核气；血府逐瘀汤治血瘀胸痛而痛有定处、舌暗有瘀斑；越鞠丸治六郁；旋覆代赭汤治噫气不除。","tags":["鉴别"]},{"id":"JC-FJ-0044","type":"A2","group":null,"topic":"理血剂-黄土汤","difficulty":3,"stem":"患者，女，48 岁。大便下血，血色暗淡，先便后血，腹痛喜温喜按，面色萎黄，四肢不温，舌淡苔白，脉沉细无力。宜首选","options":{"A":"黄土汤","B":"小蓟饮子","C":"槐花散","D":"归脾汤","E":"胶艾汤"},"answer":"A","explain":"脾阳不足、统摄无权而便血，治当温阳健脾、养血止血，黄土汤主之，以灶心黄土温中止血为君，白术、附子温阳健脾，生地、阿胶养血止血，黄芩制其温燥。小蓟饮子治下焦湿热尿血；槐花散清肠凉血；归脾汤偏于气血两虚。","tags":["鉴别"]},{"id":"JC-FJ-0045","type":"A2","group":null,"topic":"祛湿剂-独活寄生汤","difficulty":2,"stem":"患者，女，60 岁。腰膝冷痛，屈伸不利，遇寒加重，心悸气短，舌淡苔白，脉细弱。宜首选","options":{"A":"独活寄生汤","B":"羌活胜湿汤","C":"真武汤","D":"五苓散","E":"平胃散"},"answer":"A","explain":"痹证日久、肝肾两虚、气血不足之腰膝冷痛，治当祛风湿、止痹痛、益肝肾、补气血，独活寄生汤主之。羌活胜湿汤祛风胜湿而无补益之功；真武汤温阳利水；五苓散利水渗湿；平胃散燥湿运脾。","tags":["高频"]},{"id":"JC-FJ-0046","type":"A2","group":null,"topic":"消食剂-健脾丸","difficulty":2,"stem":"患者，男，20 岁。食少难消，脘腹痞闷，大便溏薄，倦怠乏力，苔腻微黄，脉虚弱。宜首选","options":{"A":"保和丸","B":"健脾丸","C":"枳实导滞丸","D":"参苓白术散","E":"四君子汤"},"answer":"B","explain":"脾虚食积、虚实夹杂，治当健脾和胃、消食止泻，健脾丸主之。保和丸纯消无补，宜食积而无脾虚者；枳实导滞丸消导化积、清热祛湿，治湿热食积；参苓白术散消食之力不足；四君子汤纯补脾气。","tags":["鉴别"]},{"id":"JC-FJ-0047","type":"A2","group":null,"topic":"解表剂-银翘散","difficulty":2,"stem":"患者，女，22 岁。发热微恶风寒，无汗，头痛口渴，咳嗽咽痛，舌尖红，苔薄白或薄黄，脉浮数。宜首选","options":{"A":"桑菊饮","B":"银翘散","C":"麻黄汤","D":"桂枝汤","E":"柴葛解肌汤"},"answer":"B","explain":"温病初起、邪郁肺卫，发热口渴咽痛而咳嗽不重，治当辛凉透表、清热解毒，银翘散主之。桑菊饮为辛凉轻剂，主治以咳嗽为主、身热不甚者；麻黄汤、桂枝汤辛温治风寒；柴葛解肌汤解肌清热治三阳合病。","tags":["鉴别"]},{"id":"JC-FJ-0048","type":"A2","group":null,"topic":"和解剂-四逆散","difficulty":3,"stem":"患者，男，32 岁。手足不温，胁肋胀痛，脘腹疼痛，脉弦。宜首选","options":{"A":"四逆散","B":"四逆汤","C":"逍遥散","D":"小柴胡汤","E":"当归四逆汤"},"answer":"A","explain":"手足不温而冷不过肘膝，兼胁痛脘痛、脉弦，为阳郁厥逆、肝脾不和，治当透邪解郁、疏肝理脾，四逆散主之。四逆汤回阳救逆，治寒厥冷过肘膝、脉微细；当归四逆汤治血虚寒厥；逍遥散偏养血健脾；小柴胡汤和解少阳。","tags":["鉴别","易错"]},{"id":"JC-FJ-0049","type":"B1","group":"FJ-B1-001","group_stem":"A.麻黄汤　B.桂枝汤　C.银翘散　D.桑菊饮　E.小青龙汤","topic":"解表剂-麻黄汤","difficulty":1,"stem":"外感风寒表实证，恶寒发热、无汗而喘、脉浮紧者，宜选用","options":{"A":"麻黄汤","B":"桂枝汤","C":"银翘散","D":"桑菊饮","E":"小青龙汤"},"answer":"A","explain":"麻黄汤发汗解表、宣肺平喘，主治外感风寒表实证，以恶寒发热、无汗而喘、脉浮紧为辨证要点。桂枝汤治表虚有汗；银翘散治风热；桑菊饮治风热咳嗽；小青龙汤治外寒内饮。","tags":["高频"]},{"id":"JC-FJ-0050","type":"B1","group":"FJ-B1-001","group_stem":"A.麻黄汤　B.桂枝汤　C.银翘散　D.桑菊饮　E.小青龙汤","topic":"解表剂-桂枝汤","difficulty":1,"stem":"外感风寒表虚证，头痛发热、汗出恶风、脉浮缓者，宜选用","options":{"A":"麻黄汤","B":"桂枝汤","C":"银翘散","D":"桑菊饮","E":"小青龙汤"},"answer":"B","explain":"桂枝汤解肌发表、调和营卫，主治外感风寒表虚证，以汗出恶风、脉浮缓为要点。麻黄汤治表实无汗；银翘散、桑菊饮治风热；小青龙汤治外寒内饮之咳喘痰稀。","tags":["高频"]},{"id":"JC-FJ-0051","type":"B1","group":"FJ-B1-001","group_stem":"A.麻黄汤　B.桂枝汤　C.银翘散　D.桑菊饮　E.小青龙汤","topic":"解表剂-银翘散","difficulty":1,"stem":"温病初起，发热无汗或有汗不畅、咽喉疼痛、口渴、脉浮数者，宜选用","options":{"A":"麻黄汤","B":"桂枝汤","C":"银翘散","D":"桑菊饮","E":"小青龙汤"},"answer":"C","explain":"银翘散辛凉透表、清热解毒，主治温病初起，以发热、微恶风寒、咽痛口渴、脉浮数为要点。麻黄汤、桂枝汤辛温治风寒；桑菊饮偏宣肺止咳；小青龙汤治外寒内饮。","tags":["高频"]},{"id":"JC-FJ-0052","type":"B1","group":"FJ-B1-001","group_stem":"A.麻黄汤　B.桂枝汤　C.银翘散　D.桑菊饮　E.小青龙汤","topic":"解表剂-小青龙汤","difficulty":3,"stem":"外感风寒、内有痰饮，恶寒发热、无汗、咳喘痰多清稀者，宜选用","options":{"A":"麻黄汤","B":"桂枝汤","C":"银翘散","D":"桑菊饮","E":"小青龙汤"},"answer":"E","explain":"小青龙汤解表散寒、温肺化饮，主治外寒内饮证，以恶寒发热、无汗、咳喘痰多清稀为要点。麻黄汤宣肺平喘而无化饮之力；桂枝汤治表虚；银翘散、桑菊饮均治风热。","tags":["鉴别"]},{"id":"JC-FJ-0053","type":"B1","group":"FJ-B1-002","group_stem":"A.白虎汤　B.清营汤　C.黄连解毒汤　D.龙胆泻肝汤　E.清胃散","topic":"清热剂-白虎汤","difficulty":1,"stem":"阳明气分热盛，壮热面赤、烦渴引饮、汗出恶热、脉洪大者，宜选用","options":{"A":"白虎汤","B":"清营汤","C":"黄连解毒汤","D":"龙胆泻肝汤","E":"清胃散"},"answer":"A","explain":"白虎汤清热生津，主治阳明气分热盛证，以大热、大汗、大渴、脉洪大为辨证要点。清营汤治热入营分；黄连解毒汤泻三焦火毒；龙胆泻肝汤清肝胆湿热；清胃散清胃凉血。","tags":["高频"]},{"id":"JC-FJ-0054","type":"B1","group":"FJ-B1-002","group_stem":"A.白虎汤　B.清营汤　C.黄连解毒汤　D.龙胆泻肝汤　E.清胃散","topic":"清热剂-清营汤","difficulty":3,"stem":"热入营分，身热夜甚、神烦少寐、时有谵语、舌绛而干者，宜选用","options":{"A":"白虎汤","B":"清营汤","C":"黄连解毒汤","D":"龙胆泻肝汤","E":"清胃散"},"answer":"B","explain":"清营汤清营解毒、透热养阴，主治热入营分证，以身热夜甚、神烦少寐、时有谵语、舌绛而干为要点。白虎汤清气分热；黄连解毒汤泻火解毒而无透热转气之力；龙胆泻肝汤、清胃散各有所主。","tags":["鉴别"]},{"id":"JC-FJ-0055","type":"B1","group":"FJ-B1-002","group_stem":"A.白虎汤　B.清营汤　C.黄连解毒汤　D.龙胆泻肝汤　E.清胃散","topic":"清热剂-黄连解毒汤","difficulty":2,"stem":"三焦火毒热盛，大热烦躁、口燥咽干、错语不眠、舌红苔黄者，宜选用","options":{"A":"白虎汤","B":"清营汤","C":"黄连解毒汤","D":"龙胆泻肝汤","E":"清胃散"},"answer":"C","explain":"黄连解毒汤泻火解毒，主治三焦火毒热盛证，以大热烦躁、口燥咽干、错语不眠为要点。白虎汤偏清阳明气分热；清营汤治热入营分；龙胆泻肝汤主肝胆湿热；清胃散主胃火牙痛。","tags":[]},{"id":"JC-FJ-0056","type":"B1","group":"FJ-B1-002","group_stem":"A.白虎汤　B.清营汤　C.黄连解毒汤　D.龙胆泻肝汤　E.清胃散","topic":"清热剂-清胃散","difficulty":2,"stem":"胃火牙痛，牙痛牵引头脑、口气热臭、牙龈红肿溃烂者，宜选用","options":{"A":"白虎汤","B":"清营汤","C":"黄连解毒汤","D":"龙胆泻肝汤","E":"清胃散"},"answer":"E","explain":"清胃散清胃凉血，主治胃火牙痛，以牙痛牵引头痛、口气热臭、牙龈红肿溃烂、舌红苔黄为要点。白虎汤清气分大热；黄连解毒汤泻三焦火毒；龙胆泻肝汤主肝胆实火；清营汤治热入营分。","tags":[]},{"id":"JC-FJ-0057","type":"B1","group":"FJ-B1-003","group_stem":"A.四君子汤　B.参苓白术散　C.补中益气汤　D.四物汤　E.六味地黄丸","topic":"补益剂-四君子汤","difficulty":1,"stem":"脾胃气虚，面色萎白、语声低微、四肢乏力、食少便溏者，宜选用","options":{"A":"四君子汤","B":"参苓白术散","C":"补中益气汤","D":"四物汤","E":"六味地黄丸"},"answer":"A","explain":"四君子汤益气健脾，主治脾胃气虚证，以面色萎白、语声低微、食少便溏、脉虚弱为要点。参苓白术散兼渗湿止泻；补中益气汤兼升阳举陷；四物汤补血；六味地黄丸滋补肝肾。","tags":["高频"]},{"id":"JC-FJ-0058","type":"B1","group":"FJ-B1-003","group_stem":"A.四君子汤　B.参苓白术散　C.补中益气汤　D.四物汤　E.六味地黄丸","topic":"补益剂-参苓白术散","difficulty":2,"stem":"脾胃气虚夹湿，饮食不化、肠鸣泄泻、四肢乏力、形体消瘦者，宜选用","options":{"A":"四君子汤","B":"参苓白术散","C":"补中益气汤","D":"四物汤","E":"六味地黄丸"},"answer":"B","explain":"参苓白术散益气健脾、渗湿止泻，主治脾虚夹湿证，以饮食不化、肠鸣泄泻、四肢乏力、形体消瘦为要点。四君子汤补气而无渗湿止泻之力；补中益气汤主升阳举陷；四物汤补血；六味地黄丸补肝肾。","tags":["鉴别"]},{"id":"JC-FJ-0059","type":"B1","group":"FJ-B1-003","group_stem":"A.四君子汤　B.参苓白术散　C.补中益气汤　D.四物汤　E.六味地黄丸","topic":"补益剂-补中益气汤","difficulty":2,"stem":"中气不足、气虚下陷，体倦肢软、少气懒言、脱肛或子宫脱垂者，宜选用","options":{"A":"四君子汤","B":"参苓白术散","C":"补中益气汤","D":"四物汤","E":"六味地黄丸"},"answer":"C","explain":"补中益气汤补中益气、升阳举陷，主治中气不足、气虚下陷证，以体倦肢软、少气懒言、脱肛、子宫脱垂为要点。四君子汤补气而无升举之力；参苓白术散兼渗湿止泻；四物汤补血；六味地黄丸补肝肾。","tags":["高频"]},{"id":"JC-FJ-0060","type":"B1","group":"FJ-B1-003","group_stem":"A.四君子汤　B.参苓白术散　C.补中益气汤　D.四物汤　E.六味地黄丸","topic":"补益剂-四物汤","difficulty":1,"stem":"营血虚滞，心悸失眠、头晕目眩、面色无华、月经量少者，宜选用","options":{"A":"四君子汤","B":"参苓白术散","C":"补中益气汤","D":"四物汤","E":"六味地黄丸"},"answer":"D","explain":"四物汤补血调血，主治营血虚滞证，以心悸失眠、头晕目眩、面色无华、月经量少或经闭为要点。四君子汤补气；参苓白术散健脾渗湿；补中益气汤升阳举陷；六味地黄丸滋补肝肾。","tags":["高频"]},{"id":"JC-FJ-0061","type":"B1","group":"FJ-B1-004","group_stem":"A.理中丸　B.四逆汤　C.小建中汤　D.当归四逆汤　E.吴茱萸汤","topic":"温里剂-理中丸","difficulty":2,"stem":"脾胃虚寒，脘腹绵绵作痛、喜温喜按、呕吐便溏者，宜选用","options":{"A":"理中丸","B":"四逆汤","C":"小建中汤","D":"当归四逆汤","E":"吴茱萸汤"},"answer":"A","explain":"理中丸温中祛寒、补气健脾，主治脾胃虚寒证，以脘腹绵绵作痛、喜温喜按、呕吐便溏为要点。四逆汤回阳救逆治寒厥；小建中汤兼缓急止痛；当归四逆汤治血虚寒厥；吴茱萸汤主厥阴头痛、干呕吐涎沫。","tags":["高频"]},{"id":"JC-FJ-0062","type":"B1","group":"FJ-B1-004","group_stem":"A.理中丸　B.四逆汤　C.小建中汤　D.当归四逆汤　E.吴茱萸汤","topic":"温里剂-四逆汤","difficulty":1,"stem":"心肾阳衰寒厥，四肢厥逆、恶寒蜷卧、下利清谷、脉微细者，宜选用","options":{"A":"理中丸","B":"四逆汤","C":"小建中汤","D":"当归四逆汤","E":"吴茱萸汤"},"answer":"B","explain":"四逆汤回阳救逆，主治心肾阳衰寒厥证，以四肢厥逆、恶寒蜷卧、下利清谷、脉微细为要点。理中丸主中焦虚寒而无回阳之力；小建中汤温中补虚缓急；当归四逆汤治血虚寒厥；吴茱萸汤主肝胃虚寒。","tags":["高频"]},{"id":"JC-FJ-0063","type":"B1","group":"FJ-B1-004","group_stem":"A.理中丸　B.四逆汤　C.小建中汤　D.当归四逆汤　E.吴茱萸汤","topic":"温里剂-小建中汤","difficulty":3,"stem":"中焦虚寒、肝脾不和，腹中拘急疼痛、喜温喜按、心悸虚烦者，宜选用","options":{"A":"理中丸","B":"四逆汤","C":"小建中汤","D":"当归四逆汤","E":"吴茱萸汤"},"answer":"C","explain":"小建中汤温中补虚、和里缓急，主治中焦虚寒、肝脾不和证，以腹中拘急疼痛、喜温喜按、心悸虚烦、面色无华为要点。理中丸偏于健脾止泻；四逆汤回阳救逆；当归四逆汤治血虚寒厥；吴茱萸汤降逆止呕。","tags":["鉴别"]},{"id":"JC-FJ-0064","type":"B1","group":"FJ-B1-004","group_stem":"A.理中丸　B.四逆汤　C.小建中汤　D.当归四逆汤　E.吴茱萸汤","topic":"温里剂-当归四逆汤","difficulty":3,"stem":"血虚寒厥，手足厥寒、脉细欲绝、舌淡苔白者，宜选用","options":{"A":"理中丸","B":"四逆汤","C":"小建中汤","D":"当归四逆汤","E":"吴茱萸汤"},"answer":"D","explain":"当归四逆汤温经散寒、养血通脉，主治血虚寒厥证，以手足厥寒、脉细欲绝为要点。四逆汤治阳衰寒厥而脉微细；理中丸主中焦虚寒；小建中汤温中补虚缓急；吴茱萸汤主肝胃虚寒之头痛呕吐。","tags":["鉴别"]},{"id":"JC-FJ-0065","type":"B1","group":"FJ-B1-005","group_stem":"A.平胃散　B.藿香正气散　C.茵陈蒿汤　D.五苓散　E.真武汤","topic":"祛湿剂-平胃散","difficulty":1,"stem":"湿滞脾胃，脘腹胀满、不思饮食、口淡无味、苔白腻而厚者，宜选用","options":{"A":"平胃散","B":"藿香正气散","C":"茵陈蒿汤","D":"五苓散","E":"真武汤"},"answer":"A","explain":"平胃散燥湿运脾、行气和胃，主治湿滞脾胃证，以脘腹胀满、不思饮食、口淡无味、苔白腻而厚为要点。藿香正气散兼解表；茵陈蒿汤清利湿热退黄；五苓散利水渗湿；真武汤温阳利水。","tags":["高频"]},{"id":"JC-FJ-0066","type":"B1","group":"FJ-B1-005","group_stem":"A.平胃散　B.藿香正气散　C.茵陈蒿汤　D.五苓散　E.真武汤","topic":"祛湿剂-藿香正气散","difficulty":2,"stem":"外感风寒、内伤湿滞，恶寒发热、头痛、胸膈满闷、呕吐泄泻者，宜选用","options":{"A":"平胃散","B":"藿香正气散","C":"茵陈蒿汤","D":"五苓散","E":"真武汤"},"answer":"B","explain":"藿香正气散解表化湿、理气和中，主治外感风寒、内伤湿滞证，以恶寒发热、头痛、胸膈满闷、呕吐泄泻为要点。平胃散专于燥湿运脾而无解表之力；茵陈蒿汤退黄；五苓散利水；真武汤温阳利水。","tags":["高频"]},{"id":"JC-FJ-0067","type":"B1","group":"FJ-B1-005","group_stem":"A.平胃散　B.藿香正气散　C.茵陈蒿汤　D.五苓散　E.真武汤","topic":"祛湿剂-茵陈蒿汤","difficulty":1,"stem":"湿热黄疸，一身面目俱黄、黄色鲜明、小便短赤者，宜选用","options":{"A":"平胃散","B":"藿香正气散","C":"茵陈蒿汤","D":"五苓散","E":"真武汤"},"answer":"C","explain":"茵陈蒿汤清热利湿退黄，主治湿热黄疸，以一身面目俱黄、黄色鲜明、小便短赤、舌苔黄腻为要点。平胃散燥湿运脾；藿香正气散解表化湿；五苓散利水渗湿；真武汤温阳利水，均无退黄专功。","tags":["高频"]},{"id":"JC-FJ-0068","type":"B1","group":"FJ-B1-005","group_stem":"A.平胃散　B.藿香正气散　C.茵陈蒿汤　D.五苓散　E.真武汤","topic":"祛湿剂-真武汤","difficulty":2,"stem":"脾肾阳虚、水湿内停，小便不利、四肢沉重疼痛、腹痛下利者，宜选用","options":{"A":"平胃散","B":"藿香正气散","C":"茵陈蒿汤","D":"五苓散","E":"真武汤"},"answer":"E","explain":"真武汤温阳利水，主治脾肾阳虚、水湿内停证，以小便不利、四肢沉重疼痛、腹痛下利、苔白脉沉为要点。五苓散主膀胱气化不利之蓄水证而阳虚不显；平胃散燥湿运脾；茵陈蒿汤退黄；藿香正气散解表化湿。","tags":["鉴别"]},{"id":"JC-FJ-0069","type":"B1","group":"FJ-B1-006","group_stem":"A.二陈汤　B.温胆汤　C.清气化痰丸　D.半夏白术天麻汤　E.贝母瓜蒌散","topic":"祛痰剂-二陈汤","difficulty":1,"stem":"湿痰证，咳嗽痰多色白易咯、胸膈痞闷、恶心呕吐、苔白腻者，宜选用","options":{"A":"二陈汤","B":"温胆汤","C":"清气化痰丸","D":"半夏白术天麻汤","E":"贝母瓜蒌散"},"answer":"A","explain":"二陈汤燥湿化痰、理气和中，主治湿痰证，以咳嗽痰多色白易咯、胸膈痞闷、恶心呕吐、苔白腻为要点。温胆汤主痰热内扰；清气化痰丸主痰热咳嗽；半夏白术天麻汤主风痰眩晕；贝母瓜蒌散主燥痰。","tags":["高频"]},{"id":"JC-FJ-0070","type":"B1","group":"FJ-B1-006","group_stem":"A.二陈汤　B.温胆汤　C.清气化痰丸　D.半夏白术天麻汤　E.贝母瓜蒌散","topic":"祛痰剂-温胆汤","difficulty":2,"stem":"胆胃不和、痰热内扰，胆怯易惊、虚烦不眠、眩悸呕恶者，宜选用","options":{"A":"二陈汤","B":"温胆汤","C":"清气化痰丸","D":"半夏白术天麻汤","E":"贝母瓜蒌散"},"answer":"B","explain":"温胆汤理气化痰、和胃利胆，主治胆胃不和、痰热内扰证，以胆怯易惊、虚烦不眠、眩悸呕恶、苔黄腻为要点。二陈汤主湿痰而无清热之力；清气化痰丸主痰热咳嗽；半夏白术天麻汤主风痰眩晕。","tags":["鉴别"]},{"id":"JC-FJ-0071","type":"B1","group":"FJ-B1-006","group_stem":"A.二陈汤　B.温胆汤　C.清气化痰丸　D.半夏白术天麻汤　E.贝母瓜蒌散","topic":"祛痰剂-清气化痰丸","difficulty":2,"stem":"痰热咳嗽，咳嗽气喘、咯痰黄稠、胸膈痞闷、舌红苔黄腻者，宜选用","options":{"A":"二陈汤","B":"温胆汤","C":"清气化痰丸","D":"半夏白术天麻汤","E":"贝母瓜蒌散"},"answer":"C","explain":"清气化痰丸清热化痰、理气止咳，主治痰热咳嗽，以咳嗽气喘、咯痰黄稠、胸膈痞闷、舌红苔黄腻为要点。二陈汤性温燥；温胆汤主胆胃不和；半夏白术天麻汤主风痰眩晕；贝母瓜蒌散主肺燥有痰。","tags":["鉴别"]},{"id":"JC-FJ-0072","type":"B1","group":"FJ-B1-006","group_stem":"A.二陈汤　B.温胆汤　C.清气化痰丸　D.半夏白术天麻汤　E.贝母瓜蒌散","topic":"祛痰剂-半夏白术天麻汤","difficulty":3,"stem":"风痰上扰之眩晕头痛，头重如蒙、胸闷恶心、苔白腻、脉弦滑者，宜选用","options":{"A":"二陈汤","B":"温胆汤","C":"清气化痰丸","D":"半夏白术天麻汤","E":"贝母瓜蒌散"},"answer":"D","explain":"半夏白术天麻汤化痰息风、健脾祛湿，主治风痰上扰证，以眩晕头痛、头重如蒙、胸闷恶心、苔白腻、脉弦滑为要点。二陈汤无息风之力；温胆汤主痰热内扰；清气化痰丸主痰热咳嗽；贝母瓜蒌散主燥痰。","tags":["鉴别"]},{"id":"JC-FJ-0073","type":"B1","group":"FJ-B1-007","group_stem":"A.血府逐瘀汤　B.补阳还五汤　C.桃核承气汤　D.小蓟饮子　E.黄土汤","topic":"理血剂-血府逐瘀汤","difficulty":2,"stem":"胸中血瘀，胸痛头痛日久、痛如针刺而有定处、舌暗有瘀斑者，宜选用","options":{"A":"血府逐瘀汤","B":"补阳还五汤","C":"桃核承气汤","D":"小蓟饮子","E":"黄土汤"},"answer":"A","explain":"血府逐瘀汤活血化瘀、行气止痛，主治胸中血瘀证，以胸痛头痛日久、痛如针刺有定处、舌暗有瘀斑为要点。补阳还五汤主气虚血瘀之中风后遗；桃核承气汤主下焦蓄血；小蓟饮子主血淋尿血；黄土汤主虚寒便血。","tags":["高频"]},{"id":"JC-FJ-0074","type":"B1","group":"FJ-B1-007","group_stem":"A.血府逐瘀汤　B.补阳还五汤　C.桃核承气汤　D.小蓟饮子　E.黄土汤","topic":"理血剂-补阳还五汤","difficulty":1,"stem":"气虚血瘀之中风后遗，半身不遂、口眼歪斜、语言謇涩、小便频数者，宜选用","options":{"A":"血府逐瘀汤","B":"补阳还五汤","C":"桃核承气汤","D":"小蓟饮子","E":"黄土汤"},"answer":"B","explain":"补阳还五汤补气活血通络，主治气虚血瘀之中风后遗症，以半身不遂、口眼歪斜、语言謇涩、小便频数或遗尿为要点。血府逐瘀汤行气止痛治胸中血瘀；桃核承气汤泻热逐瘀；小蓟饮子凉血止血；黄土汤温阳止血。","tags":["高频"]},{"id":"JC-FJ-0075","type":"B1","group":"FJ-B1-007","group_stem":"A.血府逐瘀汤　B.补阳还五汤　C.桃核承气汤　D.小蓟饮子　E.黄土汤","topic":"理血剂-桃核承气汤","difficulty":3,"stem":"下焦蓄血，少腹急结、小便自利、其人如狂、至夜发热者，宜选用","options":{"A":"血府逐瘀汤","B":"补阳还五汤","C":"桃核承气汤","D":"小蓟饮子","E":"黄土汤"},"answer":"C","explain":"桃核承气汤泻热逐瘀，主治下焦蓄血证，以少腹急结、小便自利、其人如狂、至夜发热为要点。血府逐瘀汤主胸中血瘀；补阳还五汤主气虚血瘀；小蓟饮子主下焦湿热尿血；黄土汤主脾虚便血。","tags":["鉴别"]},{"id":"JC-FJ-0076","type":"B1","group":"FJ-B1-007","group_stem":"A.血府逐瘀汤　B.补阳还五汤　C.桃核承气汤　D.小蓟饮子　E.黄土汤","topic":"理血剂-小蓟饮子","difficulty":2,"stem":"下焦湿热蕴结之血淋尿血，尿中带血、小便频数、赤涩热痛者，宜选用","options":{"A":"血府逐瘀汤","B":"补阳还五汤","C":"桃核承气汤","D":"小蓟饮子","E":"黄土汤"},"answer":"D","explain":"小蓟饮子凉血止血、利水通淋，主治下焦湿热蕴结之血淋尿血，以尿中带血、小便频数、赤涩热痛为要点。血府逐瘀汤主胸中血瘀；补阳还五汤主气虚血瘀；桃核承气汤主下焦蓄血；黄土汤主虚寒便血。","tags":["鉴别"]},{"id":"JC-FJ-0077","type":"B1","group":"FJ-B1-008","group_stem":"A.川芎茶调散　B.镇肝熄风汤　C.天麻钩藤饮　D.消风散　E.羚角钩藤汤","topic":"治风剂-川芎茶调散","difficulty":1,"stem":"外感风邪头痛，偏正头痛或巅顶作痛、目眩鼻塞、恶风发热者，宜选用","options":{"A":"川芎茶调散","B":"镇肝熄风汤","C":"天麻钩藤饮","D":"消风散","E":"羚角钩藤汤"},"answer":"A","explain":"川芎茶调散疏风止痛，主治外感风邪头痛，以偏正头痛或巅顶作痛、目眩鼻塞、恶风发热为要点。镇肝熄风汤、天麻钩藤饮主肝阳上亢；消风散治风疹湿疹；羚角钩藤汤主肝经热盛动风。","tags":["高频"]},{"id":"JC-FJ-0078","type":"B1","group":"FJ-B1-008","group_stem":"A.川芎茶调散　B.镇肝熄风汤　C.天麻钩藤饮　D.消风散　E.羚角钩藤汤","topic":"治风剂-镇肝熄风汤","difficulty":2,"stem":"肝阳上亢、气血上逆之类中风，头目眩晕、目胀耳鸣、脑部热痛、脉弦长有力者，宜选用","options":{"A":"川芎茶调散","B":"镇肝熄风汤","C":"天麻钩藤饮","D":"消风散","E":"羚角钩藤汤"},"answer":"B","explain":"镇肝熄风汤镇肝息风、滋阴潜阳，主治肝阳上亢、气血上逆之类中风，以头目眩晕、目胀耳鸣、脑部热痛、面色如醉、脉弦长有力为要点。天麻钩藤饮平肝息风力较缓；羚角钩藤汤主热盛动风；川芎茶调散治外感风邪头痛。","tags":["鉴别"]},{"id":"JC-FJ-0079","type":"B1","group":"FJ-B1-008","group_stem":"A.川芎茶调散　B.镇肝熄风汤　C.天麻钩藤饮　D.消风散　E.羚角钩藤汤","topic":"治风剂-天麻钩藤饮","difficulty":2,"stem":"肝阳偏亢、肝风上扰，头痛眩晕、失眠多梦、舌红苔黄、脉弦者，宜选用","options":{"A":"川芎茶调散","B":"镇肝熄风汤","C":"天麻钩藤饮","D":"消风散","E":"羚角钩藤汤"},"answer":"C","explain":"天麻钩藤饮平肝息风、清热活血、补益肝肾，主治肝阳偏亢、肝风上扰证，以头痛眩晕、失眠多梦、舌红苔黄、脉弦为要点。镇肝熄风汤镇潜之力更峻；羚角钩藤汤主热盛动风；川芎茶调散治外感头痛；消风散治风疹湿疹。","tags":["鉴别"]},{"id":"JC-FJ-0080","type":"B1","group":"FJ-B1-008","group_stem":"A.川芎茶调散　B.镇肝熄风汤　C.天麻钩藤饮　D.消风散　E.羚角钩藤汤","topic":"治风剂-消风散","difficulty":3,"stem":"风疹湿疹，皮肤瘙痒、疹色红、抓破后渗出津水、舌红苔黄者，宜选用","options":{"A":"川芎茶调散","B":"镇肝熄风汤","C":"天麻钩藤饮","D":"消风散","E":"羚角钩藤汤"},"answer":"D","explain":"消风散疏风养血、清热除湿，主治风疹湿疹，以皮肤瘙痒、疹色红、抓破后渗出津水、舌红苔黄为要点。川芎茶调散治外感头痛；镇肝熄风汤、天麻钩藤饮主肝阳上亢；羚角钩藤汤主肝经热盛动风。","tags":["鉴别"]}]},{"meta":{"bank_id":"jichu-zhongyao","title":"中药学","paper":"jichu","subject":"中药学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":80,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"JC-ZY-0001","type":"A1","group":null,"topic":"总论-四气","difficulty":1,"stem":"寒凉药的主要作用是","options":{"A":"温中散寒","B":"补火助阳","C":"清热泻火","D":"回阳救逆","E":"温通经脉"},"answer":"C","explain":"寒凉药性属阴，能清热泻火、凉血解毒，主治热证。温中散寒为干姜所长；补火助阳、回阳救逆属附子一类；温通经脉属桂枝、肉桂。","tags":["经典"]},{"id":"JC-ZY-0002","type":"A1","group":null,"topic":"总论-五味","difficulty":1,"stem":"五味中具有软坚散结、泻下通便作用的是","options":{"A":"酸味","B":"苦味","C":"甘味","D":"辛味","E":"咸味"},"answer":"E","explain":"咸味能软能下，善软坚散结、泻下通便，多用于瘰疬痰核与大便燥结。酸味能收能涩，苦味能泄能燥，甘味能补能和，辛味能散能行。","tags":["高频"]},{"id":"JC-ZY-0003","type":"A1","group":null,"topic":"总论-升降浮沉","difficulty":1,"stem":"药性升浮者，其作用趋向与功效多为","options":{"A":"下行向内，如潜阳降逆","B":"上行向外，如升阳发表","C":"沉降下行，如清热泻火","D":"通利二便，如泻下逐水","E":"收敛固涩，如敛汗涩肠"},"answer":"B","explain":"升浮药主上行向外，多具升阳发表、祛风散寒、涌吐、开窍之功。潜阳降逆、清热泻火、泻下逐水、收敛固涩均属沉降药的作用趋向。","tags":[]},{"id":"JC-ZY-0004","type":"A1","group":null,"topic":"总论-归经","difficulty":1,"stem":"确定药物归经的主要依据是","options":{"A":"药物形色气味","B":"药物产地季节","C":"所治证候脏腑","D":"药物炮制方法","E":"药物用量大小"},"answer":"C","explain":"归经以脏腑经络理论为基础，以药物所治病证的疗效为依据。形色气味、产地、炮制与用量均不能直接决定药物归经。","tags":["经典"]},{"id":"JC-ZY-0005","type":"A1","group":null,"topic":"总论-配伍七情","difficulty":2,"stem":"一种药物能减轻或消除另一种药物毒副作用的配伍是","options":{"A":"相须","B":"相使","C":"相畏","D":"相杀","E":"相恶"},"answer":"D","explain":"相杀指一药能减轻或消除另一药的毒性或副作用，如生姜杀半夏。相畏是同一关系从被制药物角度的提法；相须、相使均属增效配伍；相恶指功效降低。","tags":["高频","易错"]},{"id":"JC-ZY-0006","type":"A1","group":null,"topic":"总论-十八反","difficulty":2,"stem":"下列配伍属于十八反的是","options":{"A":"甘草配海藻","B":"人参配莱菔子","C":"半夏配生姜","D":"黄芪配茯苓","E":"当归配川芎"},"answer":"A","explain":"十八反中有藻戟遂芫俱战草一句，甘草与海藻同用属相反。人参恶莱菔子属相恶；生姜与半夏属相杀；黄芪配茯苓、当归配川芎为常用配伍。","tags":["高频"]},{"id":"JC-ZY-0007","type":"A1","group":null,"topic":"总论-妊娠禁忌","difficulty":2,"stem":"下列药物中，属于妊娠慎用的是","options":{"A":"巴豆","B":"斑蝥","C":"桃仁","D":"牵牛子","E":"麝香"},"answer":"C","explain":"妊娠慎用药多为活血祛瘀、行气破滞之品，桃仁活血祛瘀，故须慎用。巴豆、斑蝥、牵牛子、麝香毒性强或药性峻猛，均属妊娠禁用。","tags":["易错"]},{"id":"JC-ZY-0008","type":"A1","group":null,"topic":"总论-煎服法","difficulty":1,"stem":"入汤剂时宜后下的药物是","options":{"A":"磁石","B":"牡蛎","C":"薄荷","D":"阿胶","E":"人参"},"answer":"C","explain":"薄荷芳香含挥发油，久煎有效成分易挥散，故宜后下。磁石、牡蛎为矿物介壳，须先煎；阿胶宜烊化；人参贵重宜另煎。","tags":["高频"]},{"id":"JC-ZY-0009","type":"A1","group":null,"topic":"清热药-石膏","difficulty":1,"stem":"善清阳明气分实热，煅用又能收湿敛疮生肌的是","options":{"A":"知母","B":"石膏","C":"天花粉","D":"栀子","E":"芦根"},"answer":"B","explain":"石膏辛甘大寒，专清阳明气分实热，为气分高热要药，煅用收湿敛疮生肌。知母兼滋阴润燥；天花粉清热生津排脓；栀子泻火除烦；芦根清热生津止呕。","tags":["高频"]},{"id":"JC-ZY-0010","type":"A1","group":null,"topic":"清热药-青蒿","difficulty":3,"stem":"既能清透虚热，又能凉血除蒸、解暑热、截疟的是","options":{"A":"地骨皮","B":"白薇","C":"青蒿","D":"银柴胡","E":"胡黄连"},"answer":"C","explain":"青蒿苦辛寒，清透虚热、凉血除蒸、解暑热、截疟，善治夜热早凉及疟疾寒热。地骨皮清肺降火而无截疟之力；白薇利尿通淋；银柴胡、胡黄连只清虚热除疳热。","tags":["鉴别"]},{"id":"JC-ZY-0011","type":"A1","group":null,"topic":"泻下药-大黄","difficulty":1,"stem":"既能泻下攻积，又能清热泻火、凉血解毒、逐瘀通经的是","options":{"A":"芒硝","B":"大黄","C":"番泻叶","D":"芦荟","E":"火麻仁"},"answer":"B","explain":"大黄苦寒沉降，泻下攻积、清热泻火、凉血解毒、逐瘀通经、利湿退黄，为治积滞便秘要药。芒硝长于软坚；番泻叶、芦荟、火麻仁均无凉血逐瘀之功。","tags":["高频"]},{"id":"JC-ZY-0012","type":"A1","group":null,"topic":"泻下药-大黄与芒硝","difficulty":2,"stem":"大黄与芒硝均能泻下，但芒硝尤善于","options":{"A":"泻下攻积","B":"软坚润燥","C":"逐瘀通经","D":"凉血解毒","E":"利湿退黄"},"answer":"B","explain":"芒硝咸能软坚、苦寒泄热，长于润燥软坚泻下，善治燥屎坚结。泻下攻积、逐瘀通经、凉血解毒、利湿退黄均为大黄所长，二药常相须为用。","tags":["鉴别"]},{"id":"JC-ZY-0013","type":"A1","group":null,"topic":"祛风湿药-独活","difficulty":1,"stem":"善治下半身风湿痹痛，尤宜腰膝腿足疼痛的是","options":{"A":"羌活","B":"独活","C":"威灵仙","D":"秦艽","E":"桑寄生"},"answer":"B","explain":"独活辛散苦燥温通，祛风除湿、通痹止痛，善治腰以下痹痛。羌活善治上半身与项背痹痛；威灵仙善消骨鲠；秦艽兼退虚热；桑寄生兼补肝肾安胎。","tags":["鉴别"]},{"id":"JC-ZY-0014","type":"A1","group":null,"topic":"祛风湿药-桑寄生","difficulty":2,"stem":"既能祛风湿、补肝肾、强筋骨，又能安胎的是","options":{"A":"五加皮","B":"桑寄生","C":"杜仲","D":"秦艽","E":"防己"},"answer":"B","explain":"桑寄生苦甘平，祛风湿、补肝肾、强筋骨、安胎，宜于痹证日久兼肝肾不足及胎动不安。五加皮能利水消肿而无安胎之功；杜仲不祛风湿；秦艽、防己无补益之力。","tags":["鉴别"]},{"id":"JC-ZY-0015","type":"A1","group":null,"topic":"化湿药-苍术","difficulty":2,"stem":"既能燥湿健脾，又能祛风散寒、明目的是","options":{"A":"厚朴","B":"苍术","C":"藿香","D":"砂仁","E":"白豆蔻"},"answer":"B","explain":"苍术辛苦温，燥湿健脾、祛风散寒、明目，为治湿阻中焦要药，还可治风寒湿痹与夜盲。厚朴下气除满；藿香化湿解暑止呕；砂仁、白豆蔻化湿行气温中。","tags":["鉴别"]},{"id":"JC-ZY-0016","type":"A1","group":null,"topic":"温里药-附子","difficulty":2,"stem":"附子入汤剂先煎久煎的主要目的是","options":{"A":"增强补益作用","B":"减低毒性","C":"缓和辛散之性","D":"便于烊化","E":"防止有效成分挥发"},"answer":"B","explain":"附子辛甘大热有毒，所含乌头碱类成分久煎可水解，故先煎久煎以减毒。附子无补益之力；烊化为阿胶的用法；防止挥发是薄荷等芳香药后下的原因。","tags":["高频","易错"]},{"id":"JC-ZY-0017","type":"A1","group":null,"topic":"温里药-肉桂","difficulty":2,"stem":"既能补火助阳、引火归元，又能散寒止痛、温通经脉的是","options":{"A":"桂枝","B":"肉桂","C":"干姜","D":"吴茱萸","E":"小茴香"},"answer":"B","explain":"肉桂辛甘大热，补火助阳、引火归元、散寒止痛、温通经脉，为治命门火衰要药。桂枝属解表药；干姜温中回阳化饮；吴茱萸降逆止呕；小茴香理气和胃。","tags":["鉴别"]},{"id":"JC-ZY-0018","type":"A1","group":null,"topic":"理气药-陈皮与青皮","difficulty":2,"stem":"陈皮与青皮的功效区别，正确的是","options":{"A":"陈皮偏于疏肝破气，青皮偏于理气健脾","B":"陈皮偏于理气健脾、燥湿化痰，青皮偏于疏肝破气","C":"两药均以疏肝破气为主","D":"两药均以燥湿化痰为主","E":"陈皮能消积化滞，青皮能降逆止呕"},"answer":"B","explain":"陈皮辛温，理气健脾、燥湿化痰，力缓而偏入脾肺；青皮苦辛温，疏肝破气、消积化滞，力峻而偏入肝胆。C、D 混淆二药主次，E 与二药功效不符。","tags":["鉴别"]},{"id":"JC-ZY-0019","type":"A1","group":null,"topic":"理气药-枳实","difficulty":1,"stem":"既能破气消积，又能化痰除痞的是","options":{"A":"木香","B":"香附","C":"枳实","D":"陈皮","E":"川楝子"},"answer":"C","explain":"枳实苦辛酸微寒，破气消积、化痰除痞，善治食积气滞之痞满胀痛与痰滞胸痹。木香偏行脾胃气滞；香附疏肝解郁调经；陈皮力缓；川楝子行气止痛杀虫。","tags":[]},{"id":"JC-ZY-0020","type":"A1","group":null,"topic":"理气药-香附","difficulty":1,"stem":"被称为气病之总司、女科之主帅，善疏肝解郁调经的是","options":{"A":"木香","B":"香附","C":"乌药","D":"沉香","E":"川楝子"},"answer":"B","explain":"香附辛微苦微甘平，疏肝解郁、理气宽中、调经止痛，为疏肝调经要药，故有此誉。木香偏脾胃气滞；乌药兼温肾散寒；沉香兼纳气平喘；川楝子兼杀虫疗癣。","tags":["高频"]},{"id":"JC-ZY-0021","type":"A1","group":null,"topic":"消食药-山楂","difficulty":1,"stem":"善消肉食油腻积滞，又能行气散瘀的是","options":{"A":"神曲","B":"麦芽","C":"山楂","D":"鸡内金","E":"莱菔子"},"answer":"C","explain":"山楂酸甘微温，消食健胃、行气散瘀，尤善消肉食油腻之积。神曲善化酒谷陈腐之积；麦芽善消米面薯芋之积兼回乳；鸡内金兼涩精止遗；莱菔子兼降气化痰。","tags":[]},{"id":"JC-ZY-0022","type":"A1","group":null,"topic":"消食药-麦芽","difficulty":1,"stem":"既能消食健胃，又能回乳消胀的药物是","options":{"A":"山楂","B":"神曲","C":"麦芽","D":"谷芽","E":"鸡内金"},"answer":"C","explain":"麦芽甘平，行气消食、健脾开胃、回乳消胀，大剂量可断乳。山楂散瘀；神曲消食和胃；谷芽无回乳之力；鸡内金涩精止遗通淋化石，故哺乳期用麦芽须慎。","tags":["易错"]},{"id":"JC-ZY-0023","type":"A1","group":null,"topic":"驱虫药-使君子","difficulty":2,"stem":"杀虫消积，为治蛔虫病要药，服时忌饮热茶的是","options":{"A":"槟榔","B":"苦楝皮","C":"使君子","D":"南瓜子","E":"雷丸"},"answer":"C","explain":"使君子甘温，杀虫消积，为治蛔虫蛲虫要药，尤宜小儿疳积，服时饮热茶易致呃逆呕吐。槟榔兼行气利水截疟；苦楝皮有毒兼疗癣；南瓜子、雷丸专于杀虫。","tags":["易错"]},{"id":"JC-ZY-0024","type":"A1","group":null,"topic":"止血药-三七","difficulty":1,"stem":"既能化瘀止血，又能活血定痛，有止血不留瘀特点的是","options":{"A":"白及","B":"三七","C":"地榆","D":"艾叶","E":"仙鹤草"},"answer":"B","explain":"三七甘微苦温，化瘀止血、活血定痛，止血而不留瘀，为出血与跌打损伤要药。白及收敛止血消肿生肌；地榆凉血止血解毒敛疮；艾叶温经止血；仙鹤草收涩止血。","tags":["高频"]},{"id":"JC-ZY-0025","type":"A1","group":null,"topic":"止血药-艾叶","difficulty":3,"stem":"既能温经止血，又能散寒止痛、安胎的是","options":{"A":"地榆","B":"槐花","C":"艾叶","D":"白及","E":"炮姜"},"answer":"C","explain":"艾叶辛苦温，温经止血、散寒止痛，兼安胎，宜下焦虚寒出血与胎动不安。地榆、槐花凉血止血；白及收敛止血；炮姜温经止血而无安胎之功，为其主要区别。","tags":["鉴别"]},{"id":"JC-ZY-0026","type":"A1","group":null,"topic":"活血药-乳香与没药","difficulty":3,"stem":"乳香与没药均能活血止痛、消肿生肌，二者区别是","options":{"A":"乳香偏于行气活血伸筋，没药偏于散血化瘀","B":"乳香偏于补血，没药偏于止血","C":"乳香性寒，没药性温","D":"二药均能补益肝肾","E":"乳香善治肺痈，没药善治肠痈"},"answer":"A","explain":"二药均辛苦温，活血止痛、消肿生肌，常相须为用。乳香辛香走窜，偏行气活血伸筋；没药偏散血化瘀。二药无补血止血之力，性皆温，亦不入补肝肾之列。","tags":["鉴别"]},{"id":"JC-ZY-0027","type":"A1","group":null,"topic":"化痰药-川贝母与浙贝母","difficulty":3,"stem":"川贝母与浙贝母功效的主要区别是","options":{"A":"川贝母偏于清热散结，浙贝母偏于润肺止咳","B":"川贝母偏于润肺化痰止咳，浙贝母偏于清热化痰散结","C":"二者功效完全相同","D":"川贝母善治风热咳嗽，浙贝母善治肺虚久咳","E":"二者均以软坚散结为主"},"answer":"B","explain":"川贝母苦甘微寒，润肺化痰止咳，宜肺虚久咳燥咳少痰；浙贝母苦寒，清热化痰、散结消痈，宜风热痰热咳嗽及瘰疬疮痈。A、D 恰将二药主治颠倒，C、E 亦误。","tags":["高频","鉴别"]},{"id":"JC-ZY-0028","type":"A1","group":null,"topic":"止咳平喘药-百部","difficulty":2,"stem":"润肺下气止咳，又能杀虫灭虱，新久咳嗽均可用的是","options":{"A":"苦杏仁","B":"紫苏子","C":"百部","D":"款冬花","E":"紫菀"},"answer":"C","explain":"百部甘苦微温，润肺下气止咳、杀虫灭虱，新久咳嗽皆可，尤宜肺痨咳嗽与顿咳。苦杏仁兼润肠通便；紫苏子兼降气化痰；款冬花、紫菀润肺止咳而无杀虫之力。","tags":["易错"]},{"id":"JC-ZY-0029","type":"A1","group":null,"topic":"安神药-朱砂","difficulty":2,"stem":"清心镇惊安神，又能清热解毒，只宜入丸散不入煎剂的是","options":{"A":"磁石","B":"朱砂","C":"龙骨","D":"酸枣仁","E":"远志"},"answer":"B","explain":"朱砂甘微寒有毒，清心镇惊安神、明目解毒；含硫化汞，受热易析出汞而增毒，故只入丸散，不入煎剂。磁石、龙骨无清热解毒之力；酸枣仁、远志养心安神。","tags":["易错"]},{"id":"JC-ZY-0030","type":"A1","group":null,"topic":"安神药-酸枣仁","difficulty":1,"stem":"善治心肝阴血不足之虚烦不眠，又能敛汗生津的是","options":{"A":"柏子仁","B":"酸枣仁","C":"远志","D":"合欢皮","E":"首乌藤"},"answer":"B","explain":"酸枣仁甘酸平，养心补肝、宁心安神、敛汗生津，为治虚烦不眠要药。柏子仁兼润肠通便；远志兼祛痰消肿；合欢皮解郁活血；首乌藤养血祛风通络。","tags":[]},{"id":"JC-ZY-0031","type":"A1","group":null,"topic":"开窍药-麝香","difficulty":1,"stem":"开窍醒神，又能活血通经、消肿止痛，不入煎剂的是","options":{"A":"冰片","B":"石菖蒲","C":"麝香","D":"苏合香","E":"牛黄"},"answer":"C","explain":"麝香辛温，开窍醒神、活血通经、消肿止痛，为醒神回苏要药；芳香走窜、有效成分易挥发且价昂，只入丸散。冰片、苏合香长于开窍；石菖蒲化湿和胃；牛黄凉肝息风。","tags":[]},{"id":"JC-ZY-0032","type":"A1","group":null,"topic":"开窍药-石菖蒲","difficulty":1,"stem":"既能开窍豁痰、醒神益智，又能化湿和胃的是","options":{"A":"远志","B":"石菖蒲","C":"麝香","D":"冰片","E":"郁金"},"answer":"B","explain":"石菖蒲辛苦温，开窍豁痰、醒神益智、化湿开胃，宜痰蒙清窍之神昏健忘及湿阻中焦之脘痞。远志无化湿和胃之力；麝香、冰片偏于急救；郁金行气解郁凉血。","tags":[]},{"id":"JC-ZY-0033","type":"A1","group":null,"topic":"补阴药-南沙参","difficulty":3,"stem":"养阴清肺、益胃生津，兼能化痰益气的是","options":{"A":"北沙参","B":"南沙参","C":"麦冬","D":"石斛","E":"玉竹"},"answer":"B","explain":"南沙参甘微苦微寒，养阴清肺、益胃生津、化痰、益气。北沙参功近而无化痰益气之力；麦冬兼清心；石斛兼清热；玉竹养阴润燥生津，三者均不能益气化痰。","tags":["鉴别"]},{"id":"JC-ZY-0034","type":"A1","group":null,"topic":"补阳药-鹿茸","difficulty":2,"stem":"壮肾阳、益精血、强筋骨，又能调冲任托疮毒的是","options":{"A":"鹿茸","B":"淫羊藿","C":"杜仲","D":"肉苁蓉","E":"补骨脂"},"answer":"A","explain":"鹿茸甘咸温，壮肾阳、益精血、强筋骨、调冲任、托疮毒，为峻补肾阳要药。淫羊藿兼祛风湿；杜仲兼安胎；肉苁蓉兼润肠通便；补骨脂兼温脾止泻、纳气平喘。","tags":["高频"]},{"id":"JC-ZY-0035","type":"A1","group":null,"topic":"收涩药-五味子","difficulty":2,"stem":"收敛固涩、益气生津，又能补肾宁心的是","options":{"A":"山茱萸","B":"五味子","C":"乌梅","D":"桑螵蛸","E":"莲子"},"answer":"B","explain":"五味子酸甘温，收敛固涩、益气生津、补肾宁心，治久咳虚喘、自汗盗汗、久泻、口渴与心悸失眠。山茱萸偏补益肝肾；乌梅兼安蛔；桑螵蛸固精缩尿；莲子补脾止泻。","tags":[]},{"id":"JC-ZY-0036","type":"A1","group":null,"topic":"收涩药-乌梅","difficulty":2,"stem":"敛肺止咳、涩肠止泻，又能生津止渴、安蛔止痛的是","options":{"A":"五味子","B":"乌梅","C":"诃子","D":"肉豆蔻","E":"赤石脂"},"answer":"B","explain":"乌梅酸涩平，敛肺止咳、涩肠止泻、生津止渴、安蛔止痛，为治蛔厥腹痛要药。五味子兼补肾宁心；诃子兼降火利咽；肉豆蔻温中行气；赤石脂收敛止血生肌。","tags":["高频"]},{"id":"JC-ZY-0037","type":"A2","group":null,"topic":"解表药-麻黄","difficulty":2,"stem":"患者，男，28 岁。恶寒发热，无汗，头痛身痛，鼻塞流清涕，咳嗽气喘，痰白稀，舌淡红苔薄白，脉浮紧。宜首选","options":{"A":"桂枝","B":"麻黄","C":"荆芥","D":"防风","E":"紫苏"},"answer":"B","explain":"风寒表实无汗而兼咳喘，麻黄发汗解表、宣肺平喘，最为合拍。桂枝解肌发表而平喘力弱；荆芥、防风为一般风寒感冒常用，无平喘之功；紫苏长于行气宽中。","tags":["高频"]},{"id":"JC-ZY-0038","type":"A2","group":null,"topic":"解表药-牛蒡子","difficulty":2,"stem":"患者，女，25 岁。发热微恶风寒，咽喉红肿疼痛，咳嗽痰黄，舌尖红苔薄黄，脉浮数。宜首选","options":{"A":"麻黄","B":"桂枝","C":"牛蒡子","D":"紫苏","E":"香薷"},"answer":"C","explain":"风热表证兼咽喉肿痛，牛蒡子疏散风热、宣肺透疹、解毒利咽，最合此证。麻黄、桂枝、紫苏、香薷均辛温解表，用于风寒或暑湿，不宜于风热咽痛。","tags":[]},{"id":"JC-ZY-0039","type":"A2","group":null,"topic":"清热药-石膏","difficulty":1,"stem":"患者，男，35 岁。壮热面赤，烦渴引饮，汗出恶热，脉洪大有力。宜首选","options":{"A":"黄连","B":"石膏","C":"栀子","D":"黄柏","E":"苦参"},"answer":"B","explain":"壮热、大汗、大渴、脉洪大为阳明气分热盛，石膏辛甘大寒，清泄气分实热，为必用之品。黄连偏清中焦；栀子泻火除烦兼利湿；黄柏、苦参偏清下焦湿热。","tags":["高频"]},{"id":"JC-ZY-0040","type":"A2","group":null,"topic":"清热药-地骨皮","difficulty":3,"stem":"患者，女，46 岁。午后潮热，骨蒸盗汗，五心烦热，咳嗽痰少带血，舌红少苔，脉细数。宜首选","options":{"A":"石膏","B":"芦根","C":"地骨皮","D":"黄连","E":"龙胆"},"answer":"C","explain":"阴虚内热、骨蒸盗汗兼肺热咳痰带血，地骨皮凉血除蒸、清肺降火，最为对证。石膏清阳明实热；芦根清热生津而无退蒸之力；黄连、龙胆苦寒清实火，易伤阴。","tags":["鉴别"]},{"id":"JC-ZY-0041","type":"A2","group":null,"topic":"泻下药-火麻仁","difficulty":2,"stem":"患者，男，62 岁。大便干结难下，数日一行，口干，舌红少津，脉细。宜首选","options":{"A":"大黄","B":"芒硝","C":"火麻仁","D":"甘遂","E":"番泻叶"},"answer":"C","explain":"老年津亏肠燥便秘，治当润肠通便，火麻仁甘平质润，最为适宜。大黄、番泻叶苦寒攻下易伤正气；芒硝软坚需配攻下；甘遂峻下逐水，毒性大，非所宜。","tags":["易错"]},{"id":"JC-ZY-0042","type":"A2","group":null,"topic":"祛风湿药-羌活","difficulty":2,"stem":"患者，男，45 岁。肩背疼痛，颈项强痛，遇寒加重，恶寒微热，舌淡苔白，脉浮紧。宜首选","options":{"A":"独活","B":"羌活","C":"秦艽","D":"防己","E":"桑寄生"},"answer":"B","explain":"肩背颈项疼痛属上半身风寒湿痹，羌活解表散寒、祛风除湿止痛，善治腰以上痹痛。独活善治下半身；秦艽兼清湿热退虚热；防己兼利水消肿；桑寄生兼补肝肾强筋骨。","tags":[]},{"id":"JC-ZY-0043","type":"A2","group":null,"topic":"化湿药-藿香","difficulty":2,"stem":"患者，女，30 岁。夏日感受暑湿，头身困重，脘痞腹胀，恶心呕吐，舌苔白腻，脉濡缓。宜首选","options":{"A":"苍术","B":"厚朴","C":"藿香","D":"茯苓","E":"泽泻"},"answer":"C","explain":"暑湿困阻中焦、呕恶脘痞，藿香芳香化湿、和中止呕、发表解暑，最为合拍。苍术燥湿力强而偏于健脾；厚朴下气除满；茯苓、泽泻淡渗利湿而无解暑止呕之力。","tags":["高频"]},{"id":"JC-ZY-0044","type":"A2","group":null,"topic":"温里药-干姜","difficulty":2,"stem":"患者，男，40 岁。畏寒肢冷，脘腹冷痛，呕吐清涎，大便溏泄，兼咳喘痰多清稀，舌淡苔白滑，脉沉细。宜首选","options":{"A":"附子","B":"干姜","C":"吴茱萸","D":"肉桂","E":"小茴香"},"answer":"B","explain":"脾胃虚寒兼寒饮咳喘，干姜温中散寒、回阳通脉、温肺化饮，一药两治。附子长于回阳救逆；吴茱萸善治厥阴头痛寒疝；肉桂引火归元；小茴香理气和胃。","tags":[]},{"id":"JC-ZY-0045","type":"A2","group":null,"topic":"理气药-川楝子","difficulty":3,"stem":"患者，女，38 岁。两胁胀痛，走窜不定，心烦易怒，口苦，舌红苔黄，脉弦数。宜首选","options":{"A":"陈皮","B":"木香","C":"川楝子","D":"香附","E":"枳实"},"answer":"C","explain":"肝郁化火之胁痛口苦，川楝子苦寒，行气止痛兼清肝火，正合此证。陈皮偏理脾肺；木香偏脾胃气滞；香附性平而无清火之力；枳实破气消积，偏于痞满。","tags":["鉴别"]},{"id":"JC-ZY-0046","type":"A2","group":null,"topic":"补气药-黄芪","difficulty":2,"stem":"患者，女，50 岁。气短乏力，食少便溏，久泻脱肛，子宫下垂，舌淡苔白，脉弱。宜首选","options":{"A":"人参","B":"黄芪","C":"白术","D":"甘草","E":"党参"},"answer":"B","explain":"中气下陷之脱肛、子宫脱垂，当补气升阳，黄芪补气升阳、益卫固表、托毒生肌，最为对证。人参长于大补元气救脱；白术燥湿安胎；党参升举之力不及黄芪；甘草调和诸药。","tags":["高频"]},{"id":"JC-ZY-0047","type":"A2","group":null,"topic":"补阴药-枸杞子","difficulty":3,"stem":"患者，女，45 岁。腰膝酸软，头晕耳鸣，盗汗，五心烦热，舌红少苔，脉细数。宜首选","options":{"A":"鹿茸","B":"淫羊藿","C":"枸杞子","D":"杜仲","E":"菟丝子"},"answer":"C","explain":"腰膝酸软、头晕耳鸣兼五心烦热，为肝肾阴虚，枸杞子滋补肝肾、益精明目，正合其证。鹿茸、淫羊藿、杜仲、菟丝子皆属补阳药，性偏温燥，阴虚火旺者用之伤阴。","tags":["易错"]},{"id":"JC-ZY-0048","type":"A2","group":null,"topic":"收涩药-桑螵蛸","difficulty":2,"stem":"患者，男，10 岁。睡中遗尿，夜间尿频，面色少华，舌淡，脉细弱。宜首选","options":{"A":"乌梅","B":"桑螵蛸","C":"五味子","D":"山茱萸","E":"麻黄"},"answer":"B","explain":"肾气不固之遗尿尿频，桑螵蛸甘咸平，固精缩尿、补肾助阳，为治遗尿要药。乌梅涩肠安蛔；五味子偏敛肺生津；山茱萸偏补益肝肾；麻黄宣肺利水，反能通利小便。","tags":[]},{"id":"JC-ZY-0049","type":"B1","group":"ZY-B1-001","group_stem":"A.麻黄　B.桂枝　C.紫苏　D.生姜　E.香薷","topic":"解表药-麻黄","difficulty":1,"stem":"发汗解表、宣肺平喘、利水消肿，为治风寒表实无汗证要药的是","options":{"A":"麻黄","B":"桂枝","C":"紫苏","D":"生姜","E":"香薷"},"answer":"A","explain":"麻黄辛温，发汗解表、宣肺平喘、利水消肿，为风寒表实无汗证要药。桂枝发汗力缓而长于调和营卫；紫苏行气宽中；生姜温中止呕；香薷长于化湿和中。","tags":["高频"]},{"id":"JC-ZY-0050","type":"B1","group":"ZY-B1-001","group_stem":"A.麻黄　B.桂枝　C.紫苏　D.生姜　E.香薷","topic":"解表药-桂枝","difficulty":1,"stem":"发汗解肌、温通经脉、助阳化气，善治风寒表虚有汗证的是","options":{"A":"麻黄","B":"桂枝","C":"紫苏","D":"生姜","E":"香薷"},"answer":"B","explain":"桂枝辛甘温，发汗解肌、温通经脉、助阳化气，治风寒表虚有汗，如桂枝汤。麻黄发汗力峻，宜表实无汗；紫苏兼行气安胎；生姜兼温中止呕；香薷兼化湿利水。","tags":["高频"]},{"id":"JC-ZY-0051","type":"B1","group":"ZY-B1-001","group_stem":"A.麻黄　B.桂枝　C.紫苏　D.生姜　E.香薷","topic":"解表药-紫苏","difficulty":1,"stem":"解表散寒、行气宽中、安胎，兼能解鱼蟹毒的是","options":{"A":"麻黄","B":"桂枝","C":"紫苏","D":"生姜","E":"香薷"},"answer":"C","explain":"紫苏辛温，解表散寒、行气宽中、安胎，并能解鱼蟹毒，宜风寒感冒兼胸闷呕恶及胎动不安。麻黄主宣肺平喘；桂枝温通经脉；生姜偏温中止呕；香薷偏化湿和中。","tags":[]},{"id":"JC-ZY-0052","type":"B1","group":"ZY-B1-001","group_stem":"A.麻黄　B.桂枝　C.紫苏　D.生姜　E.香薷","topic":"解表药-香薷","difficulty":3,"stem":"发汗解表、化湿和中、利水消肿，素有夏月麻黄之称的是","options":{"A":"麻黄","B":"桂枝","C":"紫苏","D":"生姜","E":"香薷"},"answer":"E","explain":"香薷辛微温，发汗解表、化湿和中、利水消肿，外能散寒、内能化湿，故有夏月麻黄之称，治阴暑证。麻黄无化湿之功；桂枝、紫苏、生姜均不主治暑湿。","tags":["鉴别"]},{"id":"JC-ZY-0053","type":"B1","group":"ZY-B1-002","group_stem":"A.黄连　B.黄芩　C.黄柏　D.龙胆　E.苦参","topic":"清热药-黄芩","difficulty":1,"stem":"善清上焦湿热，又能泻火解毒、止血、安胎的是","options":{"A":"黄连","B":"黄芩","C":"黄柏","D":"龙胆","E":"苦参"},"answer":"B","explain":"黄芩苦寒，善清上焦肺与大肠湿热，并能泻火解毒、凉血止血、清热安胎。黄连偏清中焦；黄柏偏清下焦；龙胆泻肝胆火；苦参清下焦湿热兼杀虫止痒。","tags":["高频"]},{"id":"JC-ZY-0054","type":"B1","group":"ZY-B1-002","group_stem":"A.黄连　B.黄芩　C.黄柏　D.龙胆　E.苦参","topic":"清热药-黄连","difficulty":3,"stem":"善清中焦湿热，又能泻心火、除烦止呕的是","options":{"A":"黄连","B":"黄芩","C":"黄柏","D":"龙胆","E":"苦参"},"answer":"A","explain":"黄连大苦大寒，善清中焦脾胃与心经之火，能清热燥湿、泻火解毒，治痞满呕逆与心火烦躁。黄芩主上焦；黄柏主下焦；龙胆主肝胆；苦参长于下焦湿热与杀虫止痒。","tags":["高频"]},{"id":"JC-ZY-0055","type":"B1","group":"ZY-B1-002","group_stem":"A.黄连　B.黄芩　C.黄柏　D.龙胆　E.苦参","topic":"清热药-黄柏","difficulty":2,"stem":"善清下焦湿热，又能退虚热、泻相火的是","options":{"A":"黄连","B":"黄芩","C":"黄柏","D":"龙胆","E":"苦参"},"answer":"C","explain":"黄柏苦寒沉降，善清下焦湿热，并能泻相火、退虚热，治湿热下注及阴虚火旺之骨蒸。黄连主中焦；黄芩主上焦；龙胆泻肝胆实火；苦参退虚热之力不足。","tags":["鉴别"]},{"id":"JC-ZY-0056","type":"B1","group":"ZY-B1-002","group_stem":"A.黄连　B.黄芩　C.黄柏　D.龙胆　E.苦参","topic":"清热药-龙胆","difficulty":2,"stem":"既能清热燥湿，又能泻肝胆实火的是","options":{"A":"黄连","B":"黄芩","C":"黄柏","D":"龙胆","E":"苦参"},"answer":"D","explain":"龙胆苦寒，清热燥湿、泻肝胆实火，善治肝胆实火之胁痛头痛目赤及湿热下注。黄连、黄芩、黄柏分主中、上、下三焦而不专入肝胆；苦参以燥湿杀虫止痒见长。","tags":[]},{"id":"JC-ZY-0057","type":"B1","group":"ZY-B1-003","group_stem":"A.人参　B.黄芪　C.党参　D.白术　E.甘草","topic":"补气药-人参","difficulty":1,"stem":"大补元气、复脉固脱，为拯危救脱要药的是","options":{"A":"人参","B":"黄芪","C":"党参","D":"白术","E":"甘草"},"answer":"A","explain":"人参甘微苦微温，大补元气、复脉固脱、补脾益肺、生津养血、安神益智，为拯危救脱要药。黄芪长于补气升阳固表；党参力较缓；白术健脾燥湿；甘草调和诸药。","tags":["高频"]},{"id":"JC-ZY-0058","type":"B1","group":"ZY-B1-003","group_stem":"A.人参　B.黄芪　C.党参　D.白术　E.甘草","topic":"补气药-黄芪","difficulty":2,"stem":"补气升阳、益卫固表、利水消肿、托毒生肌的是","options":{"A":"人参","B":"黄芪","C":"党参","D":"白术","E":"甘草"},"answer":"B","explain":"黄芪甘微温，补气升阳、益卫固表、利水消肿、托毒生肌，为治气虚下陷与表虚自汗要药。人参偏于大补元气；党参偏补中益气；白术健脾燥湿安胎；甘草益气和中。","tags":["高频"]},{"id":"JC-ZY-0059","type":"B1","group":"ZY-B1-003","group_stem":"A.人参　B.黄芪　C.党参　D.白术　E.甘草","topic":"补气药-白术","difficulty":2,"stem":"补气健脾、燥湿利水、止汗、安胎的是","options":{"A":"人参","B":"黄芪","C":"党参","D":"白术","E":"甘草"},"answer":"D","explain":"白术苦甘温，补气健脾、燥湿利水、止汗、安胎，为补脾燥湿要药，治脾虚食少便溏、水肿及胎动不安。人参大补元气；黄芪升阳固表；党参补中益气；甘草调和诸药。","tags":[]},{"id":"JC-ZY-0060","type":"B1","group":"ZY-B1-003","group_stem":"A.人参　B.黄芪　C.党参　D.白术　E.甘草","topic":"补气药-甘草","difficulty":1,"stem":"补脾益气、缓急止痛、调和诸药、清热解毒的是","options":{"A":"人参","B":"黄芪","C":"党参","D":"白术","E":"甘草"},"answer":"E","explain":"甘草甘平，补脾益气、缓急止痛、调和诸药、清热解毒、祛痰止咳，生用偏清热解毒，炙用偏补中。人参、黄芪、党参、白术均以补气为主而无调和诸药之能。","tags":[]},{"id":"JC-ZY-0061","type":"B1","group":"ZY-B1-004","group_stem":"A.川芎　B.丹参　C.桃仁　D.红花　E.牛膝","topic":"活血药-川芎","difficulty":2,"stem":"活血行气、祛风止痛，为血中之气药、治头痛要药的是","options":{"A":"川芎","B":"丹参","C":"桃仁","D":"红花","E":"牛膝"},"answer":"A","explain":"川芎辛温，活血行气、祛风止痛，为血中之气药，善治血瘀气滞诸痛及头痛。丹参偏凉血消痈；桃仁兼润肠通便；红花偏通经；牛膝引血下行、利水通淋。","tags":["高频"]},{"id":"JC-ZY-0062","type":"B1","group":"ZY-B1-004","group_stem":"A.川芎　B.丹参　C.桃仁　D.红花　E.牛膝","topic":"活血药-丹参","difficulty":2,"stem":"活血祛瘀、通经止痛，又能凉血消痈、除烦安神的是","options":{"A":"川芎","B":"丹参","C":"桃仁","D":"红花","E":"牛膝"},"answer":"B","explain":"丹参苦微寒，活血祛瘀、通经止痛、凉血消痈、除烦安神，一味功同四物，善治血瘀诸痛兼心烦不眠。川芎偏行气祛风；桃仁润肠；红花通经；牛膝引血下行。","tags":[]},{"id":"JC-ZY-0063","type":"B1","group":"ZY-B1-004","group_stem":"A.川芎　B.丹参　C.桃仁　D.红花　E.牛膝","topic":"活血药-桃仁","difficulty":3,"stem":"活血祛瘀，又能润肠通便、止咳平喘的是","options":{"A":"川芎","B":"丹参","C":"桃仁","D":"红花","E":"牛膝"},"answer":"C","explain":"桃仁苦甘平，活血祛瘀、润肠通便、止咳平喘，宜血瘀经闭兼肠燥便秘或咳嗽气喘。川芎兼祛风止痛；丹参兼凉血安神；红花无通便之能；牛膝兼利水通淋。","tags":["鉴别"]},{"id":"JC-ZY-0064","type":"B1","group":"ZY-B1-004","group_stem":"A.川芎　B.丹参　C.桃仁　D.红花　E.牛膝","topic":"活血药-牛膝","difficulty":3,"stem":"活血通经、引血下行，又能利水通淋、补肝肾强筋骨的是","options":{"A":"川芎","B":"丹参","C":"桃仁","D":"红花","E":"牛膝"},"answer":"E","explain":"牛膝苦甘酸平，活血通经、引血下行、利水通淋、补肝肾强筋骨，治血瘀经闭、口舌生疮、淋证及腰膝酸软。川芎、丹参、桃仁、红花均无补肝肾强筋骨之力。","tags":["鉴别"]},{"id":"JC-ZY-0065","type":"B1","group":"ZY-B1-005","group_stem":"A.半夏　B.天南星　C.桔梗　D.川贝母　E.浙贝母","topic":"化痰药-半夏","difficulty":1,"stem":"燥湿化痰、降逆止呕、消痞散结，为燥湿化痰要药的是","options":{"A":"半夏","B":"天南星","C":"桔梗","D":"川贝母","E":"浙贝母"},"answer":"A","explain":"半夏辛温有毒，燥湿化痰、降逆止呕、消痞散结，为燥湿化痰要药，治痰多咳嗽、呕吐及心下痞。天南星偏祛风止痉；桔梗宣肺利咽；川贝、浙贝偏清热润肺。","tags":["高频"]},{"id":"JC-ZY-0066","type":"B1","group":"ZY-B1-005","group_stem":"A.半夏　B.天南星　C.桔梗　D.川贝母　E.浙贝母","topic":"化痰药-天南星","difficulty":2,"stem":"燥湿化痰、祛风止痉、散结消肿，善治风痰眩晕与中风口眼歪斜的是","options":{"A":"半夏","B":"天南星","C":"桔梗","D":"川贝母","E":"浙贝母"},"answer":"B","explain":"天南星苦辛温有毒，燥湿化痰、祛风止痉、散结消肿，善治风痰眩晕、中风痰壅与口眼歪斜。半夏偏降逆止呕；桔梗宣肺排脓；川贝、浙贝清热化痰而无祛风止痉之力。","tags":["鉴别"]},{"id":"JC-ZY-0067","type":"B1","group":"ZY-B1-005","group_stem":"A.半夏　B.天南星　C.桔梗　D.川贝母　E.浙贝母","topic":"化痰药-桔梗","difficulty":1,"stem":"宣肺、利咽、祛痰、排脓，能载药上行，为舟楫之剂的是","options":{"A":"半夏","B":"天南星","C":"桔梗","D":"川贝母","E":"浙贝母"},"answer":"C","explain":"桔梗苦辛平，宣肺、利咽、祛痰、排脓，性升提而载药上行，故称舟楫之剂，治咳嗽痰多咽痛及肺痈。半夏降逆止呕；天南星祛风止痉；川贝、浙贝偏于润肺散结。","tags":["高频"]},{"id":"JC-ZY-0068","type":"B1","group":"ZY-B1-005","group_stem":"A.半夏　B.天南星　C.桔梗　D.川贝母　E.浙贝母","topic":"化痰药-浙贝母","difficulty":2,"stem":"清热化痰、散结消痈，善治风热痰热咳嗽及瘰疬疮痈的是","options":{"A":"半夏","B":"天南星","C":"桔梗","D":"川贝母","E":"浙贝母"},"answer":"E","explain":"浙贝母苦寒，清热化痰、散结消痈，宜风热痰热咳嗽与瘰疬疮痈。川贝母苦甘微寒，偏润肺止咳，宜肺虚燥咳；半夏、天南星性温燥；桔梗偏宣肺排脓。","tags":["鉴别"]},{"id":"JC-ZY-0069","type":"B1","group":"ZY-B1-006","group_stem":"A.茯苓　B.猪苓　C.泽泻　D.薏苡仁　E.车前子","topic":"利水药-茯苓","difficulty":1,"stem":"利水渗湿、健脾、宁心，药性平和，为利水渗湿要药的是","options":{"A":"茯苓","B":"猪苓","C":"泽泻","D":"薏苡仁","E":"车前子"},"answer":"A","explain":"茯苓甘淡平，利水渗湿、健脾、宁心，药性平和，补利兼优，为利水渗湿要药。猪苓专于利水而无补性；泽泻兼泄热；薏苡仁兼除痹排脓；车前子兼明目化痰。","tags":["高频"]},{"id":"JC-ZY-0070","type":"B1","group":"ZY-B1-006","group_stem":"A.茯苓　B.猪苓　C.泽泻　D.薏苡仁　E.车前子","topic":"利水药-泽泻","difficulty":2,"stem":"利水渗湿、泄热，善治水湿停聚兼相火偏旺之证的是","options":{"A":"茯苓","B":"猪苓","C":"泽泻","D":"薏苡仁","E":"车前子"},"answer":"C","explain":"泽泻甘淡寒，利水渗湿、泄热，善治水湿停聚兼下焦湿热或相火偏旺，如六味地黄丸中之用意。茯苓健脾宁心；猪苓利水力强而无泄热之能；薏苡仁兼除痹排脓；车前子兼明目。","tags":[]},{"id":"JC-ZY-0071","type":"B1","group":"ZY-B1-006","group_stem":"A.茯苓　B.猪苓　C.泽泻　D.薏苡仁　E.车前子","topic":"利水药-薏苡仁","difficulty":2,"stem":"利水渗湿、健脾除痹、清热排脓的是","options":{"A":"茯苓","B":"猪苓","C":"泽泻","D":"薏苡仁","E":"车前子"},"answer":"D","explain":"薏苡仁甘淡凉，利水渗湿、健脾除痹、清热排脓，治水肿脚气、风湿痹痛及肺痈肠痈。茯苓无除痹排脓之力；猪苓、泽泻专于利水；车前子兼清肝明目、清肺化痰。","tags":[]},{"id":"JC-ZY-0072","type":"B1","group":"ZY-B1-006","group_stem":"A.茯苓　B.猪苓　C.泽泻　D.薏苡仁　E.车前子","topic":"利水药-车前子","difficulty":2,"stem":"利水通淋、渗湿止泻、清肝明目、清肺化痰的是","options":{"A":"茯苓","B":"猪苓","C":"泽泻","D":"薏苡仁","E":"车前子"},"answer":"E","explain":"车前子甘寒，利水通淋、渗湿止泻、清肝明目、清肺化痰，一药四用，治淋证水肿、暑湿泄泻、目赤肿痛与痰热咳嗽。余四味均无清肝明目与清肺化痰之效。","tags":[]},{"id":"JC-ZY-0073","type":"B1","group":"ZY-B1-007","group_stem":"A.当归　B.熟地黄　C.白芍　D.阿胶　E.何首乌","topic":"补血药-当归","difficulty":1,"stem":"补血活血、调经止痛、润肠通便，为补血调经要药的是","options":{"A":"当归","B":"熟地黄","C":"白芍","D":"阿胶","E":"何首乌"},"answer":"A","explain":"当归甘辛温，补血活血、调经止痛、润肠通便，为补血调经要药，宜血虚诸证及月经不调。熟地黄滋阴填精；白芍敛阴柔肝；阿胶止血润燥；何首乌兼截疟解毒。","tags":["高频"]},{"id":"JC-ZY-0074","type":"B1","group":"ZY-B1-007","group_stem":"A.当归　B.熟地黄　C.白芍　D.阿胶　E.何首乌","topic":"补血药-熟地黄","difficulty":2,"stem":"补血滋阴、益精填髓，为补血要药、六味地黄丸之君药的是","options":{"A":"当归","B":"熟地黄","C":"白芍","D":"阿胶","E":"何首乌"},"answer":"B","explain":"熟地黄甘微温，补血滋阴、益精填髓，为补血要药，六味地黄丸以之为君。当归兼活血调经；白芍兼敛阴止汗、平抑肝阳；阿胶兼止血；何首乌兼解毒截疟。","tags":["高频"]},{"id":"JC-ZY-0075","type":"B1","group":"ZY-B1-007","group_stem":"A.当归　B.熟地黄　C.白芍　D.阿胶　E.何首乌","topic":"补血药-白芍","difficulty":3,"stem":"养血调经、敛阴止汗、柔肝止痛、平抑肝阳的是","options":{"A":"当归","B":"熟地黄","C":"白芍","D":"阿胶","E":"何首乌"},"answer":"C","explain":"白芍苦酸微寒，养血调经、敛阴止汗、柔肝止痛、平抑肝阳，治血虚肝旺之胁痛、头痛眩晕及自汗盗汗。当归偏活血；熟地黄偏填精；阿胶偏止血；何首乌偏乌须发。","tags":["鉴别"]},{"id":"JC-ZY-0076","type":"B1","group":"ZY-B1-007","group_stem":"A.当归　B.熟地黄　C.白芍　D.阿胶　E.何首乌","topic":"补血药-阿胶","difficulty":2,"stem":"补血滋阴、润燥、止血，入汤剂宜烊化兑服的是","options":{"A":"当归","B":"熟地黄","C":"白芍","D":"阿胶","E":"何首乌"},"answer":"D","explain":"阿胶甘平，补血滋阴、润燥、止血，为胶类黏腻之品，入汤剂宜烊化兑服，治血虚诸证及出血。当归、熟地黄、白芍均不烊化；何首乌兼截疟解毒润肠。","tags":["易错"]},{"id":"JC-ZY-0077","type":"B1","group":"ZY-B1-008","group_stem":"A.石决明　B.牡蛎　C.羚羊角　D.钩藤　E.天麻","topic":"平肝药-石决明","difficulty":1,"stem":"平肝潜阳、清肝明目，为凉肝镇肝要药的是","options":{"A":"石决明","B":"牡蛎","C":"羚羊角","D":"钩藤","E":"天麻"},"answer":"A","explain":"石决明咸寒，平肝潜阳、清肝明目，为凉肝镇肝要药，宜头痛眩晕、目赤翳障。牡蛎兼软坚散结、收敛固涩；羚羊角偏息风解毒；钩藤偏清热定惊；天麻偏祛风通络。","tags":[]},{"id":"JC-ZY-0078","type":"B1","group":"ZY-B1-008","group_stem":"A.石决明　B.牡蛎　C.羚羊角　D.钩藤　E.天麻","topic":"平肝药-牡蛎","difficulty":2,"stem":"平肝潜阳、重镇安神，又能软坚散结、收敛固涩的是","options":{"A":"石决明","B":"牡蛎","C":"羚羊角","D":"钩藤","E":"天麻"},"answer":"B","explain":"牡蛎咸微寒，平肝潜阳、重镇安神、软坚散结、收敛固涩，治眩晕耳鸣、痰核瘰疬、自汗遗精。石决明偏清肝明目；羚羊角、钩藤偏息风止痉；天麻偏祛风通络。","tags":["鉴别"]},{"id":"JC-ZY-0079","type":"B1","group":"ZY-B1-008","group_stem":"A.石决明　B.牡蛎　C.羚羊角　D.钩藤　E.天麻","topic":"平肝药-羚羊角","difficulty":2,"stem":"平肝息风、清肝明目、散血解毒，宜另煎或磨汁服的是","options":{"A":"石决明","B":"牡蛎","C":"羚羊角","D":"钩藤","E":"天麻"},"answer":"C","explain":"羚羊角咸寒，平肝息风、清肝明目、散血解毒，为治肝风内动、惊痫抽搐要药；因价昂且不宜久煎，宜另煎或磨汁服。石决明、牡蛎偏潜阳；钩藤、天麻偏息风。","tags":["易错"]},{"id":"JC-ZY-0080","type":"B1","group":"ZY-B1-008","group_stem":"A.石决明　B.牡蛎　C.羚羊角　D.钩藤　E.天麻","topic":"平肝药-天麻","difficulty":3,"stem":"息风止痉、平抑肝阳，又能祛风通络的是","options":{"A":"石决明","B":"牡蛎","C":"羚羊角","D":"钩藤","E":"天麻"},"answer":"E","explain":"天麻甘平，息风止痉、平抑肝阳、祛风通络，治眩晕头痛、肢体麻木与风湿痹痛。钩藤清热定惊而无祛风通络之力；石决明、牡蛎偏潜阳；羚羊角偏散血解毒。","tags":["鉴别"]}]},{"meta":{"bank_id":"jichu-zhongyi-jichu","title":"中医基础理论","paper":"jichu","subject":"中医基础理论","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":80,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"JC-JCL-0001","type":"A1","group":null,"topic":"阴阳学说-阴阳失调","difficulty":2,"stem":"所谓“阳胜则热”，其病理变化属于","options":{"A":"阴虚内热","B":"虚热证","C":"真热假寒","D":"寒热错杂","E":"实热证"},"answer":"E","explain":"阳胜则热指阳邪偏盛而正气未衰，邪正交争剧烈，属实热证。阴虚内热由阴液亏虚而虚热内生，与阳邪偏盛不同。真热假寒为热盛格阴于外的假寒。寒热错杂为寒证与热证并存。","tags":["高频","易错"]},{"id":"JC-JCL-0002","type":"A1","group":null,"topic":"阴阳学说-阴阳关系","difficulty":2,"stem":"“阴在内，阳之守也；阳在外，阴之使也”，说明阴阳之间的","options":{"A":"对立制约","B":"消长平衡","C":"互根互用","D":"相互转化","E":"交感互藏"},"answer":"C","explain":"阴为阳之守、阳为阴之使，说明阴阳互为根本、相互为用，脱离一方则另一方无以存在。对立制约指阴阳相互斗争约束。消长平衡指阴阳量的增减。相互转化指在条件下向对立面转变。","tags":["经典","高频"]},{"id":"JC-JCL-0003","type":"A1","group":null,"topic":"五行学说-相乘相侮","difficulty":2,"stem":"“木旺乘土”属于五行之间的","options":{"A":"相乘","B":"相生","C":"相克","D":"相侮","E":"制化"},"answer":"A","explain":"木旺乘土指木气过盛而克土太过，属相乘。相生指资生促进。相克指正常限度内的制约。相侮指反克，即被克者反克克它的一行。制化指生克协调状态。","tags":["易错"]},{"id":"JC-JCL-0004","type":"A1","group":null,"topic":"五行学说-治则","difficulty":2,"stem":"下列治法中，依据五行相生规律确立的是","options":{"A":"抑木扶土","B":"培土制水","C":"佐金平木","D":"滋水涵木","E":"泻南补北"},"answer":"D","explain":"滋水涵木即补肾阴以养肝阴，属虚则补其母，依据五行相生规律。抑木扶土、培土制水、佐金平木、泻南补北均属相克关系的治法。","tags":["鉴别","高频"]},{"id":"JC-JCL-0005","type":"B1","group":"JCL-B1-001","group_stem":"A.酸　B.苦　C.甘　D.辛　E.咸","topic":"五行学说-五行归类","difficulty":1,"stem":"五行归类中，与肺相应的味是","options":{"A":"酸","B":"苦","C":"甘","D":"辛","E":"咸"},"answer":"D","explain":"酸入肝、苦入心、甘入脾、辛入肺、咸入肾，故与肺相应者为辛。酸味入肝；苦味入心；甘味入脾；咸味入肾。","tags":[]},{"id":"JC-JCL-0006","type":"B1","group":"JCL-B1-001","group_stem":"A.酸　B.苦　C.甘　D.辛　E.咸","topic":"五行学说-五行归类","difficulty":1,"stem":"五行归类中，与肾相应的味是","options":{"A":"酸","B":"苦","C":"甘","D":"辛","E":"咸"},"answer":"E","explain":"咸入肾，故与肾相应者为咸味。酸入肝；苦入心；甘入脾；辛入肺。此即五味入五脏的对应规律。","tags":[]},{"id":"JC-JCL-0007","type":"B1","group":"JCL-B1-001","group_stem":"A.酸　B.苦　C.甘　D.辛　E.咸","topic":"五行学说-五行归类","difficulty":1,"stem":"五行归类中，与脾相应的味是","options":{"A":"酸","B":"苦","C":"甘","D":"辛","E":"咸"},"answer":"C","explain":"甘入脾，故与脾相应者为甘味。酸入肝；苦入心；辛入肺；咸入肾。甘味能补能缓，与脾主运化相合。","tags":[]},{"id":"JC-JCL-0008","type":"B1","group":"JCL-B1-001","group_stem":"A.酸　B.苦　C.甘　D.辛　E.咸","topic":"五行学说-五行归类","difficulty":1,"stem":"五行归类中，与肝相应的味是","options":{"A":"酸","B":"苦","C":"甘","D":"辛","E":"咸"},"answer":"A","explain":"酸入肝，故与肝相应者为酸味。苦入心；甘入脾；辛入肺；咸入肾。酸味收敛，与肝主藏血、主疏泄相合。","tags":[]},{"id":"JC-JCL-0009","type":"A1","group":null,"topic":"藏象学说-五脏","difficulty":1,"stem":"被称为“君主之官”的脏是","options":{"A":"肝","B":"心","C":"脾","D":"肺","E":"肾"},"answer":"B","explain":"心主血脉而藏神，为五脏六腑之大主，故称君主之官。肝为将军之官；脾为仓廪之官；肺为相傅之官；肾为作强之官。","tags":["经典","高频"]},{"id":"JC-JCL-0010","type":"A1","group":null,"topic":"藏象学说-五脏","difficulty":1,"stem":"“喜条达而恶抑郁”的脏是","options":{"A":"肝","B":"心","C":"脾","D":"肺","E":"肾"},"answer":"A","explain":"肝属木，主疏泄，性喜条达舒畅而恶抑郁，故答肝。心主血脉藏神；脾主运化升清；肺主气司呼吸；肾主藏精主水。","tags":["高频"]},{"id":"JC-JCL-0011","type":"A1","group":null,"topic":"藏象学说-脾","difficulty":2,"stem":"脾主统血的功能主要依赖于","options":{"A":"脾阳的温煦","B":"脾阴的濡润","C":"脾气的固摄","D":"脾精的充盈","E":"脾血的濡养"},"answer":"C","explain":"脾主统血指脾气统摄血液在脉中运行、防止外溢，故依赖脾气的固摄作用。脾阳主温煦运化；脾阴主濡润；脾精、脾血均非统血的直接动力。","tags":["易错"]},{"id":"JC-JCL-0012","type":"A1","group":null,"topic":"藏象学说-肺","difficulty":2,"stem":"肺主通调水道主要依靠","options":{"A":"主一身之气","B":"朝百脉","C":"司呼吸","D":"主治节","E":"宣发肃降"},"answer":"E","explain":"肺通过宣发使津液布散于体表皮毛，通过肃降使津液下输膀胱，故通调水道依靠宣发肃降。主气司呼吸、朝百脉、主治节虽属肺的功能，但不是水道通调的直接机制。","tags":["高频"]},{"id":"JC-JCL-0013","type":"A1","group":null,"topic":"藏象学说-肾","difficulty":1,"stem":"被称为“先天之本”的脏是","options":{"A":"心","B":"脾","C":"肝","D":"肾","E":"肺"},"answer":"D","explain":"肾藏先天之精，主生长发育生殖，为生命之本原，故称先天之本。脾为后天之本、气血生化之源；心为君主之官；肝为罢极之本；肺为气之主。","tags":["高频"]},{"id":"JC-JCL-0014","type":"A1","group":null,"topic":"藏象学说-奇恒之腑","difficulty":2,"stem":"奇恒之腑中，被称为“髓海”的是","options":{"A":"骨","B":"脑","C":"脉","D":"髓","E":"女子胞"},"answer":"B","explain":"脑为髓聚之处，故称髓海。奇恒之腑包括脑、髓、骨、脉、胆、女子胞，形态似腑而功能似脏。骨为髓之府，脉为血之府，均不称髓海。","tags":["易错"]},{"id":"JC-JCL-0015","type":"B1","group":"JCL-B1-002","group_stem":"A.心　B.肝　C.脾　D.肺　E.肾","topic":"藏象学说-五脏与体华窍","difficulty":1,"stem":"“在体合筋，其华在爪”的脏是","options":{"A":"心","B":"肝","C":"脾","D":"肺","E":"肾"},"answer":"B","explain":"肝在体合筋、其华在爪，故答肝。心在体合脉、其华在面；脾在体合肉、其华在唇；肺在体合皮、其华在毛；肾在体合骨、其华在发。","tags":[]},{"id":"JC-JCL-0016","type":"B1","group":"JCL-B1-002","group_stem":"A.心　B.肝　C.脾　D.肺　E.肾","topic":"藏象学说-五脏与体华窍","difficulty":1,"stem":"“在体合肉，其华在唇”的脏是","options":{"A":"心","B":"肝","C":"脾","D":"肺","E":"肾"},"answer":"C","explain":"脾在体合肉、其华在唇四白，故答脾。脾主运化、主肌肉四肢，肌肉丰满与唇色荣润均赖脾气健运。","tags":[]},{"id":"JC-JCL-0017","type":"B1","group":"JCL-B1-002","group_stem":"A.心　B.肝　C.脾　D.肺　E.肾","topic":"藏象学说-五脏与体华窍","difficulty":1,"stem":"“在体合皮，其华在毛”的脏是","options":{"A":"心","B":"肝","C":"脾","D":"肺","E":"肾"},"answer":"D","explain":"肺在体合皮、其华在毛，故答肺。肺主宣发，输精于皮毛，肺气充则皮毛润泽、卫外固密。","tags":[]},{"id":"JC-JCL-0018","type":"B1","group":"JCL-B1-002","group_stem":"A.心　B.肝　C.脾　D.肺　E.肾","topic":"藏象学说-五脏与体华窍","difficulty":1,"stem":"“在体合骨，其华在发”的脏是","options":{"A":"心","B":"肝","C":"脾","D":"肺","E":"肾"},"answer":"E","explain":"肾在体合骨、其华在发，故答肾。肾藏精、精生髓、髓养骨，精血同源故发为血之余而根于肾。","tags":[]},{"id":"JC-JCL-0019","type":"B1","group":"JCL-B1-003","group_stem":"A.胃　B.小肠　C.大肠　D.膀胱　E.三焦","topic":"藏象学说-六腑","difficulty":1,"stem":"主受纳、腐熟水谷的腑是","options":{"A":"胃","B":"小肠","C":"大肠","D":"膀胱","E":"三焦"},"answer":"A","explain":"胃主受纳、腐熟水谷，称太仓、水谷之海，故答胃。小肠主受盛化物、泌别清浊；大肠主传导糟粕；膀胱贮尿排尿；三焦通行水道。","tags":["高频"]},{"id":"JC-JCL-0020","type":"B1","group":"JCL-B1-003","group_stem":"A.胃　B.小肠　C.大肠　D.膀胱　E.三焦","topic":"藏象学说-六腑","difficulty":1,"stem":"主泌别清浊的腑是","options":{"A":"胃","B":"小肠","C":"大肠","D":"膀胱","E":"三焦"},"answer":"B","explain":"小肠主受盛化物、泌别清浊，清者上输于脾，浊者下传大肠，故答小肠。胃主受纳腐熟；大肠传导糟粕；膀胱贮尿；三焦通行水道。","tags":["高频"]},{"id":"JC-JCL-0021","type":"B1","group":"JCL-B1-003","group_stem":"A.胃　B.小肠　C.大肠　D.膀胱　E.三焦","topic":"藏象学说-六腑","difficulty":1,"stem":"主传导糟粕、形成粪便的腑是","options":{"A":"胃","B":"小肠","C":"大肠","D":"膀胱","E":"三焦"},"answer":"C","explain":"大肠主传导糟粕、吸收部分水液并形成粪便，故答大肠。小肠泌别清浊；胃受纳腐熟；膀胱贮尿排尿；三焦通行水道。","tags":[]},{"id":"JC-JCL-0022","type":"B1","group":"JCL-B1-003","group_stem":"A.胃　B.小肠　C.大肠　D.膀胱　E.三焦","topic":"藏象学说-六腑","difficulty":1,"stem":"贮尿排尿、气化则能出的腑是","options":{"A":"胃","B":"小肠","C":"大肠","D":"膀胱","E":"三焦"},"answer":"D","explain":"膀胱贮尿排尿，赖肾之气化而能出，故答膀胱。胃主受纳腐熟；小肠泌别清浊；大肠传导糟粕；三焦通行水道。","tags":[]},{"id":"JC-JCL-0023","type":"A1","group":null,"topic":"精气血津液-气的生成","difficulty":2,"stem":"与气的生成关系最密切的脏腑是","options":{"A":"肺脾肾","B":"心肺肝","C":"肝脾肾","D":"心脾肝","E":"肺肝肾"},"answer":"A","explain":"气的生成源于先天精气、水谷精气与自然界清气，分别以肾为根、脾胃为源、肺为主，故肺脾肾三脏最密切。心主血脉、肝主疏泄虽参与气的运行，但不是生成的主要脏腑。","tags":["高频"]},{"id":"JC-JCL-0024","type":"A1","group":null,"topic":"精气血津液-气的功能","difficulty":1,"stem":"“气能摄血”体现的是气的","options":{"A":"推动作用","B":"温煦作用","C":"防御作用","D":"气化作用","E":"固摄作用"},"answer":"E","explain":"气能摄血指气对血具有统摄固护作用，使血行脉中而不外溢，属固摄作用。推动促进血行；温煦维持体温；防御抗御外邪；气化主物质代谢转化。","tags":["高频"]},{"id":"JC-JCL-0025","type":"A1","group":null,"topic":"精气血津液-血的生成","difficulty":1,"stem":"被称为“气血生化之源”的脏是","options":{"A":"心","B":"肝","C":"脾","D":"肺","E":"肾"},"answer":"C","explain":"脾主运化水谷精微，为气血化生提供物质基础，故称气血生化之源、后天之本。心主血脉推动血行；肝藏血；肺主气；肾藏精生髓化血，均非生化之源。","tags":["高频"]},{"id":"JC-JCL-0026","type":"A1","group":null,"topic":"精气血津液-津液代谢","difficulty":3,"stem":"水液代谢中主“决渎”、为水液运行通道的是","options":{"A":"肺","B":"三焦","C":"脾","D":"肾","E":"膀胱"},"answer":"B","explain":"三焦为决渎之官，主通行水道，是水液上下输布的通道，故答三焦。肺主通调水道，脾主运化水湿，肾为主水之脏，膀胱贮尿排尿，四者均非通道本身。","tags":["易错"]},{"id":"JC-JCL-0027","type":"B1","group":"JCL-B1-004","group_stem":"A.元气　B.宗气　C.营气　D.卫气　E.中气","topic":"精气血津液-气的分类","difficulty":2,"stem":"贯心脉以行气血、聚于胸中的气是","options":{"A":"元气","B":"宗气","C":"营气","D":"卫气","E":"中气"},"answer":"B","explain":"宗气聚于胸中，上走息道以司呼吸，贯心脉以行气血，故答宗气。元气根于肾；营气行于脉中；卫气行于脉外；中气指脾胃之气。","tags":["高频"]},{"id":"JC-JCL-0028","type":"B1","group":"JCL-B1-004","group_stem":"A.元气　B.宗气　C.营气　D.卫气　E.中气","topic":"精气血津液-气的分类","difficulty":2,"stem":"行于脉中、具有化生血液作用的气是","options":{"A":"元气","B":"宗气","C":"营气","D":"卫气","E":"中气"},"answer":"C","explain":"营气行于脉中，化生血液并营养全身，故答营气。卫气行于脉外而司开合；元气根于肾；宗气聚于胸中；中气指脾胃之气。","tags":[]},{"id":"JC-JCL-0029","type":"B1","group":"JCL-B1-004","group_stem":"A.元气　B.宗气　C.营气　D.卫气　E.中气","topic":"精气血津液-气的分类","difficulty":2,"stem":"行于脉外、温养脏腑皮毛而司汗孔开合的气是","options":{"A":"元气","B":"宗气","C":"营气","D":"卫气","E":"中气"},"answer":"D","explain":"卫气行于脉外，温养脏腑皮毛、司汗孔开合、抗御外邪，故答卫气。营气行于脉中；元气为生命活动原动力；宗气贯心脉行呼吸；中气指脾胃之气。","tags":["高频"]},{"id":"JC-JCL-0030","type":"B1","group":"JCL-B1-004","group_stem":"A.元气　B.宗气　C.营气　D.卫气　E.中气","topic":"精气血津液-气的分类","difficulty":2,"stem":"根于肾、推动人体生长发育的气是","options":{"A":"元气","B":"宗气","C":"营气","D":"卫气","E":"中气"},"answer":"A","explain":"元气根于肾，由先天之精化生，推动人体生长发育与生殖，故答元气。宗气聚于胸中；营气行于脉中；卫气行于脉外；中气指脾胃之气。","tags":[]},{"id":"JC-JCL-0031","type":"A1","group":null,"topic":"经络-十二经脉流注","difficulty":3,"stem":"十二经脉气血流注中，手太阴肺经之后接续的是","options":{"A":"手少阴心经","B":"足阳明胃经","C":"手厥阴心包经","D":"手阳明大肠经","E":"足太阴脾经"},"answer":"D","explain":"十二经脉流注始于手太阴肺经，次接手阳明大肠经，再传足阳明胃经，故答手阳明大肠经。手少阴心经在足太阴脾经之后；足太阴脾经接足阳明胃经；手厥阴心包经在足少阴肾经之后。","tags":["高频","易错"]},{"id":"JC-JCL-0032","type":"A1","group":null,"topic":"经络-十二经脉走向","difficulty":1,"stem":"手三阴经的循行走向是","options":{"A":"从胸走手","B":"从手走头","C":"从头走足","D":"从足走腹胸","E":"从手走胸"},"answer":"A","explain":"十二经脉走向为手三阴从胸走手、手三阳从手走头、足三阳从头走足、足三阴从足走腹胸。故手三阴经从胸走手，其余各项分别对应手三阳、足三阳、足三阴。","tags":["高频"]},{"id":"JC-JCL-0033","type":"B1","group":"JCL-B1-005","group_stem":"A.督脉　B.任脉　C.冲脉　D.带脉　E.维脉","topic":"经络-奇经八脉","difficulty":2,"stem":"被称为“阴脉之海”的经脉是","options":{"A":"督脉","B":"任脉","C":"冲脉","D":"带脉","E":"维脉"},"answer":"B","explain":"任脉行于腹面正中，总任一身阴经，故称阴脉之海。督脉总督阳经为阳脉之海；冲脉为十二经脉之海、血海；带脉约束纵行诸经；维脉维系阴阳。","tags":["高频"]},{"id":"JC-JCL-0034","type":"B1","group":"JCL-B1-005","group_stem":"A.督脉　B.任脉　C.冲脉　D.带脉　E.维脉","topic":"经络-奇经八脉","difficulty":2,"stem":"被称为“十二经脉之海”的经脉是","options":{"A":"督脉","B":"任脉","C":"冲脉","D":"带脉","E":"维脉"},"answer":"C","explain":"冲脉与十二经脉气血相通，调节十二经气血，故称十二经脉之海，亦称血海。任脉为阴脉之海；督脉为阳脉之海；带脉约束诸经；维脉维系阴阳。","tags":["易错"]},{"id":"JC-JCL-0035","type":"B1","group":"JCL-B1-005","group_stem":"A.督脉　B.任脉　C.冲脉　D.带脉　E.维脉","topic":"经络-奇经八脉","difficulty":2,"stem":"环腰一周、约束纵行诸经的经脉是","options":{"A":"督脉","B":"任脉","C":"冲脉","D":"带脉","E":"维脉"},"answer":"D","explain":"带脉起于季胁，环腰一周，约束纵行诸经，故答带脉。任脉行于身前正中；督脉行于身后正中；冲脉与肾经并行而上；维脉维系一身阴阳。","tags":[]},{"id":"JC-JCL-0036","type":"B1","group":"JCL-B1-005","group_stem":"A.督脉　B.任脉　C.冲脉　D.带脉　E.维脉","topic":"经络-奇经八脉","difficulty":2,"stem":"被称为“阳脉之海”的经脉是","options":{"A":"督脉","B":"任脉","C":"冲脉","D":"带脉","E":"维脉"},"answer":"A","explain":"督脉行于背部正中，总督一身阳经，故称阳脉之海。任脉为阴脉之海；冲脉为十二经脉之海；带脉约束诸经；维脉维系阴阳。","tags":["高频"]},{"id":"JC-JCL-0037","type":"A1","group":null,"topic":"体质-体质形成","difficulty":1,"stem":"体质形成过程中起决定作用的因素是","options":{"A":"饮食营养","B":"情志活动","C":"劳逸起居","D":"地理环境","E":"先天禀赋"},"answer":"E","explain":"先天禀赋源于父母肾精，是体质形成的物质基础，对体质强弱与类型起决定作用。饮食营养、情志活动、劳逸起居、地理环境属后天因素，对体质起影响与塑造作用。","tags":["高频"]},{"id":"JC-JCL-0038","type":"A1","group":null,"topic":"体质-体质与发病","difficulty":3,"stem":"偏阳质的人感受外邪后，病机多趋向于","options":{"A":"从寒化","B":"从湿化","C":"从热化","D":"从燥化","E":"从虚化"},"answer":"C","explain":"偏阳质者阳气偏盛，感邪后易从阳化热，故多从热化。偏阴质者阳气偏衰，感邪后多从寒化。从湿化多与脾虚湿盛有关，从燥化多与阴虚津亏有关，从虚化并非体质偏阳的主要转归。","tags":["易错"]},{"id":"JC-JCL-0039","type":"A1","group":null,"topic":"病因-六淫","difficulty":1,"stem":"其性开泄、易袭阳位的邪气是","options":{"A":"寒邪","B":"风邪","C":"湿邪","D":"燥邪","E":"火邪"},"answer":"B","explain":"风为阳邪，其性开泄，易袭阳位，故答风邪。寒性收引凝滞而易伤阳气；湿性重浊黏滞而易袭阴位；燥性干涩伤津；火性炎上而易生风动血。","tags":["高频"]},{"id":"JC-JCL-0040","type":"A1","group":null,"topic":"病因-痰饮","difficulty":2,"stem":"痰饮的形成主要涉及的脏腑是","options":{"A":"心肝脾","B":"肝脾肾","C":"心肺肾","D":"肺肝肾","E":"肺脾肾"},"answer":"E","explain":"痰饮由水液代谢障碍停聚而成，肺主通调水道、脾主运化水湿、肾主蒸腾气化，三脏失常则水湿停聚为痰饮。心主血脉、肝主疏泄虽可影响水行，但不是主要环节。","tags":["高频"]},{"id":"JC-JCL-0041","type":"A1","group":null,"topic":"病因-七情内伤","difficulty":1,"stem":"“思则气结”，过度思虑最易损伤的脏是","options":{"A":"脾","B":"心","C":"肝","D":"肺","E":"肾"},"answer":"A","explain":"思则气结指思虑过度使气机郁结，脾主运化而藏意，故思伤脾。怒伤肝、喜伤心、悲伤肺、恐伤肾，分别为五志所伤。","tags":["高频"]},{"id":"JC-JCL-0042","type":"B1","group":"JCL-B1-006","group_stem":"A.风邪　B.寒邪　C.湿邪　D.燥邪　E.火邪","topic":"病因-六淫","difficulty":2,"stem":"其性收引、易伤阳气的邪气是","options":{"A":"风邪","B":"寒邪","C":"湿邪","D":"燥邪","E":"火邪"},"answer":"B","explain":"寒为阴邪，其性收引凝滞，易伤阳气，故答寒邪。风性开泄；湿性重浊黏滞；燥性干涩；火性炎上。","tags":[]},{"id":"JC-JCL-0043","type":"B1","group":"JCL-B1-006","group_stem":"A.风邪　B.寒邪　C.湿邪　D.燥邪　E.火邪","topic":"病因-六淫","difficulty":2,"stem":"其性干涩、易伤肺津的邪气是","options":{"A":"风邪","B":"寒邪","C":"湿邪","D":"燥邪","E":"火邪"},"answer":"D","explain":"燥为秋令主气，其性干涩，最易伤肺津，故答燥邪。风性开泄；寒性收引；湿性黏滞；火性炎上。","tags":["高频"]},{"id":"JC-JCL-0044","type":"B1","group":"JCL-B1-006","group_stem":"A.风邪　B.寒邪　C.湿邪　D.燥邪　E.火邪","topic":"病因-六淫","difficulty":2,"stem":"其性炎上、易生风动血的邪气是","options":{"A":"风邪","B":"寒邪","C":"湿邪","D":"燥邪","E":"火邪"},"answer":"E","explain":"火为阳邪，其性炎上，易生风动血、易扰心神，故答火邪。风性开泄善行；寒性收引；湿性重浊；燥性干涩。","tags":[]},{"id":"JC-JCL-0045","type":"B1","group":"JCL-B1-006","group_stem":"A.风邪　B.寒邪　C.湿邪　D.燥邪　E.火邪","topic":"病因-六淫","difficulty":2,"stem":"其性重浊趋下、易袭阴位的邪气是","options":{"A":"风邪","B":"寒邪","C":"湿邪","D":"燥邪","E":"火邪"},"answer":"C","explain":"湿为阴邪，其性重浊黏滞趋下，易袭阴位，故答湿邪。风性轻扬而上；寒性收引；燥性干涩；火性炎上。","tags":[]},{"id":"JC-JCL-0046","type":"A2","group":null,"topic":"病因-瘀血","difficulty":2,"stem":"患者，男，48岁。半年前跌仆伤及腰部，此后腰部刺痛，固定不移，入夜加重，舌质紫暗有瘀斑，脉涩。其病邪性质是","options":{"A":"气滞","B":"寒凝","C":"湿阻","D":"血瘀","E":"痰聚"},"answer":"D","explain":"跌仆外伤致血行不畅，刺痛、固定不移、入夜加重、舌紫暗有瘀斑、脉涩，均为瘀血阻滞之象，故属血瘀。气滞以胀痛、部位不定为主；寒凝以冷痛、得温则减为主；湿阻以重着黏滞为主；痰聚多见形体肥胖、苔腻脉滑。","tags":["鉴别"]},{"id":"JC-JCL-0047","type":"A1","group":null,"topic":"病机-邪正盛衰","difficulty":1,"stem":"“邪气盛则实，精气夺则虚”，其中“虚”是指","options":{"A":"邪气亢盛","B":"虚实夹杂","C":"真虚假实","D":"真实假虚","E":"正气虚损"},"answer":"E","explain":"精气夺则虚，指正气被耗伤而不足，故虚指正气虚损。邪气盛则实指邪盛而正气未衰的实证。虚实夹杂为邪盛与正虚并存，真虚假实与真实假虚属虚实真假。","tags":["经典","高频"]},{"id":"JC-JCL-0048","type":"A1","group":null,"topic":"病机-阴阳失调","difficulty":2,"stem":"亡阳的病机实质是","options":{"A":"阳气偏盛","B":"阳气暴脱","C":"阳气偏衰","D":"阴寒内盛","E":"阴虚阳亢"},"answer":"B","explain":"亡阳指阳气突然大量亡失，属阳气暴脱，病情危重。阳气偏盛属实热；阳气偏衰为一般阳虚；阴寒内盛为实寒；阴虚阳亢为阴虚不能制阳。","tags":["高频","易错"]},{"id":"JC-JCL-0049","type":"A1","group":null,"topic":"病机-阴阳格拒","difficulty":3,"stem":"真寒假热的病机是","options":{"A":"阴盛格阳","B":"阳盛格阴","C":"阴虚阳亢","D":"阳虚阴盛","E":"阴阳两虚"},"answer":"A","explain":"真寒假热是阴寒内盛，逼迫虚阳浮越于外，形成内真寒外假热，即阴盛格阳。阳盛格阴形成真热假寒。阴虚阳亢、阳虚阴盛、阴阳两虚均不出现寒热真假之象。","tags":["鉴别","易错"]},{"id":"JC-JCL-0050","type":"A1","group":null,"topic":"病机-气血失常","difficulty":2,"stem":"气逆病变最常见的脏腑是","options":{"A":"心与肺","B":"肝与脾","C":"脾与胃","D":"肺胃肝","E":"肺与肾"},"answer":"D","explain":"气逆指气机升降失常、升之太过或降之不及，多见于肺、胃、肝三脏。肺气上逆见咳喘，胃气上逆见恶心呕吐嗳气，肝气上逆见头痛面红易怒。心、脾、肾以气虚或气陷为多见。","tags":["高频"]},{"id":"JC-JCL-0051","type":"A1","group":null,"topic":"病机-气陷","difficulty":1,"stem":"气虚无力升举，导致内脏下垂，其病机是","options":{"A":"气滞","B":"气逆","C":"气陷","D":"气闭","E":"气脱"},"answer":"C","explain":"气陷是气虚升举无力、清阳不升的病理状态，可见内脏下垂、久泄脱肛。气滞为气机郁滞；气逆为升降失常；气闭为气机闭塞；气脱为气不内守而外脱。","ta
