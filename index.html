ptions":{"A":"阳黄热重于湿","B":"阳黄湿重于热","C":"阴黄寒湿阻遏","D":"急黄疫毒炽盛","E":"胆腑郁热"},"answer":"C","explain":"黄色晦暗如烟熏、畏寒神疲、舌淡苔白腻，为寒湿困遏、阳气不宣之阴黄寒湿阻遏证，方用茵陈术附汤。阳黄黄色鲜明如橘皮、伴湿热之象，急黄则黄色如金、高热神昏。故属阴黄。","tags":["鉴别","高频"]},{"id":"LC-NK-0038","type":"A2","group":null,"topic":"高频鉴别-眩晕与头痛","difficulty":2,"stem":"患者，女，52 岁。头晕目眩，视物旋转，如坐舟车，伴恶心呕吐，苔白腻，脉弦滑。其与头痛的鉴别要点是","options":{"A":"有无头痛","B":"有无恶心呕吐","C":"有无视物旋转","D":"有无苔白腻","E":"有无脉弦滑"},"answer":"C","explain":"眩晕以眼花、视物旋转、站立不稳为主症，头痛以头部疼痛为主症。两者均可伴恶心呕吐，也可同见苔腻脉弦。眩晕者可兼头痛，头痛者亦可兼眩晕，故以有无视物旋转、站立不稳为鉴别要点。","tags":["鉴别"]},{"id":"LC-NK-0039","type":"A2","group":null,"topic":"高频鉴别-感冒与风温","difficulty":2,"stem":"患者，女，30 岁。发热微恶风，头痛口渴，咽喉红肿疼痛，咳嗽痰黄，舌边尖红苔薄黄，脉浮数。其与普通感冒的鉴别要点是","options":{"A":"有无恶寒","B":"热势高低与口渴程度","C":"有无咳嗽","D":"有无头痛","E":"有无咽痛"},"answer":"B","explain":"患者发热重、口渴、咽红肿、痰黄、脉浮数，为风温初起。风温热势较高、口渴明显、传变迅速，易内陷营血；感冒发热较轻、口渴不甚、少见传变。故以热势高低与口渴程度鉴别。两者均可有恶寒、咳嗽、头痛、咽痛。","tags":["鉴别"]},{"id":"LC-NK-0040","type":"A2","group":null,"topic":"高频鉴别-泄泻与痢疾","difficulty":2,"stem":"患者，女，28 岁。大便稀溏，日行四五次，腹痛肠鸣，泻后痛减，苔白腻，脉濡。其诊断与痢疾的鉴别要点是","options":{"A":"有无便次增多","B":"有无腹痛","C":"有无脓血便与里急后重","D":"有无肠鸣","E":"有无苔腻"},"answer":"C","explain":"患者便稀、腹痛肠鸣、泻后痛减，为泄泻。泄泻粪质稀薄或如水样，无脓血与里急后重；痢疾下痢赤白黏冻、里急后重、腹痛窘迫。故以有无脓血便与里急后重鉴别。两者均可有腹痛与便次增多。","tags":["鉴别"]},{"id":"LC-NK-0041","type":"A2","group":null,"topic":"高频鉴别-哮与喘","difficulty":3,"stem":"患者，男，55 岁。喘促日久，动则喘甚，呼多吸少，气不得续，形瘦神疲，跗肿，舌淡苔白，脉沉弱。其诊断是","options":{"A":"哮病缓解期","B":"喘证之肾虚不纳","C":"喘证之肺气虚耗","D":"哮病之虚哮","E":"肺胀之肺肾气虚"},"answer":"B","explain":"喘促日久、动则喘甚、呼多吸少、气不得续、跗肿、脉沉弱，为喘证日久由肺及肾、肾虚不纳。哮病必有喉中哮鸣，本例无之；肺气虚耗以气短乏力、自汗为主而肾虚证不著。故属喘证肾虚不纳，方用金匮肾气丸合参蛤散。","tags":["鉴别","易错"]},{"id":"LC-NK-0042","type":"A2","group":null,"topic":"高频鉴别-胃痛与真心痛","difficulty":2,"stem":"患者，男，60 岁。突发胸膺部憋闷疼痛，痛引肩背，伴心悸气短，汗出肢冷，舌紫暗苔薄白，脉沉细。其诊断是","options":{"A":"胃痛之瘀血停胃","B":"胸痹之心血瘀阻","C":"腹痛之寒邪内阻","D":"胁痛之瘀血阻络","E":"真心痛之阳气暴脱"},"answer":"E","explain":"胸膺疼痛牵引肩背、心悸气短、汗出肢冷、脉沉细，为正虚阳脱之真心痛危候，急当回阳固脱。胸痹之心血瘀阻以胸痛固定、舌紫暗为主而无肢冷脉微；胃痛、腹痛、胁痛的疼痛部位与本例不符。故属真心痛。","tags":["鉴别","易错"]},{"id":"LC-NK-0043","type":"A2","group":null,"topic":"高频鉴别-淋证与癃闭","difficulty":3,"stem":"患者，男，68 岁。小便点滴不通 1 天，小腹胀满疼痛，烦躁不安，舌淡苔薄白，脉沉细。其与淋证的鉴别要点是","options":{"A":"有无尿频尿急","B":"有无排尿刺痛","C":"有无小便闭塞不通","D":"有无发热","E":"有无腰痛"},"answer":"C","explain":"患者小便点滴不通、小腹胀满，为癃闭。淋证以小便频数短涩、淋沥刺痛为特征，排尿尚通而量少；癃闭以小便闭塞不通为主症，无尿痛。故以有无小便闭塞不通为鉴别要点。癃闭与淋证均可有小腹胀、腰痛。","tags":["鉴别"]},{"id":"LC-NK-0044","type":"A2","group":null,"topic":"高频鉴别-眩晕与头痛","difficulty":2,"stem":"患者，男，48 岁。头部胀痛，两侧为重，心烦易怒，面红目赤，口苦，舌红苔黄，脉弦数。其与眩晕的鉴别要点是","options":{"A":"有无头部疼痛","B":"有无心烦易怒","C":"有无面红目赤","D":"有无口苦","E":"有无脉弦"},"answer":"A","explain":"患者以头部胀痛为主症，属头痛之肝阳上亢。头痛以头部疼痛为主症，眩晕以眼花、视物旋转为主症。两者同属肝阳上亢时均可有心烦易怒、面红目赤、口苦、脉弦，故以有无头部疼痛为鉴别要点。","tags":["鉴别"]},{"id":"LC-NK-0045","type":"A2","group":null,"topic":"肺痨-肺阴亏损","difficulty":2,"stem":"患者，女，26 岁。干咳少痰，痰中带血，潮热盗汗，口干咽燥，舌红少津苔薄白，脉细数。其证型是","options":{"A":"肺阴亏损","B":"虚火灼肺","C":"气阴耗伤","D":"阴阳虚损","E":"燥热伤肺"},"answer":"A","explain":"干咳痰少带血、潮热盗汗、口干咽燥、舌红少津脉细数，为肺痨肺阴亏损证，方用月华丸。虚火灼肺者热势更盛、咳血鲜红量多、心烦颧红；气阴耗伤者兼气短乏力自汗。故属肺阴亏损。","tags":["高频"]},{"id":"LC-NK-0046","type":"A2","group":null,"topic":"肺痨-虚火灼肺","difficulty":2,"stem":"患者，男，34 岁。咳呛气急，痰少质黏，时时咳血，血色鲜红，午后潮热，五心烦热，颧红，舌红绛苔黄，脉细数。其代表方是","options":{"A":"月华丸","B":"百合固金汤","C":"保真汤","D":"补天大造丸","E":"沙参麦冬汤"},"answer":"B","explain":"咳血鲜红、五心烦热、颧红、舌红绛，为阴虚火旺、灼伤肺络，属肺痨虚火灼肺证，方用百合固金汤。月华丸治肺阴亏损，保真汤治气阴耗伤，补天大造丸治阴阳虚损。故取百合固金汤。","tags":["鉴别"]},{"id":"LC-NK-0047","type":"A2","group":null,"topic":"痫病-风痰闭阻","difficulty":2,"stem":"患者，男，18 岁。猝然仆倒，两目上视，四肢抽搐，口吐涎沫，醒后如常人，平素痰多，苔白腻，脉弦滑。其代表方是","options":{"A":"定痫丸","B":"龙胆泻肝汤","C":"通窍活血汤","D":"六君子汤","E":"左归丸"},"answer":"A","explain":"猝倒抽搐、口吐涎沫、苔白腻脉弦滑，为风痰闭阻清窍之痫病，方用定痫丸。龙胆泻肝汤合涤痰汤治痰火扰神，通窍活血汤治瘀阻脑络，六君子汤合归脾汤治心脾两虚。故取定痫丸。","tags":["高频"]},{"id":"LC-NK-0048","type":"A2","group":null,"topic":"痫病-瘀阻脑络","difficulty":3,"stem":"患者，女，40 岁。头部外伤后反复发作性抽搐，发时昏仆，平素头痛如刺，舌紫暗有瘀斑，脉涩。其证型是","options":{"A":"风痰闭阻","B":"痰火扰神","C":"瘀阻脑络","D":"心脾两虚","E":"心肾亏虚"},"answer":"C","explain":"有头部外伤史，发时昏仆抽搐，平素头痛如刺、舌紫暗有瘀斑、脉涩，为瘀血阻络、脑脉不通，属瘀阻脑络证，方用通窍活血汤。风痰闭阻者痰多苔腻，痰火扰神者烦躁口苦。故属瘀阻脑络。","tags":["鉴别"]},{"id":"LC-NK-0049","type":"A2","group":null,"topic":"噎膈-痰气交阻","difficulty":2,"stem":"患者，男，55 岁。吞咽梗阻，胸膈痞满，甚则疼痛，情志舒畅时减轻，嗳气则舒，苔薄腻，脉弦滑。其代表方是","options":{"A":"启膈散","B":"沙参麦冬汤","C":"通幽汤","D":"补气运脾汤","E":"旋覆代赭汤"},"answer":"A","explain":"吞咽梗阻、胸膈痞满、随情志变化、苔薄腻脉弦滑，为痰气交阻之噎膈，方用启膈散。沙参麦冬汤治津亏热结，通幽汤治瘀血内结，补气运脾汤治气虚阳微。故取启膈散。","tags":["高频"]},{"id":"LC-NK-0050","type":"A2","group":null,"topic":"噎膈-瘀血内结","difficulty":3,"stem":"患者，女，62 岁。吞咽困难，食不得下，甚至水饮难进，胸膈疼痛固定不移，面色晦暗，舌紫暗有瘀点，脉细涩。其治法是","options":{"A":"开郁化痰、润燥降气","B":"滋养津液、泻热散结","C":"破结行瘀、滋阴养血","D":"温补脾肾、益气回阳","E":"疏肝理气、和胃降逆"},"answer":"C","explain":"胸膈疼痛固定、舌紫暗有瘀点、脉细涩，为瘀血内结之噎膈，治当破结行瘀、滋阴养血，方用通幽汤。开郁化痰润燥降气为痰气交阻治法，滋养津液泻热散结为津亏热结治法，温补脾肾益气回阳为气虚阳微治法。故取破结行瘀。","tags":["鉴别"]},{"id":"LC-NK-0051","type":"A2","group":null,"topic":"便秘-热秘","difficulty":2,"stem":"患者，男，30 岁。大便干结，数日一行，腹部胀满，口干口臭，面赤身热，小便短赤，舌红苔黄燥，脉滑数。其代表方是","options":{"A":"麻子仁丸","B":"六磨汤","C":"温脾汤","D":"黄芪汤","E":"济川煎"},"answer":"A","explain":"大便干结、腹满口臭、身热尿赤、苔黄燥脉滑数，为肠胃积热之热秘，方用麻子仁丸。六磨汤治气秘，温脾汤合半硫丸治冷秘，黄芪汤治气虚秘，济川煎治阳虚秘。故取麻子仁丸。","tags":["高频"]},{"id":"LC-NK-0052","type":"A2","group":null,"topic":"便秘-阳虚秘","difficulty":2,"stem":"患者，女，68 岁。大便艰涩，排出困难，腹中冷痛，腰膝酸冷，小便清长，舌淡苔白，脉沉迟。其代表方是","options":{"A":"麻子仁丸","B":"六磨汤","C":"温脾汤合半硫丸","D":"润肠丸","E":"济川煎"},"answer":"E","explain":"便艰、腹中冷痛、腰膝酸冷、尿清长、脉沉迟，为阳气虚衰、肠道失温之阳虚秘，方用济川煎。温脾汤合半硫丸治阴寒积滞之冷秘，润肠丸治血虚秘，麻子仁丸治热秘。故取济川煎。","tags":["鉴别"]},{"id":"LC-NK-0053","type":"A2","group":null,"topic":"积聚-积证瘀血内结","difficulty":2,"stem":"患者，男，48 岁。腹中积块坚硬，固定不移，疼痛拒按，面色晦暗，形体消瘦，舌紫暗有瘀斑，脉沉涩。其代表方是","options":{"A":"柴胡疏肝散合失笑散","B":"膈下逐瘀汤","C":"八珍汤合化积丸","D":"逍遥散","E":"六磨汤"},"answer":"B","explain":"积块坚硬固定、痛处拒按、舌紫暗有瘀斑，为积证瘀血内结，方用膈下逐瘀汤。柴胡疏肝散合失笑散治气滞血阻，八珍汤合化积丸治正虚瘀结，逍遥散与六磨汤治聚证。故取膈下逐瘀汤。","tags":["高频"]},{"id":"LC-NK-0054","type":"A2","group":null,"topic":"积聚-聚证肝气郁结","difficulty":2,"stem":"患者，女，38 岁。腹中气聚，结块柔软，攻窜胀痛，时聚时散，脘胁胀闷，苔薄白，脉弦。其治法是","options":{"A":"疏肝解郁、行气消聚","B":"理气化浊、导滞散结","C":"祛瘀软坚、兼调脾胃","D":"补益气血、活血化瘀","E":"温中散寒、行气止痛"},"answer":"A","explain":"腹中气聚、攻窜胀痛、时聚时散，为聚证肝气郁结，治当疏肝解郁、行气消聚，方用逍遥散。理气化浊导滞散结治食滞痰阻，祛瘀软坚兼调脾胃治积证瘀血内结，补益气血活血化瘀治正虚瘀结。故取疏肝解郁。","tags":["鉴别"]},{"id":"LC-NK-0055","type":"A2","group":null,"topic":"遗精-君相火旺","difficulty":2,"stem":"患者，男，22 岁。梦中遗精，夜寐不安，心悸怔忡，精神不振，小便短黄，舌红苔黄，脉细数。其代表方是","options":{"A":"黄连清心饮合三才封髓丹","B":"程氏萆薢分清饮","C":"妙香散","D":"金锁固精丸","E":"知柏地黄丸"},"answer":"A","explain":"梦中遗精、心悸怔忡、舌红脉细数，为君相火旺、扰动精室，方用黄连清心饮合三才封髓丹。程氏萆薢分清饮治湿热下注，妙香散治劳伤心脾，金锁固精丸治肾虚不固。故取黄连清心饮合三才封髓丹。","tags":["鉴别"]},{"id":"LC-NK-0056","type":"A2","group":null,"topic":"遗精-肾虚不固","difficulty":3,"stem":"患者，男，45 岁。遗精频作，甚则滑精，腰膝酸软，头晕耳鸣，畏寒肢冷，舌淡苔白，脉沉弱。其代表方是","options":{"A":"黄连清心饮","B":"程氏萆薢分清饮","C":"妙香散","D":"金锁固精丸","E":"龙胆泻肝汤"},"answer":"D","explain":"遗精频作甚至滑精、腰膝酸软、畏寒肢冷、脉沉弱，为肾虚不固、精关失约，方用金锁固精丸。湿热下注者尿黄苔腻，劳伤心脾者心悸失眠，君相火旺者梦遗心烦。故取金锁固精丸。","tags":["鉴别"]},{"id":"LC-NK-0057","type":"A2","group":null,"topic":"痉证-邪壅经络","difficulty":2,"stem":"患者，男，35 岁。头痛，项背强直，恶寒发热，肢体酸重，苔白腻，脉浮紧。其代表方是","options":{"A":"羌活胜湿汤","B":"羚角钩藤汤","C":"白虎汤","D":"清营汤","E":"大定风珠"},"answer":"A","explain":"项背强直、恶寒发热、肢体酸重、苔白腻脉浮紧，为风寒湿邪壅滞经络之痉证，方用羌活胜湿汤。羚角钩藤汤治肝经热盛，白虎汤合增液承气汤治阳明热盛，清营汤治心营热盛，大定风珠治阴血亏虚。故取羌活胜湿汤。","tags":["鉴别"]},{"id":"LC-NK-0058","type":"A2","group":null,"topic":"痉证-阴血亏虚","difficulty":3,"stem":"患者，女，50 岁。项背强急，四肢抽搐，面色苍白，头晕目眩，神疲气短，舌淡苔薄白，脉细弱。其代表方是","options":{"A":"羌活胜湿汤","B":"导痰汤","C":"四物汤合大定风珠","D":"羚角钩藤汤","E":"清营汤"},"answer":"C","explain":"项背强急、抽搐、面白头晕、神疲气短、脉细弱，为阴血亏虚、筋脉失养之痉证，方用四物汤合大定风珠。导痰汤治痰浊阻滞，羚角钩藤汤治肝经热盛，清营汤治心营热盛。故取四物汤合大定风珠。","tags":["鉴别"]},{"id":"LC-NK-0059","type":"A2","group":null,"topic":"内伤发热-气虚发热","difficulty":2,"stem":"患者，女，40 岁。发热日久，热势不高，劳累后加重，气短乏力，自汗易感，食少便溏，舌淡苔薄白，脉细弱。其代表方是","options":{"A":"清骨散","B":"补中益气汤","C":"归脾汤","D":"金匮肾气丸","E":"丹栀逍遥散"},"answer":"B","explain":"低热日久、劳累加重、气短乏力、自汗、便溏、脉细弱，为气虚发热，治当益气健脾、甘温除热，方用补中益气汤。清骨散治阴虚发热，归脾汤治血虚发热，金匮肾气丸治阳虚发热，丹栀逍遥散治气郁发热。","tags":["高频"]},{"id":"LC-NK-0060","type":"A2","group":null,"topic":"咳嗽-肝火犯肺","difficulty":3,"stem":"患者，男，42 岁。气逆咳嗽，咳时面赤，痰黏难咯，咳引胸胁作痛，口苦咽干，舌红苔薄黄，脉弦数。其代表方是","options":{"A":"三拗汤合止嗽散","B":"桑菊饮","C":"清金化痰汤","D":"黛蛤散合加减泻白散","E":"沙参麦冬汤"},"answer":"D","explain":"气逆咳嗽、面赤、咳引胸胁痛、口苦、脉弦数，为肝火犯肺之咳嗽，方用黛蛤散合加减泻白散。三拗汤合止嗽散治风寒袭肺，桑菊饮治风热犯肺，清金化痰汤治痰热郁肺，沙参麦冬汤治肺阴亏耗。故取黛蛤散合加减泻白散。","tags":["鉴别"]},{"id":"LC-NK-0061","type":"A2","group":null,"topic":"虚劳-肝血虚","difficulty":2,"stem":"患者，女，35 岁。头晕目眩，面色无华，胁痛隐隐，肢体麻木，月经量少色淡，舌淡苔薄白，脉细。其代表方是","options":{"A":"归脾汤","B":"四物汤","C":"养心汤","D":"补肝汤","E":"八珍汤"},"answer":"B","explain":"头晕目眩、面白、肢体麻木、经少色淡、脉细，为肝血虚之虚劳，方用四物汤。归脾汤与养心汤偏补心脾气血，补肝汤偏养肝阴，八珍汤治气血两虚而无侧重。故取四物汤。","tags":["鉴别"]},{"id":"LC-NK-0062","type":"A2","group":null,"topic":"肺痈-成痈期","difficulty":2,"stem":"患者，男，40 岁。壮热不退，烦躁不安，咳嗽气急，胸满作痛，咳吐黄绿色浊痰，气味腥臭，舌红苔黄腻，脉滑数。其代表方是","options":{"A":"银翘散","B":"千金苇茎汤合如金解毒散","C":"加味桔梗汤","D":"沙参清肺汤","E":"桔梗杏仁煎"},"answer":"B","explain":"壮热、胸痛、咳吐黄绿浊痰腥臭、苔黄腻脉滑数，为肺痈成痈期，治当清肺解毒、化瘀消痈，方用千金苇茎汤合如金解毒散。银翘散治初期，加味桔梗汤治溃脓期，沙参清肺汤与桔梗杏仁煎治恢复期。故取千金苇茎汤合如金解毒散。","tags":["高频"]},{"id":"LC-NK-0063","type":"A2","group":null,"topic":"心悸-心虚胆怯","difficulty":3,"stem":"患者，女，26 岁。心悸不宁，善惊易恐，稍惊即发，坐卧不安，少寐多梦，舌淡苔薄白，脉细数。其证型是","options":{"A":"心虚胆怯","B":"心血不足","C":"阴虚火旺","D":"心阳不振","E":"瘀阻心脉"},"answer":"A","explain":"心悸易惊、善恐、稍惊即发、坐卧不安，为心虚胆怯证，方用安神定志丸。心血不足者面色无华、头晕乏力；阴虚火旺者五心烦热、舌红少苔；心阳不振者形寒肢冷。故属心虚胆怯。","tags":["鉴别"]},{"id":"LC-NK-0064","type":"A2","group":null,"topic":"胸痹-痰浊闭阻","difficulty":2,"stem":"患者，男，56 岁。胸闷如窒而痛，气短喘促，肢体沉重，形体肥胖，痰多，苔白腻，脉滑。其代表方是","options":{"A":"血府逐瘀汤","B":"柴胡疏肝散","C":"栝蒌薤白半夏汤合涤痰汤","D":"生脉散合人参养荣汤","E":"参附汤合右归饮"},"answer":"C","explain":"胸闷如窒而痛、肢体沉重、痰多、苔白腻脉滑，为痰浊闭阻之胸痹，方用栝蒌薤白半夏汤合涤痰汤。血府逐瘀汤治心血瘀阻，柴胡疏肝散治气滞心胸，生脉散合人参养荣汤治气阴两虚。故取栝蒌薤白半夏汤合涤痰汤。","tags":["高频"]},{"id":"LC-NK-0065","type":"A2","group":null,"topic":"不寐-心肾不交","difficulty":2,"stem":"患者，男，50 岁。心烦不寐，入睡困难，心悸多梦，腰膝酸软，潮热盗汗，舌红少苔，脉细数。其代表方是","options":{"A":"龙胆泻肝汤","B":"黄连温胆汤","C":"归脾汤","D":"六味地黄丸合交泰丸","E":"安神定志丸合酸枣仁汤"},"answer":"D","explain":"心烦不寐、腰膝酸软、潮热盗汗、舌红少苔脉细数，为肾阴不足、心火偏亢之心肾不交，方用六味地黄丸合交泰丸。龙胆泻肝汤治肝火扰心，归脾汤治心脾两虚，安神定志丸合酸枣仁汤治心胆气虚。故取六味地黄丸合交泰丸。","tags":["高频"]},{"id":"LC-NK-0066","type":"A2","group":null,"topic":"癫狂-癫证痰气郁结","difficulty":2,"stem":"患者，女，30 岁。精神抑郁，表情淡漠，神志痴呆，语无伦次，时时叹息，苔白腻，脉弦滑。其代表方是","options":{"A":"逍遥散合顺气导痰汤","B":"生铁落饮","C":"养心汤合越鞠丸","D":"二阴煎","E":"癫狂梦醒汤"},"answer":"A","explain":"精神抑郁、表情淡漠、神志痴呆、苔白腻脉弦滑，为癫证痰气郁结，方用逍遥散合顺气导痰汤。生铁落饮治狂证痰火扰神，养心汤合越鞠丸治癫证心脾两虚，二阴煎治火盛伤阴。故取逍遥散合顺气导痰汤。","tags":["高频"]},{"id":"LC-NK-0067","type":"A2","group":null,"topic":"痞满-肝胃不和","difficulty":1,"stem":"患者，男，38 岁。脘腹痞闷，胸胁胀满，心烦易怒，善太息，恶心嗳气，苔薄白，脉弦。其代表方是","options":{"A":"保和丸","B":"二陈平胃汤","C":"泻心汤合连朴饮","D":"越鞠丸合枳术丸","E":"益胃汤"},"answer":"D","explain":"脘腹痞闷、胸胁胀满、善太息、嗳气、脉弦，为肝胃不和之痞满，方用越鞠丸合枳术丸。保和丸治饮食内停，二陈平胃汤治痰湿中阻，泻心汤合连朴饮治湿热阻胃。故取越鞠丸合枳术丸。","tags":["鉴别"]},{"id":"LC-NK-0068","type":"A2","group":null,"topic":"呕吐-肝气犯胃","difficulty":1,"stem":"患者，女，34 岁。呕吐吞酸，嗳气频繁，胸胁胀痛，每因情志不遂而加重，苔薄白，脉弦。其代表方是","options":{"A":"藿香正气散","B":"保和丸","C":"小半夏汤合苓桂术甘汤","D":"四七汤","E":"理中丸"},"answer":"D","explain":"呕吐吞酸、嗳气、胸胁胀痛、随情志加重、脉弦，为肝气犯胃之呕吐，方用四七汤。藿香正气散治外邪犯胃，保和丸治饮食停滞，小半夏汤合苓桂术甘汤治痰饮内阻，理中丸治脾胃虚寒。故取四七汤。","tags":["鉴别"]},{"id":"LC-NK-0069","type":"A2","group":null,"topic":"腹痛-湿热壅滞","difficulty":2,"stem":"患者，男，40 岁。腹部胀痛，痛而拒按，大便不畅，小便短赤，烦渴引饮，舌红苔黄腻，脉滑数。其代表方是","options":{"A":"良附丸合正气天香散","B":"大承气汤","C":"枳实导滞丸","D":"柴胡疏肝散","E":"小建中汤"},"answer":"B","explain":"腹胀痛拒按、便结尿赤、烦渴、苔黄腻脉滑数，为湿热内结、气机壅滞之腹痛，方用大承气汤。枳实导滞丸治饮食积滞，柴胡疏肝散治肝郁气滞，良附丸合正气天香散治寒邪内阻。故取大承气汤。","tags":["高频"]},{"id":"LC-NK-0070","type":"A2","group":null,"topic":"痿证-湿热浸淫","difficulty":2,"stem":"患者，男，38 岁。肢体痿软无力，以下肢为甚，肢体困重，麻木微肿，小便短赤，舌红苔黄腻，脉濡数。其代表方是","options":{"A":"清燥救肺汤","B":"加味二妙散","C":"参苓白术散","D":"虎潜丸","E":"圣愈汤"},"answer":"B","explain":"肢体痿软困重、麻木微肿、尿赤、苔黄腻脉濡数，为湿热浸淫之痿证，方用加味二妙散。清燥救肺汤治肺热津伤，参苓白术散合补中益气汤治脾胃虚弱，虎潜丸治肝肾亏损，圣愈汤合补阳还五汤治脉络瘀阻。","tags":["高频"]},{"id":"LC-NK-0071","type":"A2","group":null,"topic":"胁痛-肝胆湿热","difficulty":2,"stem":"患者，男，44 岁。胁肋灼痛，口苦口黏，胸闷纳呆，恶心呕吐，小便黄赤，舌红苔黄腻，脉弦滑数。其代表方是","options":{"A":"柴胡疏肝散","B":"龙胆泻肝汤","C":"血府逐瘀汤","D":"一贯煎","E":"复元活血汤"},"answer":"B","explain":"胁肋灼痛、口苦口黏、尿黄、苔黄腻脉弦滑数，为肝胆湿热之胁痛，方用龙胆泻肝汤。柴胡疏肝散治肝郁气滞，血府逐瘀汤治瘀血阻络，一贯煎治肝络失养。故取龙胆泻肝汤。","tags":["高频"]},{"id":"LC-NK-0072","type":"A2","group":null,"topic":"鼓胀-阳虚水盛","difficulty":2,"stem":"患者，男，58 岁。腹大胀满，形如蛙腹，朝宽暮急，面色苍黄，畏寒肢冷，下肢浮肿，舌淡胖苔白滑，脉沉细。其代表方是","options":{"A":"柴胡疏肝散合胃苓汤","B":"实脾饮","C":"中满分消丸","D":"调营饮","E":"附子理苓汤"},"answer":"E","explain":"腹大如蛙腹、朝宽暮急、畏寒肢冷、下肢浮肿、舌淡胖，为脾肾阳虚、水湿内停之阳虚水盛，方用附子理苓汤或济生肾气丸。实脾饮治水湿困脾，中满分消丸治水热蕴结，调营饮治瘀结水留。故取附子理苓汤。","tags":["鉴别"]},{"id":"LC-NK-0073","type":"A2","group":null,"topic":"腰痛-肾虚腰痛","difficulty":1,"stem":"患者，男，55 岁。腰痛酸软，喜按喜揉，腿膝无力，遇劳更甚，卧则减轻，畏寒肢冷，舌淡苔白，脉沉细。其代表方是","options":{"A":"甘姜苓术汤","B":"四妙丸","C":"身痛逐瘀汤","D":"右归丸","E":"左归丸"},"answer":"D","explain":"腰痛酸软喜按、遇劳更甚、卧则减轻、畏寒肢冷，为肾阳虚之腰痛，方用右归丸。左归丸治肾阴虚腰痛而见虚火舌红少苔，甘姜苓术汤治寒湿腰痛，四妙丸治湿热腰痛，身痛逐瘀汤治瘀血腰痛。","tags":["高频"]},{"id":"LC-NK-0074","type":"A2","group":null,"topic":"水肿-脾阳虚衰","difficulty":2,"stem":"患者，女，52 岁。身肿日久，腰以下为甚，按之凹陷不起，脘腹胀满，纳减便溏，面色不华，舌淡苔白腻，脉沉缓。其代表方是","options":{"A":"越婢加术汤","B":"五皮饮合胃苓汤","C":"疏凿饮子","D":"实脾饮","E":"济生肾气丸合真武汤"},"answer":"D","explain":"水肿腰以下为甚、按之凹陷不起、纳减便溏、面色不华，为脾阳虚衰之阴水，方用实脾饮。越婢加术汤治风水相搏，五皮饮合胃苓汤治水湿浸渍，疏凿饮子治湿热壅盛，济生肾气丸合真武汤治肾阳衰微。故取实脾饮。","tags":["高频"]},{"id":"LC-NK-0075","type":"A2","group":null,"topic":"癃闭-肾阳衰惫","difficulty":2,"stem":"患者，男，72 岁。小便不通，排出无力，面色白，神疲乏力，畏寒肢冷，腰膝酸软，舌淡苔白，脉沉细弱。其代表方是","options":{"A":"八正散","B":"清肺饮","C":"沉香散","D":"代抵当丸","E":"济生肾气丸"},"answer":"E","explain":"小便不通、排出无力、畏寒肢冷、腰膝酸软、脉沉细弱，为肾阳衰惫、气化无权之癃闭，方用济生肾气丸。八正散治膀胱湿热，清肺饮治肺热壅盛，沉香散治肝郁气滞，代抵当丸治浊瘀阻塞。故取济生肾气丸。","tags":["高频"]},{"id":"LC-NK-0076","type":"A2","group":null,"topic":"阳痿-湿热下注","difficulty":1,"stem":"患者，男，38 岁。阴茎痿软，阴囊潮湿，瘙痒腥臭，小便黄赤，口苦，舌红苔黄腻，脉滑数。其代表方是","options":{"A":"赞育丸","B":"归脾汤","C":"逍遥散","D":"启阳娱心丹","E":"龙胆泻肝汤"},"answer":"E","explain":"阴囊潮湿瘙痒、尿黄口苦、苔黄腻脉滑数，为湿热下注之阳痿，方用龙胆泻肝汤。赞育丸治命门火衰，归脾汤治心脾亏虚，逍遥散治肝郁不舒，启阳娱心丹治惊恐伤肾。故取龙胆泻肝汤。","tags":["鉴别"]},{"id":"LC-NK-0077","type":"A2","group":null,"topic":"郁证-心神失养","difficulty":1,"stem":"患者，女，28 岁。精神恍惚，心神不宁，悲忧善哭，时时欠伸，舌淡苔薄白，脉弦细。其代表方是","options":{"A":"柴胡疏肝散","B":"丹栀逍遥散","C":"半夏厚朴汤","D":"甘麦大枣汤","E":"天王补心丹"},"answer":"D","explain":"精神恍惚、心神不宁、悲忧善哭、时时欠伸，为心神失养之郁证脏躁，方用甘麦大枣汤。柴胡疏肝散治肝气郁结，丹栀逍遥散治气郁化火，半夏厚朴汤治痰气郁结，天王补心丹治心肾阴虚。故取甘麦大枣汤。","tags":["高频"]},{"id":"LC-NK-0078","type":"A2","group":null,"topic":"血证-便血肠道湿热","difficulty":2,"stem":"患者，男，42 岁。便血鲜红，大便不畅，腹痛，口苦，舌红苔黄腻，脉濡数。其代表方是","options":{"A":"桑菊饮","B":"地榆散合槐角丸","C":"归脾汤","D":"黄土汤","E":"小蓟饮子"},"answer":"B","explain":"便血鲜红、大便不畅、口苦、苔黄腻脉濡数，为肠道湿热之便血，方用地榆散合槐角丸。桑菊饮治鼻衄热邪犯肺，归脾汤治气虚不摄，黄土汤治脾胃虚寒，小蓟饮子治尿血下焦湿热。故取地榆散合槐角丸。","tags":["高频"]},{"id":"LC-NK-0079","type":"A2","group":null,"topic":"痰饮-悬饮饮停胸胁","difficulty":2,"stem":"患者，男，46 岁。胸胁疼痛，咳唾引痛，呼吸困难，咳逆气喘不能平卧，苔白腻，脉沉弦。其代表方是","options":{"A":"柴枳半夏汤","B":"椒目瓜蒌汤合十枣汤","C":"香附旋覆花汤","D":"沙参麦冬汤","E":"小青龙汤"},"answer":"B","explain":"胸胁疼痛咳唾引痛、呼吸困难不能平卧、脉沉弦，为悬饮饮停胸胁，治当泻肺祛饮，方用椒目瓜蒌汤合十枣汤或控涎丹。柴枳半夏汤治邪犯胸肺，香附旋覆花汤治络气不和，沙参麦冬汤治阴虚内热。故取椒目瓜蒌汤合十枣汤。","tags":["鉴别"]},{"id":"LC-NK-0080","type":"A2","group":null,"topic":"消渴-中消胃热炽盛","difficulty":1,"stem":"患者，男，48 岁。多食易饥，口渴，尿多，形体消瘦，大便干燥，苔黄，脉滑实有力。其代表方是","options":{"A":"消渴方","B":"玉女煎","C":"七味白术散","D":"六味地黄丸","E":"金匮肾气丸"},"answer":"B","explain":"多食易饥、口渴尿多、形瘦便干、苔黄脉滑实，为胃热炽盛之中消，方用玉女煎。消渴方治上消肺热津伤，七味白术散治气阴亏虚，六味地黄丸治下消肾阴亏虚，金匮肾气丸治阴阳两虚。故取玉女煎。","tags":["高频"]},{"id":"LC-NK-0081","type":"B1","group":"NK-B1-001","group_stem":"A.藿香正气散　B.葛根芩连汤　C.保和丸　D.痛泻要方　E.四神丸","topic":"泄泻-证型方剂","difficulty":1,"stem":"寒湿内盛之泄泻的代表方是","options":{"A":"藿香正气散","B":"葛根芩连汤","C":"保和丸","D":"痛泻要方","E":"四神丸"},"answer":"A","explain":"寒湿内盛治当芳香化湿、解表散寒，方用藿香正气散。葛根芩连汤治湿热伤中，保和丸治食滞肠胃，痛泻要方治肝气乘脾，四神丸治肾阳虚衰。故取藿香正气散。","tags":["高频"]},{"id":"LC-NK-0082","type":"B1","group":"NK-B1-001","group_stem":"A.藿香正气散　B.葛根芩连汤　C.保和丸　D.痛泻要方　E.四神丸","topic":"泄泻-证型方剂","difficulty":2,"stem":"湿热伤中之泄泻的代表方是","options":{"A":"藿香正气散","B":"葛根芩连汤","C":"保和丸","D":"痛泻要方","E":"四神丸"},"answer":"B","explain":"湿热伤中治当清热利湿、分利止泻，方用葛根芩连汤。藿香正气散治寒湿内盛，保和丸治食滞肠胃，痛泻要方治肝气乘脾。故取葛根芩连汤。","tags":["高频"]},{"id":"LC-NK-0083","type":"B1","group":"NK-B1-001","group_stem":"A.藿香正气散　B.葛根芩连汤　C.保和丸　D.痛泻要方　E.四神丸","topic":"泄泻-证型方剂","difficulty":2,"stem":"肝气乘脾之泄泻的代表方是","options":{"A":"藿香正气散","B":"葛根芩连汤","C":"保和丸","D":"痛泻要方","E":"四神丸"},"answer":"D","explain":"肝气乘脾治当抑肝扶脾，方用痛泻要方，症见腹痛肠鸣、泻后痛减、每因情志而发。保和丸治食滞肠胃，四神丸治肾阳虚衰之五更泻。故取痛泻要方。","tags":["高频","鉴别"]},{"id":"LC-NK-0084","type":"B1","group":"NK-B1-001","group_stem":"A.藿香正气散　B.葛根芩连汤　C.保和丸　D.痛泻要方　E.四神丸","topic":"泄泻-证型方剂","difficulty":2,"stem":"肾阳虚衰之泄泻的代表方是","options":{"A":"藿香正气散","B":"葛根芩连汤","C":"保和丸","D":"痛泻要方","E":"四神丸"},"answer":"E","explain":"肾阳虚衰治当温肾健脾、固涩止泻，方用四神丸，多见黎明前脐腹作痛、完谷不化、形寒肢冷。痛泻要方治肝气乘脾，葛根芩连汤治湿热。故取四神丸。","tags":["高频"]},{"id":"LC-NK-0085","type":"B1","group":"NK-B1-002","group_stem":"A.天麻钩藤饮　B.半夏白术天麻汤　C.通窍活血汤　D.归脾汤　E.左归丸","topic":"眩晕-证型方剂","difficulty":1,"stem":"肝阳上亢之眩晕的代表方是","options":{"A":"天麻钩藤饮","B":"半夏白术天麻汤","C":"通窍活血汤","D":"归脾汤","E":"左归丸"},"answer":"A","explain":"肝阳上亢治当平肝潜阳、清火熄风，方用天麻钩藤饮。半夏白术天麻汤治痰湿中阻，通窍活血汤治瘀血阻窍，归脾汤治气血亏虚，左归丸治肾精不足。故取天麻钩藤饮。","tags":["高频"]},{"id":"LC-NK-0086","type":"B1","group":"NK-B1-002","group_stem":"A.天麻钩藤饮　B.半夏白术天麻汤　C.通窍活血汤　D.归脾汤　E.左归丸","topic":"眩晕-证型方剂","difficulty":1,"stem":"痰湿中阻之眩晕的代表方是","options":{"A":"天麻钩藤饮","B":"半夏白术天麻汤","C":"通窍活血汤","D":"归脾汤","E":"左归丸"},"answer":"B","explain":"痰湿中阻治当化痰祛湿、健脾和胃，方用半夏白术天麻汤。天麻钩藤饮治肝阳上亢，通窍活血汤治瘀血阻窍，归脾汤治气血亏虚。故取半夏白术天麻汤。","tags":["高频"]},{"id":"LC-NK-0087","type":"B1","group":"NK-B1-002","group_stem":"A.天麻钩藤饮　B.半夏白术天麻汤　C.通窍活血汤　D.归脾汤　E.左归丸","topic":"眩晕-证型方剂","difficulty":2,"stem":"瘀血阻窍之眩晕的代表方是","options":{"A":"天麻钩藤饮","B":"半夏白术天麻汤","C":"通窍活血汤","D":"归脾汤","E":"左归丸"},"answer":"C","explain":"瘀血阻窍治当祛瘀生新、活血通窍，方用通窍活血汤，症见眩晕头痛、痛处固定、舌紫暗有瘀斑。天麻钩藤饮治肝阳，归脾汤治气血亏虚。故取通窍活血汤。","tags":["鉴别"]},{"id":"LC-NK-0088","type":"B1","group":"NK-B1-002","group_stem":"A.天麻钩藤饮　B.半夏白术天麻汤　C.通窍活血汤　D.归脾汤　E.左归丸","topic":"眩晕-证型方剂","difficulty":3,"stem":"肾精不足之眩晕的代表方是","options":{"A":"天麻钩藤饮","B":"半夏白术天麻汤","C":"通窍活血汤","D":"归脾汤","E":"左归丸"},"answer":"E","explain":"肾精不足治当滋养肝肾、益精填髓，方用左归丸，症见眩晕日久、腰酸耳鸣、齿摇发落。归脾汤治气血亏虚之眩晕，二者需据肾虚证候鉴别。故取左归丸。","tags":["鉴别"]},{"id":"LC-NK-0089","type":"B1","group":"NK-B1-003","group_stem":"A.八正散　B.石韦散　C.小蓟饮子　D.沉香散　E.程氏萆薢分清饮","topic":"淋证-证型方剂","difficulty":1,"stem":"热淋的代表方是","options":{"A":"八正散","B":"石韦散","C":"小蓟饮子","D":"沉香散","E":"程氏萆薢分清饮"},"answer":"A","explain":"热淋治当清热利湿通淋，方用八正散，症见小便频数短涩、灼热刺痛、尿色黄赤。石韦散治石淋，小蓟饮子治血淋，沉香散治气淋，程氏萆薢分清饮治膏淋。故取八正散。","tags":["高频"]},{"id":"LC-NK-0090","type":"B1","group":"NK-B1-003","group_stem":"A.八正散　B.石韦散　C.小蓟饮子　D.沉香散　E.程氏萆薢分清饮","topic":"淋证-证型方剂","difficulty":2,"stem":"石淋的代表方是","options":{"A":"八正散","B":"石韦散","C":"小蓟饮子","D":"沉香散","E":"程氏萆薢分清饮"},"answer":"B","explain":"石淋治当清热利湿、排石通淋，方用石韦散，症见小便艰涩、尿中夹砂石、排尿时突然中断。八正散治热淋，小蓟饮子治血淋。故取石韦散。","tags":["高频"]},{"id":"LC-NK-0091","type":"B1","group":"NK-B1-003","group_stem":"A.八正散　B.石韦散　C.小蓟饮子　D.沉香散　E.程氏萆薢分清饮","topic":"淋证-证型方剂","difficulty":2,"stem":"血淋的代表方是","options":{"A":"八正散","B":"石韦散","C":"小蓟饮子","D":"沉香散","E":"程氏萆薢分清饮"},"answer":"C","explain":"血淋治当清热通淋、凉血止血，方用小蓟饮子，症见小便热涩刺痛、尿中带血。八正散治热淋而无尿血，石韦散治石淋。故取小蓟饮子。","tags":["鉴别"]},{"id":"LC-NK-0092","type":"B1","group":"NK-B1-003","group_stem":"A.八正散　B.石韦散　C.小蓟饮子　D.沉香散　E.程氏萆薢分清饮","topic":"淋证-证型方剂","difficulty":3,"stem":"膏淋的代表方是","options":{"A":"八正散","B":"石韦散","C":"小蓟饮子","D":"沉香散","E":"程氏萆薢分清饮"},"answer":"E","explain":"膏淋治当清热利湿、分清泄浊，方用程氏萆薢分清饮，症见小便浑浊如米泔水、置之沉淀如絮状。小蓟饮子治血淋，沉香散治气淋。故取程氏萆薢分清饮。","tags":["鉴别"]},{"id":"LC-NK-0093","type":"B1","group":"NK-B1-004","group_stem":"A.防风汤　B.乌头汤　C.薏苡仁汤　D.白虎加桂枝汤　E.独活寄生汤","topic":"痹证-证型方剂","difficulty":2,"stem":"行痹的代表方是","options":{"A":"防风汤","B":"乌头汤","C":"薏苡仁汤","D":"白虎加桂枝汤","E":"独活寄生汤"},"answer":"A","explain":"行痹为风邪偏胜，治当祛风通络、散寒除湿，方用防风汤，症见肢体关节疼痛游走不定。乌头汤治痛痹，薏苡仁汤治着痹，白虎加桂枝汤治风湿热痹。故取防风汤。","tags":["高频"]},{"id":"LC-NK-0094","type":"B1","group":"NK-B1-004","group_stem":"A.防风汤　B.乌头汤　C.薏苡仁汤　D.白虎加桂枝汤　E.独活寄生汤","topic":"痹证-证型方剂","difficulty":2,"stem":"痛痹的代表方是","options":{"A":"防风汤","B":"乌头汤","C":"薏苡仁汤","D":"白虎加桂枝汤","E":"独活寄生汤"},"answer":"B","explain":"痛痹为寒邪偏胜，治当散寒通络、祛风除湿，方用乌头汤，症见疼痛剧烈、痛有定处、遇寒加重。防风汤治行痹，薏苡仁汤治着痹。故取乌头汤。","tags":["高频"]},{"id":"LC-NK-0095","type":"B1","group":"NK-B1-004","group_stem":"A.防风汤　B.乌头汤　C.薏苡仁汤　D.白虎加桂枝汤　E.独活寄生汤","topic":"痹证-证型方剂","difficulty":2,"stem":"着痹的代表方是","options":{"A":"防风汤","B":"乌头汤","C":"薏苡仁汤","D":"白虎加桂枝汤","E":"独活寄生汤"},"answer":"C","explain":"着痹为湿邪偏胜，治当除湿通络、祛风散寒，方用薏苡仁汤，症见关节重着、酸痛、肿胀散漫。防风汤治行痹，乌头汤治痛痹。故取薏苡仁汤。","tags":["高频"]},{"id":"LC-NK-0096","type":"B1","group":"NK-B1-004","group_stem":"A.防风汤　B.乌头汤　C.薏苡仁汤　D.白虎加桂枝汤　E.独活寄生汤","topic":"痹证-证型方剂","difficulty":3,"stem":"风湿热痹的代表方是","options":{"A":"防风汤","B":"乌头汤","C":"薏苡仁汤","D":"白虎加桂枝汤","E":"独活寄生汤"},"answer":"D","explain":"风湿热痹治当清热通络、祛风除湿，方用白虎加桂枝汤合宣痹汤，症见关节红肿灼热、疼痛剧烈、得冷则舒。独活寄生汤治肝肾亏虚之痹证。故取白虎加桂枝汤。","tags":["鉴别"]},{"id":"LC-NK-0097","type":"B1","group":"NK-B1-005","group_stem":"A.玉屏风散　B.归脾汤　C.当归六黄汤　D.龙胆泻肝汤　E.清骨散","topic":"自汗盗汗-证型方剂","difficulty":1,"stem":"肺卫不固之自汗的代表方是","options":{"A":"玉屏风散","B":"归脾汤","C":"当归六黄汤","D":"龙胆泻肝汤","E":"清骨散"},"answer":"A","explain":"肺卫不固治当益气固表，方用玉屏风散，症见汗出恶风、易感风邪、体倦乏力。归脾汤治心血不足，当归六黄汤治阴虚火旺，龙胆泻肝汤治邪热郁蒸。故取玉屏风散。","tags":["高频"]},{"id":"LC-NK-0098","type":"B1","group":"NK-B1-005","group_stem":"A.玉屏风散　B.归脾汤　C.当归六黄汤　D.龙胆泻肝汤　E.清骨散","topic":"自汗盗汗-证型方剂","difficulty":2,"stem":"心血不足之自汗盗汗的代表方是","options":{"A":"玉屏风散","B":"归脾汤","C":"当归六黄汤","D":"龙胆泻肝汤","E":"清骨散"},"answer":"B","explain":"心血不足治当补血养心、益气固表，方用归脾汤，症见自汗或盗汗、心悸少寐、面色无华。玉屏风散治肺卫不固，当归六黄汤治阴虚火旺。故取归脾汤。","tags":["高频"]},{"id":"LC-NK-0099","type":"B1","group":"NK-B1-005","group_stem":"A.玉屏风散　B.归脾汤　C.当归六黄汤　D.龙胆泻肝汤　E.清骨散","topic":"自汗盗汗-证型方剂","difficulty":2,"stem":"阴虚火旺之盗汗的代表方是","options":{"A":"玉屏风散","B":"归脾汤","C":"当归六黄汤","D":"龙胆泻肝汤","E":"清骨散"},"answer":"C","explain":"阴虚火旺治当滋阴降火、固表止汗，方用当归六黄汤，症见夜寐盗汗、五心烦热、颧红口干。玉屏风散治肺卫不固，龙胆泻肝汤治邪热郁蒸。故取当归六黄汤。","tags":["高频"]},{"id":"LC-NK-0100","type":"B1","group":"NK-B1-005","group_stem":"A.玉屏风散　B.归脾汤　C.当归六黄汤　D.龙胆泻肝汤　E.清骨散","topic":"内伤发热-阴虚发热","difficulty":2,"stem":"阴虚发热之内伤发热的代表方是","options":{"A":"玉屏风散","B":"归脾汤","C":"当归六黄汤","D":"龙胆泻肝汤","E":"清骨散"},"answer":"E","explain":"阴虚发热治当滋阴清热，方用清骨散，症见午后潮热、手足心热、盗汗、舌红少苔。当归六黄汤亦治阴虚火旺但偏于汗证，归脾汤治血虚发热。故取清骨散。","tags":["鉴别"]}]},{"meta":{"bank_id":"linchuang-waike","title":"中医外科学","paper":"linchuang","subject":"中医外科学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":45,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"LC-WK-0001","type":"A1","group":null,"topic":"总论-阴阳辨证","difficulty":2,"stem":"外科疮疡辨证中，属于阴证表现的是","options":{"A":"疮色红活焮赤","B":"肿势高突根束","C":"疼痛剧烈拒按","D":"脓液稠厚色黄","E":"溃后脓水清稀"},"answer":"E","explain":"阴证疮疡色泽晦暗、肿势平坦或下陷、疼痛较缓、脓液稀薄、溃后脓水清稀而病程长。A、B、C、D 均为阳证表现，提示热毒壅盛而正气尚充。故选 E。","tags":["鉴别","高频"]},{"id":"LC-WK-0002","type":"A1","group":null,"topic":"总论-部位辨证","difficulty":2,"stem":"发生于人体下部的疮疡，其常见病因是","options":{"A":"风温、风热","B":"气郁、火郁","C":"湿热、寒湿","D":"燥邪、暑邪","E":"痰浊、食积"},"answer":"C","explain":"部位辨证认为发于上部多风温风热，发于中部多气郁火郁，发于下部多湿热寒湿。下部地势低洼，湿性重浊趋下，故湿邪为患最多。A 属上部，B 属中部，D、E 非其对应病因。","tags":["高频"]},{"id":"LC-WK-0003","type":"A1","group":null,"topic":"总论-辨肿","difficulty":2,"stem":"肿而宣浮，不红不热，善走注而游移不定者，其肿属","options":{"A":"热肿","B":"寒肿","C":"风肿","D":"痰肿","E":"气肿"},"answer":"C","explain":"风性善行数变，故风肿宣浮、不红不热、走注游移、来去迅速。热肿色红焮热；寒肿皮色青暗、得温则舒；痰肿软如棉硬如馒；气肿皮紧内软、随喜怒消长。","tags":["鉴别"]},{"id":"LC-WK-0004","type":"A1","group":null,"topic":"总论-辨脓","difficulty":2,"stem":"外科辨脓，属佳象的脓液表现是","options":{"A":"稀薄如水","B":"色泽污浊","C":"腥秽恶臭","D":"稠厚明净微腥","E":"夹败絮样物"},"answer":"D","explain":"脓为气血所化，稠厚、明净、略带腥味者示气血充足、正能抗邪，为佳象。A、B、C、E 均为脓水稀薄污浊、腥秽恶臭或夹败絮，提示正虚毒陷，预后较差。","tags":["高频"]},{"id":"LC-WK-0005","type":"A1","group":null,"topic":"总论-内治三法","difficulty":1,"stem":"疮疡初起，肿疡尚未成脓者，内治宜首选","options":{"A":"消法","B":"托法","C":"补法","D":"温法","E":"汗法"},"answer":"A","explain":"消法是用消散之药使初起肿疡得以消散，适用于疮疡初期未成脓者。托法用于中期正虚毒盛、脓成难溃；补法用于溃疡后期气血不足、新肉不生。温法、汗法不属外科内治三法。","tags":["高频"]},{"id":"LC-WK-0006","type":"A1","group":null,"topic":"疮疡-疖","difficulty":1,"stem":"暑疖的好发季节与人群是","options":{"A":"冬春季，老年人","B":"夏秋季，儿童","C":"春夏季，孕妇","D":"秋冬季，青壮年","E":"四季皆发，无年龄差异"},"answer":"B","explain":"暑疖发于夏秋季节，以儿童及新产妇多见，因暑湿热毒蕴蒸肌肤而成，红肿热痛较著。冬春季节、老年人、孕妇均非其好发特点，四季均发亦不符合暑疖的时令属性。","tags":[]},{"id":"LC-WK-0007","type":"A1","group":null,"topic":"疮疡-手足疔","difficulty":2,"stem":"生于手指末节，肿如蛇头，疼痛连心者，称为","options":{"A":"蛇眼疔","B":"蛇头疔","C":"蛇腹疔","D":"红丝疔","E":"托盘疔"},"answer":"B","explain":"蛇头疔生于手指末端，肿形如蛇头，疼痛剧烈，易损筋骨。蛇眼疔生于指甲边缘；蛇腹疔生于指腹；红丝疔为红丝上窜；托盘疔生于掌心。四者部位形态各异。","tags":["鉴别"]},{"id":"LC-WK-0008","type":"A1","group":null,"topic":"疮疡-丹毒","difficulty":1,"stem":"丹毒的典型皮损特点是","options":{"A":"色如涂丹，边界清楚，灼热肿胀","B":"苍白水肿，边界不清，按之凹陷","C":"紫暗瘀斑，压之不退，无灼热","D":"丘疹密集，夜间奇痒，抓破渗液","E":"水疱成簇，带状分布，刺痛灼痛"},"answer":"A","explain":"丹毒起病急骤，患处皮肤突然鲜红成片、色如涂丹、边缘清楚、稍高出皮面、灼热肿胀，压之褪色、放手即复。B 见于水肿；C 见于紫癜；D 见于湿疮等瘙痒性皮肤病；E 为蛇串疮表现。","tags":["高频","鉴别"]},{"id":"LC-WK-0009","type":"A1","group":null,"topic":"疮疡-有头疽","difficulty":3,"stem":"有头疽后期，疮面腐烂，脓水稀薄，新肉不生，伴神疲乏力、面色苍白者，属","options":{"A":"火陷","B":"干陷","C":"虚陷","D":"走黄","E":"内闭"},"answer":"C","explain":"有头疽内陷分火陷、干陷、虚陷。虚陷见于溃后期，正虚毒恋，故疮面腐烂、脓水稀薄、新肉不生而全身虚衰。火陷多见于初期，毒盛入营；干陷多见于溃脓期，脓腐不透；走黄为疔疮毒邪走散，与内陷不同。","tags":["易错","经典"]},{"id":"LC-WK-0010","type":"A1","group":null,"topic":"乳房疾病-乳痈","difficulty":1,"stem":"乳痈最多见于","options":{"A":"青春期少女","B":"哺乳期妇女，尤以初产妇多见","C":"绝经期妇女","D":"妊娠早期妇女","E":"老年妇女"},"answer":"B","explain":"乳痈即急性乳腺炎，多见于产后哺乳期妇女，尤以初产妇常见，多因乳汁淤积、肝胃郁热或乳头破损染毒而发。青春期少女、绝经期、妊娠早期及老年妇女均非好发人群。","tags":["高频"]},{"id":"LC-WK-0011","type":"A1","group":null,"topic":"乳房疾病-乳癖","difficulty":2,"stem":"乳癖肿块的特点是","options":{"A":"坚硬如石，推之不移","B":"边界不清，随月经消长","C":"红肿热痛，触之有波动","D":"单发光滑，活动度大","E":"乳头溢血，橘皮样变"},"answer":"B","explain":"乳癖即乳腺增生病，肿块多双侧多发、形态不一、边界不清、质地不硬、推之可动，大小与胀痛随月经周期消长。A、E 见于乳岩；C 为乳痈成脓；D 多见于乳核。","tags":["鉴别","高频"]},{"id":"LC-WK-0012","type":"A1","group":null,"topic":"皮肤病-蛇串疮","difficulty":1,"stem":"蛇串疮的皮损分布特征是","options":{"A":"沿一侧周围神经呈带状分布","B":"对称分布于四肢伸侧","C":"泛发全身，分批出现","D":"仅见于口周黏膜","E":"由躯干向四肢蔓延"},"answer":"A","explain":"蛇串疮即带状疱疹，皮损为成簇水疱，沿一侧周围神经呈带状排列，多不超过正中线，伴明显神经痛。B 多见于湿疮；C 见于水痘、药毒；D 为单纯疱疹好发部位；E 非其分布规律。","tags":["高频"]},{"id":"LC-WK-0013","type":"A1","group":null,"topic":"皮肤病-白疕","difficulty":1,"stem":"白疕刮去鳞屑后可见的典型征象是","options":{"A":"薄膜现象与点状出血","B":"环状红晕与领圈状脱屑","C":"脓疱密集与黄痂","D":"靶形红斑与中心水疱","E":"同形反应与线状排列"},"answer":"A","explain":"白疕即银屑病，皮损为红斑上覆多层干燥银白色鳞屑，刮去鳞屑见淡红色半透明薄膜，再刮则见点状出血，为诊断的重要依据。B 见于玫瑰糠疹；C 见于脓疱型皮肤病；D 见于多形红斑；E 见于扁平疣。","tags":["经典","高频"]},{"id":"LC-WK-0014","type":"A1","group":null,"topic":"肛肠病-内痔","difficulty":2,"stem":"内痔痔核脱出，不能自行回纳，需用手托回，其分期为","options":{"A":"Ⅰ期","B":"Ⅱ期","C":"Ⅲ期","D":"Ⅳ期","E":"混合痔"},"answer":"C","explain":"内痔分期以脱出程度为要：Ⅰ期便血无脱出；Ⅱ期便时脱出、便后自回；Ⅲ期脱出后不能自回，须手托回纳；Ⅳ期脱出不能回纳或回纳即脱。混合痔为内外痔并存，不是分期名称。","tags":["高频"]},{"id":"LC-WK-0015","type":"A1","group":null,"topic":"肛肠病-肛裂","difficulty":2,"stem":"肛裂的疼痛特点是","options":{"A":"持续性隐痛，便后减轻","B":"周期性疼痛，便后加剧数小时","C":"阵发性绞痛，与排便无关","D":"灼痛，遇热加重","E":"坠胀痛，久立加重"},"answer":"B","explain":"肛裂疼痛呈周期性：排便时裂口受刺激而灼痛，便后短暂缓解，随即因括约肌痉挛而持续剧痛数小时。A 不符合其发作规律；C 见于肠道痉挛；D 见于湿热证皮肤病；E 见于痔脱出嵌顿或肛周感染。","tags":["高频","鉴别"]},{"id":"LC-WK-0016","type":"A1","group":null,"topic":"泌尿男科-精癃","difficulty":1,"stem":"精癃最早出现、最常见的症状是","options":{"A":"尿频，尤以夜尿增多","B":"尿痛伴肉眼血尿","C":"阴茎异常勃起","D":"阴囊潮湿瘙痒","E":"睾丸坠胀疼痛"},"answer":"A","explain":"精癃即前列腺增生，起病隐匿，最早出现尿频，尤以夜间为著，继而排尿困难、尿线变细、尿后余沥。尿痛血尿多见于淋证或结石；阴囊潮湿瘙痒、睾丸坠胀多属湿热下注，均非本病首发。","tags":[]},{"id":"LC-WK-0017","type":"A1","group":null,"topic":"周围血管病-脱疽","difficulty":1,"stem":"脱疽的好发部位与人群是","options":{"A":"四肢末端，下肢多见，青壮年男性","B":"头面部，老年人多见","C":"躯干部，肥胖者多见","D":"上肢末端，女性多见","E":"肛周，久坐者多见"},"answer":"A","explain":"脱疽好发于四肢末端，尤以下肢为多，多见于青壮年男性，因寒湿外袭、血脉瘀阻而致肢端缺血。B、C、D、E 均非其典型好发部位与人群。","tags":["高频"]},{"id":"LC-WK-0018","type":"A1","group":null,"topic":"其他-烧伤","difficulty":3,"stem":"按中国九分法，成人双下肢（含臀部）的体表面积为","options":{"A":"9%","B":"18%","C":"27%","D":"46%","E":"45%"},"answer":"D","explain":"中国九分法中头颈部占 9%、双上肢占 18%、躯干占 27%、双下肢含臀部占 46%，其中双臀 5%、双大腿 21%、双小腿 13%、双足 7%。A 为头颈，B 为双上肢，C 为躯干；E 为女性因臀大足小调整后的数值，不用于成人通用计算。","tags":["计算","易错"]},{"id":"LC-WK-0019","type":"A2","group":null,"topic":"疮疡-有头疽","difficulty":3,"stem":"患者，男，65 岁。项后红肿结块 10 天，疮形平塌，疮色紫滞，脓水稀少，疮口散漫，伴壮热口渴、神昏谵语，舌红绛，苔黄燥，脉洪数。其证型是","options":{"A":"火陷证","B":"干陷证","C":"虚陷证","D":"走黄证","E":"内闭外脱证"},"answer":"A","explain":"有头疽火陷见于初起一二周，正不胜邪、毒邪内陷入营，故疮顶不高、根盘散漫、疮色紫滞、脓少干枯，兼壮热神昏、舌红绛脉洪数。干陷见于溃脓期，以脓腐不透为主；虚陷见于溃后期，以脓水稀薄、新肉不生为主；走黄为疔疮毒散，不属有头疽内陷分型。","tags":["易错","经典"]},{"id":"LC-WK-0020","type":"A2","group":null,"topic":"疮疡-走黄","difficulty":3,"stem":"患者，女，38 岁。面部疔疮 5 天，自行挤压后肿势扩散，伴寒战高热、烦躁不安、皮肤瘀点瘀斑，舌红绛，苔黄，脉洪数。其治法是","options":{"A":"凉血清热解毒","B":"辛温解表散寒","C":"托里透脓解毒","D":"补益气血生肌","E":"温阳散寒通脉"},"answer":"A","explain":"颜面疔疮挤压后毒邪走散入营血发为走黄，症见肿势蔓延、寒战高热、烦躁神昏、皮肤瘀斑，治当凉血清热解毒。B 用于风寒外束；C 用于中期正虚毒盛难溃；D 用于后期气血两虚；E 用于阴寒之证。","tags":["经典","易错"]},{"id":"LC-WK-0021","type":"A2","group":null,"topic":"疮疡-丹毒","difficulty":2,"stem":"患者，男，55 岁。左小腿突然红肿成片，色如涂丹，边界清楚，灼热疼痛，伴恶寒发热、口渴，舌红，苔黄腻，脉滑数。其治法是","options":{"A":"清热利湿解毒","B":"温经散寒通络","C":"疏肝理气化痰","D":"益气养血托毒","E":"活血化瘀止痛"},"answer":"A","explain":"下肢丹毒由湿热下注、火毒蕴结肌肤而成，故患肢红赤成片、灼热肿胀、边界清楚，兼苔黄腻脉滑数，治当清热利湿解毒。B 用于寒湿痹阻；C 用于肝郁痰凝之乳癖；D 用于溃疡后期气血不足；E 未针对湿热火毒之本。","tags":["高频"]},{"id":"LC-WK-0022","type":"A2","group":null,"topic":"乳房疾病-乳痈","difficulty":2,"stem":"患者，女，26 岁。产后 3 周，右乳外上象限结块疼痛 2 天，乳汁排出不畅，皮色微红，伴恶寒发热、胸闷不舒，舌淡红，苔薄白，脉浮数。其代表方是","options":{"A":"瓜蒌牛蒡汤","B":"透脓散","C":"托里消毒散","D":"逍遥蒌贝散","E":"二仙汤"},"answer":"A","explain":"乳痈初期为气滞热壅证，乳汁淤积、肝胃郁热而致乳房结块疼痛、排乳不畅，治当疏肝清胃、通乳消肿，方用瓜蒌牛蒡汤。B 用于脓成未溃；C 用于溃后正虚毒恋；D 用于乳癖肝郁痰凝；E 用于冲任失调之乳癖。","tags":["高频"]},{"id":"LC-WK-0023","type":"A2","group":null,"topic":"乳房疾病-乳痈","difficulty":2,"stem":"患者，女，29 岁。产后 5 周，左乳肿块增大 5 天，疼痛剧烈，皮色焮红，按之有波动感，壮热不退，舌红，苔黄，脉洪数。其治法是","options":{"A":"疏肝清胃、通乳消肿","B":"清热解毒、托里透脓","C":"温阳散寒、化痰散结","D":"补益气血、生肌收口","E":"疏肝解郁、化痰软坚"},"answer":"B","explain":"乳痈成脓期为热毒炽盛证，肿块增大、焮红剧痛、按之应指有波动，伴壮热，治当清热解毒、托里透脓，方用透脓散加味，并宜及时切开排脓。A 用于初期；C 用于阴证疮疡；D 用于溃疡后期；E 用于乳癖。","tags":["高频"]},{"id":"LC-WK-0024","type":"A2","group":null,"topic":"乳房疾病-乳癖","difficulty":2,"stem":"患者，女，35 岁。双侧乳房胀痛伴肿块 1 年，经前加重、经后减轻，伴心烦易怒、月经先后不定，舌淡红，苔薄白，脉弦。其证型是","options":{"A":"肝郁痰凝证","B":"冲任失调证","C":"气滞血瘀证","D":"热毒炽盛证","E":"气血两虚证"},"answer":"A","explain":"乳癖肝郁痰凝证多见于青壮年，肿块随情志与月经周期消长，兼心烦易怒、胸闷胁胀、脉弦，治以疏肝解郁、化痰散结，方用逍遥蒌贝散。B 多见于中年以上、伴腰膝酸软者；C 以刺痛固定为特点；D 见于乳痈；E 见于虚证。","tags":["高频"]},{"id":"LC-WK-0025","type":"A2","group":null,"topic":"皮肤病-瘾疹","difficulty":2,"stem":"患者，女，24 岁。全身起风团 3 天，色鲜红，遇热加重，瘙痒剧烈，伴发热、咽喉肿痛，舌红，苔薄黄，脉浮数。其治法是","options":{"A":"疏风清热止痒","B":"疏风散寒止痒","C":"清热利湿解毒","D":"养血润燥止痒","E":"清泻肝胆湿热"},"answer":"A","explain":"瘾疹风热犯表证因风热客于肌肤、营卫不和而致，风团色鲜红、遇热加重、瘙痒剧烈，兼发热咽痛，治当疏风清热止痒，方用消风散。B 用于风寒束表之风团色白、遇冷加重；C 用于湿疮；D 用于血虚风燥；E 用于蛇串疮肝经郁热。","tags":["高频"]},{"id":"LC-WK-0026","type":"A2","group":null,"topic":"皮肤病-湿疮","difficulty":2,"stem":"患者，女，31 岁。双前臂皮损潮红、水疱密集，抓破后糜烂渗液，剧痒难忍，伴心烦口渴，舌红，苔黄腻，脉滑数。其证型是","options":{"A":"湿热浸淫证","B":"脾虚湿蕴证","C":"血虚风燥证","D":"风热蕴肤证","E":"气滞血瘀证"},"answer":"A","explain":"湿疮湿热浸淫证起病急，皮损潮红、水疱糜烂渗液、瘙痒剧烈，兼心烦口渴、苔黄腻脉滑数。B 起病缓、皮损暗淡、渗液不多、纳差便溏；C 见慢性期皮损肥厚干燥脱屑；D 以红斑丘疹、遇风加重为主；E 见皮损色暗、结节疼痛。","tags":["高频","鉴别"]},{"id":"LC-WK-0027","type":"A2","group":null,"topic":"皮肤病-接触性皮炎","difficulty":1,"stem":"患者，女，29 岁。染发后 2 天，前额及头皮皮肤潮红肿胀、起水疱，边界清楚，局限于接触部位，瘙痒剧烈，舌红，苔薄黄，脉浮数。其诊断是","options":{"A":"接触性皮炎","B":"湿疮","C":"药毒","D":"蛇串疮","E":"瘾疹"},"answer":"A","explain":"接触性皮炎有明确接触史，皮损局限于接触部位且边界清楚，去除接触物后较快消退。B 湿疮多对称泛发、边界不清、易反复；C 药毒有用药史、多对称泛发、全身症状重；D 蛇串疮沿神经带状分布伴神经痛；E 瘾疹为风团、时起时消。","tags":["鉴别"]},{"id":"LC-WK-0028","type":"A2","group":null,"topic":"肛肠病-肛痈","difficulty":2,"stem":"患者，男，42 岁。肛门左侧红肿热痛 3 天，痛势持续加剧，夜不能寐，伴恶寒发热、大便干结，舌红，苔黄，脉弦滑数。其治法是","options":{"A":"清热解毒、消肿止痛","B":"温经散寒、活血通络","C":"补中益气、升阳举陷","D":"清热凉血、润肠通便","E":"滋阴清热、软坚散结"},"answer":"A","explain":"肛痈火毒蕴结证因湿热火毒蕴阻肛门而致，症见肛周红肿热痛、持续加剧、伴恶寒发热，治当清热解毒、消肿止痛，方用仙方活命饮，脓成宜及早切开引流。B 用于阴证；C 用于脱肛；D 用于肛裂；E 用于阴虚之证。","tags":["高频"]},{"id":"LC-WK-0029","type":"A2","group":null,"topic":"肛肠病-肛裂","difficulty":2,"stem":"患者，女，30 岁。排便时肛门灼痛，便后疼痛持续数小时，便血鲜红量少，大便干结，3 日一行，舌红，苔黄燥，脉弦。其治法是","options":{"A":"清热凉血、润肠通便","B":"清热解毒、托里透脓","C":"补气升提、升阳举陷","D":"温经散寒、活血止痛","E":"疏肝理气、化痰散结"},"answer":"A","explain":"肛裂血热肠燥证因燥热内结、灼伤肛门而致，症见周期性疼痛、便血色鲜、大便干结，治当清热凉血、润肠通便，方用凉血地黄汤合脾约麻仁丸。B 用于肛痈；C 用于脱肛；D 用于寒凝；E 用于乳癖。","tags":["高频"]},{"id":"LC-WK-0030","type":"A2","group":null,"topic":"肛肠病-脱肛","difficulty":2,"stem":"患者，男，58 岁。直肠黏膜脱出肛外 2 年，劳累后加重，需用手托回，伴面色萎黄、神疲乏力、气短，舌淡，苔薄白，脉弱。其代表方是","options":{"A":"补中益气汤","B":"仙方活命饮","C":"龙胆泻肝汤","D":"凉血地黄汤","E":"透脓散"},"answer":"A","explain":"脱肛脾虚气陷证因中气不足、气虚下陷、固摄无力而致直肠脱出、劳则加重，兼面色萎黄、气短脉弱，治当补气升提、升阳举陷，方用补中益气汤。B 用于肛痈；C 用于湿热下注；D 用于肛裂；E 用于脓成未溃。","tags":["高频"]},{"id":"LC-WK-0031","type":"A2","group":null,"topic":"泌尿男科-子痈","difficulty":2,"stem":"患者，男，33 岁。右侧睾丸肿痛 3 天，阴囊红肿灼热，伴恶寒发热、小便黄赤，舌红，苔黄腻，脉滑数。其治法是","options":{"A":"清热利湿、解毒消肿","B":"温经散寒、化痰散结","C":"补益肝肾、软坚散结","D":"疏肝理气、活血止痛","E":"益气养血、托毒生肌"},"answer":"A","explain":"子痈湿热下注证因湿热蕴结、气血壅滞而成，症见睾丸肿痛、阴囊红肿灼热，兼恶寒发热、小便黄赤，舌红苔黄腻脉滑数，治当清热利湿、解毒消肿，方用枸橘汤或龙胆泻肝汤。B 用于子痰寒痰凝结；C、E 用于虚证；D 用于气滞血瘀。","tags":["高频"]},{"id":"LC-WK-0032","type":"A2","group":null,"topic":"泌尿男科-精浊","difficulty":2,"stem":"患者，男，36 岁。尿频尿急、尿道灼热 3 个月，会阴部胀痛，小便末有白浊，舌红，苔黄腻，脉滑数。其证型是","options":{"A":"湿热蕴结证","B":"气滞血瘀证","C":"肾阳不足证","D":"肝肾阴虚证","E":"脾虚气陷证"},"answer":"A","explain":"精浊湿热蕴结证见尿频尿急、尿道灼热、尿末白浊、会阴胀痛，舌红苔黄腻、脉滑数。B 以会阴刺痛、舌暗有瘀斑为主；C 以腰膝酸冷、阳事不举为主；D 以腰膝酸软、五心烦热为主；E 以尿后余沥、气短乏力为主。","tags":["鉴别"]},{"id":"LC-WK-0033","type":"A2","group":null,"topic":"泌尿男科-精癃","difficulty":3,"stem":"患者，男，68 岁。排尿困难 2 年，尿线细、尿后余沥，夜间尿频 4 至 5 次，畏寒肢冷，腰膝酸软，舌淡，苔白，脉沉细。其证型是","options":{"A":"肾阳衰微证","B":"湿热下注证","C":"气滞血瘀证","D":"肺热壅盛证","E":"中气下陷证"},"answer":"A","explain":"精癃肾阳衰微证因肾阳虚衰、气化无力、膀胱失约而致排尿困难、夜尿频多，兼畏寒肢冷、腰膝酸软、舌淡脉沉细，治当温补肾阳、化气行水。B 见尿黄灼热、苔黄腻；C 见会阴刺痛、舌暗；D 见小便点滴不通、咳嗽气促；E 见气短乏力、小腹坠胀。","tags":["鉴别"]},{"id":"LC-WK-0034","type":"A2","group":null,"topic":"周围血管病-脱疽","difficulty":2,"stem":"患者，男，35 岁。右足发凉怕冷、麻木 1 年，行走 200 米即小腿酸痛，休息后缓解，足背动脉搏动减弱，舌淡，苔白，脉沉细。其证型是","options":{"A":"寒凝脉络证","B":"血脉瘀阻证","C":"湿热下注证","D":"热毒炽盛证","E":"气血两虚证"},"answer":"A","explain":"脱疽寒凝脉络证见于早期，寒邪客于经脉、阳气不达四末，故患肢发凉麻木、间歇性跛行，舌淡苔白脉沉细，治当温经散寒、活血通络，方用阳和汤。B 以静息痛、皮色紫暗为主；C 见患肢肿胀灼热；D 见肢端溃烂臭秽；E 见疮口久不收口。","tags":["高频"]},{"id":"LC-WK-0035","type":"A2","group":null,"topic":"周围血管病-股肿","difficulty":3,"stem":"患者，女，52 岁。髋部手术后 6 天，左下肢突然肿胀、皮色紫暗、皮温升高，按之凹陷，伴胀痛，舌暗红，苔黄腻，脉滑数。其证型是","options":{"A":"湿热下注证","B":"寒湿阻络证","C":"气虚血瘀证","D":"肝郁气滞证","E":"脾肾阳虚证"},"answer":"A","explain":"股肿湿热下注证多因术后久卧、气血运行不畅、湿热蕴结下肢而致，症见患肢突然肿胀、皮色紫暗、皮温升高、按之凹陷，舌暗红苔黄腻脉滑数，治当清热利湿、活血化瘀。B 以皮色苍白、遇寒加重为主；C 见肿胀朝轻暮重、气短乏力；D、E 与本证不符。","tags":["易错"]},{"id":"LC-WK-0036","type":"A2","group":null,"topic":"其他-毒蛇咬伤","difficulty":3,"stem":"患者，男，28 岁。足踝被蛇咬伤 2 小时，伤口不红不肿、微痛麻木，继而眼睑下垂、复视、吞咽困难、呼吸费力。其中毒类型是","options":{"A":"神经毒（风毒）","B":"血液毒（火毒）","C":"混合毒","D":"过敏反应","E":"伤口感染"},"answer":"A","explain":"神经毒蛇咬伤后局部症状轻微、仅有麻木，1 至 6 小时后出现眼睑下垂、复视、吞咽困难、呼吸麻痹等，属风毒为患。血液毒以局部剧痛肿胀、出血不止、皮下瘀斑为主；混合毒兼有两类表现；D、E 不能解释进行性肌麻痹。","tags":["经典"]},{"id":"LC-WK-0037","type":"B1","group":"WK-B1-001","group_stem":"A.膏药　B.油膏　C.箍围药　D.掺药　E.切开法","topic":"总论-外治法","difficulty":1,"stem":"疮疡初起，肿势散漫不聚、边界不清，需束毒消肿、收束疮根者，宜选用","options":{"A":"膏药","B":"油膏","C":"箍围药","D":"掺药","E":"切开法"},"answer":"C","explain":"箍围药以药粉调糊敷于疮周，能收束疮毒、截断病势，适用于肿势散漫不聚者。膏药适用于肿疡、溃疡各期；油膏润泽疮面、用于渗液不多者；掺药须撒布于膏药或油膏之上；切开法用于脓已成者。","tags":[]},{"id":"LC-WK-0038","type":"B1","group":"WK-B1-001","topic":"总论-外治法","difficulty":2,"stem":"溃疡脓腐未尽，需将药粉撒布于疮面以提脓祛腐者，宜选用","options":{"A":"膏药","B":"油膏","C":"箍围药","D":"掺药","E":"切开法"},"answer":"D","explain":"掺药为粉末状药物，可直接撒布疮面或掺于膏药、油膏上，具提脓祛腐、生肌收口之功。膏药功在消肿止痛、祛风散寒；油膏润泽疮面；箍围药用于疮周束毒；切开法为排脓手术。","tags":[]},{"id":"LC-WK-0039","type":"B1","group":"WK-B1-001","topic":"总论-外治法","difficulty":1,"stem":"痈肿已成脓，按之应指有波动感，宜采用的外治法是","options":{"A":"膏药","B":"油膏","C":"箍围药","D":"掺药","E":"切开法"},"answer":"E","explain":"脓已成而正气尚支者宜及时切开排脓，使毒随脓泄、肿消痛止，切口循经直切、深浅适度并保持引流通畅。膏药、油膏、箍围药、掺药均属药物疗法，只能消肿提脓，不能排出已成之脓。","tags":["高频"]},{"id":"LC-WK-0040","type":"B1","group":"WK-B1-002","group_stem":"A.五味消毒饮　B.仙方活命饮　C.普济消毒饮　D.托里消毒散　E.阳和汤","topic":"疮疡-疔疮","difficulty":2,"stem":"颜面部疔疮初起，红肿高突、坚硬根深如钉，伴恶寒发热者，宜首选","options":{"A":"五味消毒饮","B":"仙方活命饮","C":"普济消毒饮","D":"托里消毒散","E":"阳和汤"},"answer":"A","explain":"颜面疔疮为火热之毒蕴结，治宜清热解毒，方用五味消毒饮。B 仙方活命饮兼能消肿溃坚，多用于痈疡初起；C 普济消毒饮主治大头瘟、风热疫毒；D 托里消毒散用于正虚毒恋；E 阳和汤温阳散寒，治阴证。","tags":["高频"]},{"id":"LC-WK-0041","type":"B1","group":"WK-B1-002","topic":"疮疡-有头疽","difficulty":3,"stem":"有头疽溃脓期，疮口脓水稀少、新肉不生，伴神疲乏力者，宜首选","options":{"A":"五味消毒饮","B":"仙方活命饮","C":"普济消毒饮","D":"托里消毒散","E":"阳和汤"},"answer":"D","explain":"有头疽溃后正虚毒恋、气血不足，治当托里消毒、扶正祛邪，方用托里消毒散。A 五味消毒饮纯攻无补；B 偏于消散；C 主治头面风热疫毒；E 阳和汤温阳散寒，不适用于热毒未清者。","tags":["易错"]},{"id":"LC-WK-0042","type":"B1","group":"WK-B1-002","topic":"疮疡-痈","difficulty":1,"stem":"痈初起，患处红肿热痛、光软无头，伴恶寒发热、口渴，宜首选","options":{"A":"五味消毒饮","B":"仙方活命饮","C":"普济消毒饮","D":"托里消毒散","E":"阳和汤"},"answer":"B","explain":"痈初起为热毒蕴结、气血壅滞，治宜清热解毒、活血消肿，代表方为仙方活命饮。A 清热解毒力专而消散之力较弱；C 主治头面疫毒；D 用于溃后正虚；E 用于阴证。","tags":["经典"]},{"id":"LC-WK-0043","type":"B1","group":"WK-B1-003","group_stem":"A.风邪　B.湿邪　C.热邪　D.虫邪　E.血虚","topic":"皮肤病-病因辨证","difficulty":1,"stem":"皮损为水疱、糜烂、渗液，浸淫成片，缠绵难愈者，其致病因素多为","options":{"A":"风邪","B":"湿邪","C":"热邪","D":"虫邪","E":"血虚"},"answer":"B","explain":"湿性重浊黏滞，故湿邪致病多见水疱、糜烂、渗液、浸淫成片，病程缠绵、反复发作。风邪致病起病急、游走不定；热邪见红斑灼热；虫邪见瘙痒剧烈、夜间尤甚；血虚见皮肤干燥脱屑。","tags":["高频"]},{"id":"LC-WK-0044","type":"B1","group":"WK-B1-003","topic":"皮肤病-病因辨证","difficulty":1,"stem":"皮损为红斑、丘疹，色鲜红灼热，遇热加重，伴口渴心烦者，其致病因素多为","options":{"A":"风邪","B":"湿邪","C":"热邪","D":"虫邪","E":"血虚"},"answer":"C","explain":"热为阳邪，其性炎上，致病见红斑、丘疹色鲜红、灼热，遇热加重，常兼口渴心烦、便干。风邪以瘙痒、游走为主；湿邪以糜烂渗液为主；虫邪以奇痒、夜间加重为主；血虚以干燥脱屑为主。","tags":[]},{"id":"LC-WK-0045","type":"B1","group":"WK-B1-003","topic":"皮肤病-病因辨证","difficulty":3,"stem":"皮损干燥、脱屑、肥厚、苔藓样变，瘙痒入夜尤甚，抓破血痕累累者，其致病因素多为","options":{"A":"风邪","B":"湿邪","C":"热邪","D":"虫邪","E":"血虚"},"answer":"E","explain":"血虚生风化燥、肌肤失养，故见皮肤干燥、脱屑、肥厚、苔藓样变，瘙痒入夜尤甚、抓破血痕累累，多见于慢性皮肤病。风邪多起病急、游走不定；湿邪多渗液缠绵；热邪多红肿灼热；虫邪多伴虫斑、肛门瘙痒。","tags":["易错"]}]},{"meta":{"bank_id":"linchuang-zhenjiu","title":"针灸学","paper":"linchuang","subject":"针灸学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":70,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"LC-ZJ-0001","type":"A1","group":null,"topic":"经络总论-十二经脉命名","difficulty":1,"stem":"十二经脉命名的三个依据是","options":{"A":"手足、阴阳、五行","B":"手足、阴阳、脏腑","C":"阴阳、五行、脏腑","D":"手足、表里、五行","E":"阴阳、营卫、脏腑"},"answer":"B","explain":"十二经脉的名称由手足、阴阳、脏腑三部分组合而成，如手太阴肺经。五行与营卫不参与命名，表里关系属经脉联系而非命名要素。故取手足、阴阳、脏腑三项。","tags":["经典"]},{"id":"LC-ZJ-0002","type":"A1","group":null,"topic":"经络总论-走向规律","difficulty":1,"stem":"十二经脉中，循行从手走头的是","options":{"A":"手三阴经","B":"手三阳经","C":"足三阳经","D":"足三阴经","E":"手足三阴经"},"answer":"B","explain":"手三阳经从手走头，手三阴经从胸走手，足三阳经从头走足，足三阴经从足走腹胸。这是十二经脉走向的基本规律。故从手走头者为手三阳经。","tags":["高频"]},{"id":"LC-ZJ-0003","type":"A1","group":null,"topic":"经络总论-交接规律","difficulty":2,"stem":"相表里的手足阴阳两经交接的部位是","options":{"A":"头面部","B":"胸中","C":"四肢末端","D":"腹中","E":"颈项部"},"answer":"C","explain":"相表里的阴阳两经在四肢末端交接，如手太阴肺经与手阳明大肠经交于食指端。同名阳经在头面部交接，相互衔接的阴经在胸中交接。故相表里两经交接处在四肢末端。","tags":["高频","易错"]},{"id":"LC-ZJ-0004","type":"A1","group":null,"topic":"经络总论-流注次序","difficulty":2,"stem":"十二经脉气血流注中，足太阳膀胱经之后接续的是","options":{"A":"手太阳小肠经","B":"足少阴肾经","C":"手厥阴心包经","D":"足少阳胆经","E":"手太阴肺经"},"answer":"B","explain":"流注次序为肺、大肠、胃、脾、心、小肠、膀胱、肾、心包、三焦、胆、肝，再还于肺。足太阳膀胱经之后为足少阴肾经，二者相表里。故接续者为足少阴肾经。","tags":["高频"]},{"id":"LC-ZJ-0005","type":"A1","group":null,"topic":"经络总论-十二经别","difficulty":3,"stem":"十二经别的循行特点是","options":{"A":"起于四肢末端","B":"离、入、出、合","C":"结聚于关节","D":"散布于皮肤","E":"从络穴分出"},"answer":"B","explain":"十二经别从十二经脉别出，循行呈离、入、出、合的特点，即别出本经、深入脏腑、浅出头项、合于表里经。起于四肢末端指五输穴，结聚关节指经筋，散布皮肤指皮部，从络穴分出指络脉。","tags":["鉴别"]},{"id":"LC-ZJ-0006","type":"A1","group":null,"topic":"经络总论-十五络脉","difficulty":2,"stem":"十五络脉中，脾之大络是","options":{"A":"虚里","B":"大包","C":"章门","D":"公孙","E":"腹哀"},"answer":"B","explain":"十五络脉由十二经脉与任督二脉各一支别络，再加脾之大络组成。脾之大络名为大包，出渊腋下三寸，布于胸胁。章门为脾之募穴，公孙为脾经络穴，均非脾之大络。","tags":["易错"]},{"id":"LC-ZJ-0007","type":"A1","group":null,"topic":"经络总论-十二经筋","difficulty":1,"stem":"十二经筋的分布特点是","options":{"A":"内属脏腑","B":"结聚于关节骨骼附近","C":"上入于脑","D":"分属十二皮部","E":"行于胸腹正中"},"answer":"B","explain":"十二经筋是经脉之气结聚散落于筋肉关节的体系，起于四肢末端，结聚于关节骨骼附近，不入脏腑。经筋不内属脏腑，也不入脑，与皮部为不同体系。","tags":[]},{"id":"LC-ZJ-0008","type":"A1","group":null,"topic":"经络总论-十二皮部","difficulty":3,"stem":"十二皮部的划分依据是","options":{"A":"络脉的分布","B":"十二经脉在体表的分区","C":"经筋的结聚","D":"奇穴的分布","E":"三焦的部位划分"},"answer":"B","explain":"十二皮部是十二经脉功能活动反映于体表的部位，按十二经脉在体表的分区划分，也是络脉之气散布之处。皮部以经脉分区为据，不由络脉、经筋或奇穴划分。","tags":[]},{"id":"LC-ZJ-0009","type":"A1","group":null,"topic":"腧穴总论-腧穴分类","difficulty":1,"stem":"十四经穴的总数是","options":{"A":"360 个","B":"361 个","C":"354 个","D":"365 个","E":"349 个"},"answer":"B","explain":"按现行国家标准，十二经脉与任督二脉的腧穴共 361 个，称十四经穴。奇穴与阿是穴不在此数内。故总数为 361 个。","tags":["高频","计算"]},{"id":"LC-ZJ-0010","type":"A1","group":null,"topic":"腧穴总论-骨度分寸","difficulty":1,"stem":"前发际正中至后发际正中的骨度分寸是","options":{"A":"9 寸","B":"10 寸","C":"12 寸","D":"13 寸","E":"15 寸"},"answer":"C","explain":"头部前发际正中至后发际正中进行折量为 12 寸，是头部取穴的基本骨度。9 寸用于腋前纹头至肘横纹，13 寸用于胫骨内侧髁下方至内踝尖。故为 12 寸。","tags":["高频"]},{"id":"LC-ZJ-0011","type":"A1","group":null,"topic":"腧穴总论-骨度分寸","difficulty":2,"stem":"两乳头之间的骨度分寸是","options":{"A":"6 寸","B":"8 寸","C":"9 寸","D":"10 寸","E":"12 寸"},"answer":"B","explain":"胸腹部两乳头之间折量为 8 寸，为胸腹部横向取穴的依据。胸剑联合至脐中为 8 寸，脐中至耻骨联合上缘为 5 寸。故两乳头之间为 8 寸。","tags":["易错","计算"]},{"id":"LC-ZJ-0012","type":"A1","group":null,"topic":"腧穴总论-骨度分寸","difficulty":2,"stem":"肘横纹至腕横纹的骨度分寸是","options":{"A":"9 寸","B":"10 寸","C":"11 寸","D":"12 寸","E":"13 寸"},"answer":"D","explain":"上肢肘横纹至腕横纹折量为 12 寸，腋前纹头至肘横纹为 9 寸。内关、外关等穴的定位均以此为准。故为 12 寸。","tags":["计算"]},{"id":"LC-ZJ-0013","type":"A1","group":null,"topic":"腧穴总论-手指同身寸","difficulty":2,"stem":"横指同身寸（一夫法）以四指并拢的宽度为","options":{"A":"1 寸","B":"2 寸","C":"3 寸","D":"4 寸","E":"5 寸"},"answer":"C","explain":"一夫法以患者中指近侧指间关节横纹为准，四指并拢的宽度为 3 寸。拇指同身寸以拇指指间关节宽度为 1 寸，中指同身寸以中指中节两端纹头之间为 1 寸。故四指宽度为 3 寸。","tags":["计算"]},{"id":"LC-ZJ-0014","type":"A1","group":null,"topic":"特定穴-五输穴","difficulty":2,"stem":"五输穴中，经气所注者为","options":{"A":"井穴","B":"荥穴","C":"输穴","D":"经穴","E":"合穴"},"answer":"C","explain":"五输穴以水流比拟经气运行，所出为井、所溜为荥、所注为输、所行为经、所入为合。故经气所注者为输穴。井穴为经气所出，合穴为经气所入。","tags":["高频","易错"]},{"id":"LC-ZJ-0015","type":"A1","group":null,"topic":"特定穴-原穴","difficulty":2,"stem":"阴经的输穴与原穴的关系是","options":{"A":"阴经无原穴","B":"阴经以输为原","C":"阴经以经为原","D":"阴经以井为原","E":"阴经另设原穴"},"answer":"B","explain":"原穴是脏腑原气留止之处。阴经以输穴为原穴，即所谓阴经以输为原；阳经则另设原穴。故阴经的输穴即是其原穴，如太渊既是肺经输穴又是肺经原穴。","tags":["高频","易错"]},{"id":"LC-ZJ-0016","type":"A1","group":null,"topic":"特定穴-络穴","difficulty":1,"stem":"络穴是指","options":{"A":"十五络脉从经脉分出处的腧穴","B":"脏腑之气输注于背部的腧穴","C":"脏腑之气汇聚于胸腹的腧穴","D":"经脉气血输注于四肢的腧穴","E":"经气深聚部位的腧穴"},"answer":"A","explain":"络穴是十五络脉从经脉分出之处的腧穴，共十五个，能联络表里两经。背俞穴为脏腑之气输注背部者，募穴为汇聚胸腹者，郄穴为经气深聚者。故络穴指络脉分出处的腧穴。","tags":["鉴别"]},{"id":"LC-ZJ-0017","type":"A1","group":null,"topic":"特定穴-背俞穴","difficulty":2,"stem":"背俞穴的分布位置是","options":{"A":"督脉旁开 0.5 寸","B":"足太阳膀胱经第一侧线","C":"足太阳膀胱经第二侧线","D":"任脉旁开 2 寸","E":"足少阳胆经循行线"},"answer":"B","explain":"背俞穴是脏腑之气输注于背腰部的腧穴，均分布于足太阳膀胱经第一侧线，即督脉旁开 1.5 寸。第二侧线为膏肓等穴所在，非背俞穴。故取第一侧线。","tags":["高频"]},{"id":"LC-ZJ-0018","type":"A1","group":null,"topic":"特定穴-募穴","difficulty":2,"stem":"胃的募穴是","options":{"A":"上脘","B":"中脘","C":"下脘","D":"梁门","E":"足三里"},"answer":"B","explain":"募穴是脏腑之气汇聚于胸腹部的腧穴，胃之募穴为中脘，位于脐中上 4 寸。上脘、下脘虽邻近中脘，但非胃募；足三里为胃经下合穴。故胃募为中脘。","tags":["高频"]},{"id":"LC-ZJ-0019","type":"A1","group":null,"topic":"特定穴-八会穴","difficulty":2,"stem":"八会穴中，骨会是","options":{"A":"大杼","B":"绝骨","C":"阳陵泉","D":"太渊","E":"膈俞"},"answer":"A","explain":"八会穴为脏会章门、腑会中脘、气会膻中、血会膈俞、筋会阳陵泉、脉会太渊、骨会大杼、髓会绝骨。绝骨主髓，阳陵泉主筋，太渊主脉，膈俞主血。故骨会为大杼。","tags":["高频","易错"]},{"id":"LC-ZJ-0020","type":"A1","group":null,"topic":"特定穴-八脉交会穴","difficulty":2,"stem":"八脉交会穴中，通于督脉的是","options":{"A":"后溪","B":"申脉","C":"照海","D":"列缺","E":"公孙"},"answer":"A","explain":"八脉交会穴中，后溪通督脉，申脉通阳跷脉，照海通阴跷脉，列缺通任脉，公孙通冲脉。故通督脉者为后溪。","tags":["高频"]},{"id":"LC-ZJ-0021","type":"A1","group":null,"topic":"特定穴-下合穴","difficulty":2,"stem":"大肠的下合穴是","options":{"A":"足三里","B":"上巨虚","C":"下巨虚","D":"委阳","E":"阳陵泉"},"answer":"B","explain":"下合穴是六腑之气下合于足三阳经的腧穴。大肠下合于上巨虚，小肠下合于下巨虚，三焦下合于委阳，胃下合于足三里，胆下合于阳陵泉。故大肠的下合穴为上巨虚。","tags":["高频","鉴别"]},{"id":"LC-ZJ-0022","type":"A1","group":null,"topic":"特定穴-郄穴","difficulty":3,"stem":"下列属于郄穴的是","options":{"A":"孔最","B":"列缺","C":"太渊","D":"尺泽","E":"少商"},"answer":"A","explain":"郄穴是经脉之气深聚部位的腧穴，肺经郄穴为孔最。列缺为肺经络穴，太渊为肺经输穴与原穴，尺泽为肺经合穴，少商为肺经井穴。故属郄穴者为孔最。","tags":["鉴别","易错"]},{"id":"LC-ZJ-0023","type":"A1","group":null,"topic":"特定穴-交会穴","difficulty":3,"stem":"交会穴是指","options":{"A":"两经或数经交会处的腧穴","B":"经脉之气深聚处的腧穴","C":"脏腑之气输注背部的腧穴","D":"十五络脉分出处的腧穴","E":"经气所出之处的腧穴"},"answer":"A","explain":"交会穴是两经或数经相交会合之处的腧穴，如三阴交为足三阴经交会穴。经气深聚者为郄穴，输注背部者为背俞穴，络脉分出者为络穴，经气所出者为井穴。","tags":["鉴别"]},{"id":"LC-ZJ-0024","type":"A1","group":null,"topic":"任督二脉-督脉循行","difficulty":2,"stem":"督脉的主干循行是","options":{"A":"沿腹胸正中线上行","B":"沿脊柱后正中线上行","C":"沿体侧中线上行","D":"沿下肢内侧上行","E":"沿上肢外侧上行"},"answer":"B","explain":"督脉起于胞中，下出会阴，沿脊柱后正中线上行，至项后入脑，上巅顶，沿前额下行鼻柱。沿腹胸正中线上行者是任脉，故督脉主干行于脊柱后正中线。","tags":["高频"]},{"id":"LC-ZJ-0025","type":"A1","group":null,"topic":"任督二脉-任脉循行","difficulty":3,"stem":"任脉的起始部位是","options":{"A":"胞中","B":"中极","C":"关元","D":"会阴","E":"气海"},"answer":"A","explain":"任脉起于胞中，下出会阴，沿腹胸正中线上行至咽喉，环唇，上至目眶下。中极、关元、气海均为任脉穴位而非起点，会阴为任脉所过之处。故起始于胞中。","tags":["易错"]},{"id":"LC-ZJ-0026","type":"A1","group":null,"topic":"任督二脉-百会定位","difficulty":1,"stem":"百会穴的定位是","options":{"A":"后发际正中直上 5 寸","B":"后发际正中直上 7 寸","C":"前发际正中直上 7 寸","D":"后发际正中直上 9 寸","E":"前发际正中直上 3 寸"},"answer":"B","explain":"百会位于头顶部，后发际正中直上 7 寸，约当两耳尖连线的中点处。该处亦即前发际正中直上 5 寸，两种表述定位一致。故取后发际正中直上 7 寸。","tags":["高频"]},{"id":"LC-ZJ-0027","type":"A1","group":null,"topic":"十二经脉腧穴-合谷定位","difficulty":1,"stem":"合谷穴的定位是","options":{"A":"第 1、2 掌骨间，第 2 掌骨桡侧的中点处","B":"第 2、3 掌骨间，第 2 掌骨尺侧","C":"第 1 掌骨中点桡侧","D":"腕横纹上 2 寸","E":"第 4、5 掌骨间"},"answer":"A","explain":"合谷位于手背第 1、2 掌骨之间，约当第 2 掌骨桡侧的中点处，为手阳明大肠经原穴。简便取法为以一手拇指指间关节横纹压在另一手拇食指蹼缘上，拇指尖下即是。故取第 2 掌骨桡侧中点。","tags":["高频"]},{"id":"LC-ZJ-0028","type":"A1","group":null,"topic":"十二经脉腧穴-足三里定位","difficulty":1,"stem":"足三里穴的定位是","options":{"A":"犊鼻下 3 寸，胫骨前嵴外一横指","B":"犊鼻下 2 寸，胫骨前嵴外一横指","C":"犊鼻下 4 寸，胫骨前嵴外两横指","D":"外踝尖上 8 寸","E":"内踝尖上 3 寸"},"answer":"A","explain":"足三里位于犊鼻穴下 3 寸，胫骨前嵴外一横指（中指）处，为足阳明胃经合穴与胃之下合穴。犊鼻下 4 寸外两横指近丰隆，外踝尖上 8 寸为丰隆，内踝尖上 3 寸为三阴交。","tags":["高频"]},{"id":"LC-ZJ-0029","type":"A1","group":null,"topic":"十二经脉腧穴-三阴交定位","difficulty":1,"stem":"三阴交穴的定位是","options":{"A":"内踝尖上 3 寸，胫骨内侧面后缘","B":"内踝尖上 2 寸，胫骨内侧面后缘","C":"外踝尖上 3 寸，腓骨前缘","D":"内踝尖上 4 寸，胫骨前缘","E":"胫骨内侧髁下方凹陷处"},"answer":"A","explain":"三阴交位于内踝尖上 3 寸，胫骨内侧面后缘，为足三阴经交会穴。外踝尖上 3 寸为悬钟，胫骨内侧髁下方凹陷处为阴陵泉。故取内踝尖上 3 寸。","tags":["高频"]},{"id":"LC-ZJ-0030","type":"A1","group":null,"topic":"十二经脉腧穴-太冲定位","difficulty":2,"stem":"太冲穴的定位是","options":{"A":"足背第 1、2 跖骨间隙的后方凹陷处","B":"足背第 2、3 跖骨间隙的后方凹陷处","C":"足背第 4、5 跖骨间隙的后方凹陷处","D":"第 1 跖骨头外侧凹陷处","E":"内踝尖与跟腱之间的凹陷处"},"answer":"A","explain":"太冲位于足背第 1、2 跖骨间隙的后方凹陷处，为足厥阴肝经输穴与原穴。内踝尖与跟腱之间的凹陷处为太溪，属肾经。故取第 1、2 跖骨间隙后方凹陷。","tags":["高频"]},{"id":"LC-ZJ-0031","type":"A1","group":null,"topic":"十二经脉腧穴-内关定位","difficulty":1,"stem":"内关穴的定位是","options":{"A":"腕横纹上 2 寸，掌长肌腱与桡侧腕屈肌腱之间","B":"腕横纹上 1 寸，两筋之间","C":"腕横纹上 3 寸，两筋之间","D":"腕背横纹上 2 寸，尺桡骨之间","E":"肘横纹下 2 寸"},"answer":"A","explain":"内关位于腕横纹上 2 寸，掌长肌腱与桡侧腕屈肌腱之间，为手厥阴心包经络穴与八脉交会穴。腕横纹上 1 寸为间使，腕背横纹上 2 寸为外关。故取腕横纹上 2 寸。","tags":["高频"]},{"id":"LC-ZJ-0032","type":"A1","group":null,"topic":"十二经脉腧穴-委中主治","difficulty":2,"stem":"委中穴的主治病证是","options":{"A":"腰痛、下肢痿痹","B":"头痛、眩晕","C":"咳嗽、气喘","D":"胃痛、呕吐","E":"月经不调、痛经"},"answer":"A","explain":"委中位于腘横纹中点，为足太阳膀胱经合穴与膀胱下合穴，善治腰痛、下肢痿痹、腹痛吐泻及丹毒。四总穴歌有腰背委中求之说。故主治腰痛与下肢痿痹。","tags":["高频","经典"]},{"id":"LC-ZJ-0033","type":"A1","group":null,"topic":"十二经脉腧穴-丰隆主治","difficulty":2,"stem":"丰隆穴的主要作用是","options":{"A":"化痰","B":"补血","C":"温阳","D":"疏肝","E":"固表止汗"},"answer":"A","explain":"丰隆为足阳明胃经络穴，是化痰要穴，主治痰多咳嗽、头晕、癫狂痫及下肢痿痹。补血多用膈俞、血海，温阳多用关元、命门。故丰隆的主要作用是化痰。","tags":["高频"]},{"id":"LC-ZJ-0034","type":"A1","group":null,"topic":"灸法-艾炷灸分类","difficulty":2,"stem":"艾炷灸分为","options":{"A":"直接灸与间接灸","B":"温和灸与雀啄灸","C":"悬起灸与实按灸","D":"艾条灸与温针灸","E":"发泡灸与化脓灸"},"answer":"A","explain":"艾炷灸按是否隔物分为直接灸与间接灸两类。直接灸含瘢痕灸与无瘢痕灸，间接灸含隔姜、隔蒜、隔盐、隔附子饼等。温和灸与雀啄灸属艾条灸。故分为直接灸与间接灸。","tags":["高频","鉴别"]},{"id":"LC-ZJ-0035","type":"A1","group":null,"topic":"灸法-隔盐灸","difficulty":2,"stem":"隔盐灸最常用于的穴位是","options":{"A":"神阙","B":"足三里","C":"关元","D":"中脘","E":"大椎"},"answer":"A","explain":"隔盐灸以纯净干燥的食盐填敷脐部再置艾炷施灸，多用于神阙穴。其有回阳救逆、固脱之功，用于急性腹痛吐泻、四肢厥冷及中风脱证。故最常用于神阙。","tags":["高频"]},{"id":"LC-ZJ-0036","type":"A1","group":null,"topic":"拔罐与其他-三棱针","difficulty":2,"stem":"三棱针的操作方法不包括","options":{"A":"点刺","B":"散刺","C":"挑刺","D":"泻血","E":"埋针"},"answer":"E","explain":"三棱针的操作有点刺、散刺、挑刺、泻血四法，用于实证、热证、瘀血及急症。埋针属皮内针法，与三棱针不同。故不包括埋针。","tags":["鉴别"]},{"id":"LC-ZJ-0037","type":"A1","group":null,"topic":"针灸治疗总论-选穴原则","difficulty":2,"stem":"胃痛取中脘，体现的选穴原则是","options":{"A":"近部选穴","B":"远部选穴","C":"辨证选穴","D":"对症选穴","E":"同名经选穴"},"answer":"A","explain":"近部选穴是在病痛局部或邻近部位选取腧穴，中脘位于胃脘部，属近部取穴。远部选穴如胃痛取足三里，辨证选穴如虚证取关元。故体现近部选穴原则。","tags":["鉴别"]},{"id":"LC-ZJ-0038","type":"A1","group":null,"topic":"针灸治疗总论-补泻手法","difficulty":3,"stem":"捻转补泻中，补法的操作是","options":{"A":"捻转角度大、频率快、用力重","B":"捻转角度小、频率慢、用力轻","C":"捻转角度大、频率慢、用力轻","D":"捻转角度小、频率快、用力重","E":"单向连续捻转不提插"},"answer":"B","explain":"捻转补泻以捻转的角度、频率、力度分补泻，补法为捻转角度小、频率慢、用力轻，泻法则角度大、频率快、用力重。故补法取角度小、频率慢、用力轻。","tags":["易错"]},{"id":"LC-ZJ-0039","type":"A2","group":null,"topic":"十二经脉腧穴-合谷","difficulty":2,"stem":"患者，男，28 岁。右下齿痛 2 天，遇冷加重，伴咽喉肿痛、发热恶寒，舌红苔薄黄，脉浮数。治疗取手阳明大肠经原穴，该穴是","options":{"A":"合谷","B":"曲池","C":"迎香","D":"列缺","E":"外关"},"answer":"A","explain":"手阳明大肠经原穴为合谷，位于第 1、2 掌骨间第 2 掌骨桡侧中点，善治头面五官病证，四总穴歌有面口合谷收之说。曲池为大肠经合穴，迎香为大肠经末端穴，列缺属肺经，外关属三焦经。故取合谷。","tags":["高频"]},{"id":"LC-ZJ-0040","type":"A2","group":null,"topic":"十二经脉腧穴-曲池","difficulty":2,"stem":"患者，女，35 岁。全身起红色风团，瘙痒剧烈，遇热加重，伴发热咽痛，舌红苔黄，脉浮数。治疗取手阳明大肠经合穴，该穴是","options":{"A":"曲池","B":"合谷","C":"手三里","D":"肩髃","E":"迎香"},"answer":"A","explain":"曲池为手阳明大肠经合穴，位于屈肘时肘横纹外侧端与肱骨外上髁连线中点，善清热、祛风、止痒，为治瘾疹要穴。合谷为原穴，手三里、肩髃、迎香均非合穴。故取曲池。","tags":["高频"]},{"id":"LC-ZJ-0041","type":"A2","group":null,"topic":"十二经脉腧穴-列缺","difficulty":2,"stem":"患者，男，45 岁。咳嗽气急、咽喉肿痛 3 天，伴头项强痛，舌淡红苔薄白，脉浮紧。治疗取手太阴肺经络穴，该穴是","options":{"A":"列缺","B":"太渊","C":"尺泽","D":"孔最","E":"少商"},"answer":"A","explain":"列缺为手太阴肺经络穴，位于桡骨茎突上方腕横纹上 1.5 寸，善治外感咳嗽、头项强痛，四总穴歌有头项寻列缺之说。太渊为输穴与原穴，尺泽为合穴，孔最为郄穴，少商为井穴。故取列缺。","tags":["高频","经典"]},{"id":"LC-ZJ-0042","type":"A2","group":null,"topic":"常见病证针灸治疗-中风","difficulty":2,"stem":"患者，男，62 岁。突然左侧半身不遂、口眼歪斜、言语謇涩，神志清楚，舌暗淡苔薄白，脉弦。针灸治疗的主穴是","options":{"A":"水沟、内关、三阴交、极泉、尺泽、委中","B":"百会、风池、合谷、太冲","C":"环跳、阳陵泉、足三里","D":"地仓、颊车、翳风","E":"中脘、足三里、内关"},"answer":"A","explain":"中风中经络治以醒脑开窍、疏通经络，主穴取水沟、内关、三阴交、极泉、尺泽、委中。百会、风池、合谷、太冲偏于头痛眩晕，环跳等为半身不遂局部配穴，地仓颊车治口歪，中脘足三里内关治胃痛。故取第一组。","tags":["高频"]},{"id":"LC-ZJ-0043","type":"A2","group":null,"topic":"常见病证针灸治疗-面瘫","difficulty":2,"stem":"患者，女，30 岁。晨起发现右侧口眼歪斜，右眼闭合不全，鼻唇沟变浅，舌淡苔薄白，脉浮紧。针灸治疗的主穴是","options":{"A":"地仓、颊车、合谷、阳白、四白、颧髎、翳风","B":"水沟、内关、三阴交、极泉","C":"百会、风池、太阳、合谷","D":"中脘、足三里、内关","E":"肾俞、大肠俞、委中"},"answer":"A","explain":"面瘫治以祛风通络、疏调经筋，主穴取地仓、颊车、合谷、阳白、四白、颧髎、翳风。水沟内关三阴交极泉为中风主穴，百会风池太阳治头痛，肾俞大肠俞委中治腰痛。故取第一组。","tags":["高频"]},{"id":"LC-ZJ-0044","type":"A2","group":null,"topic":"常见病证针灸治疗-头痛","difficulty":3,"stem":"患者，男，40 岁。前额部胀痛 3 天，伴鼻塞流涕，舌淡红苔薄白，脉浮。针灸治疗在基础主穴上应加配","options":{"A":"印堂、攒竹、内庭","B":"率谷、外关、足临泣","C":"天柱、后顶、申脉","D":"四神聪、太冲、内关","E":"血海、膈俞、三阴交"},"answer":"A","explain":"头痛按部位分经配穴，前额为阳明头痛，配印堂、攒竹、内庭。率谷、外关、足临泣为少阳头痛配穴，天柱、后顶、申脉为太阳头痛配穴，四神聪、太冲、内关为厥阴头痛配穴。故取阳明经穴组。","tags":["鉴别"]},{"id":"LC-ZJ-0045","type":"A2","group":null,"topic":"常见病证针灸治疗-腰痛","difficulty":2,"stem":"患者，男，50 岁。腰部冷痛重着，遇寒加重，得温则减，舌淡苔白腻，脉沉紧。针灸治疗的主穴是","options":{"A":"肾俞、大肠俞、腰阳关、委中、阿是穴","B":"大椎、曲池、合谷、外关","C":"中脘、足三里、内关","D":"关元、三阴交、地机","E":"百会、风池、太阳"},"answer":"A","explain":"腰痛治以温经散寒、通络止痛，主穴取肾俞、大肠俞、腰阳关、委中及阿是穴，寒湿者加灸。大椎曲池合谷治热证，中脘足三里内关治胃痛，关元三阴交地机治痛经。故取第一组。","tags":["高频"]},{"id":"LC-ZJ-0046","type":"A2","group":null,"topic":"常见病证针灸治疗-痹证","difficulty":3,"stem":"患者，女，48 岁。双膝关节疼痛，游走不定，遇风加重，苔薄白，脉浮。针灸治疗在主穴基础上应配","options":{"A":"膈俞、血海","B":"肾俞、关元","C":"阴陵泉、足三里","D":"曲池、大椎","E":"太冲、阳陵泉"},"answer":"A","explain":"痹证按邪气偏胜配穴，风邪偏胜为行痹，痛处游走，配膈俞、血海以活血祛风。肾俞、关元用于痛痹，阴陵泉、足三里用于着痹，曲池、大椎用于热痹。故行痹配膈俞、血海。","tags":["高频","鉴别"]},{"id":"LC-ZJ-0047","type":"A2","group":null,"topic":"常见病证针灸治疗-不寐","difficulty":2,"stem":"患者，女，38 岁。入睡困难 2 个月，心烦多梦，心悸健忘，舌红少苔，脉细数。针灸治疗的主穴是","options":{"A":"神门、内关、百会、安眠、三阴交","B":"中脘、足三里、内关","C":"百会、太阳、风池","D":"关元、气海、足三里","E":"肾俞、命门、腰阳关"},"answer":"A","explain":"不寐治以宁心安神，主穴取神门、内关、百会、安眠、三阴交。中脘足三里内关治胃痛，百会太阳风池治头痛，关元气海足三里偏于补虚固本。故取第一组。","tags":["高频"]},{"id":"LC-ZJ-0048","type":"A2","group":null,"topic":"常见病证针灸治疗-胃痛","difficulty":1,"stem":"患者，男，36 岁。胃脘胀痛，嗳气频繁，情志不遂时加重，舌淡红苔薄白，脉弦。针灸治疗的主穴是","options":{"A":"中脘、足三里、内关","B":"天枢、上巨虚、大肠俞","C":"关元、三阴交、地机","D":"期门、阳陵泉、太冲","E":"脾俞、胃俞、膈俞"},"answer":"A","explain":"胃痛治以和胃止痛，主穴取中脘、足三里、内关，肝气犯胃者加太冲、期门。天枢、上巨虚主治泄泻痢疾，关元、三阴交、地机治痛经。故主穴为中脘、足三里、内关。","tags":["高频"]},{"id":"LC-ZJ-0049","type":"A2","group":null,"topic":"常见病证针灸治疗-痛经","difficulty":2,"stem":"患者，女，24 岁。经前小腹胀痛拒按，经色紫暗有块，舌紫暗苔薄白，脉涩。针灸治疗的主穴是","options":{"A":"关元、三阴交、地机、次髎","B":"中脘、足三里、内关","C":"肾俞、命门、腰阳关","D":"百会、风池、太阳","E":"太冲、内庭、合谷"},"answer":"A","explain":"痛经治以调理冲任、通经止痛，主穴取关元、三阴交、地机、次髎，气滞血瘀者加太冲、血海。中脘足三里内关治胃痛，肾俞命门腰阳关偏温补肾阳。故取第一组。","tags":["高频"]},{"id":"LC-ZJ-0050","type":"A2","group":null,"topic":"灸法-隔盐灸应用","difficulty":3,"stem":"患者，女，30 岁。腹痛吐泻交作，面色苍白，四肢厥冷，脉沉细欲绝。宜选用的灸法是","options":{"A":"隔盐灸神阙","B":"隔蒜灸大椎","C":"无瘢痕灸足三里","D":"温和灸印堂","E":"隔附子饼灸肾俞"},"answer":"A","explain":"患者吐泻交作、肢冷脉微，属阳气暴脱，治当回阳固脱，当选隔盐灸神阙。隔蒜灸偏清热解毒，温和灸力弱不足以救脱，隔附子饼灸偏温补肾阳而缓不济急。故取隔盐灸神阙。","tags":["鉴别"]},{"id":"LC-ZJ-0051","type":"B1","group":"ZJ-B1-001","group_stem":"A.少商　B.鱼际　C.太渊　D.经渠　E.尺泽","topic":"特定穴-五输穴归属","difficulty":1,"stem":"手太阴肺经的井穴是","options":{"A":"少商","B":"鱼际","C":"太渊","D":"经渠","E":"尺泽"},"answer":"A","explain":"手太阴肺经五输穴依次为井穴少商、荥穴鱼际、输穴太渊、经穴经渠、合穴尺泽。少商位于拇指桡侧指甲根角旁 0.1 寸，为井穴。故肺经井穴为少商。","tags":["高频"]},{"id":"LC-ZJ-0052","type":"B1","group":"ZJ-B1-001","group_stem":"A.少商　B.鱼际　C.太渊　D.经渠　E.尺泽","topic":"特定穴-五输穴归属","difficulty":2,"stem":"手太阴肺经的荥穴是","options":{"A":"少商","B":"鱼际","C":"太渊","D":"经渠","E":"尺泽"},"answer":"B","explain":"肺经荥穴为鱼际，位于第 1 掌骨中点桡侧赤白肉际处。荥穴主身热，鱼际善清肺热、利咽喉。少商为井穴，太渊为输穴兼原穴。故肺经荥穴为鱼际。","tags":["易错"]},{"id":"LC-ZJ-0053","type":"B1","group":"ZJ-B1-001","group_stem":"A.少商　B.鱼际　C.太渊　D.经渠　E.尺泽","topic":"特定穴-五输穴归属","difficulty":2,"stem":"手太阴肺经的输穴是","options":{"A":"少商","B":"鱼际","C":"太渊","D":"经渠","E":"尺泽"},"answer":"C","explain":"肺经输穴为太渊，位于腕横纹桡侧桡动脉搏动处。阴经以输为原，故太渊同时为肺经原穴，又是八会穴中的脉会。经渠为肺经经穴。故输穴为太渊。","tags":["高频"]},{"id":"LC-ZJ-0054","type":"B1","group":"ZJ-B1-001","group_stem":"A.少商　B.鱼际　C.太渊　D.经渠　E.尺泽","topic":"特定穴-五输穴归属","difficulty":2,"stem":"手太阴肺经的合穴是","options":{"A":"少商","B":"鱼际","C":"太渊","D":"经渠","E":"尺泽"},"answer":"E","explain":"肺经合穴为尺泽，位于肘横纹中肱二头肌腱桡侧凹陷处。合穴主逆气而泄，尺泽善清肺泄热、降逆止咳。经渠为经穴，主喘咳寒热。故肺经合穴为尺泽。","tags":[]},{"id":"LC-ZJ-0055","type":"B1","group":"ZJ-B1-002","group_stem":"A.内踝尖上 3 寸　B.外踝尖上 8 寸　C.腕横纹上 2 寸　D.腕背横纹上 2 寸　E.腘横纹中点","topic":"十二经脉腧穴-定位","difficulty":1,"stem":"三阴交的定位是","options":{"A":"内踝尖上 3 寸，胫骨内侧面后缘","B":"外踝尖上 8 寸，胫骨前嵴外两横指","C":"腕横纹上 2 寸，两筋之间","D":"腕背横纹上 2 寸，尺桡骨之间","E":"腘横纹中点"},"answer":"A","explain":"三阴交位于内踝尖上 3 寸、胫骨内侧面后缘，为足三阴经交会穴。外踝尖上 8 寸为丰隆，腕横纹上 2 寸为内关，腕背横纹上 2 寸为外关，腘横纹中点为委中。故取 A。","tags":["高频"]},{"id":"LC-ZJ-0056","type":"B1","group":"ZJ-B1-002","group_stem":"A.内踝尖上 3 寸　B.外踝尖上 8 寸　C.腕横纹上 2 寸　D.腕背横纹上 2 寸　E.腘横纹中点","topic":"十二经脉腧穴-定位","difficulty":2,"stem":"丰隆的定位是","options":{"A":"内踝尖上 3 寸，胫骨内侧面后缘","B":"外踝尖上 8 寸，胫骨前嵴外两横指","C":"腕横纹上 2 寸，两筋之间","D":"腕背横纹上 2 寸，尺桡骨之间","E":"腘横纹中点"},"answer":"B","explain":"丰隆位于外踝尖上 8 寸，条口穴外 1 寸，胫骨前嵴外两横指处。为足阳明胃经络穴、化痰要穴。内踝尖上 3 寸为三阴交，腘横纹中点为委中。故取 B。","tags":["易错"]},{"id":"LC-ZJ-0057","type":"B1","group":"ZJ-B1-002","group_stem":"A.内踝尖上 3 寸　B.外踝尖上 8 寸　C.腕横纹上 2 寸　D.腕背横纹上 2 寸　E.腘横纹中点","topic":"十二经脉腧穴-定位","difficulty":1,"stem":"内关的定位是","options":{"A":"内踝尖上 3 寸，胫骨内侧面后缘","B":"外踝尖上 8 寸，胫骨前嵴外两横指","C":"腕横纹上 2 寸，掌长肌腱与桡侧腕屈肌腱之间","D":"腕背横纹上 2 寸，尺桡骨之间","E":"腘横纹中点"},"answer":"C","explain":"内关位于腕横纹上 2 寸，掌长肌腱与桡侧腕屈肌腱之间，为手厥阴心包经络穴。腕背横纹上 2 寸、尺桡骨之间为外关，二者内外相对。故取 C。","tags":["高频"]},{"id":"LC-ZJ-0058","type":"B1","group":"ZJ-B1-002","group_stem":"A.内踝尖上 3 寸　B.外踝尖上 8 寸　C.腕横纹上 2 寸　D.腕背横纹上 2 寸　E.腘横纹中点","topic":"十二经脉腧穴-定位","difficulty":2,"stem":"外关的定位是","options":{"A":"内踝尖上 3 寸，胫骨内侧面后缘","B":"外踝尖上 8 寸，胫骨前嵴外两横指","C":"腕横纹上 2 寸，两筋之间","D":"腕背横纹上 2 寸，尺骨与桡骨之间","E":"腘横纹中点"},"answer":"D","explain":"外关位于腕背横纹上 2 寸，尺骨与桡骨之间，为手少阳三焦经络穴，通阳维脉。内关在腕掌侧对应位置，二者一表一里相对。故取 D。","tags":["鉴别"]},{"id":"LC-ZJ-0059","type":"B1","group":"ZJ-B1-003","group_stem":"A.原穴　B.络穴　C.郄穴　D.八会穴　E.下合穴","topic":"特定穴-类别归属","difficulty":1,"stem":"太渊属于","options":{"A":"原穴","B":"络穴","C":"郄穴","D":"八会穴","E":"下合穴"},"answer":"A","explain":"太渊为手太阴肺经输穴，阴经以输为原，故同时为肺经原穴。太渊虽亦为八会穴中的脉会，但本组选项中按原穴归类最贴切。列缺为肺经络穴。故太渊属原穴。","tags":["易错"]},{"id":"LC-ZJ-0060","type":"B1","group":"ZJ-B1-003","group_stem":"A.原穴　B.络穴　C.郄穴　D.八会穴　E.下合穴","topic":"特定穴-类别归属","difficulty":1,"stem":"列缺属于","options":{"A":"原穴","B":"络穴","C":"郄穴","D":"八会穴","E":"下合穴"},"answer":"B","explain":"列缺为手太阴肺经络穴，十五络脉从该处分出走向手阳明大肠经，故能联络表里两经。列缺又是八脉交会穴之一，通任脉。故按本组归类属络穴。","tags":["高频"]},{"id":"LC-ZJ-0061","type":"B1","group":"ZJ-B1-003","group_stem":"A.原穴　B.络穴　C.郄穴　D.八会穴　E.下合穴","topic":"特定穴-类别归属","difficulty":3,"stem":"孔最属于","options":{"A":"原穴","B":"络穴","C":"郄穴","D":"八会穴","E":"下合穴"},"answer":"C","explain":"孔最位于腕横纹上 7 寸，为手太阴肺经郄穴，善治咳血、咽喉肿痛等肺经急症。郄穴主治本经循行部位及所属脏腑的急性病证。故孔最属郄穴。","tags":["鉴别"]},{"id":"LC-ZJ-0062","type":"B1","group":"ZJ-B1-003","group_stem":"A.原穴　B.络穴　C.郄穴　D.八会穴　E.下合穴","topic":"特定穴-类别归属","difficulty":3,"stem":"膈俞属于","options":{"A":"原穴","B":"络穴","C":"郄穴","D":"八会穴","E":"下合穴"},"answer":"D","explain":"膈俞位于第 7 胸椎棘突下旁开 1.5 寸，为八会穴中的血会，善治血证、皮肤病及呃逆。膈俞虽为膀胱经穴，但按特定穴归类属八会穴。故取 D。","tags":["易错"]},{"id":"LC-ZJ-0063","type":"B1","group":"ZJ-B1-004","group_stem":"A.中脘　B.关元　C.百会　D.地仓　E.肾俞","topic":"常见病证针灸治疗-主穴","difficulty":1,"stem":"胃痛针灸治疗的主穴是","options":{"A":"中脘","B":"关元","C":"百会","D":"地仓","E":"肾俞"},"answer":"A","explain":"胃痛病位在胃脘，中脘为胃之募穴、腑会，位于脐上 4 寸，是治疗胃痛的主穴，常配足三里、内关。关元偏于培元固本，地仓治口歪，肾俞治腰痛。故取中脘。","tags":["高频"]},{"id":"LC-ZJ-0064","type":"B1","group":"ZJ-B1-004","group_stem":"A.中脘　B.关元　C.百会　D.地仓　E.肾俞","topic":"常见病证针灸治疗-主穴","difficulty":2,"stem":"痛经针灸治疗的主穴是","options":{"A":"中脘","B":"关元","C":"百会","D":"地仓","E":"肾俞"},"answer":"B","explain":"痛经病位在胞宫，关元为任脉穴、小肠募穴，位于脐下 3 寸，能调理冲任、温通胞宫，为治痛经主穴。中脘治胃痛，百会升阳举陷，地仓治面瘫。故取关元。","tags":["高频"]},{"id":"LC-ZJ-0065","type":"B1","group":"ZJ-B1-004","group_stem":"A.中脘　B.关元　C.百会　D.地仓　E.肾俞","topic":"常见病证针灸治疗-主穴","difficulty":1,"stem":"面瘫针灸治疗的主穴是","options":{"A":"中脘","B":"关元","C":"百会","D":"地仓","E":"肾俞"},"answer":"D","explain":"面瘫治以祛风通络，地仓位于口角旁 0.4 寸，为治口眼歪斜的主穴，常配颊车、合谷、阳白。百会治头痛眩晕与脱肛，肾俞治腰痛。故取地仓。","tags":[]},{"id":"LC-ZJ-0066","type":"B1","group":"ZJ-B1-004","group_stem":"A.中脘　B.关元　C.百会　D.地仓　E.肾俞","topic":"常见病证针灸治疗-主穴","difficulty":1,"stem":"腰痛针灸治疗的主穴是","options":{"A":"中脘","B":"关元","C":"百会","D":"地仓","E":"肾俞"},"answer":"E","explain":"腰为肾之府，肾俞位于第 2 腰椎棘突下旁开 1.5 寸，为治腰痛主穴，常配大肠俞、腰阳关、委中。中脘治胃痛，关元偏治痛经与虚脱。故取肾俞。","tags":["高频"]},{"id":"LC-ZJ-0067","type":"B1","group":"ZJ-B1-005","group_stem":"A.隔姜灸　B.隔蒜灸　C.隔盐灸　D.隔附子饼灸　E.隔胡椒饼灸","topic":"灸法-间接灸应用","difficulty":2,"stem":"治疗瘰疬、肺痨宜选用的灸法是","options":{"A":"隔姜灸","B":"隔蒜灸","C":"隔盐灸","D":"隔附子饼灸","E":"隔胡椒饼灸"},"answer":"B","explain":"隔蒜灸以蒜片间隔施灸，有清热解毒、杀虫之功，多用于瘰疬、肺痨、疮毒初起。隔姜灸偏温胃散寒止呕，隔盐灸偏回阳固脱。故瘰疬、肺痨宜用隔蒜灸。","tags":["高频"]},{"id":"LC-ZJ-0068","type":"B1","group":"ZJ-B1-005","group_stem":"A.隔姜灸　B.隔蒜灸　C.隔盐灸　D.隔附子饼灸　E.隔胡椒饼灸","topic":"灸法-间接灸应用","difficulty":3,"stem":"治疗命门火衰所致阳痿宜选用的灸法是","options":{"A":"隔姜灸","B":"隔蒜灸","C":"隔盐灸","D":"隔附子饼灸","E":"隔胡椒饼灸"},"answer":"D","explain":"隔附子饼灸以附子饼间隔施灸，附子辛热，能温补肾阳，多用于命门火衰之阳痿、早泄、遗精及宫寒不孕。隔姜灸偏散寒止呕，隔盐灸偏回阳固脱。故取隔附子饼灸。","tags":["高频"]},{"id":"LC-ZJ-0069","type":"B1","group":"ZJ-B1-005","group_stem":"A.隔姜灸　B.隔蒜灸　C.隔盐灸　D.隔附子饼灸　E.隔胡椒饼灸","topic":"灸法-间接灸应用","difficulty":1,"stem":"治疗风寒痹痛、虚寒性呕吐腹痛宜选用的灸法是","options":{"A":"隔姜灸","B":"隔蒜灸","C":"隔盐灸","D":"隔附子饼灸","E":"隔胡椒饼灸"},"answer":"A","explain":"隔姜灸以鲜姜片间隔施灸，生姜辛温，有温胃止呕、散寒止痛之功，适用于因寒所致的呕吐、腹痛、泄泻及风寒痹痛。隔蒜灸偏清热解毒，隔盐灸偏回阳固脱。故取隔姜灸。","tags":["高频"]},{"id":"LC-ZJ-0070","type":"B1","group":"ZJ-B1-005","group_stem":"A.隔姜灸　B.隔蒜灸　C.隔盐灸　D.隔附子饼灸　E.隔胡椒饼灸","topic":"灸法-间接灸应用","difficulty":2,"stem":"治疗中风脱证宜选用的灸法是","options":{"A":"隔姜灸","B":"隔蒜灸","C":"隔盐灸","D":"隔附子饼灸","E":"隔胡椒饼灸"},"answer":"C","explain":"中风脱证见神昏、肢冷、脉微，治当回阳固脱，取神阙隔盐灸，可大炷多壮连续施灸。隔姜灸力偏温中散寒，隔附子饼灸偏温补肾阳，均不足以救暴脱。故取隔盐灸。","tags":["鉴别"]}]}]};</script>
