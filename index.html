      o._paper = m.paper || (String(m.bank_id).indexOf('jichu') === 0 ? 'jichu' : 'linchuang');
      QS.push(o);
      BYID[o.id] = o;
    });
  });
  BANKS.forEach(function (m) { m._n = (m.count || 0) || QS.filter(function (q) { return q._bank === m.bank_id; }).length; });

  // 考纲权重（用于每日抽题与报告占比）
  var SUBJ_W = {
    '中医基础理论': 12, '中医诊断学': 12, '中药学': 12, '方剂学': 10,
    '中医内科学': 20, '针灸学': 13, '中医外科学': 7, '中医妇科学': 7, '中医儿科学': 7
  };
  var SUBJ_ORDER = ['中医基础理论', '中医诊断学', '中药学', '方剂学',
    '中医内科学', '针灸学', '中医外科学', '中医妇科学', '中医儿科学'];
  var ALL_SUBJ = BANKS.map(function (m) { return m.subject; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; });
  SUBJ_ORDER = SUBJ_ORDER.filter(function (s) { return ALL_SUBJ.indexOf(s) >= 0; })
    .concat(ALL_SUBJ.filter(function (s) { return SUBJ_ORDER.indexOf(s) < 0; }));

  function subjIndex(qs) {
    var m = {};
    qs.forEach(function (q) {
      var s = q._subj;
      if (!m[s]) m[s] = { t: 0, c: 0 };
      m[s].t++;
      if (m[s].c === undefined) m[s].c = 0;
    });
    return m;
  }

  // ========== 2. 存储 ==========
  var KEY = 'tcm_lzc_v1';
  function todayKey(d) {
    var x = d || new Date();
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayDiff(a, b) {
    var d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
    return Math.round((d2 - d1) / 86400000);
  }
  function addDays(k, n) {
    var d = new Date(k + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return todayKey(d);
  }

  function defaults() {
    var d = new Date(); d.setDate(d.getDate() + 240);
    return {
      v: 1,
      settings: { examDate: todayKey(d), daily: 40, instant: true, timer: true },
      today: null,
      days: {}, seen: {}, wrong: {}, marks: {}, hist: [], session: null
    };
  }
  var S;
  try {
    S = JSON.parse(localStorage.getItem(KEY) || 'null') || defaults();
  } catch (e) { S = defaults(); }
  ['settings', 'days', 'seen', 'wrong', 'marks', 'hist'].forEach(function (k) {
    if (!S[k]) S[k] = defaults()[k];
  });
  if (!S.settings.examDate) S.settings.examDate = defaults().settings.examDate;

  var saveT = null;
  function save() {
    if (saveT) clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn('存储失败', e); }
    }, 120);
  }

  // ========== 3. 工具 ==========
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sample(arr, n) {
    if (n >= arr.length) return shuffle(arr);
    return shuffle(arr).slice(0, n);
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function fmtMMSS(sec) {
    if (sec < 0) sec = 0;
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(s);
  }

  // ========== 4. 今日任务 ==========
  function ensureToday() {
    var t = todayKey();
    if (S.today && S.today.date === t && S.today.ids && S.today.ids.length) return S.today;
    S.today = { date: t, ids: pickDaily(S.settings.daily || 40), done: 0 };
    save();
    return S.today;
  }

  // 按考纲权重抽题：优先未做过、其次到期复习、最后随机
  function pickDaily(n) {
    var pool = QS.slice();
    var picked = [], used = {};
    var dueWrong = Object.keys(S.wrong).filter(function (id) {
      return BYID[id] && S.wrong[id].due && S.wrong[id].due <= todayKey();
    });
    // 先塞 6 道到期错题
    sample(dueWrong, Math.min(6, Math.floor(n * 0.15))).forEach(function (id) {
      if (!used[id]) { used[id] = 1; picked.push(id); }
    });
    var rest = n - picked.length;

    // 按权重分配
    var wsum = 0;
    SUBJ_ORDER.forEach(function (s) { wsum += (SUBJ_W[s] || 5); });
    var plan = [];
    SUBJ_ORDER.forEach(function (s) {
      var quota = Math.round(rest * (SUBJ_W[s] || 5) / wsum);
      var list = pool.filter(function (q) { return q._subj === s && !used[q.id]; });
      var fresh = list.filter(function (q) { return !S.seen[q.id]; });
      var old = list.filter(function (q) { return S.seen[q.id]; });
      var take = [];
      take = take.concat(sample(fresh, Math.min(fresh.length, Math.ceil(quota * 0.65))));
      var left = quota - take.length;
      if (left > 0) take = take.concat(sample(old, Math.min(old.length, left)));
      take.forEach(function (q) { if (take.length && !used[q.id]) { used[q.id] = 1; picked.push(q.id); } });
      plan.push({ s: s, quota: quota, got: take.length });
    });

    // 补齐
    if (picked.length < n) {
      var more = sample(QS.filter(function (q) { return !used[q.id]; }), n - picked.length);
      more.forEach(function (q) { used[q.id] = 1; picked.push(q.id); });
    }
    return picked.slice(0, n);
  }

  // ========== 5. 会话 ==========
  var V = 'home', PAYLOAD = null;

  function startSession(cfg) {
    S.session = {
      mode: cfg.mode, title: cfg.title, ids: cfg.ids, answers: {},
      cur: 0, started: Date.now(), limitSec: cfg.limitSec || 0,
      instant: !!cfg.instant, submitted: false, res: null
    };
    save();
    V = 'quiz';
    render();
  }

  function curSess() { return S.session; }

  // ========== 6. 计算成绩 ==========
  function compute(ids, answers) {
    var m = { total: ids.length, answered: 0, correct: 0, wrongIds: [], perSubj: {}, perTopic: {} };
    ids.forEach(function (id) {
      var q = BYID[id]; if (!q) return;
      var s = q._subj, tp = (q.topic || '未分类');
      if (!m.perSubj[s]) m.perSubj[s] = { t: 0, c: 0 };
      if (!m.perTopic[tp]) m.perTopic[tp] = { t: 0, c: 0, s: s };
      m.perSubj[s].t++; m.perTopic[tp].t++;
      var a = answers[id];
      if (a) m.answered++;
      if (a && a === q.answer) { m.correct++; m.perSubj[s].c++; m.perTopic[tp].c++; }
      else { m.wrongIds.push(id); }
    });
    m.pass = Math.ceil(m.total * 0.6);
    m.passed = m.correct >= m.pass;
    return m;
  }

  function applyResult(sess) {
    var r = compute(sess.ids, sess.answers);
    sess.res = r;
    sess.submitted = true;

    var t = todayKey();
    if (!S.days[t]) S.days[t] = { n: 0, c: 0 };
    sess.ids.forEach(function (id) {
      var q = BYID[id]; if (!q) return;
      var ok = sess.answers[id] === q.answer;
      if (!S.seen[id]) S.seen[id] = { n: 0, c: 0 };
      S.seen[id].n++; if (ok) S.seen[id].c++;
      S.days[t].n++; if (ok) S.days[t].c++;
      if (!ok) {
        var w = S.wrong[id] || { n: 0, lv: 0 };
        w.n++; w.lv = 0; w.last = t; w.due = addDays(t, 1);
        S.wrong[id] = w;
      }
    });
    S.hist.push({
      t: t, at: Date.now(), mode: sess.mode, title: sess.title,
      total: r.total, correct: r.correct, pass: r.pass
    });
    if (S.hist.length > 200) S.hist = S.hist.slice(-200);
    save();
    V = 'report';
    PAYLOAD = sess;
    render();
  }

  // 错题本答对后推进记忆曲线
  function bumpWrong(id, ok) {
    var w = S.wrong[id];
    if (!w) return;
    if (ok) {
      var lv = (w.lv || 0) + 1;
      var steps = [1, 2, 4, 7, 15, 30, 60];
      w.lv = lv;
      w.due = addDays(todayKey(), steps[Math.min(lv, steps.length - 1)]);
      if (lv >= 5) { w.graduated = true; }
    } else {
      w.n = (w.n || 0) + 1; w.lv = 0; w.due = addDays(todayKey(), 1);
    }
    save();
  }

  // ========== 7. 首页 ==========
  function streak() {
    var n = 0, d = todayKey();
    // 今天没做也算连续（从昨天往前数）
    if (!S.days[d] || !S.days[d].n) d = addDays(d, -1);
    while (S.days[d] && S.days[d].n > 0) { n++; d = addDays(d, -1); }
    return n;
  }

  function totals() {
    var n = 0, c = 0, seen = 0;
    for (var k in S.seen) { n += S.seen[k].n; c += S.seen[k].c; seen++; }
    return { n: n, c: c, seen: seen };
  }

  function viewHome() {
    var t = ensureToday();
    var done = (S.days[todayKey()] && S.days[todayKey()].n) || 0;
    var goal = S.settings.daily || 40;
    var todayDone = Math.min(done, goal);
    var pr = pct(todayDone, goal);

    var left = dayDiff(todayKey(), S.settings.examDate);
    var T = totals();
    var acc = pct(T.c, T.n);
    var dueN = Object.keys(S.wrong).filter(function (id) {
      return BYID[id] && !S.wrong[id].graduated && (!S.wrong[id].due || S.wrong[id].due <= todayKey());
    }).length;

    // 各科掌握度
    var bySubj = {};
    SUBJ_ORDER.forEach(function (s) { bySubj[s] = { t: 0, c: 0, n: 0, uniq: 0 }; });
    QS.forEach(function (q) { if (bySubj[q._subj]) bySubj[q._subj].uniq++; });
    for (var id in S.seen) {
      var q = BYID[id]; if (!q) continue;
      var b = bySubj[q._subj]; if (!b) continue;
      b.t += S.seen[id].n; b.c += S.seen[id].c;
      if (S.seen[id].n > 0) b.n++;
    }

    var subjHtml = SUBJ_ORDER.map(function (s) {
      var b = bySubj[s];
      var coverage = pct(b.n, b.uniq);
      var a = b.t ? pct(b.c, b.t) : 0;
      var cls = !b.t ? '' : (a >= 75 ? 'ok' : a >= 60 ? 'mid' : 'bad');
      return '<div class="subj"><div class="hd"><b>' + esc(s) + '</b>' +
        '<span class="muted">' + (b.t ? a + '%' : '未练') + ' · 覆盖 ' + coverage + '%</span></div>' +
        '<div class="bar"><i class="' + cls + '" style="width:' + (b.t ? a : 0) + '%"></i></div></div>';
    }).join('');

    var h = '';
    h += '<div class="top"><div style="flex:1"><div class="brand">' +
      '<div class="seal serif">醫</div><div><div class="n1">中医专长 · 每日一练</div>' +
      '<div class="n2">老专长（52号令）综合笔试 · 仿真题库</div></div></div></div>' +
      '<button class="act" data-go="settings">设置</button></div>';

    h += '<div class="hero">' +
      '<div class="k">今日任务</div>' +
      '<div class="big">' + todayDone + '<em>/ ' + goal + ' 题</em></div>' +
      '<div class="sub">' + (pr >= 100 ? '今日已达标，做得稳。' : '再练 ' + (goal - todayDone) + ' 题就完成今天的量。') + '</div>' +
      '<div class="progress"><i style="width:' + pr + '%"></i></div>' +
      '<div class="row between" style="margin-top:14px">' +
      '<span class="tiny">距考试 ' + (left > 0 ? left + ' 天' : '已过') + '</span>' +
      '<span class="tiny">合格线 ' + goal + ' 题里答对 ' + Math.ceil(goal * 0.6) + ' 题</span></div>' +
      '</div>';

    h += '<div class="kpis">' +
      kpi(streak(), '连续天数') + kpi(T.n, '累计题量') +
      kpi(acc + '%', '总正确率') + kpi(dueN, '待复习错题') + '</div>';

    h += '<div class="entries">' +
      '<button class="entry primary wide" data-act="daily">' +
      '<span class="ico">✎</span><span class="grow"><span class="t">' + (pr >= 100 ? '再练一轮' : '开始今日练习') + '</span>' +
      '<span class="d">' + goal + ' 题 · 按考纲权重分配 · 即时解析</span></span>' +
      '<span style="font-size:20px;opacity:.7">›</span></button>' +
      '<button class="entry" data-act="mock"><span class="ico">⏱</span><span class="t">全真模拟</span>' +
      '<span class="d">300 题 / 300 分钟</span></button>' +
      '<button class="entry" data-act="subject"><span class="ico">☰</span><span class="t">专项练习</span>' +
      '<span class="d">按科目攻克</span></button>' +
      '<button class="entry" data-act="wrong"><span class="ico">✱</span><span class="t">错题本</span>' +
      '<span class="d">' + Object.keys(S.wrong).length + ' 题 · 待复习 ' + dueN + '</span></button>' +
      '<button class="entry" data-go="stats"><span class="ico">◎</span><span class="t">学习报告</span>' +
      '<span class="d">正确率与趋势</span></button>' +
      '</div>';

    h += '<div class="sec-title"><h3>各科掌握度</h3><span class="more">按累计正确率</span></div>';
    h += '<div class="card">' + subjHtml + '</div>';

    h += '<div class="sec-title"><h3>说明</h3></div>' +
      '<div class="card flat"><div class="tiny" style="line-height:1.8">' +
      '本库为依据老专长大纲命制的<b>仿真题</b>，非考试真题。真题各省不公开流通，网上所称“真题”多为回忆版。<br>' +
      '题库共 ' + QS.length + ' 题，覆盖 ' + SUBJ_ORDER.length + ' 个科目；全真模拟按真考 300 题 / 300 分钟、60% 合格线设置。' +
      '</div></div>';

    return h;
  }
  function kpi(v, l) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  // ========== 8. 答题页 ==========
  function viewQuiz() {
    var s = curSess();
    if (!s) { V = 'home'; return viewHome(); }
    var q = BYID[s.ids[s.cur]];
    if (!q) { V = 'home'; return viewHome(); }

    var answered = s.answers[q.id];
    var showRes = s.instant && answered;

    // 组头
    var gh = '';
    if (q.type === 'B1' && q.group) {
      var prev = s.cur > 0 ? BYID[s.ids[s.cur - 1]] : null;
      if (!prev || prev.group !== q.group) {
        gh = '<div class="groupbox">' + esc(q.group_stem || '') + '</div>';
      }
    }

    var h = '<div class="top"><button class="back" data-act="quit">‹</button>' +
      '<div class="ttl">' + esc(s.title) + '</div>' +
      '<span class="act" style="box-shadow:none;background:transparent;font-variant-numeric:tabular-nums" id="timer">' + timerText() + '</span>' +
      (s.mode === 'mock' && !s.submitted
        ? '<button class="act" data-act="handin" style="background:var(--red);color:#fff">交卷</button>'
        : '') +
      '</div>';

    h += '<div class="qhead">' +
      '<span class="pill">' + q.type + '</span>' +
      '<span class="pill gray">' + esc(q._subj) + '</span>' +
      (q.topic ? '<span class="pill blue">' + esc(q.topic) + '</span>' : '') +
      '<span class="qidx">' + (s.cur + 1) + ' / ' + s.ids.length + '</span></div>';

    h += gh;
    h += '<div class="qstem"><span class="num">' + (s.cur + 1) + '.</span>' + esc(q.stem).replace(/\n/g, '<br>') + '</div>';

    var keys = ['A', 'B', 'C', 'D', 'E'];
    keys.forEach(function (k) {
      var v = q.options && q.options[k];
      if (!v) return;
      var cls = 'opt';
      if (showRes) {
        if (k === q.answer) cls += ' right';
        else if (k === answered) cls += ' wrong';
        else cls += ' dim';
      } else if (answered === k) cls += ' sel';
      h += '<button class="' + cls + '" data-opt="' + k + '"><span class="k">' + k + '</span>' +
        '<span class="v">' + esc(v) + '</span></button>';
    });

    if (showRes) {
      var ok = answered === q.answer;
      h += '<div class="explain' + (ok ? '' : ' wrongx') + '">' +
        '<div class="h">' + (ok ? '✓ 答对了' : '✗ 答错了 · 正确答案 ' + q.answer) + '</div>' +
        esc(q.explain || '暂无解析') + '</div>';
    }

    h += '<div style="height:64px"></div>';
    h += '<div class="footbar"><div class="inner">' +
      '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>上一题</button>' +
      '<button class="btn small" data-act="sheet">答题卡 ' + Object.keys(s.answers).length + '/' + s.ids.length + '</button>' +
      '<button class="btn primary" data-act="next">' +
      (s.cur === s.ids.length - 1 ? (s.mode === 'mock' ? '交卷' : '完成') : '下一题') + '</button>' +
      '</div></div>';

    return h;
  }

  function timerText() {
    var s = curSess();
    if (!s || !s.limitSec || !S.settings.timer) return '';
    var left = Math.floor((s.started + s.limitSec * 1000 - Date.now()) / 1000);
    return '⏱ ' + fmtMMSS(left);
  }

  // ========== 9. 答题卡 ==========
  function viewSheet() {
    var s = curSess(); if (!s) { V = 'home'; return viewHome(); }
    var cls = s.ids.length > 40 ? 'sheet p5' : 'sheet';
    var h = '<div class="top"><button class="back" data-act="closesheet">‹</button>' +
      '<div class="ttl">答题卡</div><span class="act" style="box-shadow:none;background:transparent">' +
      Object.keys(s.answers).length + '/' + s.ids.length + '</span></div>';
    h += '<div class="card"><div class="' + cls + '">';
    s.ids.forEach(function (id, i) {
      var c = 'sq';
      if (s.answers[id]) c += ' done';
      if (S.marks[id]) c += ' mark';
      if (i === s.cur) c += ' cur';
      h += '<button class="' + c + '" data-jump="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div></div>';
    h += '<div class="card flat"><div class="row" style="gap:18px;font-size:12.5px;color:var(--mute)">' +
      '<span>● 已答</span><span>○ 未答</span><span>◍ 已标记</span></div></div>';
    h += '<div class="footbar"><div class="inner">' +
      '<button class="btn" data-act="mark">' + (S.marks[s.ids[s.cur]] ? '取消标记' : '标记本题') + '</button>' +
      (s.mode === 'mock' ? '<button class="btn primary" data-act="handin">交卷</button>' : '<button class="btn primary" data-act="closesheet">继续答题</button>') +
      '</div></div>';
    return h;
  }

  // ========== 10. 报告 ==========
  function viewReport() {
    var s = PAYLOAD || curSess();
    if (!s || !s.res) { V = 'home'; return viewHome(); }
    var r = s.res;
    var acc = pct(r.correct, r.total);
    var gap = r.pass - r.correct;

    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">成绩报告</div><span class="act" style="box-shadow:none;background:transparent">' + esc(s.title) + '</span></div>';

    h += '<div class="score-hero ' + (r.passed ? 'pass' : 'fail') + '">' +
      '<div class="lab">得分</div>' +
      '<div class="num">' + r.correct + '<small> / ' + r.total + '</small></div>' +
      '<div class="verdict">' + (r.passed ? '达标 · 已过合格线' : '未达标 · 差 ' + gap + ' 分') + '</div>' +
      '<div class="note">合格线 ' + r.pass + ' 分（60%） · 正确率 ' + acc + '% · 作答 ' + r.answered + '/' + r.total + '</div>' +
      '</div>';

    // 分卷
    var pj = { jichu: { t: 0, c: 0 }, linchuang: { t: 0, c: 0 } };
    s.ids.forEach(function (id) {
      var q = BYID[id]; if (!q) return;
      var b = pj[q._paper]; if (!b) return;
      b.t++; if (s.answers[id] === q.answer) b.c++;
    });
    if (pj.jichu.t && pj.linchuang.t) {
      h += '<div class="grid2" style="margin-bottom:12px">' +
        '<div class="stat"><div class="v">' + pj.jichu.c + '<span style="font-size:13px;color:var(--mute)">/' + pj.jichu.t + '</span></div>' +
        '<div class="l">卷一 中医基础知识</div></div>' +
        '<div class="stat"><div class="v">' + pj.linchuang.c + '<span style="font-size:13px;color:var(--mute)">/' + pj.linchuang.t + '</span></div>' +
        '<div class="l">卷二 中医临床知识</div></div></div>';
    }

    // 分科
    h += '<div class="sec-title"><h3>分科得分</h3></div>';
    h += '<div class="card">';
    var rows = SUBJ_ORDER.filter(function (x) { return r.perSubj[x]; });
    rows.forEach(function (x) {
      var b = r.perSubj[x];
      var a = pct(b.c, b.t);
      var cls = a >= 75 ? 'ok' : a >= 60 ? 'mid' : 'bad';
      h += '<div class="subj"><div class="hd"><b>' + esc(x) + '</b>' +
        '<span class="muted">' + b.c + '/' + b.t + ' · ' + a + '%</span></div>' +
        '<div class="bar"><i class="' + cls + '" style="width:' + a + '%"></i></div></div>';
    });
    h += '</div>';

    // 薄弱考点
    var weak = Object.keys(r.perTopic).map(function (tp) {
      var b = r.perTopic[tp];
      return { tp: tp, s: b.s, t: b.t, c: b.c, a: pct(b.c, b.t) };
    }).filter(function (x) { return x.a < 100; }).sort(function (a, b) { return a.a - b.a || b.t - a.t; }).slice(0, 8);

    if (weak.length) {
      h += '<div class="sec-title"><h3>需要补的考点</h3><span class="more">按错得多排</span></div>';
      h += '<div class="card"><div class="weaklist">' + weak.map(function (w) {
        return '<div class="w"><span class="nm">' + esc(w.tp) + ' <span class="tiny">· ' + esc(w.s) + '</span></span>' +
          '<span class="sc">' + w.c + '/' + w.t + '</span>' +
          '<span class="pill ' + (w.a < 50 ? 'red' : '') + '">' + w.a + '%</span></div>';
      }).join('') + '</div></div>';
    }

    // 错题
    if (r.wrongIds.length) {
      h += '<div class="sec-title"><h3>本次错题</h3><span class="more">' + r.wrongIds.length + ' 题</span></div>';
      h += '<div class="card">' + r.wrongIds.slice(0, 30).map(function (id) {
        var q = BYID[id]; if (!q) return '';
        return '<div style="padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px">' +
          '<div style="color:var(--ink2);line-height:1.6">' + esc(q.stem).slice(0, 60) + (q.stem.length > 60 ? '…' : '') + '</div>' +
          '<div class="tiny" style="margin-top:3px">你选 ' + (s.answers[id] || '未答') + ' · 正确 <b style="color:var(--green)">' + q.answer + '</b> · ' + esc(q._subj) + '</div></div>';
      }).join('') + (r.wrongIds.length > 30 ? '<div class="tiny" style="padding-top:9px">仅显示前 30 题</div>' : '') + '</div>';
    }

    h += '<div class="footbar"><div class="inner">' +
      '<button class="btn" data-act="home">返回首页</button>' +
      (r.wrongIds.length ? '<button class="btn primary" data-act="retrywrong">重练错题</button>' : '') +
      '</div></div>';
    return h;
  }

  // ========== 11. 错题本 ==========
  function viewWrong() {
    var ids = Object.keys(S.wrong).filter(function (id) { return BYID[id]; });
    var due = ids.filter(function (id) { return !S.wrong[id].graduated && (!S.wrong[id].due || S.wrong[id].due <= todayKey()); });
    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">错题本</div><span class="act" style="box-shadow:none;background:transparent">' + ids.length + ' 题</span></div>';

    if (!ids.length) {
      return h + '<div class="empty"><div class="ico">✱</div><p>还没有错题</p><p class="tiny">做错的题会自动进这里，按 1/2/4/7/15/30 天排期复习</p></div>' +
        '<div class="footbar"><div class="inner"><button class="btn primary" data-act="daily">去练今日题</button></div></div>';
    }

    // 按科目分组
    var grp = {};
    ids.forEach(function (id) {
      var q = BYID[id];
      (grp[q._subj] = grp[q._subj] || []).push(id);
    });

    h += '<div class="grid2" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + due.length + '</div><div class="l">今日待复习</div></div>' +
      '<div class="stat"><div class="v">' + ids.length + '</div><div class="l">累计错题</div></div></div>';

    SUBJ_ORDER.forEach(function (s) {
      if (!grp[s]) return;
      h += '<div class="sec-title"><h3>' + esc(s) + '</h3><span class="more">' + grp[s].length + ' 题</span></div>';
      h += '<div class="card">';
      grp[s].slice(0, 6).forEach(function (id) {
        var q = BYID[id], w = S.wrong[id];
        var late = w.due && w.due <= todayKey();
        h += '<div style="padding:9px 0;border-bottom:1px solid var(--line2)">' +
          '<div style="font-size:13.5px;line-height:1.6">' + esc(q.stem).slice(0, 56) + '…</div>' +
          '<div class="tiny" style="margin-top:3px">错 ' + (w.n || 1) + ' 次 · ' +
          (late ? '<b style="color:var(--red)">该复习了</b>' : '下次 ' + (w.due || '—')) + ' · 答 ' + q.answer + '</div></div>';
      });
      if (grp[s].length > 6) h += '<div class="tiny" style="padding-top:9px">还有 ' + (grp[s].length - 6) + ' 题</div>';
      h += '</div>';
    });

    h += '<div class="footbar"><div class="inner">' +
      '<button class="btn" data-act="home">首页</button>' +
      '<button class="btn primary" data-act="reviewwrong">' + (due.length ? '复习今日 ' + due.length + ' 题' : '随机复习 20 题') + '</button>' +
      '</div></div>';
    return h;
  }

  // ========== 12. 专项练习 ==========
  function viewSubject() {
    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">专项练习</div></div>';
    h += '<div class="card flat"><div class="tiny">选一科集中刷，题量自选。练习模式即时看解析。</div></div>';
    SUBJ_ORDER.forEach(function (s) {
      var n = QS.filter(function (q) { return q._subj === s; }).length;
      var empty = n === 0;
      h += '<button class="entry wide" style="width:100%;margin-bottom:9px;' + (empty ? 'opacity:.45;pointer-events:none' : '') + '" data-subj="' + esc(s) + '">' +
        '<span class="ico">◈</span><span class="grow"><span class="t">' + esc(s) + '</span>' +
        '<span class="d">' + n + ' 题可用</span></span><span style="font-size:18px;color:var(--mute)">›</span></button>';
    });
    return h;
  }

  // ========== 13. 模拟考设置 ==========
  function viewMock() {
    var nj = QS.filter(function (q) { return q._paper === 'jichu'; }).length;
    var nl = QS.filter(function (q) { return q._paper === 'linchuang'; }).length;
    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">全真模拟</div></div>';
    h += '<div class="card flat"><div class="tiny" style="line-height:1.8">' +
      '按真考形态：<b>300 题 / 300 分钟</b>，分两卷，每卷 150 题 150 分钟，60% 合格（180 分）。' +
      '模拟模式下作答不显对错，交卷后统一评分。</div></div>';
    h += '<button class="entry wide" style="width:100%;margin-bottom:10px" data-mock="all">' +
      '<span class="ico">⏱</span><span class="grow"><span class="t">全真两卷连考</span>' +
      '<span class="d">300 题 · 300 分钟 · 最接近真考</span></span><span style="font-size:18px;color:var(--mute)">›</span></button>';
    h += '<button class="entry wide" style="width:100%;margin-bottom:10px" data-mock="jichu">' +
      '<span class="ico">①</span><span class="grow"><span class="t">卷一 · 中医基础知识</span>' +
      '<span class="d">150 题 · 150 分钟 · 库存 ' + nj + '</span></span><span style="font-size:18px;color:var(--mute)">›</span></button>';
    h += '<button class="entry wide" style="width:100%;margin-bottom:10px" data-mock="linchuang">' +
      '<span class="ico">②</span><span class="grow"><span class="t">卷二 · 中医临床知识</span>' +
      '<span class="d">150 题 · 150 分钟 · 库存 ' + nl + '</span></span><span style="font-size:18px;color:var(--mute)">›</span></button>';
    h += '<button class="entry wide" style="width:100%" data-mock="quick">' +
      '<span class="ico">⚡</span><span class="grow"><span class="t">半程模考（推荐日常）</span>' +
      '<span class="d">100 题 · 100 分钟 · 时间不够时用</span></span><span style="font-size:18px;color:var(--mute)">›</span></button>';
    return h;
  }

  // ========== 14. 学习报告 ==========
  function viewStats() {
    var T = totals();
    var acc = pct(T.c, T.n);
    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">学习报告</div></div>';
    h += '<div class="grid2" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + T.n + '</div><div class="l">累计做题</div></div>' +
      '<div class="stat"><div class="v">' + acc + '%</div><div class="l">总正确率</div></div>' +
      '<div class="stat"><div class="v">' + T.seen + '</div><div class="l">做过的题</div></div>' +
      '<div class="stat"><div class="v">' + streak() + '</div><div class="l">连续天数</div></div></div>';

    // 最近 14 天
    h += '<div class="sec-title"><h3>最近 14 天</h3></div><div class="card">';
    var cells = [];
    for (var i = 13; i >= 0; i--) {
      var dk = addDays(todayKey(), -i);
      var d = S.days[dk];
      var n = d ? d.n : 0;
      var a = d ? pct(d.c, d.n) : 0;
      var lvl = !n ? 0 : a >= 75 ? 3 : a >= 60 ? 2 : 1;
      cells.push('<div style="text-align:center"><div style="height:44px;display:flex;align-items:flex-end;justify-content:center">' +
        '<div style="width:100%;max-width:26px;border-radius:5px;background:' +
        ['#ece4d4', '#f0c9bd', '#e0b173', '#7cb98f'][lvl] + ';height:' + (n ? Math.max(10, Math.min(44, n)) : 6) + 'px"></div></div>' +
        '<div class="tiny" style="font-size:10px;margin-top:4px">' + (n || '') + '</div></div>');
    }
    h += '<div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px">' + cells.join('') + '</div>';
    h += '<div class="tiny" style="margin-top:10px">柱高＝当日做题量；颜色 红＜60% 黄 60-75% 绿≥75%</div></div>';

    // 历史记录
    if (S.hist.length) {
      h += '<div class="sec-title"><h3>模考与练习记录</h3><span class="more">最近 12 次</span></div>';
      h += '<div class="card"><table class="tbl"><thead><tr><th>日期</th><th>类型</th><th style="text-align:right">得分</th></tr></thead><tbody>';
      S.hist.slice(-12).reverse().forEach(function (x) {
        h += '<tr><td>' + x.t.slice(5) + '</td><td style="color:var(--mute)">' + esc(x.title) + '</td>' +
          '<td style="text-align:right;font-weight:600;color:' + (x.correct >= x.pass ? 'var(--green)' : 'var(--red)') + '">' +
          x.correct + '/' + x.total + '</td></tr>';
      });
      h += '</tbody></table></div>';
    } else {
      h += '<div class="empty"><div class="ico">◎</div><p>还没有记录</p></div>';
    }
    return h;
  }

  // ========== 15. 设置 ==========
  function viewSettings() {
    var st = S.settings;
    var h = '<div class="top"><button class="back" data-act="home">‹</button>' +
      '<div class="ttl">设置</div></div>';
    h += '<div class="card">' +
      field('考试日期', '<input type="date" id="f-exam" value="' + st.examDate + '">', '用来算倒计时') +
      field('每日题量', '<input type="number" id="f-daily" min="10" max="300" step="5" value="' + st.daily + '">', '建议 40，约 2 周刷完一轮') +
      field('练习后立即显示解析', switchEl('f-instant', st.instant), '练习模式有效，模考不受影响') +
      field('显示倒计时', switchEl('f-timer', st.timer), '模考始终计时') +
      '</div>';

    h += '<div class="sec-title"><h3>数据</h3></div><div class="card">' +
      '<div class="row between" style="padding:10px 0"><span class="lab">导出备份</span>' +
      '<button class="btn small" data-act="export">导出 JSON</button></div>' +
      '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line2)"><span class="lab">导入备份</span>' +
      '<button class="btn small" data-act="import">选择文件</button></div>' +
      '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line2)"><span class="lab" style="color:var(--red)">清空全部进度</span>' +
      '<button class="btn small" style="color:var(--red)" data-act="reset">清空</button></div>' +
      '</div>';

    h += '<div class="card flat"><div class="tiny" style="line-height:1.8">' +
      '题库版本 ' + esc((BANKS[0] && BANKS[0].edition) || '2026-v1') + ' · 共 ' + QS.length + ' 题<br>' +
      '全部数据只存在本机浏览器，不上传任何服务器。</div></div>';
    return h;
  }
  function field(lab, ctrl, sub) {
    return '<div class="field"><div class="lab">' + lab + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + ctrl + '</div>';
  }
  function switchEl(id, on) {
    return '<button class="switch' + (on ? ' on' : '') + '" id="' + id + '"></button>';
  }

  // ========== 16. 渲染 ==========
  var app = document.getElementById('app');

  function render() {
    if (!QS.length) {
      app.innerHTML = '<div class="empty"><div class="ico">!</div><p>题库未加载</p><p class="tiny">请确认 questions 数据已注入</p></div>';
      return;
    }
    var html;
    switch (V) {
      case 'quiz': html = viewQuiz(); break;
      case 'sheet': html = viewSheet(); break;
      case 'report': html = viewReport(); break;
      case 'wrong': html = viewWrong(); break;
      case 'subject': html = viewSubject(); break;
      case 'mock': html = viewMock(); break;
      case 'stats': html = viewStats(); break;
      case 'settings': html = viewSettings(); break;
      default: html = viewHome();
    }
    app.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // ========== 17. 事件 ==========
  function go(v) { V = v; render(); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go],[data-opt],[data-jump],[data-subj],[data-mock]');
    if (!el) return;
    var s = curSess();

    if (el.dataset.go) { go(el.dataset.go); return; }

    if (el.dataset.opt !== undefined && el.dataset.opt !== '') {
      var k = el.dataset.opt;
      if (!s) return;
      if (s.mode === 'mock') {
        s.answers[s.ids[s.cur]] = k; save(); render(); return;
      }
      if (s.answers[s.ids[s.cur]]) return; // 已答锁定
      s.answers[s.ids[s.cur]] = k;
      var q = BYID[s.ids[s.cur]];
      if (s.mode === 'review') bumpWrong(q.id, k === q.answer);
      save();
      if (s.instant) render();
      return;
    }

    if (el.dataset.jump) {
      s.cur = +el.dataset.jump; save(); V = 'quiz'; render(); return;
    }
    if (el.dataset.subj) {
      var sj = el.dataset.subj;
      var list = shuffle(QS.filter(function (q) { return q._subj === sj; }));
      var n = Math.min(list.length, 30);
      showDialog('专项练习 · ' + sj,
        '本组抽 ' + n + ' 题。<br>练习模式，选完即时看解析。',
        [{ t: '开始 ' + n + ' 题', p: true, fn: function () {
          startSession({ mode: 'subject', title: sj, ids: list.slice(0, n).map(function (q) { return q.id; }), instant: S.settings.instant, limitSec: 0 });
        } }]);
      return;
    }
    if (el.dataset.mock) {
      var kind = el.dataset.mock;
      buildMock(kind);
      return;
    }

    var act = el.dataset.act;
    switch (act) {
      case 'daily':
        var t = ensureToday();
        var rest = t.ids.filter(function (id) { return !S.seen[id] || S.days[todayKey()]; });
        startSession({ mode: 'daily', title: '今日练习', ids: t.ids, instant: S.settings.instant, limitSec: 0 });
        break;
      case 'prev': if (s && s.cur > 0) { s.cur--; save(); render(); } break;
      case 'next':
        if (!s) break;
        if (s.cur < s.ids.length - 1) { s.cur++; save(); render(); }
        else if (s.mode === 'mock') { confirmHandin(); }
        else {
          var doneCount = Object.keys(s.answers).length;
          showDialog('本组完成', '共 ' + s.ids.length + ' 题，作答 ' + doneCount + ' 题。<br>看成绩报告？',
            [{ t: '稍后', fn: function () { go('home'); } },
             { t: '看报告', p: true, fn: function () { applyResult(s); } }]);
        }
        break;
      case 'sheet': V = 'sheet'; render(); break;
      case 'closesheet': V = 'quiz'; render(); break;
      case 'subject': V = 'subject'; render(); break;
      case 'mock': V = 'mock'; render(); break;
      case 'wrong': V = 'wrong'; render(); break;
      case 'mark':
        if (!s) break;
        var cid = s.ids[s.cur];
        if (S.marks[cid]) delete S.marks[cid]; else S.marks[cid] = 1;
        save(); render(); break;
      case 'handin': confirmHandin(); break;
      case 'quit':
        if (!s) { go('home'); break; }
        if (Object.keys(s.answers).length === 0) { S.session = null; save(); go('home'); break; }
        showDialog('退出本次练习？', '已作答 ' + Object.keys(s.answers).length + ' 题，退出后本轮进度不保留。',
          [{ t: '继续做', fn: function () { } },
           { t: '退出', p: true, fn: function () { S.session = null; save(); go('home'); } }]);
        break;
      case 'home': S.session = null; save(); go('home'); break;
      case 'retrywrong':
        if (!s || !s.res) break;
        var wids = s.res.wrongIds.slice();
        if (!wids.length) break;
        startSession({ mode: 'review', title: '错题重练', ids: wids, instant: true, limitSec: 0 });
        break;
      case 'reviewwrong':
        var dues = Object.keys(S.wrong).filter(function (id) {
          return BYID[id] && !S.wrong[id].graduated && (!S.wrong[id].due || S.wrong[id].due <= todayKey());
        });
        if (!dues.length) dues = sample(Object.keys(S.wrong).filter(function (id) { return BYID[id]; }), 20);
        if (!dues.length) { showDialog('错题本空的', '先去做今日练习吧。', [{ t: '好', p: true }]); break; }
        startSession({ mode: 'review', title: '错题复习', ids: shuffle(dues).slice(0, 30), instant: true, limitSec: 0 });
        break;
      case 'export': exportData(); break;
      case 'import': importData(); break;
      case 'reset':
        showDialog('清空全部进度？', '做题记录、错题本、统计都会删除，且无法恢复。', [
          { t: '取消', fn: function () { } },
          { t: '确认清空', p: true, fn: function () {
            var keep = S.settings; S = defaults(); S.settings = keep;
            localStorage.removeItem(KEY); save(); go('home');
          } }
        ]);
        break;
    }
  });

  // 设置项
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'f-exam') { S.settings.examDate = e.target.value; save(); }
    if (id === 'f-daily') {
      var v = parseInt(e.target.value, 10) || 40;
      S.settings.daily = Math.max(10, Math.min(300, v));
      S.today = null; save();
    }
  });
  document.addEventListener('click', function (e) {
    var el = e.target;
    if (el.id === 'f-instant') { S.settings.instant = !S.settings.instant; save(); el.classList.toggle('on'); }
    if (el.id === 'f-timer') { S.settings.timer = !S.settings.timer; save(); el.classList.toggle('on'); }
  });

  // ========== 18. 模考 ==========
  function buildMock(kind) {
    var jichu = QS.filter(function (q) { return q._paper === 'jichu'; });
    var lin = QS.filter(function (q) { return q._paper === 'linchuang'; });
    var ids = [], title = '', limit = 0;
    if (kind === 'all') {
      if (jichu.length < 150 || lin.length < 150) {
        showDialog('库存不足', '卷一需 150 题、卷二需 150 题。<br>当前卷一 ' + jichu.length + ' 题、卷二 ' + lin.length + ' 题。',
          [{ t: '知道了', p: true }]); return;
      }
      ids = sample(jichu, 150).map(id).concat(sample(lin, 150).map(id));
      title = '全真模拟 · 两卷'; limit = 300 * 60;
    } else if (kind === 'jichu') {
      ids = sample(jichu, Math.min(150, jichu.length)).map(id);
      title = '卷一 · 基础知识'; limit = 150 * 60;
    } else if (kind === 'linchuang') {
      ids = sample(lin, Math.min(150, lin.length)).map(id);
      title = '卷二 · 临床知识'; limit = 150 * 60;
    } else {
      ids = sample(QS, 100).map(id);
      title = '半程模考'; limit = 100 * 60;
    }
    function id(q) { return q.id; }
    showDialog('开始模拟？', esc(title) + '<br>' + ids.length + ' 题 / ' + Math.round(limit / 60) + ' 分钟，中途退出不保留。<br>时间到自动交卷。', [
      { t: '再想想', fn: function () { } },
      { t: '开始', p: true, fn: function () {
        startSession({ mode: 'mock', title: title, ids: ids, instant: false, limitSec: limit });
      } }
    ]);
  }

  function confirmHandin() {
    var s = curSess(); if (!s) return;
    var un = s.ids.length - Object.keys(s.answers).length;
    showDialog('确认交卷？', un > 0 ? '还有 <b>' + un + '</b> 题未作答，未答按 0 分计。' : '全部已作答。', [
      { t: '继续答题', fn: function () { } },
      { t: '交卷', p: true, fn: function () { applyResult(s); } }
    ]);
  }

  // ========== 18.5 键盘快捷键（电脑端） ==========
  document.addEventListener('keydown', function (e) {
    if (V !== 'quiz' || !curSess()) return;
    if (document.querySelector('.mask')) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var s = curSess();
    var k = e.key.toUpperCase();
    var map = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', '5': 'E' };
    var pick = map[k] || (['A', 'B', 'C', 'D', 'E'].indexOf(k) >= 0 ? k : null);
    if (pick) {
      e.preventDefault();
      var btn = document.querySelector('[data-opt="' + pick + '"]');
      if (btn) btn.click();
      return;
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (s.cur > 0) { s.cur--; save(); render(); } }
    if (e.key === 'ArrowRight' || e.key === 'Enter') {
      e.preventDefault();
      var nb = document.querySelector('[data-act="next"]');
      if (nb) nb.click();
    }
  });

  // ========== 19. 对话框 ==========
  function showDialog(title, body, acts) {
    var mask = document.createElement('div');
    mask.className = 'mask';
    var btns = (acts || [{ t: '好', p: true }]).map(function (a, i) {
      return '<button class="btn' + (a.p ? ' primary' : '') + '" data-i="' + i + '">' + a.t + '</button>';
    }).join('');
    mask.innerHTML = '<div class="dialog"><h4>' + title + '</h4><p>' + body + '</p><div class="acts">' + btns + '</div></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function (e) {
      if (e.target === mask) { mask.remove(); return; }
      var b = e.target.closest('[data-i]');
      if (!b) return;
      var a = acts[+b.dataset.i];
      mask.remove();
      if (a && a.fn) a.fn();
    });
  }

  // ========== 20. 导入导出 ==========
  function exportData() {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '中医专长练习进度-' + todayKey() + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  }
  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d || d.v !== 1) throw new Error('格式不符');
          S = d; save(); go('home');
          showDialog('导入成功', '进度已恢复。', [{ t: '好', p: true }]);
        } catch (err) { showDialog('导入失败', '文件不是有效的备份。', [{ t: '好', p: true }]); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  // ========== 21. 计时器 ==========
  setInterval(function () {
    var s = curSess();
    if (!s || s.submitted || !s.limitSec) return;
    var left = Math.floor((s.started + s.limitSec * 1000 - Date.now()) / 1000);
    var el = document.getElementById('timer');
    if (el) {
      el.textContent = '⏱ ' + fmtMMSS(left);
      el.style.color = left <= 300 ? 'var(--red)' : '';
      el.style.fontWeight = left <= 300 ? '700' : '';
    }
    if (left <= 0) {
      applyResult(s);
      showDialog('时间到', '已自动交卷。', [{ t: '看报告', p: true }]);
    }
  }, 1000);

  // 恢复未完成的会话（刷新兜底）
  if (S.session && S.session.ids && !S.session.submitted) {
    V = 'quiz';
  }

  render();

  // 调试出口
  window.__app = { S: function () { return S; }, qs: QS, compute: compute, setView: function (v) { V = v; render(); } };
})();

</script>
</body>
</html>
