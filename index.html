gs":["高频"]},{"id":"JC-JCL-0052","type":"A1","group":null,"topic":"病机-气血关系失常","difficulty":3,"stem":"大失血后出现气短乏力、汗出肢冷，其病机是","options":{"A":"气不摄血","B":"气血两虚","C":"气虚血瘀","D":"血虚气滞","E":"气随血脱"},"answer":"E","explain":"血为气之载体，大失血则气无所附而随血外脱，出现气短、汗出、肢冷，故为气随血脱。气不摄血是气虚不能统血而出血；气血两虚为二者俱虚而无暴脱；气虚血瘀、血虚气滞与急性大失血不符。","tags":["易错","高频"]},{"id":"JC-JCL-0053","type":"A1","group":null,"topic":"病机-内生五邪","difficulty":1,"stem":"内湿的产生主要责之于哪一脏功能失常","options":{"A":"心","B":"脾","C":"肝","D":"肺","E":"肾"},"answer":"B","explain":"脾主运化水湿，脾失健运则水湿内停而生内湿，故答脾。肺主通调水道、肾主蒸腾气化亦参与水液代谢，但内湿生成以脾运失职为关键。","tags":["高频"]},{"id":"JC-JCL-0054","type":"A1","group":null,"topic":"病机-水气凌心","difficulty":3,"stem":"水气凌心的病机是","options":{"A":"心阳虚衰，血行不畅","B":"脾虚失运，湿浊中阻","C":"肺失宣降，通调失职","D":"三焦不利，水道闭塞","E":"肾阳虚衰，水饮上逆"},"answer":"E","explain":"水气凌心指肾阳虚衰、气化不行，水饮内停上逆凌心。心阳虚衰血行不畅为心脉痹阻；脾虚湿盛困阻中焦；肺失宣降则通调失职；三焦不利为水道不畅，均非水饮上凌于心。","tags":["鉴别"]},{"id":"JC-JCL-0055","type":"A2","group":null,"topic":"病机-亡阳","difficulty":2,"stem":"患者，男，65岁。大汗淋漓，汗出而凉，四肢厥冷，神志淡漠，面色苍白，舌淡，脉微欲绝。其病机是","options":{"A":"亡阳","B":"亡阴","C":"气虚","D":"阳虚","E":"阴盛格阳"},"answer":"A","explain":"汗出而凉、四肢厥冷、神志淡漠、脉微欲绝，为阳气暴脱之亡阳证。亡阴见汗热而黏、烦躁、脉细数疾；气虚、阳虚程度较轻而无脉微欲绝；阴盛格阳为内真寒外假热，可见身热面赤。","tags":["高频"]},{"id":"JC-JCL-0056","type":"A2","group":null,"topic":"病机-血虚","difficulty":2,"stem":"患者，女，38岁。面色淡白，头晕眼花，心悸失眠，手足麻木，月经量少色淡，舌淡，脉细。其病机是","options":{"A":"气虚","B":"气血两虚","C":"血虚","D":"阳虚","E":"阴虚"},"answer":"C","explain":"面色淡白、头晕眼花、心悸失眠、肢麻、经少色淡、舌淡脉细，为血液亏虚、脏腑失养，故属血虚。气虚以乏力、气短、自汗为主；气血两虚需兼具气虚表现；阳虚有畏寒肢冷；阴虚见潮热盗汗、舌红少苔。","tags":["高频"]},{"id":"JC-JCL-0057","type":"A1","group":null,"topic":"防治原则-治未病","difficulty":2,"stem":"“见肝之病，知肝传脾，当先实脾”体现的治则是","options":{"A":"未病先防","B":"标本兼治","C":"扶正祛邪","D":"因时制宜","E":"既病防变"},"answer":"E","explain":"肝病易传脾，故在治肝同时先补脾以防传变，属既病防变。未病先防指未病之前调养防病；标本兼治为标本同调；扶正祛邪为处理正邪关系；因时制宜为三因制宜之一。","tags":["经典","高频"]},{"id":"JC-JCL-0058","type":"A1","group":null,"topic":"防治原则-三因制宜","difficulty":2,"stem":"“用寒远寒，用热远热”体现的治则是","options":{"A":"因人制宜","B":"因时制宜","C":"因地制宜","D":"正治","E":"反治"},"answer":"B","explain":"用寒远寒、用热远热指寒冷季节慎用寒药、炎热季节慎用热药，属因时制宜。因人制宜考虑年龄体质；因地制宜考虑地域环境；正治与反治是逆或顺病象而治的治则。","tags":["经典"]},{"id":"JC-JCL-0059","type":"B1","group":"JCL-B1-007","group_stem":"A.正治　B.反治　C.急则治标　D.缓则治本　E.标本兼治","topic":"防治原则-正治反治","difficulty":2,"stem":"“寒者热之”“热者寒之”所属的治则是","options":{"A":"正治","B":"反治","C":"急则治标","D":"缓则治本","E":"标本兼治"},"answer":"A","explain":"寒者热之、热者寒之是逆病证性质而治，属正治。反治为顺从病象的从治，如热因热用、寒因寒用。急则治标、缓则治本、标本兼治属标本缓急的治则。","tags":["高频"]},{"id":"JC-JCL-0060","type":"B1","group":"JCL-B1-007","group_stem":"A.正治　B.反治　C.急则治标　D.缓则治本　E.标本兼治","topic":"防治原则-正治反治","difficulty":2,"stem":"“热因热用”“寒因寒用”所属的治则是","options":{"A":"正治","B":"反治","C":"急则治标","D":"缓则治本","E":"标本兼治"},"answer":"B","explain":"热因热用、寒因寒用是顺从疾病假象而治，属反治。正治为逆病象而治，如寒者热之。急则治标、缓则治本、标本兼治属标本缓急的治则。","tags":["易错"]},{"id":"JC-JCL-0061","type":"B1","group":"JCL-B1-007","group_stem":"A.正治　B.反治　C.急则治标　D.缓则治本　E.标本兼治","topic":"防治原则-标本缓急","difficulty":2,"stem":"大出血患者首当止血以救急，所属治则是","options":{"A":"正治","B":"反治","C":"急则治标","D":"缓则治本","E":"标本兼治"},"answer":"C","explain":"大出血属急症，出血为标，急则治标，故先止血以救急，待血止后再治其本。缓则治本用于病势缓和时从本图治；标本兼治用于标本并重；正治、反治属逆顺病象而治的治则。","tags":[]},{"id":"JC-JCL-0062","type":"B1","group":"JCL-B1-007","group_stem":"A.正治　B.反治　C.急则治标　D.缓则治本　E.标本兼治","topic":"防治原则-标本缓急","difficulty":3,"stem":"肺痨日久，咳嗽轻微而潮热盗汗明显，治以滋阴降火为主，所属治则是","options":{"A":"正治","B":"反治","C":"急则治标","D":"缓则治本","E":"标本兼治"},"answer":"D","explain":"肺痨阴虚为本、咳嗽为标，咳嗽轻微而阴虚征象突出，病势缓和，故从本图治，属缓则治本。急则治标用于标急之证；标本兼治用于标本并重；正治与反治讲的是逆顺病象。","tags":["鉴别"]},{"id":"JC-JCL-0063","type":"A1","group":null,"topic":"经典原文-素问","difficulty":2,"stem":"“阴阳者，天地之道也，万物之纲纪”出自","options":{"A":"《素问·上古天真论》","B":"《灵枢·本神》","C":"《素问·至真要大论》","D":"《素问·阴阳应象大论》","E":"《灵枢·经脉》"},"answer":"D","explain":"此句出自《素问·阴阳应象大论》，强调阴阳是自然界的基本规律。上古天真论论养生与肾气；灵枢本神论神志；至真要大论论病机治则；灵枢经脉论经络循行。","tags":["经典"]},{"id":"JC-JCL-0064","type":"A1","group":null,"topic":"经典原文-素问","difficulty":3,"stem":"“正气存内，邪不可干”出自","options":{"A":"《素问·评热病论》","B":"《灵枢·百病始生》","C":"《素问·上古天真论》","D":"《素问·四气调神大论》","E":"《素问·刺法论》"},"answer":"E","explain":"此语出自《素问·遗篇·刺法论》，强调正气充盛则外邪难以侵袭。评热病论论热病；百病始生论外感发病；上古天真论、四气调神大论均论养生。","tags":["经典"]},{"id":"JC-JCL-0065","type":"A1","group":null,"topic":"经典原文-发病","difficulty":2,"stem":"“邪之所凑，其气必虚”说明","options":{"A":"正气不足是发病的内在根据","B":"邪气是发病的决定因素","C":"邪正相争决定疾病性质","D":"情志是发病的主要原因","E":"体质与发病无关"},"answer":"A","explain":"邪气得以侵袭之处，正气必然亏虚，说明正气不足是发病的内在根据。B 与正气存内邪不可干的认识相反。C 讲的是病性形成。D、E 均与原文不符。","tags":["经典","高频"]},{"id":"JC-JCL-0066","type":"A1","group":null,"topic":"经典原文-阴阳","difficulty":3,"stem":"“阴胜则阳病，阳胜则阴病”说明阴阳之间的","options":{"A":"互根互用","B":"消长平衡","C":"对立制约","D":"相互转化","E":"交感互藏"},"answer":"C","explain":"阴偏盛会损伤阳，阳偏盛会损伤阴，体现阴阳双方相互斗争、相互制约。互根互用指相互依存为用；消长平衡指量的增减；相互转化指在一定条件下向对立面转变；交感互藏指相互感应与寓藏。","tags":["经典","鉴别"]},{"id":"JC-JCL-0067","type":"A2","group":null,"topic":"综合辨析-壮水之主","difficulty":2,"stem":"患者，女，60岁。形体消瘦，五心烦热，潮热盗汗，腰膝酸软，舌红少苔，脉细数。治宜","options":{"A":"益火之源，以消阴翳","B":"壮水之主，以制阳光","C":"阴中求阳","D":"阳中求阴","E":"引火归元"},"answer":"B","explain":"腰膝酸软、五心烦热、潮热盗汗、舌红少苔、脉细数，为肾阴亏虚、虚热内生，治当滋阴以制阳，即壮水之主以制阳光。益火之源用于肾阳虚；阴中求阳用于阳虚及阴；阳中求阴用于阴虚及阳；引火归元用于虚阳浮越。","tags":["高频"]},{"id":"JC-JCL-0068","type":"A1","group":null,"topic":"综合辨析-反治","difficulty":3,"stem":"“通因通用”适用于","options":{"A":"脾虚泄泻","B":"气虚下陷","C":"寒湿泄泻","D":"肾虚不固","E":"热结旁流"},"answer":"E","explain":"通因通用指用通利之法治通泄之症，适用于实邪内结而通泄属假象者，热结旁流即燥屎内结而见下利清水。脾虚泄泻、气虚下陷、肾虚不固属虚证，当补当涩；寒湿泄泻当温中化湿。","tags":["易错","高频"]},{"id":"JC-JCL-0069","type":"A1","group":null,"topic":"综合辨析-反治","difficulty":3,"stem":"“塞因塞用”适用于","options":{"A":"食积腹胀","B":"气滞胀满","C":"水湿胀满","D":"脾虚腹胀","E":"瘀血腹满"},"answer":"D","explain":"塞因塞用指用补益之法治闭塞不通之症，适用于因虚致塞者，脾虚运化无力而腹胀当补脾。食积、气滞、水湿、瘀血所致胀满均为实证，当消导、行气、利水、活血。","tags":["易错"]},{"id":"JC-JCL-0070","type":"A1","group":null,"topic":"综合辨析-正治反治","difficulty":2,"stem":"下列属于正治法的是","options":{"A":"寒者热之","B":"热因热用","C":"寒因寒用","D":"塞因塞用","E":"通因通用"},"answer":"A","explain":"正治是逆病证性质而治，寒者热之即属正治。热因热用、寒因寒用、塞因塞用、通因通用均为顺从病象而治的反治法。","tags":["鉴别"]},{"id":"JC-JCL-0071","type":"A1","group":null,"topic":"综合辨析-脏腑关系","difficulty":2,"stem":"心肾相交的生理基础是","options":{"A":"肝升肺降，气机调畅","B":"脾气升清，胃气降浊","C":"肺主呼气，肾主纳气","D":"心主血脉，肾主藏精","E":"心火下降，肾水上升"},"answer":"E","explain":"心居上焦属火，肾居下焦属水，心火下降以温肾水、肾水上升以济心火，水火既济则心肾相交。肝升肺降属肝肺气机；脾胃升降属中焦；肺肾配合属呼吸；心肾功能对举不构成相交。","tags":["高频"]},{"id":"JC-JCL-0072","type":"A1","group":null,"topic":"综合辨析-五行传变","difficulty":3,"stem":"肝火犯肺，即“木火刑金”，属于五行传变中的","options":{"A":"相乘","B":"母病及子","C":"相侮","D":"子病犯母","E":"相生"},"answer":"C","explain":"肝木本受肺金所克，今肝火亢盛反侮肺金，属相侮。相乘是按相克次序过度克制，如木旺乘土；母病及子、子病犯母属相生关系传变。","tags":["易错","鉴别"]},{"id":"JC-JCL-0073","type":"A1","group":null,"topic":"综合辨析-气血关系","difficulty":3,"stem":"治疗大出血时配伍补气药，其理论依据是","options":{"A":"气能生血","B":"血能载气","C":"气能行血","D":"气能摄血","E":"血能化气"},"answer":"B","explain":"血为气之载体，大失血则气随血脱，故补气以固脱，依据是血能载气。气能生血用于血虚；气能行血用于血瘀；气能摄血用于气虚不摄之出血；血能化气非规范表述。","tags":["易错","高频"]},{"id":"JC-JCL-0074","type":"A1","group":null,"topic":"综合辨析-津血同源","difficulty":3,"stem":"“夺血者无汗，夺汗者无血”的理论依据是","options":{"A":"精血同源","B":"气血同源","C":"肝肾同源","D":"汗为心之液","E":"津血同源"},"answer":"E","explain":"津液与血同源于水谷精微，津能化血、血可化津，故失血者不可再发汗，夺汗者不可再伤血，依据是津血同源。精血同源指肝肾精血互化；气血同源指气血相互资生；汗为心之液讲汗与心的关系。","tags":["经典","鉴别"]},{"id":"JC-JCL-0075","type":"A1","group":null,"topic":"综合辨析-阴阳互根","difficulty":2,"stem":"“阴中求阳”治法的理论依据是","options":{"A":"阴阳对立","B":"阴阳消长","C":"阴阳转化","D":"阴阳互根","E":"阴阳交感"},"answer":"D","explain":"阴中求阳指补阳时佐以滋阴，使阳得阴助而生化无穷，依据是阴阳互根互用。阴阳对立讲相互制约；消长讲量的变化；转化讲向对立面转变；交感讲相互感应。","tags":["易错"]},{"id":"JC-JCL-0076","type":"A1","group":null,"topic":"综合辨析-五行治法","difficulty":2,"stem":"“培土生金”适用于","options":{"A":"脾虚肺弱","B":"肝火犯肺","C":"肾不纳气","D":"心脾两虚","E":"肺肾阴虚"},"answer":"A","explain":"培土生金指补脾益气以益肺气，适用于脾虚不能益肺而肺气虚弱者。肝火犯肺当清肝泻肺；肾不纳气当补肾纳气；心脾两虚当补益心脾；肺肾阴虚当滋养肺肾。","tags":["鉴别"]},{"id":"JC-JCL-0077","type":"A1","group":null,"topic":"综合辨析-五行治法","difficulty":2,"stem":"“滋水涵木”适用于","options":{"A":"肝肾阴虚、肝阳上亢","B":"肝火上炎","C":"心肾不交","D":"脾肾阳虚","E":"肺肾阴虚"},"answer":"A","explain":"滋水涵木即滋养肾阴以养肝阴，适用于肾阴亏虚、肝阴不足而肝阳上亢者。肝火上炎当清肝泻火；心肾不交当交通心肾；脾肾阳虚当温补脾肾；肺肾阴虚当滋补肺肾。","tags":["鉴别"]},{"id":"JC-JCL-0078","type":"A1","group":null,"topic":"综合辨析-五行治法","difficulty":3,"stem":"“泻南补北”适用于","options":{"A":"肝火犯肺","B":"心肾不交","C":"脾肾阳虚","D":"心脾两虚","E":"肺肾阴虚"},"answer":"B","explain":"泻南补北即泻心火、补肾水，适用于肾阴不足、心火偏亢之心肾不交证。肝火犯肺当清肝泻肺；脾肾阳虚当温补脾肾；心脾两虚当补益心脾；肺肾阴虚当滋补肺肾。","tags":["易错"]},{"id":"JC-JCL-0079","type":"A1","group":null,"topic":"综合辨析-阳病治阴","difficulty":3,"stem":"“阳病治阴”是指","options":{"A":"补阳以制阴","B":"泻阳以救阴","C":"滋阴以制阳","D":"阴阳双补","E":"引火归元"},"answer":"C","explain":"阳病治阴指阴虚不能制阳而见虚热阳亢者，当滋阴以制阳。补阳以制阴为阴病治阳；泻阳以救阴属直接祛除阳热之邪；阴阳双补用于阴阳两虚；引火归元用于虚阳浮越。","tags":["易错"]},{"id":"JC-JCL-0080","type":"A1","group":null,"topic":"综合辨析-虚实真假","difficulty":3,"stem":"“至虚有盛候”是指","options":{"A":"真实假虚","B":"虚实夹杂","C":"虚证","D":"真虚假实","E":"实证"},"answer":"D","explain":"至虚有盛候指正气极虚而反见盛实假象，即真虚假实。大实有羸状指邪实而反见虚羸假象，为真实假虚。虚实夹杂为虚实并见；虚证、实证为单纯的虚实属性。","tags":["易错","高频"]}]},{"meta":{"bank_id":"jichu-zhongyi-zhenduan","title":"中医诊断学","paper":"jichu","subject":"中医诊断学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":80,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"JC-ZD-0001","type":"A1","group":null,"topic":"望诊-望神","difficulty":1,"stem":"神志清楚，面色荣润，目光精彩，反应灵敏，属于","options":{"A":"少神","B":"失神","C":"假神","D":"神乱","E":"得神"},"answer":"E","explain":"得神是精气充盛、体健无病的表现，见神志清楚、面色荣润、目光精彩、反应灵敏。少神为精气轻度不足，精神不振、倦怠乏力。失神为精气严重衰败，神识昏迷或目暗睛迷。假神为病情危重时突然精神转佳。神乱指癫狂痫等神志异常。","tags":["高频"]},{"id":"JC-ZD-0002","type":"A1","group":null,"topic":"望诊-望神","difficulty":2,"stem":"久病重危之人，本已神志昏沉、目暗睛迷，突然精神转佳、言语不休、思亲欲见，此属","options":{"A":"得神","B":"假神","C":"少神","D":"失神","E":"神乱"},"answer":"B","explain":"假神是久病重病、精气极度衰竭之人突然出现精神转佳、言语不休、思亲欲见等虚假好转之象，为阴阳即将离决的危候。得神见于体健者。少神为精气轻度不足。失神为精气衰败的本象。神乱为癫狂痫等神志异常。","tags":["易错","高频"]},{"id":"JC-ZD-0003","type":"A1","group":null,"topic":"望诊-望舌","difficulty":1,"stem":"舌质淡白，多主","options":{"A":"热盛","B":"瘀血","C":"气血两虚","D":"阴虚火旺","E":"湿热内蕴"},"answer":"C","explain":"舌质淡白提示气血不足或阳气虚衰，血不上荣，故主气血两虚、阳虚。热盛则舌红。瘀血则舌紫暗有瘀斑。阴虚火旺则舌红少苔。湿热内蕴则舌红苔黄腻。","tags":["高频"]},{"id":"JC-ZD-0004","type":"A1","group":null,"topic":"望诊-望舌","difficulty":1,"stem":"舌苔黄燥，多主","options":{"A":"热盛伤津","B":"寒湿内盛","C":"食积停滞","D":"痰浊内阻","E":"阳虚水泛"},"answer":"A","explain":"苔黄主热，苔燥主津伤，故黄燥苔主热盛伤津。寒湿内盛苔白滑。食积停滞苔厚腻而腐。痰浊内阻苔白腻。阳虚水泛苔白滑而舌淡胖。","tags":["高频"]},{"id":"JC-ZD-0005","type":"A1","group":null,"topic":"望诊-望舌","difficulty":2,"stem":"舌体胖大，边有齿痕，多主","options":{"A":"阴虚火旺","B":"热盛伤津","C":"血瘀内阻","D":"脾虚湿盛","E":"肝风内动"},"answer":"D","explain":"舌体胖大、边有齿痕，多因脾虚运化失职、水湿内停，舌体受牙齿挤压而成。阴虚火旺者舌红瘦小。热盛伤津者舌红绛干瘦。血瘀者舌紫暗。肝风内动者舌强或歪斜颤抖。","tags":["高频"]},{"id":"JC-ZD-0006","type":"A1","group":null,"topic":"望诊-望舌","difficulty":2,"stem":"舌体强硬，语言謇涩，多主","options":{"A":"气血亏虚","B":"热入心包或中风","C":"脾虚湿困","D":"阴虚津亏","E":"寒凝血脉"},"answer":"B","explain":"舌强指舌体强硬、转动不灵、语言謇涩，多因热入心包、痰浊内阻或肝风夹痰阻络，常见于中风先兆或中风。气血亏虚者舌淡而痿软。脾虚湿困者舌胖苔腻。阴虚津亏者舌红少津。寒凝血脉者舌青紫。","tags":["鉴别"]},{"id":"JC-ZD-0007","type":"A1","group":null,"topic":"望诊-望色","difficulty":3,"stem":"面目一身俱黄，黄色晦暗如烟熏，称为","options":{"A":"阳黄","B":"萎黄","C":"黄胖","D":"湿热发黄","E":"阴黄"},"answer":"E","explain":"黄色晦暗如烟熏，属寒湿困脾、胆汁不循常道之阴黄。阳黄黄色鲜明如橘皮，属湿热。萎黄为脾虚气血不足，黄而枯槁无泽。黄胖为脾虚湿盛，黄而虚浮。湿热发黄即阳黄之类。","tags":["鉴别","易错"]},{"id":"JC-ZD-0008","type":"A1","group":null,"topic":"望诊-望形态","difficulty":3,"stem":"但坐不得卧，卧则气逆，多见于","options":{"A":"肺胀或水饮停胸","B":"肺气虚","C":"脾气虚","D":"肝阳上亢","E":"肾阳虚衰"},"answer":"A","explain":"但坐不得卧、卧则气逆，多因肺胀痰饮壅盛或水饮停于胸腹，平卧则水气上逆迫肺。肺气虚以气短乏力为主。脾气虚以纳差便溏为主。肝阳上亢见眩晕头胀。肾阳虚衰见腰膝冷痛与水肿。","tags":["鉴别"]},{"id":"JC-ZD-0009","type":"A1","group":null,"topic":"望诊-望头面","difficulty":2,"stem":"小儿囟门迟闭、头颅过大，多属","options":{"A":"脾胃虚弱","B":"肝风内动","C":"肾精不足","D":"痰湿内阻","E":"气血两虚"},"answer":"C","explain":"肾主骨生髓，囟门迟闭、头颅过大、发育迟缓，多因肾精不足、髓海空虚。脾胃虚弱多见形体消瘦、纳差。肝风内动见抽搐项强。痰湿内阻见头重如裹。气血两虚见面色淡白。","tags":["高频"]},{"id":"JC-ZD-0010","type":"A1","group":null,"topic":"望诊-望神","difficulty":2,"stem":"狂躁妄动，打人毁物，不避亲疏，多属","options":{"A":"心气不足","B":"肝气郁结","C":"心血瘀阻","D":"痰火扰心","E":"肾精亏虚"},"answer":"D","explain":"狂躁妄动、打人毁物、不避亲疏，属狂病，多因痰火扰心、神明被扰。心气不足见心悸气短。肝气郁结见情志抑郁、胸胁胀满。心血瘀阻见心胸刺痛。肾精亏虚见健忘耳鸣、腰膝酸软。","tags":["高频"]},{"id":"JC-ZD-0011","type":"B1","group":"ZD-B1-001","group_stem":"A.青色　B.赤色　C.黄色　D.白色　E.黑色","topic":"望诊-五色主病","difficulty":1,"stem":"五色主病中，主热证的是","options":{"A":"青色","B":"赤色","C":"黄色","D":"白色","E":"黑色"},"answer":"B","explain":"赤色主热证，热盛则血脉充盈、血色上荣，故见面赤。满面通红属实热，两颧潮红属虚热。白色主虚寒与失血。黄色主脾虚与湿证。黑色主肾虚、水饮与瘀血。","tags":["高频"]},{"id":"JC-ZD-0012","type":"B1","group":"ZD-B1-001","group_stem":"A.青色　B.赤色　C.黄色　D.白色　E.黑色","topic":"望诊-五色主病","difficulty":1,"stem":"五色主病中，主脾虚、湿证的是","options":{"A":"青色","B":"赤色","C":"黄色","D":"白色","E":"黑色"},"answer":"C","explain":"黄色主脾虚与湿证，脾失健运、水湿内停则面色发黄。萎黄属脾胃气虚，黄胖属脾虚湿盛，阴黄属寒湿，阳黄属湿热。青色主寒痛瘀与惊风。赤色主热。黑色主肾虚与水饮。","tags":["高频"]},{"id":"JC-ZD-0013","type":"B1","group":"ZD-B1-001","group_stem":"A.青色　B.赤色　C.黄色　D.白色　E.黑色","topic":"望诊-五色主病","difficulty":2,"stem":"五色主病中，主肾虚、水饮、瘀血的是","options":{"A":"青色","B":"赤色","C":"黄色","D":"白色","E":"黑色"},"answer":"E","explain":"黑色主肾虚、水饮与瘀血。肾阳虚衰则面色黧黑而晦暗，肾阴虚则黑而干焦，水饮内停则眼眶周围发黑，瘀血日久则面色黧黑而肌肤甲错。青色亦主瘀血，但以寒凝痛证为主。","tags":["易错"]},{"id":"JC-ZD-0014","type":"A2","group":null,"topic":"望诊-舌诊","difficulty":2,"stem":"患者，男，52岁。近半月口干喜冷饮，烦躁不安，夜寐不宁，大便干结，三日一行，小便短黄，舌质红绛，舌苔黄燥，脉象洪数。其舌象提示","options":{"A":"湿热内蕴","B":"热盛伤津","C":"阴虚火旺","D":"痰热内盛","E":"寒湿困脾"},"answer":"B","explain":"舌红绛、苔黄燥，兼口渴喜冷、便干、脉洪数，为热邪炽盛、灼伤津液，故提示热盛伤津。湿热内蕴舌红苔黄腻。阴虚火旺舌红少苔或无苔、脉细数。痰热内盛苔黄腻、脉滑数。寒湿困脾舌淡苔白腻。","tags":["高频"]},{"id":"JC-ZD-0015","type":"A2","group":null,"topic":"望诊-舌诊","difficulty":3,"stem":"患者，女，30岁。平素畏寒，近半年畏寒肢冷加重，大便溏泄，每日二三次，小便清长，夜尿增多，舌淡胖有齿痕，苔白滑，脉沉迟无力。其舌象提示","options":{"A":"气血两虚","B":"湿热内蕴","C":"阴虚火旺","D":"肝郁脾虚","E":"脾肾阳虚"},"answer":"E","explain":"舌淡胖有齿痕、苔白滑，兼畏寒肢冷、便溏、小便清长、脉沉迟，为脾肾阳气亏虚、水湿不化，故提示脾肾阳虚。气血两虚舌淡白而瘦薄。湿热内蕴舌红苔黄腻。阴虚火旺舌红少苔。肝郁脾虚舌淡红苔薄白而脉弦缓。","tags":["鉴别"]},{"id":"JC-ZD-0016","type":"A2","group":null,"topic":"望诊-望色","difficulty":2,"stem":"患者，男，58岁。半年前胸部外伤，近两月胸部刺痛固定不移，入夜尤甚，面色黧黑，肌肤甲错，唇舌紫暗，脉沉涩。其面色所主是","options":{"A":"瘀血内阻","B":"肾阳虚衰","C":"寒湿困脾","D":"肾精不足","E":"痰饮内停"},"answer":"A","explain":"面色黧黑兼肌肤甲错、唇舌紫暗、刺痛固定、脉沉涩，为瘀血内阻、血行不畅之象。肾阳虚衰之面黑多伴腰膝冷痛与水肿。寒湿困脾面色晦黄。肾精不足多见发育迟缓。痰饮内停面色多淡白。","tags":["鉴别"]},{"id":"JC-ZD-0017","type":"A1","group":null,"topic":"闻诊-声音","difficulty":1,"stem":"语声低微，气短懒言，多属","options":{"A":"实证","B":"热证","C":"寒证","D":"虚证","E":"痰证"},"answer":"D","explain":"语声低微、气短懒言，为正气不足、鼓动无力，故属虚证。实证多语声高亢有力。热证多声高气粗、烦而多言。寒证多静而少言，但声不低微。痰证多痰多胸闷、苔腻。","tags":["高频"]},{"id":"JC-ZD-0018","type":"A1","group":null,"topic":"闻诊-咳嗽","difficulty":2,"stem":"咳声重浊，痰多色白清稀，伴鼻塞流清涕，多属","options":{"A":"风热犯肺","B":"风寒束肺","C":"肺阴亏虚","D":"燥邪伤肺","E":"肝火犯肺"},"answer":"B","explain":"咳声重浊、痰白清稀、鼻塞流清涕，为风寒袭肺、肺气失宣。风热犯肺咳痰黄稠、鼻流浊涕。肺阴亏虚干咳少痰、痰中带血。燥邪伤肺干咳无痰、鼻咽干燥。肝火犯肺咳呛气逆、痰黄带血而胸胁引痛。","tags":["鉴别"]},{"id":"JC-ZD-0019","type":"A1","group":null,"topic":"闻诊-呕吐","difficulty":1,"stem":"呕吐物酸腐，嗳气厌食，多属","options":{"A":"胃寒","B":"肝气犯胃","C":"胃阴不足","D":"痰饮内停","E":"食积胃脘"},"answer":"E","explain":"呕吐酸腐、嗳气厌食，为饮食停滞、胃失和降，故属食积。胃寒呕吐清水痰涎、得温则减。肝气犯胃呕吐吞酸、嗳气随情志波动。胃阴不足呕吐反复、口燥咽干。痰饮内停呕吐清水痰涎而脘闷苔腻。","tags":["高频"]},{"id":"JC-ZD-0020","type":"A2","group":null,"topic":"闻诊-口气","difficulty":2,"stem":"患者，男，40岁。近一月口气臭秽，牙龈肿痛，刷牙时出血，口渴喜冷饮，大便干结，小便短黄，舌红苔黄，脉滑数。其口气臭秽多属","options":{"A":"胃寒","B":"食积","C":"胃热","D":"龋齿","E":"肺痈"},"answer":"C","explain":"口气臭秽兼牙龈肿痛、口渴喜冷、便干、舌红苔黄、脉滑数，为胃火炽盛上蒸所致。胃寒口气清冷无臭。食积口气酸腐而嗳气厌食。龋齿口臭伴牙齿龋洞疼痛而无全身热象。肺痈口气腥臭、咳吐脓血。","tags":["高频"]},{"id":"JC-ZD-0021","type":"A1","group":null,"topic":"问诊-问睡眠","difficulty":2,"stem":"不易入睡，心烦多梦，潮热盗汗，腰膝酸软，多属","options":{"A":"心肾不交","B":"心脾两虚","C":"痰热扰心","D":"肝郁化火","E":"胃不和卧不安"},"answer":"A","explain":"不易入睡、心烦多梦，兼潮热盗汗、腰膝酸软，为肾阴亏虚、心火偏亢、水火不济，故属心肾不交。心脾两虚多梦易醒、心悸健忘、食少乏力。痰热扰心失眠头重、胸闷痰多、苔黄腻。肝郁化火失眠易怒、口苦目赤。胃不和则卧不安见脘胀嗳腐。","tags":["高频","鉴别"]},{"id":"JC-ZD-0022","type":"A1","group":null,"topic":"问诊-问睡眠","difficulty":2,"stem":"饭后嗜睡，神疲乏力，食少便溏，多属","options":{"A":"痰湿困脾","B":"肝郁气滞","C":"心阳不足","D":"脾气虚弱","E":"肾阳衰微"},"answer":"D","explain":"饭后嗜睡、神疲乏力、食少便溏，为脾虚运化无力、清阳不升。痰湿困脾嗜睡伴头重如裹、苔白腻。肝郁气滞见情志抑郁、胸胁胀满。心阳不足见心悸胸闷、畏寒。肾阳衰微见腰膝冷痛、水肿尿少。","tags":["鉴别"]},{"id":"JC-ZD-0023","type":"A1","group":null,"topic":"问诊-问饮食口味","difficulty":3,"stem":"饥不欲食，多属","options":{"A":"胃火亢盛","B":"脾胃气虚","C":"肝气犯胃","D":"湿邪困脾","E":"胃阴不足"},"answer":"E","explain":"饥不欲食指有饥饿感而不欲进食，多因胃阴不足、虚火内扰、胃失濡润。胃火亢盛多消谷善饥。脾胃气虚多食少纳呆、食后腹胀。肝气犯胃多嗳气吞酸而随情志变化。湿邪困脾多口黏纳呆、苔腻。","tags":["易错"]},{"id":"JC-ZD-0024","type":"A1","group":null,"topic":"问诊-问饮食口味","difficulty":1,"stem":"口甜而黏腻，多属","options":{"A":"脾胃气虚","B":"脾胃湿热","C":"肝胃不和","D":"胃阴不足","E":"寒湿困脾"},"answer":"B","explain":"口甜而黏腻，多因脾胃湿热、浊气上泛。脾胃气虚多口淡无味。肝胃不和多口苦吞酸。胃阴不足多口干咽燥。寒湿困脾多口淡黏腻而苔白滑、无热象。","tags":["高频"]},{"id":"JC-ZD-0025","type":"A1","group":null,"topic":"问诊-问月经","difficulty":3,"stem":"月经先期，量多色深红，质黏稠，多属","options":{"A":"气虚","B":"血寒","C":"血热","D":"血虚","E":"气滞"},"answer":"C","explain":"月经先期、量多、色深红、质黏稠，为热迫血行之血热证。气虚者经色淡红、质稀。血寒者经期延后、色暗有块、小腹冷痛。血虚者量少色淡。气滞者经期先后不定、色暗有块而胀痛。","tags":["鉴别"]},{"id":"JC-ZD-0026","type":"A1","group":null,"topic":"问诊-问带下","difficulty":1,"stem":"带下色白，清稀无臭，量多，多属","options":{"A":"脾虚湿盛","B":"湿热下注","C":"肝肾阴虚","D":"热毒蕴结","E":"气滞血瘀"},"answer":"A","explain":"带下色白、清稀无臭、量多，为脾虚运化失职、水湿下注，故属脾虚湿盛。湿热下注带下色黄黏稠而有臭味。肝肾阴虚带下量少色黄、阴部干涩。热毒蕴结带下五色杂下、臭秽难闻。气滞血瘀带下色暗有块。","tags":["高频"]},{"id":"JC-ZD-0027","type":"A1","group":null,"topic":"问诊-问二便","difficulty":3,"stem":"大便时干时稀，多属","options":{"A":"脾胃虚弱","B":"脾肾阳虚","C":"大肠湿热","D":"食积肠胃","E":"肝郁脾虚"},"answer":"E","explain":"大便时干时稀，多因肝郁气滞、脾运失健、肝脾不和所致。脾胃虚弱多便溏、食后腹胀。脾肾阳虚多五更泄泻、完谷不化。大肠湿热多下利黏滞、肛门灼热。食积肠胃多泻下臭秽、嗳腐吞酸。","tags":["易错"]},{"id":"JC-ZD-0028","type":"B1","group":"ZD-B1-002","group_stem":"A.恶寒发热并见　B.但寒不热　C.但热不寒　D.寒热往来　E.手足心热","topic":"问诊-问寒热","difficulty":1,"stem":"外感表证初期常见","options":{"A":"恶寒发热并见","B":"但寒不热","C":"但热不寒","D":"寒热往来","E":"手足心热"},"answer":"A","explain":"外感表证初期，邪在肌表，卫阳被遏则恶寒，正邪相争则发热，故恶寒与发热并见。但寒不热见于里寒证。但热不寒见于里热证。寒热往来见于少阳病与疟疾。手足心热见于阴虚内热。","tags":["高频"]},{"id":"JC-ZD-0029","type":"B1","group":"ZD-B1-002","group_stem":"A.恶寒发热并见　B.但寒不热　C.但热不寒　D.寒热往来　E.手足心热","topic":"问诊-问寒热","difficulty":1,"stem":"里热证常见","options":{"A":"恶寒发热并见","B":"但寒不热","C":"但热不寒","D":"寒热往来","E":"手足心热"},"answer":"C","explain":"里热证邪已入里，正邪剧争于内，故但热不寒。壮热见于阳明实热，潮热见于阳明腑实或阴虚，低热多见于阴虚或气虚。恶寒发热并见属表证。但寒不热属里寒。寒热往来属半表半里。","tags":["高频"]},{"id":"JC-ZD-0030","type":"B1","group":"ZD-B1-002","group_stem":"A.恶寒发热并见　B.但寒不热　C.但热不寒　D.寒热往来　E.手足心热","topic":"问诊-问寒热","difficulty":2,"stem":"疟疾常见","options":{"A":"恶寒发热并见","B":"但寒不热","C":"但热不寒","D":"寒热往来","E":"手足心热"},"answer":"D","explain":"疟疾为疟邪伏于半表半里，邪正相争则寒热交替发作，故见寒热往来。少阳病亦见寒热往来，但以口苦咽干、胸胁苦满为别。恶寒发热并见属表证。但寒不热属里寒。手足心热属阴虚。","tags":["鉴别"]},{"id":"JC-ZD-0031","type":"A2","group":null,"topic":"问诊-表热证","difficulty":2,"stem":"患者，男，35岁。两天前受凉后发热，微恶风寒，汗出，头痛，咽痛，鼻流浊涕，口微渴，舌尖红，苔薄黄，脉浮数。其发热恶风属","options":{"A":"表寒证","B":"里热证","C":"半表半里证","D":"表热证","E":"里寒证"},"answer":"D","explain":"发热微恶风寒、汗出、咽痛、鼻流浊涕、舌尖红、苔薄黄、脉浮数，为风热袭表之表热证。表寒证恶寒重发热轻、无汗、苔薄白、脉浮紧。里热证但热不寒而无恶风。半表半里证寒热往来、口苦咽干。里寒证但寒不热。","tags":["高频"]},{"id":"JC-ZD-0032","type":"A2","group":null,"topic":"问诊-少阳病","difficulty":2,"stem":"患者，女，28岁。三日来寒热往来，一日数发，胸胁苦满，默默不欲饮食，心烦喜呕，口苦咽干，目眩，舌苔薄白，脉弦。其病位在","options":{"A":"太阳","B":"少阳","C":"阳明","D":"太阴","E":"厥阴"},"answer":"B","explain":"寒热往来、胸胁苦满、默默不欲饮食、心烦喜呕、口苦咽干、脉弦，为邪犯少阳、枢机不利。太阳病见恶寒发热、头项强痛、脉浮。阳明病见但热不寒、大汗大渴、脉洪大。太阴病见腹满而吐、自利益甚。厥阴病见消渴、气上撞心。","tags":["高频","鉴别"]},{"id":"JC-ZD-0033","type":"A2","group":null,"topic":"问诊-五更泄泻","difficulty":3,"stem":"患者，男，50岁。近一年来每于黎明前脐腹作痛，肠鸣即泻，泻后痛减，完谷不化，形寒肢冷，腰膝酸冷，舌淡胖，苔白，脉沉迟。其病位在","options":{"A":"脾肾","B":"脾胃","C":"肝脾","D":"大小肠","E":"肺脾"},"answer":"A","explain":"黎明前泄泻、完谷不化、形寒肢冷、腰膝酸冷、舌淡胖、脉沉迟，为五更泻，属脾肾阳虚，故病位在脾肾。脾胃同病多见食后腹胀、便溏。肝脾不和多见腹痛即泻、泻后不爽而随情志波动。大小肠病多见下利脓血或便秘。","tags":["鉴别"]},{"id":"JC-ZD-0034","type":"A2","group":null,"topic":"问诊-月经病","difficulty":2,"stem":"患者，女，42岁。近半年月经后期，量少色淡，小腹隐痛喜按，面色淡白，头晕眼花，心悸失眠，手足麻木，舌淡，脉细弱。其证属","options":{"A":"气滞","B":"血寒","C":"血虚","D":"血瘀","E":"气虚"},"answer":"C","explain":"经期延后、量少色淡、小腹隐痛喜按，兼面色淡白、头晕眼花、心悸失眠、手足麻木、脉细弱，为营血亏虚、冲任不足，故属血虚。气滞经行不畅、胀痛拒按、脉弦。血寒小腹冷痛得温则减、经色暗有块。血瘀经色紫暗有块、刺痛拒按。气虚以气短乏力、自汗为主。","tags":["高频"]},{"id":"JC-ZD-0035","type":"A1","group":null,"topic":"切诊-脉象要素","difficulty":1,"stem":"脉象举之有余、按之不足，轻取即得，称为","options":{"A":"沉脉","B":"虚脉","C":"实脉","D":"洪脉","E":"浮脉"},"answer":"E","explain":"举之有余、按之不足、轻取即得，是浮脉的脉象特征，主表证。沉脉轻取不应、重按始得。虚脉举按皆无力。实脉举按皆有力。洪脉来盛去衰、状若波涛。","tags":["高频"]},{"id":"JC-ZD-0036","type":"A1","group":null,"topic":"切诊-相兼脉","difficulty":2,"stem":"浮紧脉多主","options":{"A":"表热证","B":"表寒证","C":"里寒证","D":"里热证","E":"表虚证"},"answer":"B","explain":"浮脉主表，紧脉主寒，故浮紧脉主表寒证，多见于外感风寒。浮数脉主表热。沉紧脉主里寒。沉数脉主里热。浮缓脉主表虚，见于太阳中风。","tags":["高频"]},{"id":"JC-ZD-0037","type":"A1","group":null,"topic":"切诊-按诊","difficulty":2,"stem":"腹部按之疼痛，痛处固定不移，拒按，多属","options":{"A":"虚证","B":"气滞","C":"寒证","D":"瘀血内阻","E":"湿热蕴结"},"answer":"D","explain":"痛处固定不移、拒按，为瘀血内阻、气血不通之征。虚证腹痛喜按、按之痛减。气滞腹痛胀满、部位不定、按之无形。寒证腹痛得温则减。湿热蕴结多见脘腹痞满而苔黄腻。","tags":["鉴别"]},{"id":"JC-ZD-0038","type":"B1","group":"ZD-B1-003","group_stem":"A.迟脉　B.数脉　C.滑脉　D.涩脉　E.弦脉","topic":"切诊-脉象主病","difficulty":1,"stem":"诸脉中，主寒证的是","options":{"A":"迟脉","B":"数脉","C":"滑脉","D":"涩脉","E":"弦脉"},"answer":"A","explain":"迟脉一息不足四至，主寒证，亦可见于邪热结聚之实热证。数脉主热证。滑脉主痰饮、食积、实热。涩脉主气滞血瘀、精伤血少。弦脉主肝胆病、痛证、痰饮。","tags":["高频"]},{"id":"JC-ZD-0039","type":"B1","group":"ZD-B1-003","group_stem":"A.迟脉　B.数脉　C.滑脉　D.涩脉　E.弦脉","topic":"切诊-脉象主病","difficulty":2,"stem":"诸脉中，主肝胆病、痛证、痰饮的是","options":{"A":"迟脉","B":"数脉","C":"滑脉","D":"涩脉","E":"弦脉"},"answer":"E","explain":"弦脉端直以长、如按琴弦，主肝胆病、痛证、痰饮。迟脉主寒。数脉主热。滑脉主痰饮食积。涩脉主气滞血瘀、精伤血少。","tags":["高频"]},{"id":"JC-ZD-0040","type":"B1","group":"ZD-B1-003","group_stem":"A.迟脉　B.数脉　C.滑脉　D.涩脉　E.弦脉","topic":"切诊-脉象主病","difficulty":1,"stem":"诸脉中，主痰饮、食积、实热的是","options":{"A":"迟脉","B":"数脉","C":"滑脉","D":"涩脉","E":"弦脉"},"answer":"C","explain":"滑脉往来流利、应指圆滑，主痰饮、食积、实热，妇人妊娠亦见滑脉。迟脉主寒。数脉主热。涩脉主血瘀精伤。弦脉主肝胆病与痛证。","tags":["高频"]},{"id":"JC-ZD-0041","type":"A2","group":null,"topic":"切诊-脉象主病","difficulty":2,"stem":"患者，女，55岁。近一年形体日渐消瘦，潮热盗汗，五心烦热，口燥咽干，失眠多梦，腰膝酸软，舌红少苔，脉细数。其脉象所主是","options":{"A":"阴虚火旺","B":"气虚","C":"阳虚","D":"痰湿","E":"血瘀"},"answer":"A","explain":"脉细数、形体消瘦、潮热盗汗、五心烦热、舌红少苔，为阴液亏虚、虚火内生。气虚脉虚无力而气短自汗。阳虚脉沉迟无力而畏寒肢冷。痰湿脉滑而苔腻。血瘀脉涩而舌紫暗。","tags":["高频"]},{"id":"JC-ZD-0042","type":"A2","group":null,"topic":"切诊-脉象主病","difficulty":2,"stem":"患者，男，45岁。平素畏寒，近半年畏寒肢冷加重，面色淡白，神疲乏力，小便清长，夜尿三次，舌淡胖，脉沉迟无力。其脉象所主是","options":{"A":"实寒","B":"气虚","C":"血虚","D":"湿热","E":"阳虚"},"answer":"E","explain":"脉沉迟无力、畏寒肢冷、小便清长、舌淡胖，为阳气不足、温煦失职之阳虚证。实寒脉沉紧有力而腹痛拒按。气虚脉虚而无明显寒象。血虚脉细、面色淡白而无畏寒。湿热脉滑数而苔黄腻。","tags":["高频"]},{"id":"JC-ZD-0043","type":"A1","group":null,"topic":"八纲辨证-表证","difficulty":1,"stem":"表证的主要特点是","options":{"A":"但热不寒","B":"恶寒发热并见","C":"但寒不热","D":"寒热往来","E":"手足心热"},"answer":"B","explain":"表证由外邪袭表所致，以恶寒发热并见、头身疼痛、苔薄白、脉浮为特点，起病急而病程短。但热不寒主里热。但寒不热主里寒。寒热往来主少阳病或疟疾。手足心热主阴虚内热。","tags":["高频"]},{"id":"JC-ZD-0044","type":"A1","group":null,"topic":"八纲辨证-寒热真假","difficulty":2,"stem":"真寒假热的病机实质是","options":{"A":"阳虚阴盛","B":"阴虚阳亢","C":"阴盛格阳","D":"阳盛格阴","E":"阴阳两虚"},"answer":"C","explain":"真寒假热是阴寒内盛，逼迫虚阳浮越于外，属阴盛格阳。阳盛格阴形成真热假寒。阳虚阴盛为虚寒证。阴虚阳亢为虚热证。阴阳两虚为两者俱虚而无格拒之象。","tags":["易错","鉴别"]},{"id":"JC-ZD-0045","type":"A1","group":null,"topic":"八纲辨证-虚实真假","difficulty":3,"stem":"大实有羸状，是指","options":{"A":"真虚假实","B":"虚实夹杂","C":"虚证","D":"真实假虚","E":"实证"},"answer":"D","explain":"大实有羸状指邪气盛实而反见虚羸假象，即真实假虚。至虚有盛候指正气极虚而反见盛实假象，为真虚假实。虚实夹杂为虚实并见。虚证与实证为单纯的虚实属性。","tags":["易错"]},{"id":"JC-ZD-0046","type":"A1","group":null,"topic":"八纲辨证-阴阳辨证","difficulty":1,"stem":"八纲辨证中，表、热、实三纲属","options":{"A":"阳证","B":"阴证","C":"半表半里证","D":"虚实夹杂证","E":"寒热错杂证"},"answer":"A","explain":"八纲中表、热、实属阳，里、寒、虚属阴，故表热实三纲属阳证。半表半里证属少阳。虚实夹杂与寒热错杂为证候并见状态，不属单纯的阴阳归类。","tags":["高频"]},{"id":"JC-ZD-0047","type":"A1","group":null,"topic":"八纲辨证-表里同病","difficulty":1,"stem":"表证未解，里证又现，称为","options":{"A":"表证","B":"里证","C":"半表半里证","D":"寒热错杂","E":"表里同病"},"answer":"E","explain":"表证未解而里证同时出现，称表里同病。单纯表证与里证不相并存。半表半里证为邪居少阳、枢机不利。寒热错杂为寒证与热证并存，与表里同病不是同一分类。","tags":["高频"]},{"id":"JC-ZD-0048","type":"B1","group":"ZD-B1-004","group_stem":"A.表证　B.里证　C.寒证　D.热证　E.虚证","topic":"八纲辨证-表里寒热虚实","difficulty":1,"stem":"恶寒发热，头身疼痛，脉浮，属","options":{"A":"表证","B":"里证","C":"寒证","D":"热证","E":"虚证"},"answer":"A","explain":"恶寒发热并见、头身疼痛、脉浮，为邪在肌表之表证。里证以脏腑症状为主而无表证。寒证见但寒不热、舌淡苔白。热证见但热不寒、舌红苔黄。虚证见神疲乏力、脉虚弱。","tags":["高频"]},{"id":"JC-ZD-0049","type":"B1","group":"ZD-B1-004","group_stem":"A.表证　B.里证　C.寒证　D.热证　E.虚证","topic":"八纲辨证-表里寒热虚实","difficulty":1,"stem":"神疲乏力，气短懒言，自汗，脉虚弱，属","options":{"A":"表证","B":"里证","C":"寒证","D":"热证","E":"虚证"},"answer":"E","explain":"神疲乏力、气短懒言、自汗、脉虚弱，为正气不足、机能减退之虚证。表证见恶寒发热脉浮。里证以脏腑症状为主。寒证见畏寒喜暖。热证见发热口渴、脉数。","tags":["高频"]},{"id":"JC-ZD-0050","type":"B1","group":"ZD-B1-004","group_stem":"A.表证　B.里证　C.寒证　D.热证　E.虚证","topic":"八纲辨证-表里寒热虚实","difficulty":1,"stem":"但热不寒，口渴喜冷，舌红苔黄，脉数，属","options":{"A":"表证","B":"里证","C":"寒证","D":"热证","E":"虚证"},"answer":"D","explain":"但热不寒、口渴喜冷、舌红苔黄、脉数，为阳热亢盛之热证。表证当见恶寒发热并见与脉浮。里证是病位概念而非寒热属性。寒证见畏寒喜暖、舌淡苔白。虚证以正气不足为主。","tags":["高频"]},{"id":"JC-ZD-0051","type":"A2","group":null,"topic":"八纲辨证-真热假寒","difficulty":3,"stem":"患者，男，40岁。三日来高热不退，烦躁不安，面红目赤，口渴喜冷饮，大便秘结，腹满硬痛，但四肢厥冷，脉沉实有力。此属","options":{"A":"真寒假热","B":"真热假寒","C":"表寒里热","D":"阳虚外寒","E":"亡阳"},"answer":"B","explain":"高热烦躁、面红口渴、便秘、腹满硬痛、脉沉实有力为热邪内盛，四肢厥冷为热郁于内、格阴于外的假象，故属真热假寒。真寒假热为阴盛格阳。表寒里热见恶寒与里热并见。阳虚外寒脉沉迟无力。亡阳见冷汗淋漓、脉微欲绝。","tags":["易错","鉴别"]},{"id":"JC-ZD-0052","type":"A2","group":null,"topic":"八纲辨证-真寒假热","difficulty":3,"stem":"患者，女，70岁。久病卧床，畏寒肢冷，下利清谷，小便清长，但见面红如妆，身热反欲近衣被，精神萎靡，脉微欲绝。此属","options":{"A":"真热假寒","B":"阴虚内热","C":"实热证","D":"真寒假热","E":"气虚发热"},"answer":"D","explain":"畏寒肢冷、下利清谷、脉微欲绝为阳气衰微，面红如妆、身热却欲近衣被为虚阳浮越之假热，故属真寒假热。真热假寒为热盛格阴。阴虚内热见潮热盗汗、舌红少苔。实热证见高热烦渴、脉洪数。气虚发热多低热而劳累后加重、伴乏力自汗。","tags":["易错","鉴别"]},{"id":"JC-ZD-0053","type":"A2","group":null,"topic":"八纲辨证-虚实夹杂","difficulty":3,"stem":"患者，女，48岁。咳嗽反复发作两月，痰多色白，胸闷脘痞，纳差，同时神疲乏力，气短自汗，面色萎黄，舌淡苔白腻，脉滑弱。此属","options":{"A":"虚实夹杂","B":"实证","C":"虚证","D":"真虚假实","E":"真实假虚"},"answer":"A","explain":"咳嗽痰多、胸闷脘痞、苔白腻、脉滑为痰湿内盛之实，神疲乏力、气短自汗、面色萎黄、脉弱为脾肺气虚之虚，虚实并见。纯实证当脉实有力而无虚象。纯虚证当无痰湿壅盛之象。真假虚实指证候与假象相反，本例虚实皆真。","tags":["鉴别"]},{"id":"JC-ZD-0054","type":"A2","group":null,"topic":"八纲辨证-亡阴","difficulty":2,"stem":"患者，男，65岁。高热十余日，汗出过多，今见汗热而黏，烦躁不安，口渴欲饮，皮肤皱瘪，眼窝凹陷，小便极少，脉细数疾。此属","options":{"A":"亡阳","B":"气虚","C":"亡阴","D":"阳虚","E":"阴虚"},"answer":"C","explain":"汗热而黏、烦躁、口渴、皮肤皱瘪、眼窝凹陷、小便极少、脉细数疾，为阴液耗竭之亡阴证。亡阳见冷汗淋漓、四肢厥冷、脉微欲绝。气虚见气短乏力而无阴竭之象。阳虚见畏寒肢冷。阴虚为慢性虚热，病情较亡阴轻。","tags":["鉴别"]},{"id":"JC-ZD-0055","type":"A1","group":null,"topic":"气血津液辨证-气虚证","difficulty":1,"stem":"气虚证的典型表现是","options":{"A":"面色淡白","B":"刺痛拒按","C":"胀痛走窜","D":"潮热盗汗","E":"气短自汗"},"answer":"E","explain":"气虚证以神疲乏力、气短懒言、自汗、脉虚弱为典型表现。面色淡白、唇舌色淡属血虚。刺痛拒按属血瘀。胀痛走窜属气滞。潮热盗汗属阴虚。","tags":["高频"]},{"id":"JC-ZD-0056","type":"A1","group":null,"topic":"气血津液辨证-气滞证","difficulty":2,"stem":"气滞证的疼痛特点是","options":{"A":"刺痛固定","B":"胀痛，部位不定","C":"冷痛喜温","D":"灼痛拒按","E":"隐痛喜按"},"answer":"B","explain":"气滞以气机郁滞为病机，疼痛多见胀痛、部位不定、时轻时重。刺痛固定属血瘀。冷痛喜温属寒证。灼痛拒按属热证。隐痛喜按属虚证。","tags":["鉴别"]},{"id":"JC-ZD-0057","type":"A1","group":null,"topic":"气血津液辨证-血瘀证","difficulty":1,"stem":"血瘀证的典型舌象是","options":{"A":"舌淡白","B":"舌红绛","C":"舌胖有齿痕","D":"舌紫暗或有瘀斑","E":"舌红少苔"},"answer":"D","explain":"血瘀证舌质紫暗或有瘀点瘀斑，为血行不畅、瘀血内阻之象。舌淡白主气血两虚。舌红绛主热盛或阴虚火旺。舌胖有齿痕主脾虚湿盛。舌红少苔主阴虚。","tags":["高频"]},{"id":"JC-ZD-0058","type":"A1","group":null,"topic":"气血津液辨证-津液不足","difficulty":2,"stem":"津液不足的主要表现是","options":{"A":"口燥咽干，尿少","B":"畏寒肢冷","C":"脘腹胀满","D":"刺痛拒按","E":"气短乏力"},"answer":"A","explain":"津液不足则失于濡润，见口燥咽干、小便短少、皮肤干燥、舌红少津。畏寒肢冷属阳虚。脘腹胀满属气滞。刺痛拒按属血瘀。气短乏力属气虚。","tags":["高频"]},{"id":"JC-ZD-0059","type":"A1","group":null,"topic":"气血津液辨证-气随血脱","difficulty":2,"stem":"气随血脱证的典型表现是","options":{"A":"气短自汗","B":"面白心悸","C":"大失血后虚脱","D":"刺痛拒按","E":"胀痛走窜"},"answer":"C","explain":"气随血脱见于大失血之后，气无所附而外脱，见汗出肢冷、脉微欲绝。气短自汗为一般气虚。面白心悸为血虚。刺痛拒按为血瘀。胀痛走窜为气滞。","tags":["易错"]},{"id":"JC-ZD-0060","type":"A2","group":null,"topic":"气血津液辨证-气虚证","difficulty":2,"stem":"患者，男，52岁。近半年神疲乏力，气短懒言，动则汗出，头晕目眩，面色淡白，纳食减少，容易感冒，舌淡苔白，脉虚弱。其证属","options":{"A":"阳虚","B":"气虚","C":"血虚","D":"气血两虚","E":"阴虚"},"answer":"B","explain":"神疲乏力、气短懒言、动则汗出、易感冒、脉虚弱，为元气不足、脏腑功能减退，属气虚证。阳虚必兼畏寒肢冷。血虚以面白、唇舌色淡、脉细为主。气血两虚须兼具血虚表现。阴虚见潮热盗汗、舌红少苔。","tags":["高频"]},{"id":"JC-ZD-0061","type":"A2","group":null,"topic":"气血津液辨证-血虚证","difficulty":2,"stem":"患者，女，35岁。近一年面色淡白，唇甲色淡，头晕眼花，心悸失眠，多梦健忘，手足麻木，月经量少色淡，舌淡，脉细。其证属","options":{"A":"气虚","B":"阳虚","C":"阴虚","D":"血瘀","E":"血虚"},"answer":"E","explain":"面色淡白、唇甲色淡、头晕心悸、失眠多梦、手足麻木、经少色淡、脉细，为血液亏虚、脏腑失养。气虚以气短乏力、自汗为主。阳虚见畏寒肢冷。阴虚见潮热盗汗、舌红少苔。血瘀见刺痛、舌紫暗。","tags":["高频"]},{"id":"JC-ZD-0062","type":"A2","group":null,"topic":"气血津液辨证-气滞血瘀","difficulty":3,"stem":"患者，女，40岁。近三月胸胁胀满窜痛，情志不遂时加重，善太息，近一月又见胁下刺痛固定，舌紫暗有瘀斑，脉弦涩。其证属","options":{"A":"气滞","B":"血瘀","C":"气虚血瘀","D":"气滞血瘀","E":"肝郁气滞"},"answer":"D","explain":"胸胁胀满窜痛、随情志加重为气滞，胁下刺痛、舌紫暗有瘀斑、脉弦涩为血瘀，二者并见。单纯气滞无瘀血征象。单纯血瘀无胀满窜痛。气虚血瘀当兼气短乏力。肝郁气滞以情志抑郁、脉弦为主而无瘀象。","tags":["鉴别"]},{"id":"JC-ZD-0063","type":"A2","group":null,"topic":"气血津液辨证-水湿内停","difficulty":2,"stem":"患者，男，56岁。近两月下肢浮肿，按之凹陷不起，晨起眼睑亦肿，小便短少，脘腹胀满，纳差，舌淡胖苔白滑，脉沉缓。其证属","options":{"A":"水湿内停","B":"津液不足","C":"湿热蕴结","D":"气滞血瘀","E":"阴虚内热"},"answer":"A","explain":"下肢浮肿、按之凹陷、小便短少、舌淡胖苔白滑、脉沉缓，为水液代谢失常、水湿泛溢肌肤。津液不足见口渴尿少而皮肤干燥。湿热蕴结见苔黄腻、小便黄赤。气滞血瘀见刺痛、舌紫暗。阴虚内热见潮热盗汗、舌红少苔。","tags":["高频"]},{"id":"JC-ZD-0064","type":"A2","group":null,"topic":"气血津液辨证-气不摄血","difficulty":3,"stem":"患者，女，38岁。近半年月经量多，色淡质稀，淋漓十余日不尽，神疲乏力，气短懒言，面色萎黄，舌淡，脉细弱。其证属","options":{"A":"血热妄行","B":"血瘀出血","C":"气不摄血","D":"阴虚火旺","E":"脾阳虚衰"},"answer":"C","explain":"经量多而色淡质稀、淋漓不尽，兼神疲乏力、气短懒言、脉细弱，为脾气虚弱不能统摄血液。血热妄行经色深红质稠、舌红脉数。血瘀出血色暗有块、腹痛拒按。阴虚火旺见潮热盗汗、舌红少苔。脾阳虚衰当兼畏寒肢冷与便溏。","tags":["鉴别"]},{"id":"JC-ZD-0065","type":"A1","group":null,"topic":"脏腑辨证-心病","difficulty":2,"stem":"心气虚证与心阳虚证的共同表现是","options":{"A":"畏寒肢冷","B":"心悸气短乏力","C":"心胸刺痛","D":"潮热盗汗","E":"面红目赤"},"answer":"B","explain":"心气虚与心阳虚均有心悸、气短、神疲乏力等心气不足表现。畏寒肢冷为心阳虚才有的寒象。心胸刺痛属心血瘀阻。潮热盗汗属心阴虚。面红目赤属心火上炎。","tags":["鉴别"]},{"id":"JC-ZD-0066","type":"A1","group":null,"topic":"脏腑辨证-肺病","difficulty":1,"stem":"咳嗽痰黄稠，鼻流浊涕，发热重恶寒轻，证属","options":{"A":"风寒束肺","B":"燥邪伤肺","C":"肺阴亏虚","D":"痰湿蕴肺","E":"风热犯肺"},"answer":"E","explain":"咳痰黄稠、鼻流浊涕、发热重恶寒轻，为风热犯肺、肺失清肃。风寒束肺痰白清稀、恶寒重。燥邪伤肺干咳无痰、鼻咽干燥。肺阴亏虚干咳少痰、痰中带血。痰湿蕴肺痰多色白易咯、苔白腻。","tags":["高频"]},{"id":"JC-ZD-0067","type":"A1","group":null,"topic":"脏腑辨证-脾病","difficulty":2,"stem":"脾气虚证与脾阳虚证的鉴别要点是","options":{"A":"有无食少便溏","B":"有无神疲乏力","C":"有无腹胀","D":"有无畏寒肢冷","E":"有无舌淡"},"answer":"D","explain":"脾气虚与脾阳虚共有食少、腹胀、便溏、乏力、舌淡，脾阳虚兼见畏寒肢冷、腹痛喜温等寒象，故鉴别要点在于有无寒象。食少便溏、神疲乏力、腹胀、舌淡均为两证共有。","tags":["鉴别","高频"]},{"id":"JC-ZD-0068","type":"A1","group":null,"topic":"脏腑辨证-肝病","difficulty":3,"stem":"肝阳上亢证的典型表现是","options":{"A":"眩晕头胀，腰膝酸软","B":"胁肋胀痛，善太息","C":"面红目赤，口苦","D":"手足抽搐，项强","E":"目涩昏花，肢麻"},"answer":"A","explain":"肝阳上亢为肝肾阴虚、肝阳亢逆于上，上盛下虚，故见眩晕头胀、耳鸣而兼腰膝酸软。胁肋胀痛善太息属肝气郁结。面红目赤口苦属肝火上炎。手足抽搐项强属肝风内动。目涩昏花肢麻属肝血虚。","tags":["鉴别"]},{"id":"JC-ZD-0069","type":"A1","group":null,"topic":"脏腑辨证-肾病","difficulty":1,"stem":"肾阳虚证的典型表现是","options":{"A":"潮热盗汗","B":"头晕耳鸣","C":"腰膝冷痛，畏寒肢冷","D":"心悸失眠","E":"胁痛易怒"},"answer":"C","explain":"肾阳虚衰、温煦失职，见腰膝冷痛、畏寒肢冷、夜尿频多、舌淡胖。潮热盗汗与头晕耳鸣属肾阴虚。心悸失眠属心病。胁痛易怒属肝病。","tags":["高频"]},{"id":"JC-ZD-0070","type":"B1","group":"ZD-B1-005","group_stem":"A.心气虚　B.心血虚　C.肝气郁结　D.脾气虚　E.肾阴虚","topic":"脏腑辨证-证型判别","difficulty":2,"stem":"心悸气短，自汗，脉弱，属","options":{"A":"心气虚","B":"心血虚","C":"肝气郁结","D":"脾气虚","E":"肾阴虚"},"answer":"A","explain":"心悸气短、自汗、脉弱，为心气不足、鼓动无力。心血虚以心悸失眠、面色淡白、脉细为主。肝气郁结见胸胁胀满、善太息。脾气虚见食少便溏、腹胀。肾阴虚见腰膝酸软、潮热盗汗。","tags":[]},{"id":"JC-ZD-0071","type":"B1","group":"ZD-B1-005","group_stem":"A.心气虚　B.心血虚　C.肝气郁结　D.脾气虚　E.肾阴虚","topic":"脏腑辨证-证型判别","difficulty":2,"stem":"心悸失眠，面色淡白，唇舌色淡，脉细，属","options":{"A":"心气虚","B":"心血虚","C":"肝气郁结","D":"脾气虚","E":"肾阴虚"},"answer":"B","explain":"心悸失眠、面色淡白、唇舌色淡、脉细，为心血不足、心神失养。心气虚以气短自汗、脉弱为主。肝气郁结见胸胁胀满。脾气虚见食少便溏。肾阴虚见腰膝酸软、舌红少苔。","tags":[]},{"id":"JC-ZD-0072","type":"B1","group":"ZD-B1-005","group_stem":"A.心气虚　B.心血虚　C.肝气郁结　D.脾气虚　E.肾阴虚","topic":"脏腑辨证-证型判别","difficulty":2,"stem":"情志抑郁，胸胁胀满，善太息，脉弦，属","options":{"A":"心气虚","B":"心血虚","C":"肝气郁结","D":"脾气虚","E":"肾阴虚"},"answer":"C","explain":"情志抑郁、胸胁胀满、善太息、脉弦，为肝失疏泄、气机郁滞。心气虚见心悸气短。心血虚见面白脉细。脾气虚见食少便溏。肾阴虚见腰膝酸软、潮热盗汗。","tags":["高频"]},{"id":"JC-ZD-0073","type":"A2","group":null,"topic":"脏腑辨证-痰热壅肺","difficulty":3,"stem":"患者，男，45岁。一周来咳嗽气粗，痰多黄稠，咯吐不爽，胸闷胸痛，发热口渴，大便干结，小便短黄，舌红苔黄腻，脉滑数。其证属","options":{"A":"风热犯肺","B":"痰热壅肺","C":"肺阴亏虚","D":"燥邪伤肺","E":"风寒束肺"},"answer":"B","explain":"咳痰黄稠量多、胸闷胸痛、发热口渴、苔黄腻、脉滑数，为痰热壅阻肺气。风热犯肺以表证为主而痰少。肺阴亏虚干咳少痰、舌红少苔。燥邪伤肺干咳无痰、鼻咽干燥。风寒束肺痰白清稀、恶寒重。","tags":["鉴别"]},{"id":"JC-ZD-0074","type":"A2","group":null,"topic":"脏腑辨证-肝火上炎","difficulty":2,"stem":"患者，男，38岁。近半月头痛剧烈，两侧为主，面红目赤，口苦咽干，急躁易怒，失眠多梦，便秘尿黄，舌红苔黄，脉弦数。其证属","options":{"A":"肝阳上亢","B":"肝气郁结","C":"肝血虚","D":"肝火上炎","E":"肝风内动"},"answer":"D","explain":"头痛剧烈、面红目赤、口苦咽干、急躁易怒、舌红苔黄、脉弦数，为肝火炽盛上炎。肝阳上亢为上盛下虚而兼腰膝酸软。肝气郁结见情志抑郁、胸胁胀满。肝血虚见目涩肢麻、面色淡白。肝风内动见抽搐、震颤、项强。","tags":["高频"]},{"id":"JC-ZD-0075","type":"A2","group":null,"topic":"脏腑辨证-肾阴虚","difficulty":2,"stem":"患者，女，50岁。近一年腰膝酸软，头晕耳鸣，失眠多梦，潮热盗汗，五心烦热，咽干口燥，月经紊乱，舌红少苔，脉细数。其证属","options":{"A":"肾阳虚","B":"肾气不固","C":"肝肾阴虚","D":"心火亢盛","E":"肾阴虚"},"answer":"E","explain":"腰膝酸软、头晕耳鸣、潮热盗汗、五心烦热、舌红少苔、脉细数，为肾阴亏虚、虚火内生。肾阳虚见畏寒肢冷。肾气不固见小便频数失禁、遗精滑泄。肝肾阴虚当兼目涩、胁痛。心火亢盛见心烦口舌生疮而无腰膝酸软。","tags":["高频"]},{"id":"JC-ZD-0076","type":"A2","group":null,"topic":"脏腑辨证-胃热炽盛","difficulty":2,"stem":"患者，男，36岁。近一月胃脘灼痛，渴喜冷饮，消谷善饥，口臭，牙龈肿痛出血，大便干结，小便短黄，舌红苔黄，脉滑数。其证属","options":{"A":"胃阴虚","B":"胃气虚","C":"脾胃湿热","D":"胃热炽盛","E":"肝气犯胃"},"answer":"D","explain":"胃脘灼痛、渴喜冷饮、消谷善饥、口臭、牙龈肿痛、舌红苔黄、脉滑数，为胃火炽盛。胃阴虚见饥不欲食、舌红少苔。胃气虚见胃脘隐痛、食少乏力。脾胃湿热见苔黄腻、身重困倦。肝气犯胃见嗳气吞酸而随情志加重。","tags":["高频"]},{"id":"JC-ZD-0077","type":"A1","group":null,"topic":"六经辨证-太阳病","difficulty":2,"stem":"太阳伤寒证的典型表现是","options":{"A":"发热汗出，恶风，脉浮缓","B":"寒热往来，口苦咽干","C":"恶寒发热，无汗，头身疼痛，脉浮紧","D":"但热不寒，大汗大渴","E":"腹满而吐，自利益甚"},"answer":"C","explain":"太阳伤寒为风寒束表、卫阳被遏，见恶寒发热、无汗、头身疼痛、脉浮紧。发热汗出、恶风、脉浮缓为太阳中风。寒热往来、口苦咽干为少阳病。但热不寒、大汗大渴为阳明经证。腹满而吐、自利益甚为太阴病。","tags":["高频"]},{"id":"JC-ZD-0078","type":"A2","group":null,"topic":"六经辨证-阳明病","difficulty":2,"stem":"患者，男，30岁。三日来身大热，不恶寒反恶热，汗大出，口大渴，心烦，面赤，大便三日未行，小便短赤，舌红苔黄燥，脉洪大有力。此属","options":{"A":"太阳中风","B":"阳明经证","C":"少阳病","D":"太阴病","E":"厥阴病"},"answer":"B","explain":"身大热、汗大出、口大渴、不恶寒反恶热、脉洪大，为阳明热盛、邪热弥漫，属阳明经证。太阳中风见发热汗出而恶风、脉浮缓。少阳病见寒热往来、口苦咽干。太阴病见腹满呕吐、自利。厥阴病见消渴、气上撞心、厥热往来。","tags":["高频"]},{"id":"JC-ZD-0079","type":"A1","group":null,"topic":"卫气营血辨证-卫分证","difficulty":2,"stem":"卫分证的主要特点是","options":{"A":"身热夜甚，心烦不寐","B":"斑疹隐隐，舌红绛","C":"神昏谵语，舌謇肢厥","D":"发热微恶风寒，脉浮数","E":"手足蠕动，舌干绛"},"answer":"D","explain":"卫分证为温邪初袭肌表，见发热微恶风寒、头痛、口微渴、舌边尖红、脉浮数。身热夜甚、心烦不寐为营分证。斑疹隐隐、舌红绛亦属营分。神昏谵语、舌謇肢厥为热陷心包或血分。手足蠕动、舌干绛为血分虚风内动。","tags":["高频"]},{"id":"JC-ZD-0080","type":"A2","group":null,"topic":"卫气营血辨证-营分证","difficulty":3,"stem":"患者，男，25岁。五日来身热夜甚，心烦不寐，时有谵语，口干而不甚渴饮，肌肤斑疹隐隐，目常喜闭，舌红绛，脉细数。此属","options":{"A":"卫分证","B":"气分证","C":"气血两燔","D":"血分证","E":"营分证"},"answer":"E","explain":"身热夜甚、心烦不寐、时有谵语、斑疹隐隐、舌红绛、脉细数，为热灼营阴、扰及心神。卫分证见发热微恶风寒、脉浮数。气分证见壮热不恶寒、大汗大渴、脉洪大。气血两燔见高热、斑疹显露、舌绛。血分证见斑疹显露或出血、舌深绛、神昏抽搐。","tags":["鉴别"]}]},{"meta":{"bank_id":"linchuang-erke","title":"中医儿科学","paper":"linchuang","subject":"中医儿科学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":50,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"LC-EK-0001","type":"A1","group":null,"topic":"总论-生理特点","difficulty":2,"stem":"小儿脏腑娇嫩、形气未充，最突出表现于","options":{"A":"肺、脾、肾三脏不足","B":"心、肝、肾三脏不足","C":"心、肺、脾三脏不足","D":"肝、脾、肾三脏不足","E":"心、肺、肝三脏不足"},"answer":"A","explain":"小儿脏腑娇嫩、形气未充，以肺、脾、肾三脏更为突出，故有肺常不足、脾常不足、肾常虚之说，易患肺系、脾系、肾系病证。心、肝两脏常有余，病理上易见心火、肝风之证，不属不足的突出表现。","tags":["高频"]},{"id":"LC-EK-0002","type":"A1","group":null,"topic":"总论-病理特点","difficulty":3,"stem":"小儿患病后易趋康复，主要取决于","options":{"A":"脏气清灵、生机蓬勃","B":"形气未充、脏腑娇嫩","C":"肺常不足、脾常虚","D":"肾常虚、骨气未充","E":"神气怯弱、肝常有余"},"answer":"A","explain":"小儿生机蓬勃、脏气清灵，病因单纯、少七情所伤，对治疗反应灵敏，故患病后易趋康复。B、C、D 均为脏腑娇嫩、形气未充的表现，是发病容易、传变迅速的基础；E 是小儿感冒夹惊的病理基础。","tags":["易错"]},{"id":"LC-EK-0003","type":"A1","group":null,"topic":"总论-年龄分期","difficulty":1,"stem":"自出生后脐带结扎至满 28 天，称为","options":{"A":"新生儿期","B":"婴儿期","C":"幼儿期","D":"学龄前期","E":"胎儿期"},"answer":"A","explain":"新生儿期指自出生脐带结扎至满 28 天；婴儿期为出生 28 天后至满 1 周岁；幼儿期为 1 至 3 周岁；学龄前期为 3 至 7 周岁；胎儿期为受孕至分娩。","tags":[]},{"id":"LC-EK-0004","type":"A1","group":null,"topic":"总论-生长发育","difficulty":1,"stem":"正常小儿 1 周岁时的体重约为出生体重的","options":{"A":"2 倍","B":"3 倍","C":"4 倍","D":"1.5 倍","E":"5 倍"},"answer":"B","explain":"小儿出生体重约 3 kg，生后前半年每月增长约 0.7 kg、后半年每月约 0.5 kg，1 周岁时约 9 至 10 kg，为出生体重的 3 倍；2 周岁约为 4 倍。故 A、C、D、E 均不符合。","tags":["计算"]},{"id":"LC-EK-0005","type":"A1","group":null,"topic":"总论-望指纹","difficulty":1,"stem":"小儿指纹三关，自掌指关节向指尖依次为","options":{"A":"风关、气关、命关","B":"命关、气关、风关","C":"气关、风关、命关","D":"风关、命关、气关","E":"气关、命关、风关"},"answer":"A","explain":"指纹位于食指桡侧，自掌指关节横纹向指尖依次为风关、气关、命关。纹仅显于风关者病轻，达气关者病重，透关射指达命关者病危。B 为倒序，C、D、E 顺序错乱。","tags":["高频"]},{"id":"LC-EK-0006","type":"A1","group":null,"topic":"新生儿疾病-胎黄","difficulty":2,"stem":"生理性胎黄与病理性胎黄鉴别的关键点是","options":{"A":"黄疸出现与消退的时间、程度及伴随症状","B":"患儿的性别","C":"母亲的年龄","D":"出生时的体重","E":"喂养的方式"},"answer":"A","explain":"生理性胎黄多在生后 2 至 3 天出现、4 至 5 天最重，足月儿 2 周内消退，一般情况良好；病理性胎黄出现早（24 小时内）、发展快、程度重、消退迟或退而复现，常伴精神萎靡、拒乳、肝脾肿大。性别、母龄、体重、喂养方式均非主要鉴别依据。","tags":["鉴别","高频"]},{"id":"LC-EK-0007","type":"A1","group":null,"topic":"新生儿疾病-硬肿症","difficulty":3,"stem":"新生儿硬肿症皮肤硬肿最先出现的部位是","options":{"A":"小腿及大腿外侧","B":"面颊部","C":"双上肢","D":"腹部","E":"脊背部"},"answer":"A","explain":"新生儿硬肿症皮肤硬肿常自小腿、大腿外侧开始，逐渐向上蔓延至臀部、面颊、上肢，严重时波及全身。面颊、上肢、腹部、背部均可受累，但多出现在下肢之后。","tags":["易错"]},{"id":"LC-EK-0008","type":"A1","group":null,"topic":"肺系病证-小儿感冒","difficulty":2,"stem":"小儿感冒易出现夹惊，其病理基础是","options":{"A":"神气怯弱、肝常有余","B":"肺常不足、卫外不固","C":"脾常不足、运化无力","D":"肾常虚、封藏失职","E":"心常有余、火扰心神"},"answer":"A","explain":"小儿神气怯弱、肝常有余，感邪后热易扰及心肝，出现惊惕啼叫、睡卧不宁，甚则抽搐，称夹惊。肺常不足是夹痰的基础；脾常不足是夹滞的基础；肾常虚与三夹均无关；心常有余非其规范表述。","tags":["高频"]},{"id":"LC-EK-0009","type":"A1","group":null,"topic":"肺系病证-肺炎喘嗽","difficulty":2,"stem":"肺炎喘嗽的主要病机是","options":{"A":"肺气郁闭","B":"脾失健运","C":"肾不纳气","D":"肝风内动","E":"心阳不振"},"answer":"A","explain":"肺炎喘嗽由外邪犯肺、痰热壅阻、肺失宣肃、肺气郁闭而致，临床以发热、咳嗽、痰壅、气急、鼻煽为主症。脾失健运、肾不纳气属其他病证；肝风内动、心阳不振分别是其邪陷心肝、心阳虚衰两个变证的病理基础。","tags":["高频"]},{"id":"LC-EK-0010","type":"A1","group":null,"topic":"肺系病证-哮喘","difficulty":2,"stem":"小儿哮喘发作期的主要病机是","options":{"A":"痰饮内伏、遇感触发","B":"肺脾气虚、卫外不固","C":"肾不纳气、气失摄纳","D":"阴虚火旺、灼津成痰","E":"肝气郁结、气机不畅"},"answer":"A","explain":"哮喘以痰饮内伏为夙根，遇外感、异物、劳倦等诱因触发，痰气交阻、肺失宣降，故喘息气促、喉间哮鸣。B、C 为缓解期常见证候；D、E 与发作期的主要病机不符。","tags":[]},{"id":"LC-EK-0011","type":"A1","group":null,"topic":"肺系病证-咳嗽","difficulty":1,"stem":"小儿风寒咳嗽的治法是","options":{"A":"疏风散寒、宣肺止咳","B":"疏风清热、宣肺止咳","C":"燥湿化痰、理气止咳","D":"养阴润肺、化痰止咳","E":"健脾补肺、益气止咳"},"answer":"A","explain":"风寒咳嗽因风寒袭肺、肺气失宣而致，症见咳声重浊、痰白清稀、鼻塞流清涕、苔薄白脉浮紧，治当疏风散寒、宣肺止咳。B 用于风热咳嗽（痰黄稠、咽红）；C 用于痰湿咳嗽；D 用于阴虚咳嗽；E 用于气虚咳嗽。","tags":["高频"]},{"id":"LC-EK-0012","type":"A1","group":null,"topic":"脾系病证-鹅口疮","difficulty":1,"stem":"鹅口疮的典型表现是","options":{"A":"口腔黏膜及舌上满布白屑，状如鹅口","B":"口腔黏膜散在溃疡，周围红赤","C":"牙龈红肿出血，口气臭秽","D":"舌面光剥无苔，色红如镜","E":"口角皲裂糜烂，张口疼痛"},"answer":"A","explain":"鹅口疮由白色念珠菌感染所致，口腔黏膜、舌上、齿龈出现白色乳凝块样物，状如鹅口，不易擦去，强行擦去可见充血糜烂面。B 为口疮；C 为牙龈炎；D 为镜面舌；E 为口角炎。","tags":["高频"]},{"id":"LC-EK-0013","type":"A1","group":null,"topic":"脾系病证-泄泻","difficulty":2,"stem":"小儿泄泻的主要病机是","options":{"A":"脾胃运化失常、清浊不分","B":"肺失宣降、通调失职","C":"肝风内动、筋脉失养","D":"肾不纳气、气逆于上","E":"心阳虚衰、血脉瘀阻"},"answer":"A","explain":"小儿脾常不足，感受外邪、内伤乳食或脾肾阳虚，均可致脾胃运化失司、清浊不分、水湿内停而发为泄泻。肺失宣降属肺系病证；肝风内动、心阳虚衰、肾不纳气分别与惊风、心悸、哮喘等相关。","tags":[]},{"id":"LC-EK-0014","type":"A1","group":null,"topic":"心肝系病证-急惊风","difficulty":1,"stem":"急惊风的四证是","options":{"A":"热、痰、惊、风","B":"风、寒、暑、湿","C":"痰、瘀、虚、实","D":"惊、恐、悲、忧","E":"火、湿、燥、寒"},"answer":"A","explain":"急惊风以热、痰、惊、风四证为临床特征，热盛生风、痰盛发搐、惊则神志不宁；其八候为搐、搦、颤、掣、反、引、窜、视。B 为外感六淫；C、D、E 均非急惊风的辨证纲领。","tags":["高频"]},{"id":"LC-EK-0015","type":"A1","group":null,"topic":"心肝系病证-慢惊风","difficulty":2,"stem":"慢惊风的主要病机是","options":{"A":"脾虚肝旺、阴虚风动","B":"热盛动风、痰火扰心","C":"痰热蒙蔽心窍","D":"外感风邪、肺卫失宣","E":"肝气郁结、气机不畅"},"answer":"A","explain":"慢惊风多见于大病久病之后，脾胃虚弱、肝木侮土，或热病伤阴、肝肾阴虚、虚风内动，故以脾虚肝旺、阴虚风动为主要病机，症见抽搐无力、时作时止。B、C 为急惊风病机；D 为外感病机；E 与惊风无关。","tags":["鉴别"]},{"id":"LC-EK-0016","type":"A1","group":null,"topic":"肾系病证-水肿","difficulty":1,"stem":"小儿急性肾炎水肿的首发部位多为","options":{"A":"眼睑及颜面部","B":"双下肢","C":"腹部","D":"腰骶部","E":"阴囊"},"answer":"A","explain":"阳水多由风邪外袭、肺失宣降、水湿泛溢而致，起病急，水肿自眼睑、颜面开始，继而波及全身，按之凹陷易起。双下肢、腹部多见于阴水；腰骶、阴囊水肿多属局部病变或其他病证。","tags":["高频"]},{"id":"LC-EK-0017","type":"A1","group":null,"topic":"传染病-麻疹","difficulty":2,"stem":"麻疹早期诊断最有价值的体征是","options":{"A":"麻疹黏膜斑","B":"全身红色斑丘疹","C":"高热持续不退","D":"阵发性干咳","E":"结膜充血畏光"},"answer":"A","explain":"麻疹黏膜斑出现于出疹前 1 至 2 天，位于双侧颊黏膜近磨牙处，为灰白色小点、周围有红晕，是早期诊断的重要依据。皮疹为出疹期表现；发热、咳嗽、结膜充血属前驱期的一般症状，缺乏特异性。","tags":["高频","经典"]},{"id":"LC-EK-0018","type":"A1","group":null,"topic":"其他-夏季热","difficulty":3,"stem":"夏季热的主要临床特征是","options":{"A":"长期发热、口渴多饮、多尿、少汗","B":"高热、抽搐、昏迷","C":"发热、皮疹、淋巴结肿大","D":"发热、咳嗽、气促鼻煽","E":"发热、呕吐、腹泻脱水"},"answer":"A","explain":"夏季热多见于 3 岁以下婴幼儿，发于盛夏，以长期发热、口渴多饮、多尿、少汗为特征，秋凉后多能自愈。B 见于暑温、急惊风；C 见于传染性单核细胞增多症等；D 为肺炎喘嗽；E 为消化道感染。","tags":["鉴别"]},{"id":"LC-EK-0019","type":"A1","group":null,"topic":"其他-维生素D缺乏性佝偻病","difficulty":1,"stem":"维生素 D 缺乏性佝偻病激期的主要骨骼改变是","options":{"A":"方颅、肋骨串珠、手足镯","B":"杵状指、关节畸形","C":"脊柱侧弯、驼背","D":"关节红肿、活动受限","E":"肌肉萎缩、腱反射消失"},"answer":"A","explain":"佝偻病激期因钙磷代谢紊乱、骨样组织钙化障碍，出现方颅、肋骨串珠、肋膈沟、手足镯、鸡胸等骨骼改变。杵状指见于慢性缺氧性疾病；脊柱侧弯多与姿势或先天因素有关；关节红肿见于关节炎；肌肉萎缩见于神经肌肉疾病。","tags":["高频"]},{"id":"LC-EK-0020","type":"A1","group":null,"topic":"其他-紫癜","difficulty":2,"stem":"小儿紫癜最常见的首发表现是","options":{"A":"双下肢及臀部对称性皮肤紫癜","B":"阵发性剧烈腹痛","C":"游走性关节肿痛","D":"肉眼血尿","E":"反复鼻衄"},"answer":"A","explain":"紫癜以对称性、批发性皮肤紫癜为最常见的首发表现，多见于双下肢伸侧及臀部，高出皮面、压之不退色。腹痛、关节肿痛、血尿多在皮疹之后出现；反复鼻衄多见于血小板减少性紫癜。","tags":["高频"]},{"id":"LC-EK-0021","type":"A2","group":null,"topic":"总论-生长发育","difficulty":1,"stem":"患儿，男，10 个月。前囟尚未闭合，头围 46 cm，能独站片刻，会发爸爸等单词。其发育情况属于","options":{"A":"正常范围","B":"佝偻病激期","C":"脑积水","D":"小头畸形","E":"生长发育迟缓"},"answer":"A","explain":"前囟一般在生后 12 至 18 个月闭合，10 个月未闭属正常；头围 1 岁时约 46 cm，10 个月接近此值；10 个月能独站片刻、发单词符合发育规律。佝偻病见方颅、前囟迟闭、夜惊多汗；脑积水见头围异常增大、前囟饱满；小头畸形见头围明显偏小；发育迟缓见运动语言明显落后。","tags":["易错"]},{"id":"LC-EK-0022","type":"A2","group":null,"topic":"总论-喂养保健","difficulty":1,"stem":"患儿，男，5 个月。母乳充足，家长询问添加辅食的原则。下列正确的是","options":{"A":"由少到多、由稀到稠、由细到粗、由一种到多种","B":"由多到少、由稠到稀、一次多种同时添加","C":"满月即开始添加，越早越好","D":"以成人饭菜为主，逐步断奶","E":"辅食添加后即可停喂母乳"},"answer":"A","explain":"添加辅食应遵循由少到多、由稀到稠、由细到粗、由一种到多种的原则，并观察消化耐受情况，每加一种需适应数日。B 违背循序渐进；C 过早添加易致消化不良；D 小儿脾胃娇嫩，不宜早进成人饮食；E 母乳仍是重要营养来源，不应骤停。","tags":[]},{"id":"LC-EK-0023","type":"A2","group":null,"topic":"总论-小儿用药","difficulty":2,"stem":"患儿，女，出生 10 天。需用中药治疗，按年龄折算其用量约为成人量的","options":{"A":"六分之一","B":"四分之一","C":"三分之一","D":"二分之一","E":"三分之二"},"answer":"A","explain":"小儿用药剂量随年龄递增，新生儿约为成人量的六分之一，乳婴儿约为三分之一，幼儿及幼童约为二分之一至三分之二，学龄期儿童接近成人量，并需结合体重、病情与个体差异调整。B、C、D、E 对应的年龄段均大于新生儿。","tags":["计算"]},{"id":"LC-EK-0024","type":"A2","group":null,"topic":"新生儿疾病-胎黄","difficulty":2,"stem":"患儿，男，出生 20 天。皮肤巩膜黄染，色泽鲜明如橘，精神疲倦，不欲吮乳，小便短黄，大便干结，舌红，苔黄腻。其证型是","options":{"A":"湿热郁蒸证","B":"寒湿阻滞证","C":"气滞血瘀证","D":"脾虚湿困证","E":"肝肾阴虚证"},"answer":"A","explain":"湿热郁蒸证因孕母湿热传于胎儿或胎产时感受湿热，熏蒸肝胆、疏泄失常而致，故黄疸鲜明如橘、小便短黄、大便干结，舌红苔黄腻，治当清热利湿退黄。B 见黄疸晦暗、神疲肢冷；C 见黄疸晦暗、面色青紫、胁下痞块；D、E 非胎黄常见分型。","tags":["高频"]},{"id":"LC-EK-0025","type":"A2","group":null,"topic":"新生儿疾病-脐部疾患","difficulty":3,"stem":"患儿，女，出生 6 天。脐部红肿、渗出黄色液体，气味臭秽，伴发热、烦躁不安，舌红，苔黄。其诊断是","options":{"A":"脐疮","B":"脐湿","C":"脐血","D":"脐突","E":"脐风"},"answer":"A","explain":"脐疮指脐部红肿热痛、渗出脓液、气味臭秽，甚则糜烂化脓，多因脐湿久延、湿热化毒而致，治当清热解毒、佐以疏风。脐湿仅渗液而无红肿化脓；脐血为脐部渗血；脐突为脐部突起如球；脐风即新生儿破伤风，见牙关紧闭、苦笑面容、四肢抽搐。","tags":["鉴别"]},{"id":"LC-EK-0026","type":"A2","group":null,"topic":"肺系病证-小儿感冒","difficulty":2,"stem":"患儿，男，3 岁。发热 2 天，鼻塞流涕，咳嗽，脘腹胀满，不思乳食，呕吐酸腐，大便酸臭，舌红，苔厚腻，脉浮滑。其证型是","options":{"A":"感冒夹滞","B":"感冒夹痰","C":"感冒夹惊","D":"风寒感冒","E":"风热感冒"},"answer":"A","explain":"小儿脾常不足，感邪后易致乳食停滞，故表证之外兼见脘腹胀满、不思乳食、呕吐酸腐、大便酸臭、苔厚腻，属感冒夹滞，治当解表兼消食导滞，方用银翘散合保和丸。B 夹痰以咳嗽痰多、喉中痰鸣为主；C 夹惊以惊惕啼叫、睡卧不宁为主；D、E 未能概括兼夹之象。","tags":["高频"]},{"id":"LC-EK-0027","type":"A2","group":null,"topic":"肺系病证-肺炎喘嗽","difficulty":2,"stem":"患儿，女，4 岁。发热 3 天，咳嗽气急，痰多色黄黏稠，鼻煽，口渴，舌红，苔黄腻，脉滑数。其治法是","options":{"A":"清热涤痰、开肺定喘","B":"辛温宣肺、化痰止咳","C":"养阴清肺、润燥止咳","D":"益气健脾、化痰止咳","E":"温补心阳、救逆固脱"},"answer":"A","explain":"肺炎喘嗽痰热闭肺证因痰热壅盛、肺气郁闭而致，症见发热咳嗽、气急鼻煽、痰黄黏稠、苔黄腻脉滑数，治当清热涤痰、开肺定喘，方用五虎汤合葶苈大枣泻肺汤。B 用于风寒闭肺；C 用于阴虚肺热；D 用于肺脾气虚；E 用于心阳虚衰之变证。","tags":["高频"]},{"id":"LC-EK-0028","type":"A2","group":null,"topic":"肺系病证-肺炎喘嗽","difficulty":3,"stem":"患儿，男，2 岁。肺炎喘嗽 5 天，突然面色苍白，口唇青紫，呼吸浅促，四肢厥冷，烦躁不安，舌紫暗，脉微弱。其证型是","options":{"A":"心阳虚衰","B":"邪陷心肝","C":"痰热闭肺","D":"风寒闭肺","E":"阴虚肺热"},"answer":"A","explain":"肺炎喘嗽病程中邪毒内陷、心阳不振、血脉瘀阻，故见面色苍白、口唇青紫、呼吸浅促、四肢厥冷、脉微弱，属心阳虚衰之变证，治当温补心阳、救逆固脱。邪陷心肝以壮热神昏、抽搐为主；痰热闭肺、风寒闭肺为常证；阴虚肺热见于恢复期。","tags":["易错","高频"]},{"id":"LC-EK-0029","type":"A2","group":null,"topic":"肺系病证-哮喘","difficulty":2,"stem":"患儿，男，6 岁。哮喘反复发作 2 年，此次发作 1 天，喘息气促，喉间哮鸣，痰黄黏稠，面赤口渴，舌红，苔黄腻，脉滑数。其治法是","options":{"A":"清肺涤痰、止咳平喘","B":"温肺散寒、化痰平喘","C":"健脾益气、补肺固表","D":"补肾固本、纳气归元","E":"养阴清热、润肺止咳"},"answer":"A","explain":"热性哮喘因痰热壅肺、肺失宣肃而致，症见喘息哮鸣、痰黄黏稠、面赤口渴，舌红苔黄腻脉滑数，治当清肺涤痰、止咳平喘，方用麻杏石甘汤合苏葶丸。B 用于寒性哮喘（痰白清稀、形寒无汗）；C、D 用于缓解期；E 用于阴虚。","tags":["高频"]},{"id":"LC-EK-0030","type":"A2","group":null,"topic":"肺系病证-咳嗽","difficulty":1,"stem":"患儿，女，5 岁。咳嗽 1 周，痰多色黄黏稠，难以咯出，口渴，大便干结，舌红，苔黄腻，脉滑数。其证型是","options":{"A":"痰热咳嗽","B":"风寒咳嗽","C":"风热咳嗽","D":"痰湿咳嗽","E":"气虚咳嗽"},"answer":"A","explain":"痰热咳嗽因痰热蕴肺、肺失清肃而致，症见咳嗽痰多色黄黏稠、难以咯出、口渴便干，舌红苔黄腻脉滑数，治当清肺化痰止咳，方用清金化痰汤。B 见痰白清稀、鼻塞流清涕；C 见痰黄而稀、咽红；D 见痰白量多易咯、苔白腻；E 见咳声无力、气短自汗。","tags":["高频"]},{"id":"LC-EK-0031","type":"A2","group":null,"topic":"脾系病证-泄泻","difficulty":2,"stem":"患儿，男，2 岁。腹泻 3 天，日行十余次，大便水样、色黄而臭，夹有黏液，肛门灼红，伴发热、口渴、小便短黄，舌红，苔黄腻，脉滑数。其治法是","options":{"A":"清肠解热、化湿止泻","B":"消食导滞、和中止泻","C":"疏风散寒、化湿和中","D":"健脾益气、升阳止泻","E":"温补脾肾、固涩止泻"},"answer":"A","explain":"湿热泻因湿热蕴结脾胃、传化失常而致，症见大便水样色黄臭秽、夹黏液、肛门灼红，兼发热口渴、苔黄腻脉滑数，治当清肠解热、化湿止泻，方用葛根黄芩黄连汤。B 用于伤食泻；C 用于风寒泻；D 用于脾虚泻；E 用于脾肾阳虚泻。","tags":["高频"]},{"id":"LC-EK-0032","type":"A2","group":null,"topic":"脾系病证-泄泻","difficulty":3,"stem":"患儿，女，1 岁。腹泻 2 天，泻下如水，日行二十余次，精神萎靡，目眶凹陷，皮肤干燥弹性差，口渴引饮，小便极少，舌红少津，脉细数。其证型是","options":{"A":"气阴两伤","B":"阴竭阳脱","C":"湿热泻","D":"伤食泻","E":"脾虚泻"},"answer":"A","explain":"暴泻不止、耗伤气阴，故见精神萎靡、目眶凹陷、皮肤干燥、口渴引饮、小便极少，舌红少津、脉细数，属气阴两伤之变证，治当益气养阴、酸甘化阴。阴竭阳脱则在气阴耗伤基础上出现面色苍白、四肢厥冷、脉微欲绝；C、D、E 为常证，无重度脱水表现。","tags":["易错","高频"]},{"id":"LC-EK-0033","type":"A2","group":null,"topic":"脾系病证-疳证","difficulty":3,"stem":"患儿，男，2 岁。形体明显消瘦，肚腹膨胀，青筋暴露，面色萎黄，毛发稀疏易脱，精神不振，纳呆，舌淡，苔白，脉细弱。其证型是","options":{"A":"疳积","B":"疳气","C":"干疳","D":"积滞","E":"厌食"},"answer":"A","explain":"疳积为疳证中期，脾胃虚损而积滞内停，故形体明显消瘦而肚腹膨胀、青筋暴露、毛发稀疏，属虚实夹杂，治当消积理脾。疳气为初期，仅形体略瘦、食欲不振；干疳为后期，极度消瘦、皮肤干枯；积滞以乳食停滞为主而无明显消瘦；厌食以食欲不振为主、形体正常。","tags":["鉴别","易错"]},{"id":"LC-EK-0034","type":"A2","group":null,"topic":"脾系病证-积滞","difficulty":2,"stem":"患儿，女，4 岁。不思乳食 5 天，脘腹胀满，嗳腐酸馊，大便酸臭秘结，夜卧不安，舌红，苔厚腻，脉滑。其治法是","options":{"A":"消食化积、导滞和中","B":"健脾益气、和胃消食","C":"清热利湿、和中止泻","D":"温中散寒、理气止痛","E":"养阴益胃、和中进食"},"answer":"A","explain":"积滞乳食内积证因乳食不节、停滞中焦、脾运失司而致，症见不思乳食、脘腹胀满、嗳腐酸馊、大便酸臭秘结，苔厚腻脉滑，治当消食化积、导滞和中，方用保和丸。B 用于脾虚夹积（神疲乏力、大便溏薄）；C 用于湿热；D 用于寒凝；E 用于胃阴不足。","tags":["高频"]},{"id":"LC-EK-0035","type":"A2","group":null,"topic":"心肝系病证-急惊风","difficulty":1,"stem":"患儿，男，3 岁。高热 2 小时，突然神志昏迷、四肢抽搐、两目上视、牙关紧闭，舌红，苔黄，脉数。其首要处理原则是","options":{"A":"先止痉，后辨因","B":"先辨因，后止痉","C":"先退热，后止痉","D":"先通腑，后止痉","E":"先补液，后止痉"},"answer":"A","explain":"急惊风发作时应宗急则治其标之旨，立即止痉以控制抽搐、防止脑缺氧，然后再辨其病因以治本。B 顺序颠倒；C、D、E 均为辅助措施，不能取代止痉的首要地位。","tags":["高频","易错"]},{"id":"LC-EK-0036","type":"A2","group":null,"topic":"心肝系病证-夜啼","difficulty":2,"stem":"患儿，女，8 个月。夜间啼哭不止 1 周，哭声洪亮，见灯尤甚，烦躁不安，面赤唇红，小便短黄，舌尖红，苔薄黄。其证型是","options":{"A":"心经积热","B":"脾寒气滞","C":"惊恐伤神","D":"脾虚气弱","E":"肝经郁热"},"answer":"A","explain":"夜啼心经积热证因孕母恣食辛热或婴儿感受火热之邪，心火上炎、热扰神明，故夜间啼哭、哭声洪亮、见灯尤甚、面赤唇红、小便短黄，治当清心导赤，方用导赤散。B 见哭声低微、蜷缩、腹冷；C 见猝然啼哭、面色青灰；D、E 非其常见分型。","tags":["高频"]},{"id":"LC-EK-0037","type":"A2","group":null,"topic":"心肝系病证-汗证","difficulty":2,"stem":"患儿，男，5 岁。睡中汗出、醒时汗止 2 个月，伴手足心热、心烦少寐、口干，舌红，苔少，脉细数。其证型是","options":{"A":"盗汗，阴虚火旺","B":"自汗，营卫不和","C":"自汗，肺卫不固","D":"盗汗，脾胃湿热","E":"自汗，气阴两虚"},"answer":"A","explain":"睡中汗出、醒时汗止为盗汗；阴虚火旺、虚热内扰、迫津外泄，故兼手足心热、心烦少寐、口干，舌红苔少脉细数，治当滋阴降火、敛汗，方用当归六黄汤。B、C、E 均以自汗为主；D 脾胃湿热见汗出黏腻、口臭、苔黄腻。","tags":["鉴别"]},{"id":"LC-EK-0038","type":"A2","group":null,"topic":"肾系病证-水肿","difficulty":2,"stem":"患儿，男，7 岁。眼睑浮肿 3 天，渐及全身，小便短少，伴发热、咽痛、咳嗽，舌红，苔薄白，脉浮数。其证型是","options":{"A":"风水相搏","B":"湿热内侵","C":"脾虚湿困","D":"脾肾阳虚","E":"肝肾阴虚"},"answer":"A","explain":"风水相搏证因风邪外袭、肺气不宣、通调失职而致，故眼睑先肿、迅及全身、小便短少，兼发热咽痛咳嗽、脉浮数，治当疏风宣肺、利水消肿，方用麻黄连翘赤小豆汤。B 见皮肤疮疡、尿赤；C 见下肢肿甚、倦怠；D 见水肿日久、畏寒肢冷；E 见头晕、血压升高。","tags":["高频"]},{"id":"LC-EK-0039","type":"A2","group":null,"topic":"传染病-麻疹","difficulty":2,"stem":"患儿，男，4 岁。发热 4 天，体温 39.5 度，耳后发际出现红色斑丘疹，渐及面颈、躯干、四肢，3 天出齐，疹间皮肤正常，伴咳嗽、目赤畏光。最可能的诊断是","options":{"A":"麻疹","B":"风疹","C":"幼儿急疹","D":"猩红热","E":"水痘"},"answer":"A","explain":"麻疹出疹顺序为耳后发际、面部、颈部、躯干、四肢，3 至 4 天出齐，疹间皮肤正常，伴高热、咳嗽、目赤畏光及麻疹黏膜斑。风疹发热 1 至 2 天出疹、疹退快、耳后淋巴结肿大；幼儿急疹热退疹出；猩红热为弥漫性猩红色丘疹、疹间无正常皮肤；水痘为分批出现的斑丘疹与水疱。","tags":["鉴别","高频"]},{"id":"LC-EK-0040","type":"A2","group":null,"topic":"其他-营养性缺铁性贫血","difficulty":2,"stem":"患儿，女，1 岁。面色萎黄、唇甲色淡 2 个月，神疲乏力，食欲不振，易患感冒，舌淡，苔薄白，脉细弱，血红蛋白降低。其证型是","options":{"A":"脾胃虚弱","B":"心脾两虚","C":"肝肾阴虚","D":"脾肾阳虚","E":"气不摄血"},"answer":"A","explain":"缺铁性贫血脾胃虚弱证因脾胃运化失常、气血生化不足而致，症见面色萎黄、唇甲色淡、神疲乏力、食欲不振、易感外邪，舌淡脉细弱，治当健运脾胃、益气养血，方用六君子汤。B 心脾两虚兼心悸失眠；C 肝肾阴虚见头晕耳鸣、腰膝酸软；D 脾肾阳虚见畏寒肢冷；E 气不摄血以出血为主。","tags":["高频"]},{"id":"LC-EK-0041","type":"B1","group":"EK-B1-001","group_stem":"A.保和丸　B.葛根黄芩黄连汤　C.参苓白术散　D.藿香正气散　E.附子理中丸","topic":"脾系病证-泄泻","difficulty":1,"stem":"大便稀溏酸臭，夹有乳片及不消化食物残渣，脘腹胀满，嗳腐纳呆，舌苔厚腻，脉滑。宜首选","options":{"A":"保和丸","B":"葛根黄芩黄连汤","C":"参苓白术散","D":"藿香正气散","E":"附子理中丸"},"answer":"A","explain":"伤食泻因乳食不节、损伤脾胃、运化失常而致，治当消食化积、运脾止泻，方用保和丸。葛根黄芩黄连汤用于湿热泻；参苓白术散用于脾虚泻；藿香正气散用于风寒泻；附子理中丸用于脾肾阳虚泻。","tags":["高频"]},{"id":"LC-EK-0042","type":"B1","group":"EK-B1-001","topic":"脾系病证-泄泻","difficulty":2,"stem":"大便水样、色黄而臭，日行十余次，夹有黏液，腹痛，发热口渴，小便短黄，舌红，苔黄腻，脉滑数。宜首选","options":{"A":"保和丸","B":"葛根黄芩黄连汤","C":"参苓白术散","D":"藿香正气散","E":"附子理中丸"},"answer":"B","explain":"湿热泻治当清肠解热、化湿止泻，方用葛根黄芩黄连汤。保和丸用于伤食泻；参苓白术散用于脾虚泻；藿香正气散用于风寒泻（大便清稀、肠鸣腹痛）；附子理中丸用于脾肾阳虚泻（完谷不化、形寒肢冷）。","tags":[]},{"id":"LC-EK-0043","type":"B1","group":"EK-B1-001","topic":"脾系病证-泄泻","difficulty":1,"stem":"大便稀溏、色淡不臭，多于食后作泻，面色萎黄，神疲倦怠，舌淡，苔白，脉缓弱。宜首选","options":{"A":"保和丸","B":"葛根黄芩黄连汤","C":"参苓白术散","D":"藿香正气散","E":"附子理中丸"},"answer":"C","explain":"脾虚泻因脾胃虚弱、清阳不升而致，治当健脾益气、升阳止泻，方用参苓白术散。保和丸消食导滞；葛根黄芩黄连汤清肠解热；藿香正气散疏风散寒；附子理中丸温补脾肾，用于阳虚更甚者。","tags":["高频"]},{"id":"LC-EK-0044","type":"B1","group":"EK-B1-002","group_stem":"A.麻黄连翘赤小豆汤　B.五味消毒饮　C.参苓白术散　D.真武汤　E.知柏地黄丸","topic":"肾系病证-水肿","difficulty":2,"stem":"眼睑浮肿，迅及全身，小便短少，伴发热恶风、咳嗽咽痛，舌红，苔薄白，脉浮数。宜首选","options":{"A":"麻黄连翘赤小豆汤","B":"五味消毒饮","C":"参苓白术散","D":"真武汤","E":"知柏地黄丸"},"answer":"A","explain":"风水相搏证治当疏风宣肺、利水消肿，方用麻黄连翘赤小豆汤。五味消毒饮清热解毒，用于湿热内侵兼疮疡；参苓白术散健脾渗湿，用于脾虚湿困；真武汤温肾健脾，用于脾肾阳虚；知柏地黄丸滋阴降火，用于肝肾阴虚。","tags":["高频"]},{"id":"LC-EK-0045","type":"B1","group":"EK-B1-002","topic":"肾系病证-水肿","difficulty":3,"stem":"全身浮肿，尿少色赤，皮肤有疮疡，伴发热、烦躁，舌红，苔黄腻，脉滑数。宜首选","options":{"A":"麻黄连翘赤小豆汤","B":"五味消毒饮","C":"参苓白术散","D":"真武汤","E":"知柏地黄丸"},"answer":"B","explain":"湿热内侵证因疮毒内归、湿热蕴结而致，治当清热解毒、淡渗利湿，方用五味消毒饮合五皮饮。麻黄连翘赤小豆汤用于风水相搏；参苓白术散用于脾虚湿困；真武汤用于脾肾阳虚；知柏地黄丸用于肝肾阴虚。","tags":["易错"]},{"id":"LC-EK-0046","type":"B1","group":"EK-B1-002","topic":"肾系病证-水肿","difficulty":3,"stem":"水肿日久，遍身浮肿，按之凹陷不起，腰膝酸冷，畏寒肢冷，小便短少，舌淡胖，苔白，脉沉细。宜首选","options":{"A":"麻黄连翘赤小豆汤","B":"五味消毒饮","C":"参苓白术散","D":"真武汤","E":"知柏地黄丸"},"answer":"D","explain":"脾肾阳虚证治当温肾健脾、化气行水，方用真武汤合五苓散。麻黄连翘赤小豆汤用于风水相搏；五味消毒饮用于湿热内侵；参苓白术散健脾渗湿，力薄于阳虚水泛；知柏地黄丸滋阴降火，药性相反。","tags":["易错"]},{"id":"LC-EK-0047","type":"B1","group":"EK-B1-003","group_stem":"A.麻疹　B.幼儿急疹　C.风疹　D.猩红热　E.水痘","topic":"传染病-幼儿急疹","difficulty":1,"stem":"发热 3 至 4 天，热退后皮肤出现红色斑丘疹，1 天内出齐，疹退无色素沉着，多见于 2 岁以下婴幼儿","options":{"A":"麻疹","B":"幼儿急疹","C":"风疹","D":"猩红热","E":"水痘"},"answer":"B","explain":"幼儿急疹的特点为突然高热 3 至 5 天，热退疹出，皮疹为红色斑丘疹、1 天内出齐、主要分布于躯干，疹退后无脱屑及色素沉着。麻疹发热 3 至 4 天出疹、疹退有色素沉着及脱屑；风疹伴耳后淋巴结肿大；猩红热为弥漫性猩红色丘疹；水痘为分批出现的水疱。","tags":["高频"]},{"id":"LC-EK-0048","type":"B1","group":"EK-B1-003","topic":"传染病-风疹","difficulty":2,"stem":"发热 1 至 2 天后出疹，皮疹为淡红色斑丘疹，面部先起，一日内布满全身，伴耳后及枕部淋巴结肿大","options":{"A":"麻疹","B":"幼儿急疹","C":"风疹","D":"猩红热","E":"水痘"},"answer":"C","explain":"风疹发热 1 至 2 天即出疹，皮疹为淡红色斑丘疹，自面部开始、1 天内布满全身，疹退后无色素沉着，伴耳后、枕后淋巴结肿大。麻疹自耳后发际开始、3 至 4 天出齐；幼儿急疹热退疹出；猩红热皮疹弥漫如砂、伴杨梅舌；水痘皮疹分批出现。","tags":["鉴别"]},{"id":"LC-EK-0049","type":"B1","group":"EK-B1-003","topic":"传染病-猩红热","difficulty":3,"stem":"发热 1 天出疹，为弥漫性猩红色细小丘疹，疹间无正常皮肤，压之褪色，伴咽痛、杨梅舌","options":{"A":"麻疹","B":"幼儿急疹","C":"风疹","D":"猩红热","E":"水痘"},"answer":"D","explain":"猩红热起病急，发热 1 天左右出疹，皮疹为弥漫性猩红色细小丘疹、疹间无正常皮肤、压之褪色，皮肤皱褶处可见帕氏线，伴咽峡炎与杨梅舌，疹退后大片脱皮。麻疹、幼儿急疹、风疹疹间均可见正常皮肤；水痘为水疱。","tags":["鉴别"]},{"id":"LC-EK-0050","type":"B1","group":"EK-B1-003","topic":"传染病-水痘","difficulty":2,"stem":"发热 1 天出疹，皮疹分批出现，同一部位可见斑丘疹、水疱与结痂同时存在，瘙痒明显","options":{"A":"麻疹","B":"幼儿急疹","C":"风疹","D":"猩红热","E":"水痘"},"answer":"E","explain":"水痘皮疹分批出现，同一部位可见斑丘疹、水疱、结痂同时存在，呈向心性分布，瘙痒明显。麻疹为斑丘疹、3 至 4 天出齐；幼儿急疹热退疹出；风疹一日出齐；猩红热为弥漫性猩红色丘疹、疹间无正常皮肤。","tags":["高频"]}]},{"meta":{"bank_id":"linchuang-fuke","title":"中医妇科学","paper":"linchuang","subject":"中医妇科学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":50,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"LC-FK-0001","type":"A1","group":null,"topic":"总论-月经生理","difficulty":1,"stem":"促使女子生殖功能成熟、月经来潮的物质是","options":{"A":"天癸","B":"心血","C":"肺气","D":"肝血","E":"脾气"},"answer":"A","explain":"天癸是肾中精气充盛到一定程度所化生、能促进生殖功能成熟的物质，直接促使月经来潮。心主血、肝藏血、脾生血，均为月经的物质基础之一，但不能直接促使生殖功能成熟；肺气与月经产生无直接主管关系。","tags":["高频"]},{"id":"LC-FK-0002","type":"A1","group":null,"topic":"总论-冲任","difficulty":1,"stem":"十二经脉中，被称为血海的是","options":{"A":"冲脉","B":"任脉","C":"督脉","D":"带脉","E":"胞脉"},"answer":"A","explain":"冲脉为十二经气血汇聚之处，故称血海，冲脉盛则血海满盈、月经如期。任脉为阴脉之海、主胞胎；督脉为阳脉之海；带脉约束诸经；胞脉为胞宫之脉络。四者名称与功能各异。","tags":["高频","鉴别"]},{"id":"LC-FK-0003","type":"A1","group":null,"topic":"总论-带下生理","difficulty":1,"stem":"正常带下的性状特点是","options":{"A":"色白或透明、量适中、无臭、质黏不稠","B":"色黄稠黏、气味臭秽、量多","C":"色赤如败酱、质稀如水","D":"量多如注、色白如豆腐渣","E":"色绿如脓、阴痒灼痛"},"answer":"A","explain":"正常带下由脾运化、肾封藏、任带二脉约束而成，色白或无色透明，量适中，质黏而不稠，无臭气，起润泽阴道的作用。B 为湿热下注；C 为热伤血络或湿毒；D 为脾虚湿盛；E 为湿毒蕴结。","tags":["高频"]},{"id":"LC-FK-0004","type":"A1","group":null,"topic":"总论-妊娠生理","difficulty":2,"stem":"妊娠早期，脉象多表现为","options":{"A":"滑脉","B":"涩脉","C":"弦脉","D":"结脉","E":"芤脉"},"answer":"A","explain":"妊娠后阴血下聚以养胎、血海不泄，脉道充盈流利，故脉滑，尤以两尺为著。涩脉主血少或血瘀；弦脉主肝胆病、痛证、痰饮；结脉主阴盛气结、寒痰血瘀；芤脉主失血伤阴。","tags":["高频"]},{"id":"LC-FK-0005","type":"A1","group":null,"topic":"总论-胞宫生理","difficulty":1,"stem":"胞宫的主要生理功能是","options":{"A":"排出月经、孕育胎儿","B":"化生天癸、主司生殖","C":"藏精主水、司二便","D":"主疏泄、调畅气机","E":"主运化、输布水湿"},"answer":"A","explain":"胞宫即子宫，位于小腹正中，主要功能是排出月经和孕育胎儿，其功能正常有赖肾气、天癸、冲任及脏腑气血的协调。天癸由肾中精气所化；藏精主水在肾；主疏泄在肝；主运化在脾。","tags":[]},{"id":"LC-FK-0006","type":"A1","group":null,"topic":"总论-病因病机","difficulty":2,"stem":"中医妇科疾病的主要病机是","options":{"A":"冲任损伤","B":"卫外不固","C":"肺失宣降","D":"膀胱气化不利","E":"筋脉失于濡养"},"answer":"A","explain":"妇科疾病虽由气血失调、脏腑功能失常引起，但最终均通过损伤冲任二脉而导致胞宫功能失常，故冲任损伤为主要病机。B 属外感表证；C 属肺系病证；D 属淋证、癃闭；E 属痿证、痹证。","tags":["高频"]},{"id":"LC-FK-0007","type":"A1","group":null,"topic":"月经病-月经先期","difficulty":1,"stem":"月经周期提前 7 天以上，连续 2 个周期以上者，称为","options":{"A":"月经先期","B":"月经后期","C":"月经先后无定期","D":"经期延长","E":"崩漏"},"answer":"A","explain":"月经先期指周期提前 7 天以上、连续 2 个周期以上。月经后期为推后 7 天以上；先后无定期为前后不定；经期延长为行经时间超过 7 天；崩漏为经血非时而下、量多如注或淋漓不断。","tags":["高频"]},{"id":"LC-FK-0008","type":"A1","group":null,"topic":"月经病-月经过少","difficulty":1,"stem":"月经周期正常，经量明显少于既往，不足 2 天即净者，称为","options":{"A":"月经过少","B":"经期缩短","C":"闭经","D":"月经后期","E":"经间期出血"},"answer":"A","explain":"月经过少指月经周期正常而经量明显减少，或行经时间不足 2 天、甚或点滴即净。经期缩短非规范病名；闭经为停闭 6 个月以上；月经后期为周期推后；经间期出血为两次月经中间出血。","tags":[]},{"id":"LC-FK-0009","type":"A1","group":null,"topic":"月经病-经期延长","difficulty":1,"stem":"月经周期基本正常，行经时间超过 7 天以上，甚或淋漓半月方净者，称为","options":{"A":"经期延长","B":"月经过多","C":"崩漏","D":"月经先期","E":"经间期出血"},"answer":"A","explain":"经期延长指周期基本正常而行经时间超过 7 天，甚至淋漓半月始净。月经过多以经量明显增多为主；崩漏则周期、经期、经量均严重紊乱；月经先期为周期提前；经间期出血发生在两次月经之间。","tags":["高频"]},{"id":"LC-FK-0010","type":"A1","group":null,"topic":"月经病-痛经","difficulty":2,"stem":"痛经气滞血瘀证的腹痛特点是","options":{"A":"胀痛拒按，经色紫暗有块，块下痛减","B":"冷痛喜暖，得热则舒，经色黯淡","C":"灼痛喜凉，带下黄稠，舌苔黄腻","D":"隐痛喜按，经色淡质稀，神疲乏力","E":"空痛伴腰酸，经后痛甚，头晕耳鸣"},"answer":"A","explain":"气滞血瘀、胞脉不通，故小腹胀痛拒按、经色紫暗有块、块下痛减，兼胸胁乳房胀痛、脉弦。B 为寒凝血瘀；C 为湿热瘀阻；D 为气血虚弱；E 为肾气亏损。","tags":["高频","鉴别"]},{"id":"LC-FK-0011","type":"A1","group":null,"topic":"月经病-闭经","difficulty":1,"stem":"女子年逾 16 周岁月经尚未初潮，或已行经后又中断 6 个月以上者，称为","options":{"A":"闭经","B":"月经后期","C":"暗经","D":"激经","E":"居经"},"answer":"A","explain":"闭经指女子年逾 16 周岁月经未潮，或周期建立后又中断 6 个月以上。月经后期为周期推后 7 天以上而仍能来潮；暗经为终身无月经而能受孕；激经为孕后仍按月少量下血；居经为三月一行。","tags":["高频"]},{"id":"LC-FK-0012","type":"A1","group":null,"topic":"月经病-崩漏","difficulty":1,"stem":"崩漏的治疗大法是","options":{"A":"塞流、澄源、复旧","B":"健脾、补肾、疏肝","C":"清热、凉血、止血","D":"活血、化瘀、止痛","E":"补气、养血、滋阴"},"answer":"A","explain":"崩漏治当依塞流、澄源、复旧三法：塞流即止血以防脱，澄源即求因治本，复旧即调理善后以固本。B 为调经的常用治则；C、D、E 均为针对某一证型的具体治法，不能概括崩漏的治疗大法。","tags":["高频","经典"]},{"id":"LC-FK-0013","type":"A1","group":null,"topic":"月经病-经行泄泻","difficulty":2,"stem":"脾虚型经行泄泻的治法是","options":{"A":"健脾益气、除湿止泻","B":"温肾健脾、固涩止泻","C":"疏肝健脾、理气止泻","D":"清热利湿、分利止泻","E":"消食导滞、和胃止泻"},"answer":"A","explain":"脾虚经行泄泻因脾阳不足、运化失职、水湿内停而致，治当健脾益气、除湿止泻，方用参苓白术散。B 为肾阳虚证治法，方用健固汤合四神丸；C 用于肝郁乘脾；D 用于湿热；E 用于伤食。","tags":["易错"]},{"id":"LC-FK-0014","type":"A1","group":null,"topic":"带下病-湿毒蕴结","difficulty":2,"stem":"带下量多，色黄绿如脓，或赤白相兼，臭秽难闻，阴部瘙痒者，多属","options":{"A":"湿毒蕴结证","B":"湿热下注证","C":"脾虚湿盛证","D":"肾阳不足证","E":"阴虚夹湿证"},"answer":"A","explain":"湿毒蕴结、损伤任带，故带下黄绿如脓或赤白相兼、臭秽难闻、阴痒，治当清热解毒、利湿止带。B 湿热下注多见色黄黏稠有臭味而无如脓之象；C 见色白质稀无臭；D 见清冷如水；E 见量少色黄、阴部灼热。","tags":["鉴别"]},{"id":"LC-FK-0015","type":"A1","group":null,"topic":"妊娠病-妊娠恶阻","difficulty":1,"stem":"妊娠早期出现恶心呕吐、头晕倦怠，甚则食入即吐者，称为","options":{"A":"妊娠恶阻","B":"胎动不安","C":"子痫","D":"子肿","E":"滑胎"},"answer":"A","explain":"妊娠恶阻指妊娠早期冲脉之气上逆、胃失和降而致恶心呕吐、头晕倦怠，甚则食入即吐。胎动不安以腰酸腹痛、阴道下血为主；子痫见抽搐昏迷；子肿见肢体浮肿；滑胎为连续堕胎三次以上。","tags":["高频"]},{"id":"LC-FK-0016","type":"A1","group":null,"topic":"妊娠病-子痫","difficulty":2,"stem":"妊娠晚期或临产时，突然昏不知人、四肢抽搐、牙关紧闭、目睛直视、口吐白沫者，称为","options":{"A":"子痫","B":"子晕","C":"子悬","D":"子烦","E":"子嗽"},"answer":"A","explain":"子痫为妊娠期危重病证，以突然昏仆、四肢抽搐、牙关紧闭、目睛直视、口吐白沫、少顷自醒而反复发作为特点。子晕仅为妊娠眩晕；子悬为胸胁胀满、胎气上逆；子烦为心烦不宁；子嗽为妊娠咳嗽。","tags":["鉴别"]},{"id":"LC-FK-0017","type":"A1","group":null,"topic":"产后病-产后血晕","difficulty":3,"stem":"产妇分娩后突然头晕眼花、不能坐起，甚则昏不知人者，称为","options":{"A":"产后血晕","B":"产后郁冒","C":"产后痉证","D":"产后子痫","E":"产后发热"},"answer":"A","explain":"产后血晕指分娩后突然头晕眼花、不能坐起，或心胸满闷、恶心呕吐、痰涌气急，甚则神昏口噤。产后郁冒为失血复感寒邪，症见头眩目瞀、郁闷不舒、但头汗出；产后痉证以项背强直、四肢抽搐为主；产后子痫发于产后 24 小时内；产后发热以发热为主症。","tags":["鉴别"]},{"id":"LC-FK-0018","type":"A1","group":null,"topic":"妇科杂病-癥瘕","difficulty":1,"stem":"妇女小腹内有结块，固定不移、痛有定处者，称为","options":{"A":"癥","B":"瘕","C":"痞","D":"聚","E":"积热"},"answer":"A","explain":"癥者坚硬成块、固定不移、痛有定处，病属血分；瘕者痞满无形、推揉转动、痛无定处，病属气分。痞为胸腹痞塞胀满之感；聚与瘕义近但少用于妇科；积热为病机而非病名。","tags":["鉴别"]},{"id":"LC-FK-0019","type":"A1","group":null,"topic":"妇科杂病-不孕症","difficulty":2,"stem":"女子婚后同居 1 年以上，有正常性生活、未避孕而未孕者，称为","options":{"A":"原发性不孕","B":"继发性不孕","C":"暗产","D":"不育","E":"五不女"},"answer":"A","explain":"育龄妇女婚后同居 1 年以上、配偶生殖功能正常、未避孕而未妊娠者称原发性不孕；曾有妊娠而后 1 年以上未再受孕者称继发性不孕。暗产为孕后未足月而堕、多不自知；不育指男方因素；五不女为古述女子生理缺陷。","tags":["高频"]},{"id":"LC-FK-0020","type":"A1","group":null,"topic":"高频鉴别-崩漏与经期延长","difficulty":3,"stem":"崩漏与经期延长的主要鉴别点是","options":{"A":"经期是否超过 2 周及周期是否紊乱","B":"经量的多少","C":"经色的深浅","D":"有无血块","E":"有无腹痛"},"answer":"A","explain":"经期延长指周期基本正常，行经超过 7 天而能在半月内自净；崩漏则经血非时而下，周期、经期、经量均严重紊乱，出血可长达数周不止。经量、经色、血块、腹痛在两者中均可出现，不能作为主要鉴别依据。","tags":["鉴别","高频"]},{"id":"LC-FK-0021","type":"A2","group":null,"topic":"总论-产褥生理","difficulty":1,"stem":"患者，女，27 岁。产后 4 天，恶露色红、量中等、略有腥味，无腹痛发热，乳汁已下。其恶露属于","options":{"A":"血性恶露","B":"浆液性恶露","C":"白色恶露","D":"恶露不绝","E":"产后血晕"},"answer":"A","explain":"产后 1 周内恶露色鲜红、量较多、含血较多，称血性恶露，属正常生理过程；约 1 周后转为浆液性恶露，2 周后为白色恶露。恶露不绝指血性恶露持续 2 周以上淋漓不尽；产后血晕以头晕昏仆为主，均属病理。","tags":["鉴别"]},{"id":"LC-FK-0022","type":"A2","group":null,"topic":"总论-病因病机","difficulty":2,"stem":"患者，女，33 岁。近半年月经量多、色鲜红，伴心烦易怒、口苦咽干、胸胁胀痛，舌红，苔黄，脉弦数。其病机是","options":{"A":"肝郁化火，热伤冲任","B":"脾虚气弱，统摄无权","C":"肾阳不足，胞宫失煦","D":"寒凝血瘀，胞脉阻滞","E":"气血两虚，冲任不充"},"answer":"A","explain":"情志不遂、肝郁化火，火热下扰冲任、迫血妄行，故经量多色鲜红，兼心烦易怒、口苦咽干、胸胁胀痛、脉弦数。B 见经色淡、神疲乏力；C 见畏寒肢冷、经色黯淡；D 见经色紫暗有块、小腹冷痛；E 见经色淡质稀、面色萎黄。","tags":["鉴别"]},{"id":"LC-FK-0023","type":"A2","group":null,"topic":"月经病-月经先期","difficulty":2,"stem":"患者，女，30 岁。月经周期提前 10 天，量多色淡质稀，神疲乏力，气短懒言，小腹空坠，舌淡，苔薄白，脉弱。其证型是","options":{"A":"脾气虚证","B":"肾气虚证","C":"阴虚血热证","D":"阳盛血热证","E":"肝郁血热证"},"answer":"A","explain":"脾气虚弱、统摄无权、冲任不固，故经行先期、量多色淡质稀，兼神疲乏力、气短懒言、小腹空坠，舌淡脉弱，治当补脾益气、摄血调经。B 兼腰膝酸软、夜尿频多；C 见量少色红、五心烦热；D 见量多深红、面红口干；E 见色红有块、烦躁口苦。","tags":["高频"]},{"id":"LC-FK-0024","type":"A2","group":null,"topic":"月经病-月经后期","difficulty":2,"stem":"患者，女，28 岁。月经周期延后 12 天，量少色暗有块，小腹冷痛拒按，得热痛减，畏寒肢冷，舌暗，苔白，脉沉紧。其治法是","options":{"A":"温经散寒、活血调经","B":"补血益气、温经调经","C":"燥湿化痰、理气调经","D":"疏肝理气、活血调经","E":"滋阴清热、养血调经"},"answer":"A","explain":"寒邪客于胞宫、血为寒凝、冲任不畅，故经期延后、量少色暗有块、小腹冷痛拒按、得热痛减，治当温经散寒、活血调经，方用温经汤。B 用于虚寒（腹痛喜按、经色淡）；C 用于痰湿（形体肥胖、胸闷呕恶）；D 用于气滞（胀痛脉弦）；E 用于阴虚。","tags":["高频"]},{"id":"LC-FK-0025","type":"A2","group":null,"topic":"月经病-月经先后无定期","difficulty":2,"stem":"患者，女，32 岁。月经周期时先时后半年，经量或多或少，色暗有块，经前乳房胀痛，胸闷不舒，善太息，舌暗红，苔薄白，脉弦。其证型是","options":{"A":"肝郁证","B":"肾虚证","C":"脾虚证","D":"血瘀证","E":"血热证"},"answer":"A","explain":"肝郁气滞、疏泄失常、血海蓄溢无度，故经期先后不定、经量或多或少、色暗有块，兼乳房胀痛、胸闷善太息、脉弦。B 肾虚见腰膝酸软、头晕耳鸣；C 脾虚见纳差便溏；D 血瘀见经色紫暗有块、腹痛拒按；E 血热见经色鲜红、心烦口干。","tags":["高频"]},{"id":"LC-FK-0026","type":"A2","group":null,"topic":"月经病-痛经","difficulty":2,"stem":"患者，女，22 岁。经前 1 天小腹冷痛，得热痛减，经量少、色暗有块，畏寒，舌淡暗，苔白腻，脉沉紧。其治法是","options":{"A":"温经散寒、化瘀止痛","B":"理气行滞、化瘀止痛","C":"清热除湿、化瘀止痛","D":"益气养血、调经止痛","E":"补肾益精、调经止痛"},"answer":"A","explain":"寒邪客于胞宫、血为寒凝、不通则痛，故经前小腹冷痛、得热痛减、经色暗有块，治当温经散寒、化瘀止痛，方用少腹逐瘀汤。B 用于气滞血瘀（胀痛脉弦）；C 用于湿热瘀阻（灼痛、苔黄腻）；D 用于气血虚弱（隐痛喜按）；E 用于肾气亏损（经后痛、腰酸）。","tags":["高频"]},{"id":"LC-FK-0027","type":"A2","group":null,"topic":"月经病-崩漏","difficulty":2,"stem":"患者，女，42 岁。经血非时而下，量多如注 10 天，色淡质稀，神疲气短，面色萎黄，四肢不温，舌淡，苔薄白，脉弱。其治法是","options":{"A":"健脾益气、固冲止血","B":"清热凉血、固冲止血","C":"活血化瘀、固冲止血","D":"滋肾养阴、固冲止血","E":"温肾壮阳、固冲止血"},"answer":"A","explain":"脾虚气陷、统摄无权、冲任不固，故经血非时暴下、色淡质稀，兼神疲气短、面色萎黄、四肢不温，治当健脾益气、固冲止血，方用固本止崩汤。B 用于血热（色深红、心烦口渴）；C 用于血瘀（色紫暗有块）；D 用于肾阴虚；E 用于肾阳虚。","tags":["高频"]},{"id":"LC-FK-0028","type":"A2","group":null,"topic":"月经病-闭经","difficulty":3,"stem":"患者，女，25 岁。月经停闭 8 个月，形体肥胖，胸闷呕恶，带下量多色白，舌淡胖，苔白腻，脉滑。其证型是","options":{"A":"痰湿阻滞证","B":"气血虚弱证","C":"肝肾亏虚证","D":"气滞血瘀证","E":"寒凝血瘀证"},"answer":"A","explain":"痰湿壅盛、脂膜闭塞胞宫，故月经停闭，兼形体肥胖、胸闷呕恶、带下量多色白，舌淡胖苔白腻脉滑，治当健脾燥湿、化痰调经，方用苍附导痰丸。B 见头晕眼花、心悸气短；C 见腰膝酸软、头晕耳鸣；D 见精神抑郁、胸胁胀满；E 见小腹冷痛、畏寒肢冷。","tags":["鉴别","易错"]},{"id":"LC-FK-0029","type":"A2","group":null,"topic":"月经病-月经过多","difficulty":2,"stem":"患者，女，35 岁。月经量明显增多半年，色淡红质稀，伴神疲乏力、气短懒言、小腹空坠，舌淡，苔薄白，脉弱。其治法是","options":{"A":"补气摄血固冲","B":"清热凉血固冲","C":"活血化瘀止血","D":"滋阴清热止血","E":"温经散寒止血"},"answer":"A","explain":"气虚下陷、冲任不固、经血失约，故经量增多、色淡质稀，兼神疲乏力、气短懒言、小腹空坠，治当补气摄血固冲，方用举元煎。B 用于血热（色深红黏稠、心烦口渴）；C 用于血瘀（色紫暗有块）；D 用于阴虚；E 用于寒凝。","tags":["高频"]},{"id":"LC-FK-0030","type":"A2","group":null,"topic":"妊娠病-妊娠恶阻","difficulty":2,"stem":"患者，女，26 岁。妊娠 8 周，恶心呕吐，吐出清涎，食少纳呆，神疲乏力，舌淡，苔薄白，脉缓滑无力。其治法是","options":{"A":"健脾和胃、降逆止呕","B":"清肝和胃、降逆止呕","C":"滋阴清热、和胃止呕","D":"温中散寒、降逆止呕","E":"化痰除湿、和胃止呕"},"answer":"A","explain":"脾胃素虚、孕后血聚养胎、冲脉之气上逆，故呕吐清涎、食少纳呆、神疲乏力，脉缓滑无力，治当健脾和胃、降逆止呕，方用香砂六君子汤。B 用于肝胃不和（吐酸水、胸胁胀痛）；C 用于气阴两虚（干呕口干）；D 用于虚寒；E 用于痰湿（吐痰涎、胸闷）。","tags":["高频"]},{"id":"LC-FK-0031","type":"A2","group":null,"topic":"妊娠病-胎动不安","difficulty":2,"stem":"患者，女，29 岁。妊娠 60 天，阴道少量出血、色淡红，腰酸腹坠，头晕耳鸣，夜尿频多，舌淡，苔白，脉沉滑尺弱。其证型是","options":{"A":"肾虚证","B":"气血虚弱证","C":"血热证","D":"跌仆伤胎证","E":"肝郁证"},"answer":"A","explain":"肾虚冲任不固、胎失所系，故孕后阴道少量出血、腰酸腹坠，兼头晕耳鸣、夜尿频多，脉沉滑尺弱，治当补肾固冲安胎，方用寿胎丸。B 见血色淡、心悸气短；C 见血色鲜红、心烦口干；D 有外伤史、腹痛拒按；E 见胸胁胀满、嗳气。","tags":["高频"]},{"id":"LC-FK-0032","type":"A2","group":null,"topic":"妊娠病-子肿","difficulty":2,"stem":"患者，女，30 岁。妊娠 7 个月，面浮肢肿，按之凹陷，胸闷气短，纳少便溏，舌淡胖，苔白腻，脉滑。其治法是","options":{"A":"健脾渗湿、行水消肿","B":"温肾助阳、化气行水","C":"理气行滞、化湿消肿","D":"清热利湿、消肿安胎","E":"养血安胎、利水消肿"},"answer":"A","explain":"子肿脾虚证因脾阳不振、运化失职、水湿泛溢肌肤而致，症见面浮肢肿、按之凹陷、胸闷气短、纳少便溏，治当健脾渗湿、行水消肿，方用白术散。B 用于肾虚（下肢肿甚、腰酸畏寒）；C 用于气滞（肿随情绪消长）；D 用于湿热；E 用于血虚。","tags":["高频"]},{"id":"LC-FK-0033","type":"A2","group":null,"topic":"妊娠病-妊娠小便不通","difficulty":3,"stem":"患者，女，28 岁。妊娠 5 个月，小便不通 2 天，小腹胀急疼痛，坐卧不安，面色㿠白，神疲乏力，舌淡，苔薄白，脉虚缓。其证型是","options":{"A":"气虚证","B":"肾虚证","C":"湿热证","D":"气滞证","E":"血瘀证"},"answer":"A","explain":"中气不足、升降无力、胎气下压膀胱，故小便不通、小腹胀急，兼神疲乏力、面色㿠白、脉虚缓，治当补气升提、举胎利尿，方用益气导溺汤。B 兼腰膝酸软、畏寒；C 见小便短赤灼热、口苦；D 见胸胁胀满、烦躁；E 见舌暗有瘀斑。","tags":["易错"]},{"id":"LC-FK-0034","type":"A2","group":null,"topic":"产后病-产后腹痛","difficulty":2,"stem":"患者，女，30 岁。产后 4 天，小腹疼痛拒按，恶露量少、色紫暗有块，块下痛减，面色青白，四肢不温，舌紫暗，脉沉紧。其治法是","options":{"A":"活血化瘀、温经止痛","B":"补血益气、缓急止痛","C":"温经散寒、暖宫止痛","D":"理气行滞、活血止痛","E":"清热凉血、化瘀止痛"},"answer":"A","explain":"产后瘀血内停、胞脉阻滞、不通则痛，故小腹疼痛拒按、恶露量少色紫暗有块、块下痛减，舌紫暗脉沉紧，治当活血化瘀、温经止痛，方用生化汤。B 用于气血两虚（隐痛喜按、恶露色淡）；C 用于寒凝（冷痛喜暖）；D 用于气滞（胀痛嗳气）；E 用于感染邪毒（灼痛发热）。","tags":["高频"]},{"id":"LC-FK-0035","type":"A2","group":null,"topic":"产后病-产后发热","difficulty":3,"stem":"患者，女，28 岁。产后 5 天，高热寒战，小腹疼痛拒按，恶露量多、色紫暗如败酱、气味臭秽，烦躁口渴，舌红，苔黄，脉数有力。其治法是","options":{"A":"清热解毒、凉血化瘀","B":"养血益气、和营退热","C":"活血化瘀、和营退热","D":"辛凉解表、疏风清热","E":"滋阴清热、凉血退热"},"answer":"A","explain":"产后感染邪毒、正邪交争、热入营血，故高热寒战、小腹疼痛拒按、恶露臭秽如败酱，治当清热解毒、凉血化瘀，方用五味消毒饮合失笑散。B 用于血虚发热（低热、头晕心悸）；C 用于血瘀发热（乍寒乍热、恶露不畅）；D 用于外感发热；E 用于阴虚发热。","tags":["易错"]},{"id":"LC-FK-0036","type":"A2","group":null,"topic":"妇科杂病-癥瘕","difficulty":2,"stem":"患者，女，40 岁。小腹包块 1 年，按之坚硬，固定不移，疼痛拒按，经期延长、量多色暗有块，面色晦暗，舌紫暗有瘀斑，脉沉涩。其治法是","options":{"A":"活血化瘀、消癥散结","B":"理气行滞、消癥散结","C":"清热利湿、化瘀消癥","D":"健脾益气、化痰消癥","E":"温经散寒、化瘀消癥"},"answer":"A","explain":"瘀血内停、结而成癥，故小腹包块坚硬、固定不移、疼痛拒按，舌紫暗有瘀斑、脉沉涩，治当活血化瘀、消癥散结，方用桂枝茯苓丸。B 用于气滞（包块不坚、推之可移）；C 用于湿热瘀阻（带下黄稠、苔黄腻）；D 用于痰湿；E 用于寒凝。","tags":["高频"]},{"id":"LC-FK-0037","type":"A2","group":null,"topic":"妇科杂病-不孕症","difficulty":2,"stem":"患者，女，32 岁。婚后 2 年未孕，月经初潮迟，量少色淡，腰膝酸软，头晕耳鸣，畏寒肢冷，舌淡，苔白，脉沉细。其证型是","options":{"A":"肾阳虚证","B":"肾阴虚证","C":"肝郁证","D":"痰湿证","E":"血瘀证"},"answer":"A","explain":"肾阳亏虚、胞宫失于温煦、冲任不能相资，故婚久不孕，兼腰膝酸软、头晕耳鸣、畏寒肢冷，舌淡脉沉细，治当温肾暖宫、调补冲任，方用温胞饮。B 见五心烦热、月经先期；C 见胸胁胀满、烦躁易怒；D 见形体肥胖、带下量多；E 见经行腹痛、舌暗有瘀斑。","tags":["高频"]},{"id":"LC-FK-0038","type":"A2","group":null,"topic":"妇科杂病-阴挺","difficulty":2,"stem":"患者，女，56 岁。阴中有物脱出 1 年，劳则加重，小腹下坠，神疲乏力，面色少华，舌淡，苔薄白，脉弱。其治法是","options":{"A":"补气升提","B":"温肾固脱","C":"清热利湿","D":"活血化瘀","E":"养血滋阴"},"answer":"A","explain":"脾虚气陷、中气下脱、系胞无力，故阴中有物脱出、劳则加重、小腹下坠，兼神疲乏力、脉弱，治当补气升提，方用补中益气汤。B 用于肾虚（腰酸、头晕耳鸣）；C 用于湿热下注（带下黄稠、阴部灼热）；D 用于血瘀；E 用于阴血亏虚。","tags":["高频"]},{"id":"LC-FK-0039","type":"A2","group":null,"topic":"高频鉴别-胎漏与胎动不安","difficulty":2,"stem":"患者，女，27 岁。妊娠 70 天，阴道少量出血、色淡红，无腰酸腹痛。其诊断是","options":{"A":"胎漏","B":"胎动不安","C":"堕胎","D":"小产","E":"滑胎"},"answer":"A","explain":"胎漏指妊娠期阴道少量出血、时下时止或淋漓不断而无腰酸腹痛；胎动不安则在出血同时伴腰酸腹痛或小腹下坠。堕胎、小产指胎元已殒堕；滑胎为连续堕胎、小产三次以上。本例无腰酸腹痛，故为胎漏。","tags":["鉴别","高频"]},{"id":"LC-FK-0040","type":"A2","group":null,"topic":"高频鉴别-癥瘕与妊娠","difficulty":3,"stem":"患者，女，35 岁。停经 3 个月，小腹膨隆可扪及包块。为鉴别是妊娠还是癥瘕，最有意义的是","options":{"A":"有无早孕反应及尿妊娠试验","B":"包块的大小","C":"腹痛的性质","D":"带下的多少","E":"既往月经量的多少"},"answer":"A","explain":"妊娠有停经及早孕反应，尿妊娠试验阳性，超声可见胎囊胎心；癥瘕无停经及早孕反应，尿妊娠试验阴性，包块多固定不移、质硬。包块大小、腹痛、带下、经量在两者中均可重叠，不能作为主要鉴别依据。","tags":["鉴别"]},{"id":"LC-FK-0041","type":"B1","group":"FK-B1-001","group_stem":"A.少腹逐瘀汤　B.膈下逐瘀汤　C.清热调血汤　D.圣愈汤　E.调肝汤","topic":"月经病-痛经","difficulty":1,"stem":"经前或经期小腹胀痛拒按，胸胁乳房胀痛，经色紫暗有块、块下痛减，舌紫暗，脉弦。宜首选","options":{"A":"少腹逐瘀汤","B":"膈下逐瘀汤","C":"清热调血汤","D":"圣愈汤","E":"调肝汤"},"answer":"B","explain":"痛经气滞血瘀证治当理气行滞、化瘀止痛，方用膈下逐瘀汤。少腹逐瘀汤温经散寒、化瘀止痛，用于寒凝血瘀；清热调血汤清热除湿、化瘀止痛，用于湿热瘀阻；圣愈汤益气养血，用于气血虚弱；调肝汤补肾益精，用于肾气亏损。","tags":["高频"]},{"id":"LC-FK-0042","type":"B1","group":"FK-B1-001","topic":"月经病-痛经","difficulty":2,"stem":"经前或经期小腹冷痛，得热痛减，经量少色暗有块，畏寒肢冷，舌淡暗，苔白，脉沉紧。宜首选","options":{"A":"少腹逐瘀汤","B":"膈下逐瘀汤","C":"清热调血汤","D":"圣愈汤","E":"调肝汤"},"answer":"A","explain":"寒邪客于胞宫、血为寒凝，治当温经散寒、化瘀止痛，方用少腹逐瘀汤。膈下逐瘀汤偏于理气行滞；清热调血汤用于湿热（灼痛、苔黄腻）；圣愈汤用于气血虚弱（隐痛喜按）；调肝汤用于肾气亏损（经后腰酸）。","tags":[]},{"id":"LC-FK-0043","type":"B1","group":"FK-B1-001","topic":"月经病-痛经","difficulty":3,"stem":"经前小腹灼痛拒按，得热痛增，经色暗红黏稠，平素带下量多色黄，舌红，苔黄腻，脉滑数。宜首选","options":{"A":"少腹逐瘀汤","B":"膈下逐瘀汤","C":"清热调血汤","D":"圣愈汤","E":"调肝汤"},"answer":"C","explain":"湿热瘀阻胞宫、气血运行不畅，故小腹灼痛拒按、得热痛增、带下黄稠，治当清热除湿、化瘀止痛，方用清热调血汤。少腹逐瘀汤温经散寒，药性相反；膈下逐瘀汤理气行滞而不除湿热；圣愈汤补益气血；调肝汤补肾益精。","tags":["易错"]},{"id":"LC-FK-0044","type":"B1","group":"FK-B1-001","topic":"月经病-痛经","difficulty":2,"stem":"经期或经后小腹隐痛喜按，经量少色淡质稀，神疲乏力，面色苍白，舌淡，脉细弱。宜首选","options":{"A":"少腹逐瘀汤","B":"膈下逐瘀汤","C":"清热调血汤","D":"圣愈汤","E":"调肝汤"},"answer":"D","explain":"气血虚弱、胞脉失养，故经期或经后小腹隐痛喜按、经色淡质稀，治当益气养血、调经止痛，方用圣愈汤。少腹逐瘀汤温经散寒；膈下逐瘀汤理气化瘀；清热调血汤清热除湿；调肝汤补肾益精，均与气血两虚不符。","tags":[]},{"id":"LC-FK-0045","type":"B1","group":"FK-B1-002","group_stem":"A.完带汤　B.内补丸　C.知柏地黄丸　D.止带方　E.五味消毒饮","topic":"带下病-脾虚","difficulty":1,"stem":"带下量多，色白或淡黄，质稀薄，无臭气，绵绵不断，神疲纳呆，便溏，舌淡，苔白腻，脉缓弱。宜首选","options":{"A":"完带汤","B":"内补丸","C":"知柏地黄丸","D":"止带方","E":"五味消毒饮"},"answer":"A","explain":"脾虚湿盛、任带失约，治当健脾益气、升阳除湿，方用完带汤。内补丸温肾助阳、固涩止带，用于肾阳虚；知柏地黄丸滋阴降火，用于阴虚夹湿；止带方清热利湿，用于湿热下注；五味消毒饮清热解毒，用于湿毒蕴结。","tags":["高频"]},{"id":"LC-FK-0046","type":"B1","group":"FK-B1-002","topic":"带下病-湿毒蕴结","difficulty":3,"stem":"带下量多，色黄绿如脓，或赤白相兼，臭秽难闻，阴部瘙痒，口苦咽干，舌红，苔黄，脉数。宜首选","options":{"A":"完带汤","B":"内补丸","C":"知柏地黄丸","D":"止带方","E":"五味消毒饮"},"answer":"E","explain":"湿毒蕴结、损伤任带，故带下黄绿如脓、臭秽难闻，治当清热解毒、利湿止带，方用五味消毒饮。完带汤健脾除湿；内补丸温肾固涩；知柏地黄丸滋阴降火；止带方清利湿热，解毒之力不及，宜用于一般湿热下注。","tags":["易错"]},{"id":"LC-FK-0047","type":"B1","group":"FK-B1-002","topic":"带下病-湿热下注","difficulty":3,"stem":"带下量多，色黄黏稠，有臭味，阴部瘙痒，胸闷心烦，口苦咽干，舌红，苔黄腻，脉滑数。宜首选","options":{"A":"完带汤","B":"内补丸","C":"知柏地黄丸","D":"止带方","E":"五味消毒饮"},"answer":"D","explain":"湿热下注、任带失约，治当清热利湿止带，方用止带方。五味消毒饮重于解毒，用于湿毒蕴结之黄绿如脓、臭秽难闻；完带汤用于脾虚；内补丸用于肾阳虚；知柏地黄丸用于阴虚夹湿。","tags":["鉴别"]},{"id":"LC-FK-0048","type":"B1","group":"FK-B1-003","group_stem":"A.生化汤　B.五味消毒饮　C.通乳丹　D.下乳涌泉散　E.黄芪桂枝五物汤","topic":"产后病-产后恶露不绝","difficulty":1,"stem":"产后 5 天，恶露淋漓不尽、色紫暗有块，小腹疼痛拒按，舌紫暗，脉沉涩。宜首选","options":{"A":"生化汤","B":"五味消毒饮","C":"通乳丹","D":"下乳涌泉散","E":"黄芪桂枝五物汤"},"answer":"A","explain":"瘀血阻滞、新血不得归经，故恶露不绝、色紫暗有块、腹痛拒按，治当活血化瘀、理冲止血，方用生化汤。五味消毒饮用于感染邪毒发热；通乳丹用于气血虚弱缺乳；下乳涌泉散用于肝郁气滞缺乳；黄芪桂枝五物汤用于产后身痛。","tags":["高频"]},{"id":"LC-FK-0049","type":"B1","group":"FK-B1-003","topic":"产后病-缺乳","difficulty":2,"stem":"产后 3 天，乳汁甚少，乳房柔软无胀感，面色少华，神疲食少，舌淡，苔薄白，脉虚细。宜首选","options":{"A":"生化汤","B":"五味消毒饮","C":"通乳丹","D":"下乳涌泉散","E":"黄芪桂枝五物汤"},"answer":"C","explain":"气血虚弱、乳汁化源不足，故乳汁甚少、乳房柔软无胀感，治当补气养血、佐以通乳，方用通乳丹。下乳涌泉散疏肝解郁、通络下乳，用于肝郁气滞（乳房胀硬疼痛）；生化汤用于血瘀；五味消毒饮用于热毒；黄芪桂枝五物汤用于身痛。","tags":[]},{"id":"LC-FK-0050","type":"B1","group":"FK-B1-003","topic":"产后病-缺乳","difficulty":3,"stem":"产后 1 个月，乳汁涩少，乳房胀硬疼痛，情志抑郁，胸胁胀闷，舌红，苔薄黄，脉弦细。宜首选","options":{"A":"生化汤","B":"五味消毒饮","C":"通乳丹","D":"下乳涌泉散","E":"黄芪桂枝五物汤"},"answer":"D","explain":"肝郁气滞、乳脉壅塞，故乳汁涩少、乳房胀硬疼痛，治当疏肝解郁、通络下乳，方用下乳涌泉散。通乳丹补气养血，用于气血虚弱之乳房柔软无胀感；生化汤活血化瘀；五味消毒饮清热解毒；黄芪桂枝五物汤温经通痹。","tags":["易错"]}]},{"meta":{"bank_id":"linchuang-neike","title":"中医内科学","paper":"linchuang","subject":"中医内科学","exam_standard":"传统医学医术确有专长（52号令）综合笔试","edition":"2026-v1","count":100,"notice":"仿真题，非考试真题，仅供练习"},"questions":[{"id":"LC-NK-0001","type":"A1","group":null,"topic":"感冒-风寒束表","difficulty":1,"stem":"感冒之风寒束表证的治法是","options":{"A":"辛温解表","B":"辛凉解表","C":"清暑祛湿解表","D":"益气解表","E":"滋阴解表"},"answer":"A","explain":"风寒束表治当辛温解表、宣肺散寒，方用荆防败毒散。辛凉解表用于风热犯表，清暑祛湿解表用于暑湿伤表，益气解表用于气虚感冒，滋阴解表用于阴虚感冒。故取辛温解表。","tags":["高频"]},{"id":"LC-NK-0002","type":"A1","group":null,"topic":"咳嗽-痰湿蕴肺","difficulty":2,"stem":"咳嗽之痰湿蕴肺证的代表方是","options":{"A":"桑菊饮","B":"二陈平胃散合三子养亲汤","C":"清金化痰汤","D":"黛蛤散合泻白散","E":"沙参麦冬汤"},"answer":"B","explain":"痰湿蕴肺治当燥湿化痰、理气止咳，方用二陈平胃散合三子养亲汤。桑菊饮治风热犯肺，清金化痰汤治痰热郁肺，黛蛤散合泻白散治肝火犯肺，沙参麦冬汤治肺阴亏耗。故取二陈平胃散合三子养亲汤。","tags":["高频"]},{"id":"LC-NK-0003","type":"A1","group":null,"topic":"哮病-冷哮","difficulty":2,"stem":"哮病发作期之冷哮证的代表方是","options":{"A":"定喘汤","B":"射干麻黄汤","C":"三子养亲汤","D":"平喘固本汤","E":"六君子汤"},"answer":"B","explain":"冷哮治当宣肺散寒、化痰平喘，方用射干麻黄汤或小青龙汤。定喘汤治热哮，三子养亲汤治风痰哮，平喘固本汤治虚哮，六君子汤治缓解期肺脾气虚。故取射干麻黄汤。","tags":["高频"]},{"id":"LC-NK-0004","type":"A1","group":null,"topic":"喘证-痰浊阻肺","difficulty":2,"stem":"喘证之痰浊阻肺证的代表方是","options":{"A":"麻黄汤合华盖散","B":"桑白皮汤","C":"二陈汤合三子养亲汤","D":"五磨饮子","E":"金匮肾气丸"},"answer":"C","explain":"痰浊阻肺治当化痰降逆、宣肺平喘，方用二陈汤合三子养亲汤。麻黄汤合华盖散治风寒壅肺，桑白皮汤治痰热郁肺，五磨饮子治肺气郁痹，金匮肾气丸治肾虚不纳。故取二陈汤合三子养亲汤。","tags":["高频"]},{"id":"LC-NK-0005","type":"A1","group":null,"topic":"肺痈-溃脓期","difficulty":3,"stem":"肺痈之溃脓期的代表方是","options":{"A":"银翘散","B":"千金苇茎汤","C":"加味桔梗汤","D":"沙参清肺汤","E":"桔梗杏仁煎"},"answer":"C","explain":"溃脓期治当排脓解毒，方用加味桔梗汤。银翘散为肺痈初期方，千金苇茎汤合如金解毒散为成痈期方，沙参清肺汤与桔梗杏仁煎为恢复期方。故取加味桔梗汤。","tags":["鉴别"]},{"id":"LC-NK-0006","type":"A1","group":null,"topic":"心悸-瘀阻心脉","difficulty":1,"stem":"心悸之瘀阻心脉证的代表方是","options":{"A":"安神定志丸","B":"归脾汤","C":"桃仁红花煎","D":"苓桂术甘汤","E":"黄连温胆汤"},"answer":"C","explain":"瘀阻心脉治当活血化瘀、理气通络，方用桃仁红花煎。安神定志丸治心虚胆怯，归脾汤治心血不足，苓桂术甘汤治水饮凌心，黄连温胆汤治痰火扰心。故取桃仁红花煎。","tags":[]},{"id":"LC-NK-0007","type":"A1","group":null,"topic":"胸痹-心血瘀阻","difficulty":1,"stem":"胸痹之心血瘀阻证的代表方是","options":{"A":"血府逐瘀汤","B":"柴胡疏肝散","C":"栝蒌薤白半夏汤","D":"生脉散","E":"右归饮"},"answer":"A","explain":"心血瘀阻治当活血化瘀、通脉止痛，方用血府逐瘀汤。柴胡疏肝散治气滞心胸，栝蒌薤白半夏汤合涤痰汤治痰浊闭阻，生脉散治气阴两虚，右归饮治心肾阳虚。故取血府逐瘀汤。","tags":["高频"]},{"id":"LC-NK-0008","type":"A1","group":null,"topic":"不寐-心脾两虚","difficulty":1,"stem":"不寐之心脾两虚证的代表方是","options":{"A":"龙胆泻肝汤","B":"黄连温胆汤","C":"归脾汤","D":"六味地黄丸合交泰丸","E":"安神定志丸"},"answer":"C","explain":"心脾两虚治当补益心脾、养血安神，方用归脾汤。龙胆泻肝汤治肝火扰心，黄连温胆汤治痰热扰心，六味地黄丸合交泰丸治心肾不交，安神定志丸治心胆气虚。故取归脾汤。","tags":["高频"]},{"id":"LC-NK-0009","type":"A1","group":null,"topic":"癫狂-狂证痰火扰神","difficulty":2,"stem":"狂证之痰火扰神证的代表方是","options":{"A":"逍遥散","B":"生铁落饮","C":"二阴煎","D":"癫狂梦醒汤","E":"养心汤"},"answer":"B","explain":"痰火扰神治当清心泻火、涤痰醒神，方用生铁落饮。逍遥散合顺气导痰汤治癫证痰气郁结，二阴煎治火盛伤阴，癫狂梦醒汤治痰热瘀结，养心汤治癫证心脾两虚。故取生铁落饮。","tags":["鉴别"]},{"id":"LC-NK-0010","type":"A1","group":null,"topic":"胃痛-肝气犯胃","difficulty":2,"stem":"胃痛之肝气犯胃证的代表方是","options":{"A":"良附丸","B":"保和丸","C":"柴胡疏肝散","D":"清中汤","E":"黄芪建中汤"},"answer":"C","explain":"肝气犯胃治当疏肝解郁、理气止痛，方用柴胡疏肝散。良附丸治寒邪客胃，保和丸治饮食伤胃，清中汤治湿热中阻，黄芪建中汤治脾胃虚寒。故取柴胡疏肝散。","tags":["高频"]},{"id":"LC-NK-0011","type":"A1","group":null,"topic":"痞满-脾胃虚弱","difficulty":2,"stem":"痞满之脾胃虚弱证的代表方是","options":{"A":"保和丸","B":"二陈平胃汤","C":"泻心汤合连朴饮","D":"补中益气汤","E":"益胃汤"},"answer":"D","explain":"脾胃虚弱治当补气健脾、升清降浊，方用补中益气汤。保和丸治饮食内停，二陈平胃汤治痰湿中阻，泻心汤合连朴饮治湿热阻胃，益胃汤治胃阴不足。故取补中益气汤。","tags":[]},{"id":"LC-NK-0012","type":"A1","group":null,"topic":"呕吐-痰饮内阻","difficulty":2,"stem":"呕吐之痰饮内阻证的代表方是","options":{"A":"藿香正气散","B":"保和丸","C":"小半夏汤合苓桂术甘汤","D":"四七汤","E":"麦门冬汤"},"answer":"C","explain":"痰饮内阻治当温化痰饮、和胃降逆，方用小半夏汤合苓桂术甘汤。藿香正气散治外邪犯胃，保和丸治饮食停滞，四七汤治肝气犯胃，麦门冬汤治胃阴不足。故取小半夏汤合苓桂术甘汤。","tags":[]},{"id":"LC-NK-0013","type":"A1","group":null,"topic":"腹痛-中虚脏寒","difficulty":2,"stem":"腹痛之中虚脏寒证的代表方是","options":{"A":"良附丸合正气天香散","B":"大承气汤","C":"枳实导滞丸","D":"少腹逐瘀汤","E":"小建中汤"},"answer":"E","explain":"中虚脏寒治当温中补虚、缓急止痛，方用小建中汤。良附丸合正气天香散治寒邪内阻，大承气汤治湿热壅滞，枳实导滞丸治饮食积滞，少腹逐瘀汤治瘀血内停。故取小建中汤。","tags":[]},{"id":"LC-NK-0014","type":"A1","group":null,"topic":"痢疾-湿热痢","difficulty":2,"stem":"湿热痢的代表方是","options":{"A":"白头翁汤","B":"芍药汤","C":"不换金正气散","D":"驻车丸","E":"桃花汤"},"answer":"B","explain":"湿热痢治当清肠化湿、调气和血，方用芍药汤。白头翁汤合芍药汤治疫毒痢，不换金正气散治寒湿痢，驻车丸治阴虚痢，桃花汤合真人养脏汤治虚寒痢。故取芍药汤。","tags":["高频"]},{"id":"LC-NK-0015","type":"A1","group":null,"topic":"胁痛-肝络失养","difficulty":3,"stem":"胁痛之肝络失养证的代表方是","options":{"A":"柴胡疏肝散","B":"龙胆泻肝汤","C":"血府逐瘀汤","D":"一贯煎","E":"复元活血汤"},"answer":"D","explain":"肝络失养治当养阴柔肝、理气止痛，方用一贯煎。柴胡疏肝散治肝郁气滞，龙胆泻肝汤治肝胆湿热，血府逐瘀汤与复元活血汤治瘀血阻络。故取一贯煎。","tags":["鉴别"]},{"id":"LC-NK-0016","type":"A1","group":null,"topic":"黄疸-阴黄寒湿阻遏","difficulty":2,"stem":"黄疸之阴黄寒湿阻遏证的代表方是","options":{"A":"茵陈蒿汤","B":"茵陈五苓散","C":"茵陈术附汤","D":"大柴胡汤","E":"犀角散"},"answer":"C","explain":"阴黄寒湿阻遏治当温中化湿、健脾和胃，方用茵陈术附汤。茵陈蒿汤治阳黄热重于湿，茵陈五苓散合甘露消毒丹治湿重于热，大柴胡汤治胆腑郁热，犀角散治急黄。故取茵陈术附汤。","tags":["高频","易错"]},{"id":"LC-NK-0017","type":"A1","group":null,"topic":"鼓胀-水湿困脾","difficulty":3,"stem":"鼓胀之水湿困脾证的代表方是","options":{"A":"柴胡疏肝散合胃苓汤","B":"实脾饮","C":"中满分消丸","D":"调营饮","E":"济生肾气丸"},"answer":"B","explain":"水湿困脾治当温中健脾、行气利水，方用实脾饮。柴胡疏肝散合胃苓汤治气滞湿阻，中满分消丸合茵陈蒿汤治水热蕴结，调营饮治瘀结水留，济生肾气丸治阳虚水盛。故取实脾饮。","tags":["鉴别"]},{"id":"LC-NK-0018","type":"A1","group":null,"topic":"头痛-风湿头痛","difficulty":1,"stem":"风湿头痛的代表方是","options":{"A":"川芎茶调散","B":"芎芷石膏汤","C":"羌活胜湿汤","D":"天麻钩藤饮","E":"半夏白术天麻汤"},"answer":"C","explain":"风湿头痛治当祛风胜湿通窍，方用羌活胜湿汤。川芎茶调散治风寒头痛，芎芷石膏汤治风热头痛，天麻钩藤饮治肝阳头痛，半夏白术天麻汤治痰浊头痛。故取羌活胜湿汤。","tags":["高频"]},{"id":"LC-NK-0019","type":"A1","group":null,"topic":"中风-风阳上扰","difficulty":2,"stem":"中风中经络之风阳上扰证的代表方是","options":{"A":"真方白丸子","B":"天麻钩藤饮","C":"镇肝熄风汤","D":"补阳还五汤","E":"解语丹"},"answer":"B","explain":"风阳上扰治当平肝潜阳、活血通络，方用天麻钩藤饮。真方白丸子治风痰入络，镇肝熄风汤治阴虚风动，补阳还五汤治恢复期气虚络瘀，解语丹治风痰瘀阻之言语不利。故取天麻钩藤饮。","tags":["高频"]},{"id":"LC-NK-0020","type":"A1","group":null,"topic":"水肿-风水相搏","difficulty":1,"stem":"水肿之风水相搏证的代表方是","options":{"A":"越婢加术汤","B":"麻黄连翘赤小豆汤","C":"五皮饮","D":"疏凿饮子","E":"实脾饮"},"answer":"A","explain":"风水相搏治当疏风清热、宣肺行水，方用越婢加术汤。麻黄连翘赤小豆汤合五味消毒饮治湿毒浸淫，五皮饮合胃苓汤治水湿浸渍，疏凿饮子治湿热壅盛，实脾饮治脾阳虚衰。故取越婢加术汤。","tags":["高频"]},{"id":"LC-NK-0021","type":"A1","group":null,"topic":"癃闭-膀胱湿热","difficulty":2,"stem":"癃闭之膀胱湿热证的代表方是","options":{"A":"清肺饮","B":"八正散","C":"沉香散","D":"代抵当丸","E":"补中益气汤"},"answer":"B","explain":"膀胱湿热治当清利湿热、通利小便，方用八正散。清肺饮治肺热壅盛，沉香散治肝郁气滞，代抵当丸治浊瘀阻塞，补中益气汤合春泽汤治脾气不升。故取八正散。","tags":["高频"]},{"id":"LC-NK-0022","type":"A1","group":null,"topic":"阳痿-命门火衰","difficulty":2,"stem":"阳痿之命门火衰证的代表方是","options":{"A":"赞育丸","B":"归脾汤","C":"逍遥散","D":"启阳娱心丹","E":"龙胆泻肝汤"},"answer":"A","explain":"命门火衰治当温肾壮阳、滋肾填精，方用赞育丸。归脾汤治心脾亏虚，逍遥散治肝郁不舒，启阳娱心丹治惊恐伤肾，龙胆泻肝汤治湿热下注。故取赞育丸。","tags":[]},{"id":"LC-NK-0023","type":"A1","group":null,"topic":"郁证-痰气郁结","difficulty":2,"stem":"郁证之痰气郁结证的代表方是","options":{"A":"柴胡疏肝散","B":"丹栀逍遥散","C":"半夏厚朴汤","D":"甘麦大枣汤","E":"归脾汤"},"answer":"C","explain":"痰气郁结治当行气开郁、化痰散结，方用半夏厚朴汤。柴胡疏肝散治肝气郁结，丹栀逍遥散治气郁化火，甘麦大枣汤治心神失养，归脾汤治心脾两虚。故取半夏厚朴汤。","tags":["高频"]},{"id":"LC-NK-0024","type":"A1","group":null,"topic":"血证-吐血胃热壅盛","difficulty":2,"stem":"吐血之胃热壅盛证的代表方是","options":{"A":"桑菊饮","B":"泻心汤合十灰散","C":"龙胆泻肝汤","D":"黄土汤","E":"归脾汤"},"answer":"B","explain":"胃热壅盛治当清胃泻火、化瘀止血，方用泻心汤合十灰散。桑菊饮治鼻衄热邪犯肺，龙胆泻肝汤治肝火犯胃，黄土汤治脾胃虚寒，归脾汤治气虚血溢。故取泻心汤合十灰散。","tags":["高频"]},{"id":"LC-NK-0025","type":"A1","group":null,"topic":"痰饮-脾阳虚弱","difficulty":3,"stem":"痰饮之脾阳虚弱证的代表方是","options":{"A":"甘遂半夏汤","B":"柴枳半夏汤","C":"苓桂术甘汤合小半夏加茯苓汤","D":"十枣汤","E":"小青龙汤"},"answer":"C","explain":"痰饮脾阳虚弱治当温脾化饮，方用苓桂术甘汤合小半夏加茯苓汤。甘遂半夏汤或己椒苈黄丸治饮留胃肠，柴枳半夏汤治悬饮邪犯胸肺，十枣汤治饮停胸胁，小青龙汤治溢饮与支饮。故取苓桂术甘汤合小半夏加茯苓汤。","tags":["鉴别"]},{"id":"LC-NK-0026","type":"A1","group":null,"topic":"消渴-上消肺热津伤","difficulty":1,"stem":"消渴之上消肺热津伤证的代表方是","options":{"A":"消渴方","B":"玉女煎","C":"七味白术散","D":"六味地黄丸","E":"金匮肾气丸"},"answer":"A","explain":"上消肺热津伤治当清热润肺、生津止渴，方用消渴方。玉女煎治中消胃热炽盛，七味白术散治气阴亏虚，六味地黄丸治下消肾阴亏虚，金匮肾气丸治阴阳两虚。故取消渴方。","tags":["高频"]},{"id":"LC-NK-0027","type":"A1","group":null,"topic":"内伤发热-阴虚发热","difficulty":2,"stem":"内伤发热之阴虚发热证的代表方是","options":{"A":"补中益气汤","B":"清骨散","C":"归脾汤","D":"金匮肾气丸","E":"丹栀逍遥散"},"answer":"B","explain":"阴虚发热治当滋阴清热，方用清骨散。补中益气汤治气虚发热，归脾汤治血虚发热，金匮肾气丸治阳虚发热，丹栀逍遥散治气郁发热。故取清骨散。","tags":["鉴别"]},{"id":"LC-NK-0028","type":"A1","group":null,"topic":"虚劳-肾阳虚","difficulty":2,"stem":"虚劳之肾阳虚证的代表方是","options":{"A":"保元汤","B":"附子理中汤","C":"右归丸","D":"左归丸","E":"大补元煎"},"answer":"C","explain":"肾阳虚治当温补肾阳，方用右归丸。保元汤治心阳虚，附子理中汤治脾阳虚，左归丸治肾阴虚，大补元煎治肾气虚。故取右归丸。","tags":[]},{"id":"LC-NK-0029","type":"A1","group":null,"topic":"痿证-肺热津伤","difficulty":3,"stem":"痿证之肺热津伤证的代表方是","options":{"A":"清燥救肺汤","B":"加味二妙散","C":"参苓白术散","D":"虎潜丸","E":"圣愈汤"},"answer":"A","explain":"肺热津伤治当清热润肺、养阴生津，方用清燥救肺汤。加味二妙散治湿热浸淫，参苓白术散合补中益气汤治脾胃虚弱，虎潜丸治肝肾亏损，圣愈汤合补阳还五汤治脉络瘀阻。故取清燥救肺汤。","tags":["鉴别"]},{"id":"LC-NK-0030","type":"A1","group":null,"topic":"腰痛-寒湿腰痛","difficulty":1,"stem":"寒湿腰痛的代表方是","options":{"A":"四妙丸","B":"甘姜苓术汤","C":"身痛逐瘀汤","D":"左归丸","E":"右归丸"},"answer":"B","explain":"寒湿腰痛治当散寒行湿、温经通络，方用甘姜苓术汤。四妙丸治湿热腰痛，身痛逐瘀汤治瘀血腰痛，左归丸治肾阴虚腰痛，右归丸治肾阳虚腰痛。故取甘姜苓术汤。","tags":["高频"]},{"id":"LC-NK-0031","type":"A2","group":null,"topic":"高频鉴别-感冒与风温","difficulty":2,"stem":"患者，男，25 岁。恶寒发热 2 天，鼻塞流涕，咽痒咳嗽，痰白清稀，苔薄白，脉浮。其与风温的主要鉴别点是","options":{"A":"是否感受外邪","B":"发热的高低与传变速度","C":"有无鼻塞流涕","D":"有无咳嗽","E":"有无咽痛"},"answer":"B","explain":"感冒与风温均见发热、咳嗽、咽痛，但感冒发热不高、病情较轻、少见传变；风温初起即发热重恶寒轻、口渴、脉浮数，且传变迅速，易内陷营血。故以发热高低与传变速度鉴别。鼻塞流涕、咳嗽、咽痛两者皆可有之。","tags":["鉴别"]},{"id":"LC-NK-0032","type":"A2","group":null,"topic":"高频鉴别-哮与喘","difficulty":2,"stem":"患者，女，40 岁。呼吸急促，喉中哮鸣有声，胸膈满闷，咳痰清稀，苔白滑，脉弦紧。其诊断与喘证的主要区别是","options":{"A":"有无宿痰内伏","B":"有无喉中哮鸣","C":"有无外感诱因","D":"有无痰多","E":"有无胸闷"},"answer":"B","explain":"患者呼吸急促伴喉中哮鸣有声，为哮病发作。哮病以喉中哮鸣如水鸡声为特征，喘证以呼吸困难甚至张口抬肩、鼻翼煽动为特征。两者均可有痰多、胸闷与外感诱因，故鉴别关键在于喉中哮鸣。","tags":["鉴别","高频"]},{"id":"LC-NK-0033","type":"A2","group":null,"topic":"高频鉴别-胃痛与真心痛","difficulty":2,"stem":"患者，男，58 岁。胃脘部疼痛反复发作，伴嗳气泛酸，食后加重，苔薄白，脉弦。其与真心痛的鉴别要点是","options":{"A":"有无胸膺疼痛与心悸气短","B":"有无嗳气","C":"有无泛酸","D":"有无食欲减退","E":"有无腹胀"},"answer":"A","explain":"患者疼痛在胃脘、伴嗳气泛酸，属胃痛。真心痛疼痛位于胸膺部，常放射至肩背，伴心悸、气短、汗出、肢冷，病情危重。故以疼痛部位与有无心悸气短鉴别。嗳气泛酸是胃痛常见表现而非鉴别关键。","tags":["鉴别"]},{"id":"LC-NK-0034","type":"A2","group":null,"topic":"高频鉴别-中风与痫证","difficulty":3,"stem":"患者，女，65 岁。突然昏仆，不省人事，口吐涎沫，四肢抽搐，移时苏醒后如常人，苔白腻，脉弦滑。其诊断最应与下列何病鉴别","options":{"A":"中风","B":"厥证","C":"癫证","D":"郁证","E":"痉证"},"answer":"A","explain":"患者卒然昏仆、口吐涎沫、四肢抽搐、移时自醒如常人，为痫证。痫证与中风均可猝然昏仆，但中风醒后多有半身不遂、口眼歪斜、言语謇涩等后遗症，痫证醒后如常人。厥证多无抽搐与口吐涎沫。故最应与中风鉴别。","tags":["鉴别","高频"]},{"id":"LC-NK-0035","type":"A2","group":null,"topic":"高频鉴别-泄泻与痢疾","difficulty":2,"stem":"患者，男，32 岁。腹痛，里急后重，下痢赤白黏冻，日行十余次，舌红苔黄腻，脉滑数。其与泄泻的鉴别要点是","options":{"A":"有无里急后重与下痢赤白","B":"有无腹痛","C":"有无便次增多","D":"有无发热","E":"有无口渴"},"answer":"A","explain":"患者里急后重、下痢赤白黏冻，为痢疾。泄泻以排便次数增多、粪质稀薄甚至如水样为特征，无里急后重与脓血。两者均可有腹痛、便次增多、发热、口渴，故以有无里急后重与下痢赤白为鉴别要点。","tags":["鉴别","高频"]},{"id":"LC-NK-0036","type":"A2","group":null,"topic":"高频鉴别-淋证与癃闭","difficulty":2,"stem":"患者，女，45 岁。小便频数短涩，灼热刺痛，小腹拘急，尿色黄赤，苔黄腻，脉滑数。其与癃闭的鉴别要点是","options":{"A":"有无尿量减少","B":"有无排尿疼痛","C":"有无小腹胀满","D":"有无发热","E":"有无腰痛"},"answer":"B","explain":"患者尿频尿急尿痛、尿色黄赤，为热淋。淋证以小便频数短涩、淋沥刺痛为特征，每日尿量多正常；癃闭以小便量少、点滴而出甚至闭塞不通为特征，多无尿痛而小腹胀满。故以有无排尿疼痛为鉴别要点。","tags":["鉴别"]},{"id":"LC-NK-0037","type":"A2","group":null,"topic":"高频鉴别-黄疸阳黄阴黄","difficulty":2,"stem":"患者，男，50 岁。身目俱黄，黄色晦暗如烟熏，脘腹痞胀，畏寒神疲，舌淡苔白腻，脉濡缓。其证型是","o
